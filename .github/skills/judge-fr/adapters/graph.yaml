# NON-AUTHORITATIVE prototype adapter (NC-412 A-1 / D-10).
# Manual invocation only. Output is a DRAFT judgement — advisory until
# human-reviewed and folded through the normal FR process. This graph
# must never auto-fold, auto-commit, open/update PRs, poll inboxes,
# manage worktrees, run CI, or merge.
# Lineage: yamlgraph .chaplain/graphs/watcher-plan/step-judge-v2.yaml (FR-305).
version: "1.0"
name: judge-fr-adapter
description: "Thin pointer to .github/skills/judge-fr/doctrine.md — doctrine-free"

prompts_relative: true
prompts_dir: prompts

state:
  fr_path: str
  backend: str            # "copilot" | "claude"; scripts/judge.sh always sets it (FR-960)
  artifact_path: str      # per-backend-per-FR path computed by scripts/judge.sh (FR-960)
  judge_result: dict

nodes:
  select:
    type: passthrough
    output: {}
  judge:
    type: copilot
    backend: cli
    cli_flags:
      model: gpt-5.6-sol
      allow_all_paths: true
      allow_all_tools: true  # NC-414 (csap): required for non-interactive tool use;
                             # without it the file write of the draft artifact
                             # is denied while the CLI still exits 0
    prompt: judge
    variables:
      fr_path: "{state.fr_path}"
      artifact_path: "{state.artifact_path}"
    state_key: judge_result
    timeout: 600
  judge_claude:
    type: copilot
    backend: claude          # FR-959 backend; bills the operator's Claude subscription
    cli_flags:
      model: claude-opus-5     # exact id (the `opus` alias resolved to this on 2.1.255 — FR-960 witness §2.4); never an alias (REQ-YG-632, PR #577 review P3)
      tools: [Read, Glob, Grep, Write]         # availability (--tools); no Bash, no Edit, no MCP
      allowed_tools: [Read, Glob, Grep, Write] # approval (--allowedTools) for the same four
      max_turns: 40
    prompt: judge            # SAME prompt file (NC-412 zero duplication)
    variables:
      fr_path: "{state.fr_path}"
      artifact_path: "{state.artifact_path}"
    state_key: judge_result
    timeout: 600

edges:
  - from: START
    to: select
  - from: select
    to: judge
    condition: backend != "claude"
  - from: select
    to: judge_claude
    condition: backend == "claude"
  - from: judge
    to: END
  - from: judge_claude
    to: END
