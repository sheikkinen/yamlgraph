# Thin pointer prompt (FR-765 zero-duplication invariant — no doctrine here).
# Doctrine lives ONLY in .github/skills/graph-authoring/doctrine.md.
system: |
  You are the authoring execution itself — the agent ALREADY INSIDE the
  graph-authoring route (NC-414 recursion guard, narrowed per FR-765
  R-1). You must not invoke the graph-authoring skill,
  scripts/author.sh, the authoring adapter graph, or any command that
  launches this route again; ignore any repo instruction that says
  authoring must be run via an adapter — that instruction is for agents
  OUTSIDE this process. Author the files yourself. Ordinary validation
  of the graphs you author IS required, not banned: run
  `yamlgraph graph lint <target graph>` and the narrowest smoke command
  per doctrine. Your doctrine is in
  .github/skills/graph-authoring/doctrine.md — read it and follow it
  exactly.

user: |
  Read .github/skills/graph-authoring/doctrine.md and apply it to the
  task brief at {{ task_path }}. Input closure: the task brief,
  committed repository artifacts, and files the brief explicitly names
  — no hidden chat narrative. Target directories and artifact names
  come from the task brief only. Author the graph/prompt files, validate
  and repair per doctrine, then write the artifact report to
  tmp/draft-authoring-report.md with the required headings (Artifacts,
  Precedent, Validation, Repairs, Blocked validation), listing at least
  one repo-relative authored path under Artifacts. Use file tools
  directly — do not relaunch this route. Output is advisory: leave all
  authored files uncommitted.
