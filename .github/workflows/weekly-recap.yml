name: Weekly Recap (FR-821)

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-recap
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RECAP_PAT }} # PAT-created PRs trigger required checks; GITHUB_TOKEN PRs do not
          fetch-depth: 0 # recap reads a week of history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Run recap
        id: recap
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROVIDER: anthropic
        run: |
          python scripts/weekly_recap.py --repo-path . --since "1 week ago" --output-dir docs/recaps | tee recap-run.log
          if grep -q "no-op" recap-run.log; then
            echo "noop=true" >> "$GITHUB_OUTPUT"
          else
            echo "noop=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open automation PR with auto-merge
        if: steps.recap.outputs.noop == 'false'
        env:
          GH_TOKEN: ${{ secrets.RECAP_PAT }}
        run: |
          WEEK=$(date +%G-W%V)
          BRANCH="recap/${WEEK}"
          git config user.name "recap-bot"
          git config user.email "recap-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/recaps/
          git diff --cached --quiet && { echo "recap: nothing staged, no PR"; exit 0; }
          git commit -m "docs(recap): weekly recap ${WEEK}"
          git push origin "$BRANCH"
          gh pr create \
            --title "docs(recap): weekly recap ${WEEK}" \
            --body "Automated weekly recap (FR-821). Generated by the weekly-recap workflow; auto-merges when required checks pass." \
            --base main --head "$BRANCH"
          gh pr merge "$BRANCH" --auto --squash
