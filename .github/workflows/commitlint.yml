# .github/workflows/commitlint.yml
name: Conventional Commit Check

"on":
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
            style
            build
            revert
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: "PR title must have a subject after the type prefix"

      - name: feat requires FR-XXX
        if: startsWith(github.event.pull_request.title, 'feat')
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qE 'FR-[0-9]+'; then
            echo "::error::feat PRs must reference FR-XXX in the title"
            echo "Example: feat(streaming): FR-030 add subgraphs parameter"
            exit 1
          fi

  conflict-check:
    name: No conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for conflict markers
        run: |
          if git grep -n -E '^<{7} |^={7}$|^>{7} ' -- ':!.github' ':!*.md.bak'; then
            echo "::error::Unresolved merge conflict markers found in tracked files"
            exit 1
          else
            echo "✅ No conflict markers found"
          fi

  copilot-trailer-gate:
    name: Block Co-authored-by trailers
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commits and PR body for Co-authored-by trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          TRAILER_PATTERN='^[[:space:]]*Co-authored-by:[[:space:]]+'

          if git log --format=%B "$BASE_SHA..$HEAD_SHA" | grep -Eiq "$TRAILER_PATTERN"; then
            echo "::error::Co-authored-by trailer found in commit messages"
            exit 1
          fi

          if printf '%s\n' "${PR_BODY:-}" | grep -Eiq "$TRAILER_PATTERN"; then
            echo "::error::Co-authored-by trailer found in PR body"
            exit 1
          fi

          echo "✅ No Co-authored-by trailers found"

  changelog-gate:
    name: Changelog fragment required for feat/fix
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.event.pull_request.title, 'feat') ||
      startsWith(github.event.pull_request.title, 'fix')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify changelog fragments
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          source scripts/gate_artifact_semantics.sh

          CHANGED_FRAGMENTS=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '^changelog/unreleased/.*\.md$' || true)

          if [ -z "$CHANGED_FRAGMENTS" ]; then
            echo "::error::feat/fix PRs must include a changelog fragment in changelog/unreleased/"
            exit 1
          fi

          INVALID=0
          while IFS= read -r FRAGMENT; do
            if [ -z "$FRAGMENT" ]; then
              continue
            fi
            if ! validate_changelog_fragment_file "$FRAGMENT" "$FRAGMENT"; then
              INVALID=$((INVALID + 1))
            fi
          done <<< "$CHANGED_FRAGMENTS"

          if [ "$INVALID" -gt 0 ]; then
            echo "::error::One or more changelog fragments failed substance validation"
            exit 1
          fi

          echo "✅ Changelog fragment(s) validated"

  release-hygiene:
    name: Release hygiene (tag validation)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Verify changelog folder exists for tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ ! -d "changelog/${VERSION}" ]; then
            echo "::error::Tag v${VERSION} created without changelog/${VERSION}/ folder"
            echo "Run: scripts/release.sh ${VERSION}"
            exit 1
          fi
          ORPHANS=$(find changelog/unreleased -name '*.md' ! -name '.gitkeep' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$ORPHANS" -gt 0 ]; then
            echo "::error::Tag v${VERSION} pushed with ${ORPHANS} orphaned fragments in changelog/unreleased/"
            exit 1
          fi
          echo "✅ Release hygiene passed for v${VERSION}"

  changelog-req-gate:
    name: Changelog req cross-validation
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.event.pull_request.title, 'feat') ||
      startsWith(github.event.pull_request.title, 'fix')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate changelog req values
        run: python scripts/check_changelog_req.py --strict --skip-llm

  demo-gate:
    name: Demo proof required for changed demos
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.event.pull_request.title, 'feat') ||
      startsWith(github.event.pull_request.title, 'fix')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify demo output logs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          source scripts/demo_log_semantics.sh

          # Find demo directories with changed files (excluding the log itself
          # and the shared tests/ directory which is test infrastructure)
          CHANGED_DEMOS=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -E '^examples/demos/[^/]+/' \
            | grep -vE 'demo-output\.log$' \
            | grep -vE '^examples/demos/tests/' \
            | sed 's|examples/demos/\([^/]*\)/.*|\1|' \
            | sort -u) || true

          if [ -z "$CHANGED_DEMOS" ]; then
            echo "⏭️ No demo files changed — demo gate skipped"
            exit 0
          fi

          MISSING=0
          INVALID=0
          for DEMO in $CHANGED_DEMOS; do
            LOG="examples/demos/${DEMO}/demo-output.log"
            if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qF "$LOG"; then
              if ! validate_demo_output_log_file "$LOG" "$LOG"; then
                INVALID=$((INVALID + 1))
              fi
            else
              echo "::error::Demo '$DEMO' changed but no demo-output.log in diff"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ "$MISSING" -gt 0 ] || [ "$INVALID" -gt 0 ]; then
            echo ""
            echo "Run each changed demo and commit a successful output log:"
            echo "  yamlgraph graph run examples/demos/<name>/graph.yaml --full 2>&1 | tee examples/demos/<name>/demo-output.log"
            exit 1
          fi

  diary-gate:
    name: Diary reflection required for feat/fix
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.event.pull_request.title, 'feat') ||
      startsWith(github.event.pull_request.title, 'fix')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify diary reflection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          source scripts/gate_artifact_semantics.sh

          # Extract FR number from PR title
          FR_NUM=$(echo "$PR_TITLE" | grep -oE 'FR-[0-9]+' | head -1 | sed 's/FR-//')

          if [ -z "$FR_NUM" ]; then
            echo "⏭️ No FR-XXX reference in title — diary gate skipped"
            exit 0
          fi

          echo "🔍 Checking for diary reflection for FR-$FR_NUM..."

          MATCHING_DIARIES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E "docs/diary/.*reflection.*fr-${FR_NUM}([^0-9]|$)" || true)

          if [ -z "$MATCHING_DIARIES" ]; then
            echo "::error::feat/fix PRs referencing FR-$FR_NUM must include a diary reflection in docs/diary/"
            echo ""
            echo "Expected: docs/diary/YYYY-MM-DD-reflection-fr-${FR_NUM}.md"
            echo ""
            echo "The diary reflection should document:"
            echo "  - Cognitive traps encountered"
            echo "  - Heuristics learned"
            echo "  - A Seed question for future work"
            echo ""
            echo "See docs/diary/ for examples."
            exit 1
          fi

          INVALID=0
          while IFS= read -r DIARY_FILE; do
            if [ -z "$DIARY_FILE" ]; then
              continue
            fi
            if ! validate_diary_reflection_file "$DIARY_FILE" "$DIARY_FILE"; then
              INVALID=$((INVALID + 1))
            fi
          done <<< "$MATCHING_DIARIES"

          if [ "$INVALID" -gt 0 ]; then
            echo "::error::Diary reflection content requirements not met for FR-$FR_NUM"
            exit 1
          fi

          echo "✅ Diary reflection validated for FR-$FR_NUM"
