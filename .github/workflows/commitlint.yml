# .github/workflows/commitlint.yml
name: Conventional Commit Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
            style
            build
            revert
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: "PR title must have a subject after the type prefix"

      - name: feat requires FR-XXX
        if: startsWith(github.event.pull_request.title, 'feat')
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qE 'FR-[0-9]+'; then
            echo "::error::feat PRs must reference FR-XXX in the title"
            echo "Example: feat(streaming): FR-030 add subgraphs parameter"
            exit 1
          fi

  conflict-check:
    name: No conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for conflict markers
        run: |
          if git grep -n -E '^<{7} |^={7}$|^>{7} ' -- ':!.github' ':!*.md.bak'; then
            echo "::error::Unresolved merge conflict markers found in tracked files"
            exit 1
          else
            echo "✅ No conflict markers found"
          fi

  changelog-gate:
    name: CHANGELOG required for feat/fix
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.event.pull_request.title, 'feat') ||
      startsWith(github.event.pull_request.title, 'fix')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG.md modified
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^CHANGELOG\.md$'; then
            echo "✅ CHANGELOG.md is modified"
          else
            echo "::error::feat/fix PRs must include changes to CHANGELOG.md"
            exit 1
          fi
