name: CI

"on":
  pull_request:
    types: [opened, synchronize, reopened]
  # Merge queue candidates (FR-934): required test contexts must report
  # on merge_group or the candidate times out of the queue. Non-PR events
  # short-circuit the changes filter, so merge groups run the full matrix.
  merge_group:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0, v0.1.0, etc.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # Non-PR events (tag pushes) short-circuit to 'true' so the release
      # chain (test -> build -> publish) can never skip (FR-919 C-3).
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'

  core-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,digest,websearch,fsm,verify,rag,replicate,openai-proxy,examples-dungeon-master]"

      - name: Run core-only tests
        # FR-759 P2: deliberately does NOT install the `otel` extra — this
        # is the CI path proving the disabled/missing-extra OTEL tests
        # collect and pass (rather than skip) when opentelemetry-sdk is
        # absent from the environment.
        run: pytest tests/unit -m "not process" -q --no-cov

  test:
    # FR-889 §4d: this job is a required status context (`test (3.11)`,
    # `test (3.13)`). It must ALWAYS report a conclusion — a skipped job
    # never satisfies required checks, deadlocking docs-only auto-merge
    # PRs. Real steps are gated per-step; the final no-op step reports
    # success on docs-only diffs.
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'

      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,digest,websearch,fsm,verify,rag,replicate,openai-proxy,examples-dungeon-master,otel,vision]"

      - name: Run tests
        if: needs.changes.outputs.code == 'true'
        run: pytest tests/unit/ -v --cov=yamlgraph --cov-fail-under=80

      - name: Run linter
        if: needs.changes.outputs.code == 'true'
        run: ruff check yamlgraph/

      - name: Run import-linter
        if: needs.changes.outputs.code == 'true'
        run: lint-imports

      - name: Docs-only no-op (required-context conclusion)
        if: needs.changes.outputs.code != 'true'
        run: echo "docs-only diff — code gates vacuously satisfied"

  build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag version ($VERSION) != pyproject.toml version ($PYPROJECT_VERSION)"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/yamlgraph/
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  create-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
