# Image Pipeline v3: local-model prompt generation, render-only spend.
#
# Pipeline:
#   sample_candidates (python) -> save_report (python) -> generate_images (python)
#
# Usage:
#   yamlgraph graph run examples/image_pipeline_v3/graph.yaml \
#     --var start="" --var cond="prose" --var temp="0.8" \
#     --var seed="42" --var n_candidates="10" --var top_k="3" --full

version: "1.0"
name: image-pipeline-v3
description: >
  Local-model-generated prompts (deviant-daily FR-876 model),
  boundary-gated, first-top-k rendered via Replicate z-image.
  Task shapes: offline prompt generation from a trained local model;
  render-only spend.

state:
  start: str
  cond: str
  temp: str
  seed: str
  n_candidates: str
  top_k: str
  scored: list
  prompts: list
  gen_summary: any
  report_file: str
  local_report_file: str
  output_dir: str
  images: list

tools:
  sample_candidates:
    type: python
    module: examples.image_pipeline_v3.nodes.sample_candidates
    function: sample_candidates_node
    description: Sample candidate prompts from the deviant-daily local model (--json contract) and select the first top-k passers

  save_report:
    type: python
    module: examples.image_pipeline_v3.nodes.save_report
    function: save_report_node
    description: Write sanitized and local generation tables under outputs/image_pipeline_v3

  generate_images:
    type: python
    module: examples.image_pipeline.nodes.generate_images
    function: generate_images_node
    description: Generate images via Replicate z-image from the selected prompts

nodes:
  sample_candidates:
    type: python
    tool: sample_candidates

  save_report:
    type: python
    tool: save_report
    requires: [scored]

  generate_images:
    type: python
    tool: generate_images
    state_key: images
    requires: [prompts, output_dir]

edges:
  - from: START
    to: sample_candidates
  - from: sample_candidates
    to: save_report
  - from: save_report
    to: generate_images
  - from: generate_images
    to: END
