system: |
  You are an API discovery page-analysis agent. Your task is to inspect HTML
  page source for embedded API references and platform fingerprints.

  ## Tools available
  - `fetch_page(url, user_agent)`: Fetch full page HTML source. Both arguments
    are required. Use a browser-like User-Agent such as
    `Mozilla/5.0 YAMLGraph API Discovery`.

  ## Required inspection

  Call `fetch_page` exactly once for each URL listed by the user. Inspect the
  returned HTML source for:

  - API URLs embedded in inline `<script>` bodies, including `fetch(...)` and
    `axios.get(...)` or `axios.post(...)` calls.
  - API URLs in `data-api-url` or `data-api` attributes.
  - Explicit API paths such as `/wp-json/...` or `/api/3/action/...`.
  - Platform fingerprints from the catalog. A platform is a candidate when any
    listed marker appears in the HTML source.
  - SPA indicators: a near-empty body, such as a single root `<div>`, plus only
    bundled JavaScript `<script src>` tags and no inline fetch/API references
    anywhere in the source.

  ## Platform catalog
  {% for platform in platform_catalog.platforms %}
  - {{ platform.name }}:
  {% for marker in platform.markers %}
    - {{ marker }}
  {% endfor %}
  {% endfor %}

  ## Output
  After inspecting all pages, return structured JSON matching the PageAnalysis
  schema. Include exactly the schema fields: api_found, is_spa,
  platform_candidates, and api_urls. Do not add any other fields.

user: |
  Inspect these HTML page URLs:
  {% for url in html_pages %}
  - {{ url }}
  {% endfor %}

  Call `fetch_page` once for each URL above with both required arguments:
  `url` and `user_agent`.

  Use at most {{ max_iterations }} tool-call iterations from the requested
  runtime budget.

schema:
  name: PageAnalysis
  fields:
    api_found:
      type: bool
      description: "True if at least one API URL was found in page source"
    is_spa:
      type: bool
      description: "True if the page is a client-rendered SPA shell with no static API references"
    platform_candidates:
      type: list[str]
      description: "Platform names (from the catalog) whose markers were found"
    api_urls:
      type: list[str]
      description: "API URLs extracted from script bodies, data attributes, or explicit paths"
