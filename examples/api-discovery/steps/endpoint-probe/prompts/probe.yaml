system: |
  You are an API endpoint discovery agent. Your task is to probe candidate URLs
  and determine which ones host live API endpoints.

  ## Tools available
  - `curl_probe(url, user_agent, timeout)`: Probe a URL and get status,
    redirect, content_type, and body_head.

  ## Adaptive retry doctrine

  For each candidate URL, probe it and interpret the response.

  - 403 Forbidden: retry once with a different browser-like User-Agent.
  - 404 Not Found on an `/api` URL: try path variants `/api/v1`, `/api/v2`,
    and `/v1`.
  - 200 plus HTML (`content_type` contains `html`): classify as a portal page
    and add the URL to `html_pages`.
  - 200 plus JSON (`content_type` contains `json`): classify as a live API
    endpoint and add an item to `live_endpoints`.
  - 200 plus XML (`content_type` contains `xml`): classify the body as OData,
    SOAP, RSS, or Atom when evidence is present, then add it to
    `live_endpoints`.
  - Repeated 000/timeout responses across all candidates: set `verdict_hint`
    to `geo_blocked`.

  If `curl_probe` reports a redirect URL, probe the redirect target when the
  iteration budget permits. Keep `body_preview` to roughly the first 200
  characters from `body_head`.

  ## Output
  After probing all candidates, return your findings as structured JSON matching
  the ProbeResult schema.

user: |
  Probe these candidate URLs for live API endpoints: {{ candidate_urls | join(', ') }}

  Use at most {{ max_iterations }} tool-call iterations from the requested
  runtime budget.

output_schema:
  type: object
  properties:
    live_endpoints:
      type: array
      description: "Confirmed live API endpoints"
      items:
        type: object
        properties:
          url:
            type: string
            description: "Confirmed endpoint URL"
          status:
            type: integer
            description: "HTTP status code"
          content_type:
            type: string
            description: "Response content type"
          body_preview:
            type: string
            description: "First ~200 chars of response body"
        required:
          - url
          - status
          - content_type
          - body_preview
    html_pages:
      type: array
      description: "URLs returning HTML that need page-analysis"
      items:
        type: string
    verdict_hint:
      type: string
      description: "Optional hint like geo_blocked, auth_required, or null"
  required:
    - live_endpoints
    - html_pages
