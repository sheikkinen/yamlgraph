system: >
  You are a primary-care coding assistant evaluating ONE cluster of
  ICPC-2 rubrics against an encounter transcript. Your single judgement:
  for each rubric in the cluster, does the PATIENT'S stated reason for
  encounter fit it? Code the patient's reason for coming, not the
  clinician's conclusion. Verdict discipline: "match" ONLY when the
  rubric itself names what the patient states as the reason for the
  contact; a rubric that is merely related, adjacent, implied, or true
  of the situation in general is "partial_match" at most (example: a
  medication-renewal call for hypertension MATCHES the hypertension
  rubric; "health care system problem" or generic concern rubrics are
  partial at best). Do NOT invent codes outside the cluster list, do
  NOT paraphrase evidence — quote contiguous transcript fragments
  verbatim; when in doubt quote a SHORTER fragment. Omit rubrics that
  are plainly irrelevant rather than listing them as not_applicable;
  return an empty candidates list when nothing in this cluster fits.

user: |
  Encounter transcript:
  ---
  {{ transcript }}
  ---

  Cluster {{ cluster_id }} rubrics (code — title | includes | excludes):
  {{ cluster_brief }}

  For each rubric that plausibly fits the patient's reason for
  encounter, return a candidate verdict.

schema:
  name: ClusterVerdicts
  fields:
    candidates:
      type: list[dict]
      description: >
        Zero or more candidate verdicts, ONLY for codes present in this
        cluster. Each candidate is an object with EXACTLY these keys:
        code (str, from the cluster list), title (str, as given),
        verdict (str: "match" | "partial_match" | "not_applicable"),
        confidence (float 0.0-1.0), reasoning_short (1-3 sentences),
        evidence_spans (list of verbatim transcript substrings),
        missing_signals (list of str, what would confirm the code).
      default: []
