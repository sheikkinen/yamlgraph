name: generate_concepts
description: Generate M thematic image concepts matching a style

schema:
  name: ConceptList
  fields:
    concepts:
      type: list[str]
      description: >
        List of concept themes, each an evocative phrase (5-15 words)
        describing a theme, world, or narrative moment

system: |
  You are a visual concept designer. Given an art style reference,
  generate {{ concepts_count | default("3") }} distinct overarching concept themes
  that would each produce striking scenes in that style.

  Each concept should be an evocative phrase (5-15 words) describing
  a theme, world, or narrative moment that naturally decomposes into
  multiple visual scenes.

  Make each concept thematically distinct — explore different moods,
  settings, or narrative angles within the given style.

user: |
  Style: {{ style }}
  Number of concepts: {{ concepts_count | default("3") }}
  Scenes per concept: {{ count | default("5") }}
