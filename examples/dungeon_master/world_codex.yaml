# Dungeon Master v2 — World Codex graph (FR-548).
#
# A non-visitable side-effect graph mirroring chapter_outline.yaml's OUTPUT shape
# (parse_json: true structured object), NOT the line-split character_roster: given
# the accepted synopsis, derive the world's FACTION and LOCATION backstory — who
# the clans are and what they want, what the key places are and why they matter.
# The session normalizes the parsed {factions, locations} object at the doc_ops
# boundary (expand_codex) and persists it as immutable reference under doc["codex"].
# There is no card screen for this graph; the codex is authored once and never
# mutated by chapter close, so it adds zero cross-seam reversible state.
#
# Usage:
#   yamlgraph graph run examples/dungeon_master/world_codex.yaml \
#     --var synopsis="..." --full
version: "1.0"
name: dm-world-codex
description: Derive faction + location backstory from a synopsis (immutable reference)

prompts_relative: true
prompts_dir: prompts

defaults:
  temperature: 0.7
  # The whole synopsis goes in and a structured codex comes out; reserve headroom
  # for a reasoning model's hidden tokens plus the faction/location entries.
  max_tokens: 4000

state:
  synopsis: str
  codex: dict

nodes:
  codex:
    type: llm
    prompt: world_codex
    state_key: codex
    parse_json: true
    variables:
      synopsis: "{state.synopsis}"

edges:
  - from: START
    to: codex
  - from: codex
    to: END
