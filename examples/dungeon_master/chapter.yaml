# Dungeon Master v2 — Single chapter expansion graph (FR-488).
#
# One shared graph serves every chapter card, mirroring character.yaml: given
# the accepted synopsis as fixed context, THIS chapter's one-paragraph summary,
# its index, and the PREVIOUS chapter's world_state (the forward-carry — the
# seed of the consistency anchor, FR-488 J7), produce the full chapter
# description AND the world_state at the end of this chapter.
#
# Output is STRUCTURED (parse_json: true): a {text, world_state} object — the
# world_state ledger is a first-class field, not buried in prose. Empty draft =>
# first expansion; non-empty draft => apply the instruction to the existing text.
#
# Usage:
#   yamlgraph graph run examples/dungeon_master/chapter.yaml \
#     --var synopsis="..." --var summary="..." --var index="2" \
#     --var previous_world_state="..." --var draft="" \
#     --var instruction="darken the mood" --full
version: "1.0"
name: dm-chapter
description: Expand one chapter from its summary + the carried-forward world state

prompts_relative: true
prompts_dir: prompts

defaults:
  temperature: 0.7
  # Reserve headroom for reasoning-model hidden tokens + the full chapter prose
  # plus its world-state ledger.
  max_tokens: 4000

state:
  synopsis: str
  summary: str
  index: str
  previous_world_state: str
  draft: str
  instruction: str
  chapter: dict

nodes:
  chapter:
    type: llm
    prompt: chapter
    state_key: chapter
    parse_json: true
    variables:
      synopsis: "{state.synopsis}"
      summary: "{state.summary}"
      index: "{state.index}"
      previous_world_state: "{state.previous_world_state}"
      draft: "{state.draft}"
      instruction: "{state.instruction}"

edges:
  - from: START
    to: chapter
  - from: chapter
    to: END
