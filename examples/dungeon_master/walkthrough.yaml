# Dungeon Master v2 — Full-text walkthrough render (FR-487).
#
# The second of the walkthrough's two passes. A MAP over one pre-assembled bundle
# per played turn (turn_ops.walkthrough_render_inputs): each bundle carries the
# turn's FR-485 cut segment (the structural spine), the FR-486 performance
# (dialogue/expression/acted intent, but NOT the private thinking), the scene
# `setting`, and that turn's `staging` delta. For each turn the render expands the
# cut segment into one full, playable passage — staged, spoken, acted — preserving
# the cut's emphasis (the climax turn stays heaviest) and inventing nothing not
# present in the authored layers.
#
# The render is LOCAL (per-turn) because the global work — de-repetition and
# climax weighting — is already baked into the cut spine (FR-485); the global
# coherence rides in on the spine, the renderer stays local, and the staging
# deltas carry the continuity between passages.
#
# The bundles are assembled in Python and fed as a list; the map collects the
# rendered passages in turn order, which turn_ops.invoke_walkthrough pairs with
# each bundle's n and validates 1:1 against the played arc (reused
# validate_cut_turns). Output per turn is plain prose (parse_json: false).
#
# Usage (bundles are normally assembled by the session, not the CLI):
#   yamlgraph graph run examples/dungeon_master/walkthrough.yaml \
#     --var-json bundles='[{"n":1,"cut_text":"...","setting":"...","staging":"...","cast":[]}]' \
#     --full
version: "1.0"
name: dm-walkthrough
description: Render one full-text passage per played turn from the authored layers

prompts_relative: true
prompts_dir: prompts

defaults:
  temperature: 0.7
  # Each passage is full scene prose for one turn; reserve headroom for a
  # reasoning model's hidden tokens and the rendered text.
  max_tokens: 4000

state:
  bundles: list
  renders: list

nodes:
  render:
    type: map
    over: "{state.bundles}"
    as: turn
    max_items: 16
    node:
      type: llm
      prompt: walkthrough
      state_key: passage
      parse_json: false
      variables:
        turn: "{state.turn}"
    collect: renders

edges:
  - from: START
    to: render
  - from: render
    to: END
