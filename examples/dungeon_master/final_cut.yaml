# Dungeon Master v2 — Final Cut compose graph (FR-484).
#
# A terminal leaf, the same shape as key_scene: one llm node that composes a
# single continuous scene narration from the WHOLE played arc — the frozen scene
# plan, every turn recap in order (not the 3-turn window the live recap writer
# sees), the canonical BEATS, and a derived climax marker. It de-repeats standing
# facts and weights the pivotal beat. The played turns are not touched; this is a
# separate composed artifact (additive).
#
# Inputs are assembled by turn_ops.final_cut_context(doc); draft + instruction
# carry an Iterate's current cut and steer. Empty draft => first compose;
# non-empty draft => apply the change.
# FR-511 added continuity constraints (allowed/dead cast) to the prompt contract.
#
# Usage:
#   yamlgraph graph run examples/dungeon_master/final_cut.yaml \
#     --var key_scene="..." --var arc="Turn 1 — ...\n\nTurn 2 — ..." \
#     --var beats="- a beat" --var climax="Turn 2" \
#     --var draft="" --var instruction="" --full
version: "1.0"
name: dm-final-cut
description: Compose one continuous scene narration from the whole played arc

prompts_relative: true
prompts_dir: prompts

defaults:
  temperature: 0.7
  # The whole arc goes in and a full polished scene comes out; reserve generous
  # headroom for both a reasoning model's hidden tokens and the long prose.
  max_tokens: 4000

state:
  key_scene: str
  arc: str
  beats: str
  climax: str
  beat_groups: str
  allowed_cast: str
  dead_before_open: str
  dead_within_chapter: str
  possession_facts: str
  draft: str
  instruction: str
  final_cut: str

nodes:
  final_cut:
    type: llm
    prompt: final_cut
    state_key: final_cut
    parse_json: false
    variables:
      key_scene: "{state.key_scene}"
      arc: "{state.arc}"
      beats: "{state.beats}"
      climax: "{state.climax}"
      beat_groups: "{state.beat_groups}"
      allowed_cast: "{state.allowed_cast}"
      dead_before_open: "{state.dead_before_open}"
      dead_within_chapter: "{state.dead_within_chapter}"
      possession_facts: "{state.possession_facts}"
      draft: "{state.draft}"
      instruction: "{state.instruction}"

edges:
  - from: START
    to: final_cut
  - from: final_cut
    to: END
