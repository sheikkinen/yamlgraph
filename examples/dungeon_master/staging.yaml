# Dungeon Master v2 — Whole-arc director-staging pass (FR-487).
#
# The first of the walkthrough's two passes. Where the per-character actors decide
# what they think/say/do (turn.yaml) and the cuts summarise the arc, this pass is
# the DIRECTOR's eye applied to the finish: over the WHOLE arc at once it returns
# one curtain-up `setting` (location, time, who is present) and a per-turn
# `staging` delta (location/blocking changes as the scene moves). Because it sees
# the full sequence, those per-turn deltas are the seams that carry cross-turn
# continuity between the otherwise locally-rendered passages (FR-487 OQ3/OQ4).
#
# The output is STRUCTURED (parse_json: true): a {setting, staging: [{n, text}]}
# object keyed by the played turn numbers. Inputs are assembled by
# turn_ops.walkthrough_staging_context(doc) — the scene plan, the played arc, the
# beats, the climax marker, and the rendered FR-485 cut spine.
#
# Usage:
#   yamlgraph graph run examples/dungeon_master/staging.yaml \
#     --var key_scene="..." --var arc="Turn 1 — ...\n\nTurn 2 — ..." \
#     --var beats="- a beat" --var climax="Turn 2" --var cut="Turn 1 — ..." \
#     --var draft="" --var instruction="" --full
version: "1.0"
name: dm-staging
description: Whole-arc director-staging pass — scene setting plus per-turn staging deltas

prompts_relative: true
prompts_dir: prompts

defaults:
  temperature: 0.7
  # The whole arc + cut goes in and a setting plus one delta per turn comes out;
  # reserve headroom for a reasoning model's hidden tokens and the staging prose.
  max_tokens: 4000

state:
  key_scene: str
  arc: str
  beats: str
  climax: str
  cut: str
  draft: str
  instruction: str
  staging: dict

nodes:
  staging:
    type: llm
    prompt: staging
    state_key: staging
    parse_json: true
    variables:
      key_scene: "{state.key_scene}"
      arc: "{state.arc}"
      beats: "{state.beats}"
      climax: "{state.climax}"
      cut: "{state.cut}"
      draft: "{state.draft}"
      instruction: "{state.instruction}"

edges:
  - from: START
    to: staging
  - from: staging
    to: END
