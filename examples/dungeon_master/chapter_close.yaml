# Dungeon Master v2 — Chapter-close world_state derivation graph (FR-491 G2/B).
#
# A chapter is no longer expanded from its summary in one shot (chapter.yaml is
# retired); it is PLAYED, turn by turn. When its scene completes, this graph runs
# once to derive the WORLD STATE at the end of the chapter from the inherited
# world_state (where the previous chapter left off) plus THIS chapter's played
# recaps. That end-of-chapter ledger is the forward-carry seed the next chapter
# inherits (the load-bearing FR-488 J7 seam, preserved through play).
#
# Output is STRUCTURED (parse_json: true): a {world_state, seam_packet} object.
# The chapter's prose is composed separately from played recaps; this graph
# derives the chapter-close continuity artifacts.
#
# Usage:
#   yamlgraph graph run examples/dungeon_master/chapter_close.yaml \
#     --var synopsis="..." --var summary="..." --var index="2" \
#     --var previous_world_state="..." --var recaps="..." --full
version: "1.0"
name: dm-chapter-close
description: Derive the end-of-chapter world state from the played recaps

prompts_relative: true
prompts_dir: prompts

defaults:
  temperature: 0.5
  # gemini-3.5-flash is a REASONING model: it spends hidden thinking tokens from
  # the completion budget BEFORE emitting JSON. A 2000 cap was exhausted entirely
  # by reasoning (~1921 tok observed in LangSmith), leaving "text": "" → empty
  # ledger. Two guards: a large output budget AND a bounded reasoning threshold so
  # thinking can never starve the structured ledger that must follow it.
  # Kept below 1024 deliberately: create_llm() rejects thinking_budget >= 1024 on
  # non-thinking providers (e.g. inception/mercury used for fast test runs); under
  # the threshold it bounds Gemini reasoning on vertex yet is silently ignored
  # elsewhere, so the graph stays provider-portable.
  max_tokens: 8000
  thinking_budget: 512

state:
  synopsis: str
  summary: str
  index: str
  previous_world_state: str
  recaps: str
  chapter_close: dict

nodes:
  chapter_close:
    type: llm
    prompt: chapter_close
    state_key: chapter_close
    parse_json: true
    variables:
      synopsis: "{state.synopsis}"
      summary: "{state.summary}"
      index: "{state.index}"
      previous_world_state: "{state.previous_world_state}"
      recaps: "{state.recaps}"

edges:
  - from: START
    to: chapter_close
  - from: chapter_close
    to: END
