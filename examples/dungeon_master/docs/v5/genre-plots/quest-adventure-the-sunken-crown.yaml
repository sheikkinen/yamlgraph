# plot-plan: The Sunken Crown
# Genre: quest-adventure
# Kinds used: lack, departure, donor_test, provision, struggle, victory,
#   return, liquidation (8 of 16)
# Source: v4/genre-plots/quest-adventure-the-sunken-crown.md

meta:
  title: The Sunken Crown
  genre: quest-adventure
  synopsis: v5/quest-adventure-the-sunken-crown.txt

agents:
  - Eira
  - Thane Gault
  - Ferryman Ossa
  - Queen Livia
  - Usurper Kael

initial_world:
  - pred: alive
    args: [Eira]
    value: true
  - pred: alive
    args: [Thane Gault]
    value: true
  - pred: alive
    args: [Ferryman Ossa]
    value: true
  - pred: alive
    args: [Queen Livia]
    value: true
  - pred: alive
    args: [Usurper Kael]
    value: true
  - pred: at
    args: [Eira, Capital]
    value: true
  - pred: at
    args: [Thane Gault, Capital]
    value: true
  - pred: at
    args: [Sunken Crown, Temple]
    value: true
  - pred: holds
    args: [Ferryman Ossa, passage]
    value: true
  - pred: rel
    args: [Eira, Queen Livia]
    value: sworn
  - pred: rel
    args: [Thane Gault, Queen Livia]
    value: sworn
  - pred: faction
    args: [Usurper Kael, northern_lords]
    value: true
  - pred: faction
    args: [Queen Livia, southern_lords]
    value: true

initial_belief:
  - observer: Eira
    fluent:
      pred: at
      args: [Sunken Crown, Temple]
    held: true
  - observer: Usurper Kael
    fluent:
      pred: at
      args: [Sunken Crown, Temple]
    held: true
  - observer: Eira
    fluent:
      pred: alive
      args: [Ferryman Ossa]
    held: uncertain

goals:
  - pred: holds
    args: [Queen Livia, Sunken Crown]
    value: true
  - pred: alive
    args: [Eira]
    value: true
  - pred: alive
    args: [Thane Gault]
    value: true

functions:
  - id: F1
    kind: lack
    gloss: >
      Queen Livia summons Eira and Gault: without the Sunken Crown,
      the southern lords will not swear fealty, and Kael's army will
      crush them within the month.
    subject: Queen Livia
    roles:
      dispatcher: Queen Livia
      hero: Eira
    chapter: 1
    observers: [Eira, Thane Gault]
    motivation:
      agent: Queen Livia
      goal: legitimize_reign
    threatens: null
    enables: [F2]
    eff_affect:
      - op: open
        char: Eira
        kind: guilt

  - id: F2
    kind: departure
    gloss: >
      Eira and Gault leave the capital at dawn, traveling south along
      the flooded river road toward the old temple.
    subject: Eira
    roles:
      hero: Eira
      helper: Thane Gault
    chapter: 1
    observers: [Eira, Thane Gault]
    motivation:
      agent: Eira
      goal: retrieve_crown
    threatens:
      agent: Usurper Kael
      goal: prevent_coronation
    enables: [F3]
    pre_world:
      - pred: at
        args: [Eira, Capital]
        value: true
    eff_world:
      - pred: at
        args: [Eira, Capital]
        value: false
      - pred: at
        args: [Eira, River road]
        value: true
      - pred: at
        args: [Thane Gault, Capital]
        value: false
      - pred: at
        args: [Thane Gault, River road]
        value: true
    eff_affect: []

  - id: F3
    kind: donor_test
    gloss: >
      At the flooded fork, Ferryman Ossa blocks the passage and demands
      Eira recite the temple's true name from memory — no manuscript,
      no notes. Gault reaches for his sword but Eira stops him.
    subject: Eira
    roles:
      hero: Eira
      donor: Ferryman Ossa
    chapter: 2
    observers: [Eira, Thane Gault, Ferryman Ossa]
    motivation:
      agent: Ferryman Ossa
      goal: guard_temple
    threatens: null
    enables: [F4]
    pre_world:
      - pred: at
        args: [Eira, River road]
        value: true
      - pred: holds
        args: [Ferryman Ossa, passage]
        value: true
    eff_belief:
      - observer: Ferryman Ossa
        fluent:
          pred: rel
          args: [Eira, Queen Livia]
        held: worthy
    eff_affect: []

  - id: F4
    kind: provision
    gloss: >
      Ossa ferries them through the flooded gorge and gives Eira a
      breathing reed — 'the temple is underwater past the second gate.'
    subject: Ferryman Ossa
    roles:
      donor: Ferryman Ossa
      hero: Eira
    chapter: 2
    observers: [Eira, Thane Gault]
    motivation:
      agent: Ferryman Ossa
      goal: guard_temple
    threatens: null
    enables: [F5]
    pre_world:
      - pred: holds
        args: [Ferryman Ossa, passage]
        value: true
    pre_belief:
      - observer: Ferryman Ossa
        fluent:
          pred: rel
          args: [Eira, Queen Livia]
        held: worthy
    eff_world:
      - pred: at
        args: [Eira, Temple]
        value: true
      - pred: at
        args: [Thane Gault, Temple]
        value: true
      - pred: holds
        args: [Eira, breathing_reed]
        value: true
    eff_affect: []

  - id: F5
    kind: struggle
    gloss: >
      Inside the flooded temple, Eira dives past the second gate while
      Gault holds off Kael's raiders who arrived by a different route.
      The water is black and the reed is her only air.
    subject: Eira
    roles:
      hero: Eira
      helper: Thane Gault
      villain: Usurper Kael
    chapter: 3
    observers: [Eira, Thane Gault]
    motivation:
      agent: Eira
      goal: retrieve_crown
    threatens:
      agent: Usurper Kael
      goal: prevent_coronation
    enables: [F6]
    pre_world:
      - pred: at
        args: [Eira, Temple]
        value: true
      - pred: holds
        args: [Eira, breathing_reed]
        value: true
      - pred: at
        args: [Sunken Crown, Temple]
        value: true
    eff_affect:
      - op: open
        char: Eira
        kind: loss

  - id: F6
    kind: victory
    gloss: >
      Eira surfaces with the Sunken Crown in her hands. Above, Gault
      has driven off the raiders — bloodied but alive. The temple is
      theirs.
    subject: Eira
    roles:
      hero: Eira
      helper: Thane Gault
    chapter: 3
    observers: [Eira, Thane Gault]
    motivation:
      agent: Eira
      goal: retrieve_crown
    threatens:
      agent: Usurper Kael
      goal: prevent_coronation
    enables: [F7]
    pre_world:
      - pred: at
        args: [Sunken Crown, Temple]
        value: true
    eff_world:
      - pred: holds
        args: [Eira, Sunken Crown]
        value: true
      - pred: at
        args: [Sunken Crown, Temple]
        value: false
    eff_affect:
      - op: close
        char: Eira
        kind: loss

  - id: F7
    kind: return
    gloss: >
      Eira and Gault ride north through enemy territory, the crown
      wrapped in oilcloth against Eira's chest.
    subject: Eira
    roles:
      hero: Eira
      helper: Thane Gault
    chapter: 4
    observers: [Eira, Thane Gault]
    motivation:
      agent: Eira
      goal: deliver_crown
    threatens:
      agent: Usurper Kael
      goal: prevent_coronation
    enables: [F8]
    pre_world:
      - pred: holds
        args: [Eira, Sunken Crown]
        value: true
    eff_world:
      - pred: at
        args: [Eira, Capital]
        value: true
      - pred: at
        args: [Thane Gault, Capital]
        value: true
    eff_affect: []

  - id: F8
    kind: liquidation
    gloss: >
      Eira places the Sunken Crown on Queen Livia's head before the
      assembled southern lords. The oaths are sworn. The lack is
      liquidated — the kingdom has a legitimate ruler.
    subject: Eira
    roles:
      hero: Eira
      dispatcher: Queen Livia
    chapter: 5
    observers: [Eira, Thane Gault, Queen Livia]
    motivation:
      agent: Eira
      goal: legitimize_queen
    threatens:
      agent: Usurper Kael
      goal: seize_throne
    enables: []
    pre_world:
      - pred: holds
        args: [Eira, Sunken Crown]
        value: true
      - pred: at
        args: [Eira, Capital]
        value: true
    eff_world:
      - pred: holds
        args: [Queen Livia, Sunken Crown]
        value: true
      - pred: holds
        args: [Eira, Sunken Crown]
        value: false
    eff_affect:
      - op: close
        char: Eira
        kind: guilt

affect_policy:
  unclosed_is_error: true
  partial_goal_failure: false
