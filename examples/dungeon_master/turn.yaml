# Dungeon Master v2 — Turn graph (FR-477, FR-479).
#
# One round of play: every principal is prompted privately for THINKING + INTENT
# (a map over the cast), then a structured DIRECTOR judges the scene state
# (phase, establishing description, scene_complete, steer, continuity) before a
# render-only NARRATOR consolidates the intents into one dry "Turn N — …" recap.
# A single graph returns the per-character intents, the director's direction, and
# the recap (J1): map → direct → recap.
#
# Inputs (set by the session's invoke_turn, J3):
#   cast    — list of {name, sheet, previous} bundles, one per reviewed character
#   scene   — key scene + a bounded digest of prior turn recaps (J4)
#   turn_n  — the 1-based turn number
#   instruction — optional DM steer applied to the recap on Iterate (else "")
#
# Outputs: intents (list of {thinking, intent}, cast order), direction (dict),
#          recap (str).
#
# Usage:
#   yamlgraph graph run examples/dungeon_master/turn.yaml \
#     --var-json cast='[{"name":"Kara","sheet":"...","previous":""}]' \
#     --var scene="..." --var turn_n=1 --var instruction="" --full
version: "1.0"
name: dm-turn
description: One turn — private per-character intents mapped over the cast, then consolidated

prompts_relative: true
prompts_dir: prompts

defaults:
  temperature: 0.7
  # Reserve headroom for reasoning-model hidden tokens + the full recap.
  max_tokens: 4000

state:
  cast: list
  scene: str
  turn_n: str
  instruction: str
  protected: str
  gone_this_chapter: str
  intents: list
  direction: dict
  recap: str

nodes:
  intents:
    type: map
    over: "{state.cast}"
    as: char
    max_items: 8
    node:
      type: llm
      prompt: character_intent
      state_key: intent
      parse_json: true
      variables:
        char: "{state.char}"
        scene: "{state.scene}"
        turn_n: "{state.turn_n}"
    collect: intents

  direct:
    type: llm
    prompt: turn_direct
    state_key: direction
    parse_json: true
    variables:
      scene: "{state.scene}"
      cast: "{state.cast}"
      intents: "{state.intents}"
      turn_n: "{state.turn_n}"
      protected: "{state.protected}"
      gone_this_chapter: "{state.gone_this_chapter}"

  recap:
    type: llm
    prompt: turn_recap
    state_key: recap
    parse_json: false
    variables:
      scene: "{state.scene}"
      cast: "{state.cast}"
      intents: "{state.intents}"
      direction: "{state.direction}"
      turn_n: "{state.turn_n}"
      instruction: "{state.instruction}"
      gone_this_chapter: "{state.gone_this_chapter}"

edges:
  - from: START
    to: intents
  - from: intents
    to: direct
  - from: direct
    to: recap
  - from: recap
    to: END
