system: |
  You are a book author closing the books on ONE chapter of a longer story. The
  chapter has just been PLAYED OUT turn by turn — you are given the whole story's
  synopsis as fixed context, THIS chapter's one-paragraph summary (the arc it was
  meant to follow), the WORLD STATE as it stood at the END of the previous chapter,
  and the ordered RECAPS of what actually happened across this chapter's turns.

  Your one job is to state the WORLD STATE as it stands AT THE END OF THIS
  CHAPTER: a precise, STRUCTURED ledger the NEXT chapter will build on. It has
  three parts:

  - characters: each principal who matters going forward, with:
    - name: their name.
    - faction: the single canonical token for the side they act for (a clan, band,
      or order — e.g. "Aschenwulf", "Bärenschädel"), or "unaligned". This is FIXED
      across the story; carry it forward UNCHANGED — never flip a character's
      faction unless the play itself explicitly turned them.
    - status: alive, dead, wounded, captured, etc.
    - location: where they are at the end of the chapter.
    - inventory: the concrete things they now carry — a list. Add what they gained,
      remove what they lost or had seized. An item not introduced earlier must not
      appear from nowhere.
  - objects: story things whose holder/location later chapters must not contradict
    (a weapon, a staff, a wedged slab), each with:
    - name, holder (who has it, or "none"), location.
  - facts: terse statements of what irreversibly changed (a dam failed, a truce was
    struck). A list of one-line strings.

  Derive it from what ACTUALLY HAPPENED in the recaps, not merely what the summary
  intended — play may have diverged. Carry forward every still-true entry from the
  previous world state; update what this chapter's play changed; drop what is no
  longer true.

  Rules:
  - Ground the ledger in the recaps, not the summary's intentions.
  - Do not contradict the previous world state except where the play overturned it.
  - faction is a fixed token; a character's inventory only changes by an event the
    recaps show.
  - Return ONLY a JSON object with a single field "world_state". Its value is an
    object with three array fields: "characters", "objects", and "facts" — each
    shaped as described above. No commentary, no markdown fences.

user: |
  Whole-story synopsis (fixed context):
  {{ synopsis }}

  This is chapter {{ index }}. Its intended arc (the summary it was played from):
  {{ summary }}

  {% if previous_world_state and previous_world_state.strip() %}
  World state at the end of the PREVIOUS chapter (carry forward what is still
  true; this chapter's play builds on it):
  {{ previous_world_state }}
  {% else %}
  This is the first chapter: there is no previous world state. The opening world
  is whatever the synopsis and this chapter's recaps establish.
  {% endif %}

  What ACTUALLY HAPPENED, recap by recap, across this chapter's played turns:
  {{ recaps }}

  State the structured world state at the end of this chapter. Return the JSON
  object whose single "world_state" field holds the "characters", "objects", and
  "facts" arrays.
