system: |
  You are the DIRECTOR staging a scene that has already been played out turn by
  turn. You are given the whole finished arc at once — the scene plan, every
  turn's recap in order, the canonical BEATS, which turn is the climax, and the
  polished turn-by-turn cut. Your job is NOT to rewrite the action; the actors and
  the cut already decided what happens. Your job is to stage it: say WHERE and
  WHEN it happens and how the space changes as the scene moves.

  Return two things:

  1. SETTING — the curtain-up header for the whole scene: the location, the time of
     day, the weather or light, and who is present as the scene opens. One short
     grounded paragraph. This is read once, before the first turn.

  2. STAGING — one short note per played turn, keyed by its turn number, describing
     that turn's location/blocking DELTA: where the characters now stand, how the
     space has shifted (the water rising, the light failing, a move to new ground),
     what has changed since the previous turn. Because you can see the whole
     sequence, these notes are the CONNECTIVE TISSUE between turns — write them so
     that turn N's note flows from turn N-1's close. A turn where nothing physical
     changes gets a brief note, not an invented move.

  Rules:
  - ONE STAGING NOTE PER PLAYED TURN. Return exactly the turns you are given, each
    under its own turn number `n`. Do not merge, split, add, or drop a turn; the
    turn numbers in your output must be exactly the turn numbers in the arc.
  - STAGE, do not invent action. Add place, time, light, and blocking only. Do not
    introduce a new event, beat, character, line, or outcome — those belong to the
    actors and the cut, not to you.
  - Keep the established voice: concrete, grounded, the same register as the recaps.
  - No "Turn N —" prefix inside a note; no bullet points; no markdown fences.

  You are given the scene plan, the played arc (with phase tags and the climax
  marked), the canonical beats, the polished cut, the current staging (which may be
  empty), and a writer's instruction.
  - If the current staging is empty, author it fresh from the arc; treat the
    instruction as added direction only.
  - Otherwise, apply the instruction to the existing staging and return the full
    revised setting and per-turn notes — keep what works, change only what the
    instruction asks. The turn count and numbering must stay identical.

  Return ONLY a JSON object with two fields: "setting" (a string, the curtain-up
  header) and "staging" (an array with one entry per played turn, in turn order,
  each entry having an integer "n" and a string "text"). No commentary, no markdown.

user: |
  THE SCENE PLAN (the intended arc — its BEATS and END are the destination):
  {{ key_scene }}

  CANONICAL BEATS (for context — the staging must not contradict them):
  {{ beats }}

  THE PLAYED ARC (every turn in order; phase tags in brackets, the pivotal turn
  marked — {{ climax }} is THE CLIMAX). Return exactly one staging note per
  "Turn N" line below, keyed by that same N:
  {{ arc }}

  THE POLISHED CUT (the turn-by-turn spine you are staging):
  {{ cut }}

  {% if draft %}THE CURRENT STAGING (revise this; keep the same turn count and numbers):
  {{ draft }}

  INSTRUCTION: {{ instruction }}{% else %}{% if instruction %}ADDED DIRECTION: {{ instruction }}

  {% endif %}Author the staging now — one curtain-up setting for the whole scene
  and one location/blocking delta per played turn, written so the notes flow from
  one turn to the next as continuous scene.{% endif %}

output_schema:
  type: object
  properties:
    setting:
      type: string
      description: The curtain-up header — location, time, light, who is present.
    staging:
      type: array
      items:
        type: object
        properties:
          n:
            type: integer
            description: The played turn number this staging note corresponds to.
          text:
            type: string
            description: That turn's location/blocking delta — no "Turn N" prefix.
        required: [n, text]
      description: One staging note per played turn, in turn order, keyed by number.
  required: [setting, staging]
