<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dungeon Master</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --bg-primary: #1c1814;
      --bg-secondary: #2a2320;
      --bg-card: #33291f;
      --parchment: #e8dcc0;
      --ink: #2b2b2b;
      --text: #d8cbb0;
      --muted: #9c8b6e;
      --accent: #c2873f;
      --accent-hover: #e0a955;
      --success: #6a994e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 1rem 1.5rem;
      background: var(--bg-secondary);
      border-bottom: 2px solid var(--accent);
    }
    header h1 { margin: 0; color: var(--accent); font-size: 1.4rem; }
    main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
    label { display: block; margin-bottom: 0.75rem; color: var(--muted); font-size: 0.9rem; }
    input, textarea {
      width: 100%; margin-top: 0.25rem; padding: 0.5rem;
      background: var(--bg-card); color: var(--text);
      border: 1px solid var(--accent); border-radius: 4px;
    }
    button {
      background: var(--accent); color: var(--bg-primary);
      border: none; padding: 0.5rem 0.9rem; border-radius: 4px;
      font-weight: 600; cursor: pointer; margin: 0.2rem 0.2rem 0 0;
    }
    button:hover { background: var(--accent-hover); }
    button.primary { background: var(--success); color: var(--parchment); }
    button.primary:hover { background: #7bb35a; }

    /* Breadcrumb strip above the story body. */
    #app-shell { display: flex; flex-direction: column; gap: 1.25rem; }
    .crumbs {
      display: flex; align-items: center; gap: 0.5rem;
      background: var(--bg-secondary);
      padding: 0.5rem 1rem; border-radius: 8px;
      border-left: 4px solid var(--accent);
      font-size: 0.9rem;
    }
    .crumb { color: var(--parchment); text-decoration: none; }
    a.crumb { color: var(--accent); cursor: pointer; }
    a.crumb:hover { color: var(--accent-hover); text-decoration: underline; }
    .crumb-current { color: var(--accent-hover); font-weight: 700; }
    .crumb-member { font-size: 0.85rem; }
    .crumb-sep { color: var(--muted); }

    /* Story card. */
    .story-card {
      background: var(--bg-secondary);
      padding: 1.5rem; border-radius: 8px;
      border-left: 4px solid var(--accent);
    }
    .card-title { margin: 0 0 0.25rem; color: var(--accent); }
    .card-hint { margin: 0 0 1.25rem; color: var(--muted); font-size: 0.9rem; }
    .card-actions { margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .accepted-badge {
      display: inline-block; margin-top: 1rem;
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 0.2rem 0.6rem; border-radius: 999px;
      border: 1px solid var(--success); color: var(--success);
    }

    /* The editable prose surface + its form/prompt. */
    .text-block {
      display: block; width: 100%;
      background: var(--parchment); color: var(--ink);
      font-family: Georgia, "Iowan Old Style", serif;
      font-size: 1.05rem; line-height: 1.6;
      padding: 1.25rem; border-radius: 6px; margin-bottom: 1rem;
      border: 1px solid transparent;
      min-height: 22rem; resize: vertical;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }
    .text-block:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(0,0,0,0.35), 0 0 0 2px rgba(194,135,63,0.35);
    }
    .text-block.readonly { resize: none; white-space: pre-wrap; }
    .text-block-form { display: flex; flex-direction: column; }
    .iterate-prompt {
      flex: 0 0 auto; width: 100%; resize: vertical;
      margin-bottom: 0.5rem; padding: 0.6rem;
      border-radius: 6px; border: 1px solid var(--accent);
      background: var(--bg-secondary); color: var(--text);
      font-family: Georgia, "Iowan Old Style", serif; font-size: 0.95rem;
    }
    .iterate-prompt::placeholder { color: var(--muted); }

    /* Two-column play turn: read-only intents aside + the recap card (FR-477). */
    .story-grid { display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; }
    #story-aside {
      align-self: start;
      background: var(--bg-secondary);
      padding: 1rem; border-radius: 8px;
      border-left: 4px solid var(--accent);
    }
    .aside-title { margin: 0 0 0.75rem; color: var(--accent); font-size: 1rem; }
    .intent-card {
      background: var(--bg-card); border-radius: 6px;
      padding: 0.75rem; margin-bottom: 0.75rem;
      border: 1px solid rgba(194,135,63,0.35);
    }
    .intent-card:last-child { margin-bottom: 0; }
    .intent-name { color: var(--accent); font-weight: 700; margin-bottom: 0.4rem; }
    .intent-thinking { color: var(--muted); font-style: italic; margin-bottom: 0.4rem; }
    .intent-intent { color: var(--parchment); }
    .intent-label {
      display: inline-block; font-size: 0.7rem; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--accent); margin-right: 0.35rem;
    }
    @media (max-width: 768px) { .story-grid { grid-template-columns: 1fr; } }

    /* Director card (FR-481): the director's structured judgement, always shown
       on a turn — a compact, read-only signal beneath the intents. */
    .director-card {
      margin-top: 1rem; padding: 0.75rem;
      background: var(--bg-card); border-radius: 6px;
      border: 1px solid rgba(194,135,63,0.35);
    }
    .director-title { color: var(--accent); font-weight: 700; margin-bottom: 0.5rem; }
    .director-phase {
      display: inline-block; font-size: 0.7rem; letter-spacing: 0.05em;
      text-transform: uppercase; padding: 0.15rem 0.5rem; border-radius: 999px;
      border: 1px solid var(--accent); color: var(--accent); margin-bottom: 0.5rem;
    }
    .director-label {
      display: block; font-size: 0.7rem; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--accent); margin: 0.35rem 0 0.2rem;
    }
    .director-beats ul { margin: 0; padding-left: 1.1rem; color: var(--parchment); }
    .director-beats li { margin-bottom: 0.2rem; }
    .director-steer { color: var(--muted); font-style: italic; }
    .director-complete { color: var(--accent); font-weight: 700; margin-top: 0.5rem; }
    .continuity-flags { margin-top: 0.5rem; }
    .continuity-title { color: #e0a86c; font-weight: 700; font-size: 0.8rem; }
    .continuity-flag { color: var(--muted); font-size: 0.85rem; margin-top: 0.2rem; }

    .error { color: #e06c6c; }

    /* Single busy overlay (FR-478): shown while any slow request is in flight.
       Lives outside #app-body so the #app-body swap never destroys it; covers
       the viewport to both signal "weaving" and swallow a second press. */
    #busy { display: none; }
    .htmx-request#busy {
      display: block;
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0, 0, 0, 0.15);
      cursor: progress;
    }
    .busy-badge {
      position: fixed; top: 0.75rem; right: 1rem;
      background: var(--bg-secondary); color: var(--accent);
      border: 1px solid var(--accent); border-radius: 4px;
      padding: 0.35rem 0.7rem; font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div id="busy" aria-live="polite"><span class="busy-badge">⏳ Weaving…</span></div>
  <header>
    <h1>🎲 Dungeon Master</h1>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
