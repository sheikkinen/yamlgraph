<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dungeon Master</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --bg-primary: #1c1814;
      --bg-secondary: #2a2320;
      --bg-card: #33291f;
      --parchment: #e8dcc0;
      --ink: #2b2b2b;
      --text: #d8cbb0;
      --muted: #9c8b6e;
      --accent: #c2873f;
      --accent-hover: #e0a955;
      --success: #6a994e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 1rem 1.5rem;
      background: var(--bg-secondary);
      border-bottom: 2px solid var(--accent);
    }
    header h1 { margin: 0; color: var(--accent); font-size: 1.4rem; }
    main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
    label { display: block; margin-bottom: 0.75rem; color: var(--muted); font-size: 0.9rem; }
    input, textarea {
      width: 100%; margin-top: 0.25rem; padding: 0.5rem;
      background: var(--bg-card); color: var(--text);
      border: 1px solid var(--accent); border-radius: 4px;
    }
    button {
      background: var(--accent); color: var(--bg-primary);
      border: none; padding: 0.5rem 0.9rem; border-radius: 4px;
      font-weight: 600; cursor: pointer; margin: 0.2rem 0.2rem 0 0;
    }
    button:hover { background: var(--accent-hover); }
    button.primary { background: var(--success); color: var(--parchment); }
    button.primary:hover { background: #7bb35a; }

    /* Breadcrumb strip above the story body. */
    #app-shell { display: flex; flex-direction: column; gap: 1.25rem; }
    .crumbs {
      display: flex; align-items: center; gap: 0.5rem;
      background: var(--bg-secondary);
      padding: 0.5rem 1rem; border-radius: 8px;
      border-left: 4px solid var(--accent);
      font-size: 0.9rem;
    }
    .crumb { color: var(--parchment); text-decoration: none; }
    a.crumb { color: var(--accent); cursor: pointer; }
    a.crumb:hover { color: var(--accent-hover); text-decoration: underline; }
    .crumb-current { color: var(--accent-hover); font-weight: 700; }
    .crumb-member { font-size: 0.85rem; }
    .crumb-sep { color: var(--muted); }

    /* Story card. */
    .story-card {
      background: var(--bg-secondary);
      padding: 1.5rem; border-radius: 8px;
      border-left: 4px solid var(--accent);
    }
    .card-title { margin: 0 0 0.25rem; color: var(--accent); }
    .card-hint { margin: 0 0 1.25rem; color: var(--muted); font-size: 0.9rem; }
    .card-actions { margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .accepted-badge {
      display: inline-block; margin-top: 1rem;
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 0.2rem 0.6rem; border-radius: 999px;
      border: 1px solid var(--success); color: var(--success);
    }

    /* The editable prose surface + its form/prompt. */
    .text-block {
      display: block; width: 100%;
      background: var(--parchment); color: var(--ink);
      font-family: Georgia, "Iowan Old Style", serif;
      font-size: 1.05rem; line-height: 1.6;
      padding: 1.25rem; border-radius: 6px; margin-bottom: 1rem;
      border: 1px solid transparent;
      min-height: 22rem; resize: vertical;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }
    .text-block:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(0,0,0,0.35), 0 0 0 2px rgba(194,135,63,0.35);
    }
    .text-block.readonly { resize: none; white-space: pre-wrap; }
    .text-block-form { display: flex; flex-direction: column; }
    .iterate-prompt {
      flex: 0 0 auto; width: 100%; resize: vertical;
      margin-bottom: 0.5rem; padding: 0.6rem;
      border-radius: 6px; border: 1px solid var(--accent);
      background: var(--bg-secondary); color: var(--text);
      font-family: Georgia, "Iowan Old Style", serif; font-size: 0.95rem;
    }
    .iterate-prompt::placeholder { color: var(--muted); }

    .error { color: #e06c6c; }
    .htmx-indicator { display: none; color: var(--accent); margin-top: 0.5rem; }
    .htmx-request .htmx-indicator { display: inline; }
    .htmx-request.htmx-indicator { display: inline; }
  </style>
</head>
<body>
  <header>
    <h1>🎲 Dungeon Master</h1>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
