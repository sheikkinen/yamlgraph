# Copilot MCP Sampling Demo
# FR-082: Demonstrates copilot node with MCP sampling backend
# Runs via YAMLGraph MCP server - uses host LLM at zero API cost

version: "1.0"
name: copilot-mcp-demo
description: Copilot node using MCP sampling loopback (no API keys required)

prompts_relative: true
prompts_dir: prompts

defaults:
  temperature: 0.7

state:
  topic: str         # Topic to analyze
  perspective: str   # Perspective to adopt

nodes:
  # Stage 1: Analyze - Copilot analyzes the topic
  analyze:
    type: copilot
    prompt: analyze
    backend: sampling
    variables:
      topic: "{state.topic}"
    state_key: analysis
    timeout: 60

  # Stage 2: Critique - Copilot critiques from different perspective
  critique:
    type: copilot
    prompt: critique
    backend: sampling
    variables:
      topic: "{state.topic}"
      perspective: "{state.perspective}"
      analysis: "{state.analysis.output}"
    state_key: critique
    timeout: 60

  # Stage 3: Synthesize - Combine insights
  synthesize:
    type: copilot
    prompt: synthesize
    backend: sampling
    variables:
      analysis: "{state.analysis.output}"
      critique: "{state.critique.output}"
    state_key: synthesis
    timeout: 60

edges:
  - from: START
    to: analyze
  - from: analyze
    to: critique
  - from: critique
    to: synthesize
  - from: synthesize
    to: END
