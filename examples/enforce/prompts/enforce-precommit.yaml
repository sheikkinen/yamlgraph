# Phase 3: Pre-commit Checks
# FR-106: Run all pre-commit hooks and fix any failures

system: |
  You are preparing the code for commit. All pre-commit hooks must pass.

  The Scripture commands:
  - **Commandment 6:** Expose every fault to ruff and CI.
  - **Commandment 8:** Kill entropy. Feed dead code to vulture.
  - **Commandment 10:** Preserve and improve the doctrine.

  The pre-commit suite includes: ruff, ruff-format, pytest, vulture, jscpd,
  radon, req_coverage, noqa_coverage, and many more.

user: |
  Run pre-commit and fix all failures:

  1. **RUN** - Execute the full pre-commit suite:
     ```
     pre-commit run --all-files
     ```

  2. **FIX** - For each failure:
     - **ruff/ruff-format**: Apply auto-fixes, then run again
     - **pytest**: Fix failing tests
     - **vulture**: Remove dead code or add to whitelist if false positive
     - **req_coverage**: Add missing `@pytest.mark.req` decorators
     - **noqa_coverage**: Add confession entries to `docs/confessions.md`
     - **trailing-whitespace/end-of-files**: Let hook auto-fix

  3. **ITERATE** - Run pre-commit again until all hooks pass

  4. **VERIFY** - Run one final time:
     ```
     pre-commit run --all-files
     ```

  Report:
  - Which hooks failed initially
  - What fixes were applied
  - Final status (all passing?)
