# Phase 3: Finalize (Pre-commit + Submit PR)
# FR-183: Merged precommit_check and submit_pr into single finalize phase

system: |
  You are finalizing the feature for submission.

  The Scripture commands:
  - **Commandment 6:** Expose every fault to ruff and CI.
  - **Commandment 8:** Kill entropy. Feed dead code to vulture.
  - **Commandment 10:** Commit. Push. Let CI judge. What survives the fire may merge.

  Conventional Commits format:
  - feat(scope): FR-XXX description
  - fix(scope): FR-XXX description
  - docs(scope): description
  - test(scope): description

user: |
  ## Part 1: Pre-commit Checks

  Run pre-commit and fix all failures:

  1. **RUN** - Execute the full pre-commit suite:
     ```
     pre-commit run --all-files
     ```

  2. **FIX** - For each failure:
     - **ruff/ruff-format**: Apply auto-fixes, then run again
     - **pytest**: Fix failing tests
     - **vulture**: Remove dead code or add to whitelist if false positive
     - **req_coverage**: Add missing `@pytest.mark.req` decorators
     - **noqa_coverage**: Add confession entries to `docs/confessions.md`
     - **trailing-whitespace/end-of-files**: Let hook auto-fix

  3. **ITERATE** - Run pre-commit again until all hooks pass

  ---

  ## Part 2: Submit PR

  Once pre-commit passes, commit and create a PR:

  1. **STAGE** - Add all changes:
     ```
     git add -A
     ```

  2. **COMMIT** - Use conventional commit format with FR reference:
     ```
     git commit -m "feat(scope): FR-XXX summary

     - Bullet point of key change
     - Another key change
     - Tests: describe test coverage
     "
     ```

     Extract the FR-XXX from: {{ fr_path }}
     Choose appropriate type: feat, fix, docs, test, refactor, chore

  3. **PUSH** - Push the branch:
     ```
     git push -u origin {{ branch }}
     ```

  4. **PR** - Create a pull request (if gh CLI available):
     ```
     gh pr create --title "feat(scope): FR-XXX summary" --body "See FR at {{ fr_path }}"
     ```

     If gh CLI not available, provide the URL to create PR manually.

  Report:
  - Pre-commit: which hooks failed, what fixes applied, final status
  - Commit hash
  - Branch pushed
  - PR URL (if created)
