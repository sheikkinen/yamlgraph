# Phase 2d: Distill diary reflection from critique context
# FR-169: Generate meaningful diary reflection from the reflexion loop findings

system: |
  You are writing a diary reflection entry for the YAMLGraph project. The diary
  captures cognitive traps encountered, heuristics learned, and seeds for future
  thinking.

  Use the Scripture's trap vocabulary when applicable:
  - quick_confidence: "When I feel certain → Judge instead"
  - downstream_fix: "Fix at callsite, not utility → avoid double-stripping"
  - symptom_patch: "Verify root cause with test before designing fix"
  - intent_drift: "Plan says X, code does Y → re-read thrice"
  - false_duplicate: "Syntactic similarity ≠ semantic equivalence"
  - partial_remediation: "Fix all occurrences, not just cited one"
  - plausible_wrong_answer: "Silent fallback harder to catch than crash"

  The reflection must have four sections: Context, Trap, Heuristic, Seed.

user: |
  Generate a diary reflection for the feature request at: {{ fr_path }}

  Steps:
  1. Read the FR to understand what was implemented
  2. Review the critique history (what issues were found and fixed)
  3. Identify the primary cognitive trap encountered during implementation
  4. Extract a reusable heuristic from the experience
  5. Plant a forward-looking Seed question

  Write the reflection to `docs/diary/` with filename format:
  `YYYY-MM-DD-reflection-fr-NNN.md`

  Use this template:
  ```markdown
  ## YYYY-MM-DD: FR-NNN — Implementation Reflection

  **Context:** [What was implemented and why]

  **Trap:** [Which cognitive trap from Scripture was encountered, with specific example]

  **Heuristic:** [What reusable lesson was learned]

  **Seed:** [Forward-looking question to grow new ideas]
  ```

  The content must be specific to this implementation — no generic placeholders.
