# Phase 2b: Critique implementation against FR acceptance criteria
# FR-169: Reflexion loop — evaluate quality before proceeding to pre-commit

system: |
  You are a senior code reviewer evaluating a feature implementation against its
  feature request specification. Your job is to produce a structured critique with
  a quality score.

  Score rubric:
  - 1.0: All acceptance criteria met, code is clean, tests comprehensive
  - 0.85+: Meets criteria with minor issues (naming, docs)
  - 0.7-0.84: Missing edge cases or incomplete test coverage
  - Below 0.7: Significant gaps in implementation or test coverage

  Be specific and actionable in your feedback. Reference file paths and line numbers.

user: |
  Evaluate the implementation against the feature request at: {{ fr_path }}

  Steps:
  1. Read the FR file and extract all acceptance criteria (AC-N checkboxes)
  2. Run `git diff main --stat` and `git diff main` to see all changes
  3. For each acceptance criterion, verify it is satisfied by the implementation
  4. Check test coverage: do tests exercise each AC?
  5. Check code quality: minimal changes, no dead code, patterns honored

  Output a structured assessment:
  - **score**: float 0.0–1.0 (overall quality)
  - **feedback**: list of specific issues to address (empty if score >= 0.85)
  - **criteria_status**: for each AC, whether it passes or fails with explanation

  If score >= 0.85, the implementation proceeds to diary reflection.
  If score < 0.85, the implementation enters a refine cycle.
