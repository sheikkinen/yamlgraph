# FR-106: End-to-End Enforce Pipeline via Git Worktree
# FR-169: Reflexion loop between test_and_demo and precommit_check
#
# Seven-phase pipeline:
# 1. implement      - Read FR, implement with TDD
# 2. test_and_demo  - Run tests, create example/demo
# 3. critique       - Evaluate implementation against FR acceptance criteria
# 4. refine         - Address critique feedback (loop with critique, max 2)
# 5. distill_reflection - Generate diary reflection from critique context
# 6. precommit_check - Run pre-commit hooks, fix failures
# 7. submit_pr      - Commit and create PR
#
# All phases chain via session continuations (FR-105), creating a single
# conversation thread where each phase has full context from prior phases.
#
# Usage via orchestration script:
#   scripts/enforce_worktree.sh feature-requests/FR-106-parallel-worktree-pipeline.md

version: "1.0"
name: enforce-pipeline
description: |
  End-to-end feature enforcement in isolated worktree.
  Seven phases: implement → test/demo → critique ↔ refine → distill → pre-commit → submit PR.
  All phases chain via session continuations (FR-105).
  Reflexion loop (FR-169) critiques against FR acceptance criteria.

prompts_relative: true
prompts_dir: prompts

state:
  fr_path: str           # Path to the approved feature request
  branch: str            # Git branch name
  implement_result: dict
  test_result: dict
  critique_result: dict    # Critique output with score + feedback
  refine_result: dict      # Refinement output (separate from test_result)
  reflection_draft: dict   # Diary reflection content
  precommit_result: dict
  pr_result: dict

nodes:
  # Phase 1: Implement with TDD
  # Read the FR, write failing tests, implement minimal change, refactor
  implement:
    type: copilot
    prompt: enforce-implement
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      fr_path: "{state.fr_path}"
      branch: "{state.branch}"
    state_key: implement_result
    timeout: 3600  # 60 min for TDD cycle

  # Phase 2: Test and Demo
  # Run full test suite, create/update examples if applicable
  test_and_demo:
    type: copilot
    prompt: enforce-test-demo
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
      resume: "{state.implement_result.session_id}"
    state_key: test_result
    timeout: 900  # 15 min

  # Phase 2b: Critique implementation against FR acceptance criteria
  critique:
    type: copilot
    prompt: enforce-critique
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
      resume: "{state.implement_result.session_id}"
    variables:
      fr_path: "{state.fr_path}"
    state_key: critique_result
    timeout: 300

  # Phase 2c: Refine if critique score below threshold
  refine:
    type: copilot
    prompt: enforce-refine
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
      resume: "{state.implement_result.session_id}"
    variables:
      fr_path: "{state.fr_path}"
      feedback: "{state.critique_result.feedback}"
    state_key: refine_result
    timeout: 300

  # Phase 2d: Distill diary reflection from critique context
  distill_reflection:
    type: copilot
    prompt: enforce-distill
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
      resume: "{state.implement_result.session_id}"
    variables:
      fr_path: "{state.fr_path}"
    state_key: reflection_draft
    timeout: 300

  # Phase 3: Pre-commit Checks
  # Run all pre-commit hooks, fix any failures
  precommit_check:
    type: copilot
    prompt: enforce-precommit
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
      resume: "{state.implement_result.session_id}"
    state_key: precommit_result
    timeout: 1200  # 20 min for iterative fixes

  # Phase 4: Submit PR
  # Stage, commit with conventional format + FR ref, push, create PR
  submit_pr:
    type: copilot
    prompt: enforce-submit-pr
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
      resume: "{state.implement_result.session_id}"
    variables:
      branch: "{state.branch}"
      fr_path: "{state.fr_path}"
    state_key: pr_result
    timeout: 500  # ~8 min

edges:
  - from: START
    to: implement
  - from: implement
    to: test_and_demo
  - from: test_and_demo
    to: critique

  # Reflexion loop: critique → refine → critique (max 2 refine iterations)
  - from: critique
    to: refine
    condition: critique_result.score < 0.85
  - from: refine
    to: critique

  # Exit loop when quality threshold met
  - from: critique
    to: distill_reflection
    condition: critique_result.score >= 0.85

  - from: distill_reflection
    to: precommit_check
  - from: precommit_check
    to: submit_pr
  - from: submit_pr
    to: END

loop_limits:
  critique: 3
  refine: 2

loop_exits:
  critique: distill_reflection
