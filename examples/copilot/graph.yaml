# Copilot Node Demo - Plan → Judge → Summarize → Write Diary
# FR-081: Demonstrates copilot node type delegating to GitHub Copilot CLI
# FR-084: Based on .chaplain/watch.sh Plan-Judge workflow
# FR-093: Added summarize + write_diary for automatic diary append
# FR-098: Consolidated from .chaplain/graph.yaml
# FR-105: Session continuation - judge resumes plan's session

version: "1.0"
name: copilot-workflow
description: Feature request workflow using copilot nodes with session continuation

prompts_relative: true
prompts_dir: prompts

defaults:
  provider: anthropic
  model: claude-haiku-4-5

state:
  topic_file: str        # Path to the topic file (e.g., .chaplain/inbox/topic.md)
  drafts_dir: str        # Output directory for drafts
  date: str              # Date for diary entry (YYYY-MM-DD)
  diary_prefix: str      # Diary entry prefix (default: Chaplain)
  diary_entry: dict      # Output from summarize node (theme, body, seed)
  written: bool          # True after diary append

tools:
  write_diary_tool:
    type: python
    module: examples.shared.diary
    function: write_diary

nodes:
  # Stage 1: Plan - Copilot reads topic and drafts feature request
  plan:
    type: copilot
    prompt: plan
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      topic_file: "{state.topic_file}"
      drafts_dir: "{state.drafts_dir}"
    state_key: plan_result
    timeout: 500

  # Stage 2: Judge - Copilot examines the draft and renders verdict
  # FR-105: Resumes the plan node's Copilot session for context continuity
  judge:
    type: copilot
    prompt: judge
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
      resume: "{state.plan_result.session_id}"  # FR-105: Continue same session
    variables:
      drafts_dir: "{state.drafts_dir}"
    state_key: judge_result
    timeout: 500

  # Stage 3: Summarize - LLM distills Plan→Judge into diary entry
  summarize:
    type: llm
    prompt: summarize
    variables:
      plan_output: "{state.plan_result}"
      judge_output: "{state.judge_result}"
    state_key: diary_entry

  # Stage 4: Write - Append formatted entry to docs/diary.md
  write_diary:
    type: python
    tool: write_diary_tool
    state_key: written

edges:
  - from: START
    to: plan
  - from: plan
    to: judge
  - from: judge
    to: summarize
  - from: summarize
    to: write_diary
  - from: write_diary
    to: END
