id: independent
type: faction
name: Independent
summary: A loose network of salt-road traders, hunters, and wanderers who owe no allegiance
  to any clan. They survive by neutrality, knowledge of the land, and the trust earned
  through generations of fair exchange.
depth: 2
lane: dynamic
members:
- reinmar
- eberhard
internal_dynamics: 'The Independents have no formal leader; decisions are made by
  consensus among the most experienced traders, with Reinmar and the elder Eberhard
  serving as informal guides. Dissent is rare but surfaces when younger members propose
  settling down or allying with a clan—most prefer the freedom of the road. Eberhard,
  now lame and living in a semi-permanent shelter near the Felsbach pass, advocates
  for a wintering post to store goods, while Reinmar insists on perpetual travel to
  maintain their neutral reputation. The faction controls the knowledge of safe routes
  across the thawing lowlands, the location of hidden caches of flint and salt, and
  a pack of trained dogs. They possess no territory—only temporary camps and the routes
  between them. Their greatest weapon is their information: they know the true origins
  of feuds (as Reinmar revealed about the reindeer) and can broker peace by exposing
  lies. Relationships with the Aschenwulf and Bärenschädel were once purely economic,
  but after the flood and the merger, Reinmar''s bond with Hilde and Arnulf has grown
  personal. The Independents now view the united valley folk as potential allies rather
  than just customers. A new generation of children from both clans may be offered
  as apprentices to learn the trader''s craft, ensuring the faction''s survival.'
controlled_territory: 'None fixed; their domain is the salt-road network stretching
  from the Wittensee lowlands to the salt mines three days east. They control two
  seasonal camps: one at the eastern edge of the Felsbach pass (a dry cave with a
  spring) and another on a gravel island in the western floodplain.'
controlled_knowledge: Maps of post-thaw river crossings, locations of every flint
  outcrop and salt lick, the true histories behind three major clan feuds, and the
  art of reading animal migrations to predict weather. Reinmar alone knows a secret
  route through the northern bogs that bypasses the Bärenschädel's old hunting grounds.
controlled_weapons: Each member carries a flint knife and a spear; Eberhard possesses
  an heirloom bronze-tipped spear traded from a southerner. Pack dogs are trained
  to guard and attack.
controlled_legitimacy: The Independents derive legitimacy from being the only source
  of flint and salt for three valleys. Every clan respects the rule that a trader's
  person and goods are inviolable. The old rites (Frida's traditions) also grant them
  passage during times of blood feud.
