depth: 3
description: The mixed group of Aschenwulf and Bärenschädel who survive the flood
  and follow Reinmar to the high valley. Initially numbering around thirty people,
  including a few children and elders. They are unified by shared catastrophe but
  divided by history. Over the course of the first year, the clan lines begin to blur
  as they share labor, shelter, and watch duty. By the third summer, the community
  has grown to about forty people and the old clan identities have faded into memory.
  They build permanent cabins, establish hunting grounds, and begin children who will
  know only the high valley as home.
id: combined_survivors
lane: dynamic
