name: Flood Survivors
type: faction
internal_tensions: 'The split after Arnulf''s return nearly destroys the group. The
  young men who side with Arnulf build separate shelters and refuse to share food.
  Heidrun''s intervention and Arnulf''s eventual release of his father''s spirit prevent
  bloodshed. Even after the reconciliation, some tensions remain: the Bärenschädel
  survivors sometimes mutter that they gave up more land and cattle than the Aschenwulf,
  and the Aschenwulf survivors sometimes mutter that they gave up their war-leader''s
  rightful revenge.'
summary: The mixed clan survivors who built a new community in the high valley after
  the Great Flood.
