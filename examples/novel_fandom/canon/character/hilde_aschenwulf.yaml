name: Hilde
birth_year: -25
role: protagonist
faction: aschenwulf_faction
personality: Decisive and pragmatic. Speaks bluntly, commands without hesitation.
  Protective of her brother Arnulf, later protective of Gunnar.
goals:
- To end the blood feud and ensure the survival of her people, even at the cost of
  old loyalties.
- To avenge her father's death at Gunnar's hands.
fears:
- Losing her people to the flood.
- Betraying her clan's expectations and the shame of compromise.
triggers:
- Memories of her father's death and threats to those she protects.
- Accusations of disloyalty from her own clan.
backstory: Daughter of the previous Aschenwulf war-leader, who was slain by Gunnar
  in a raid. Raised to lead warriors. Her younger brother Arnulf is her only remaining
  close family.
driving_force: Survival of her band and the need to forge a new path.
wants: Peace and safety for the survivors.
needs: To accept that old loyalties must yield to new bonds.
arc_summary: From vengeful war-leader to pragmatic co-leader, she breaks the blood
  feud by forming a forbidden bond with her enemy, ultimately killing her own brother
  to protect that bond and becoming the joint chief of a unified clan.
