summary: A salt-road trader who rescues Arnulf and leads him to the Felsbach valley,
  later exposing the false cause of the blood feud.
type: character
backstory: 'Reinmar was born into a family of salt-road traders who had worked the
  routes between the northern tribes for generations. His father taught him the paths,
  the languages, the signs of weather, and the art of moving goods through contested
  territory without taking sides. By age fifteen, Reinmar was leading his own pack
  train of two dogs, bartering salt, flint, and dried fish for hides, antlers, and
  amber. He came to know both the Aschenwulf and Bärenschädel as customers—fierce
  people, but reliable in trade. In the early thaw of his twentieth year, Reinmar
  was passing through the Wittensee valley when he encountered a herd of reindeer
  that had died en masse, their bodies bloated in the slush. The cause was clear:
  an early melt had locked the lichen under ice, and the herd starved. He said nothing
  of this, knowing that rumors of a stolen herd were already spreading between the
  clans. An outsider’s truth would only be weaponized. For three decades he watched
  the feud fester, trading with both sides, never speaking of what he saw. The flood
  changed his calculations. When he found Arnulf half-drowned on a sandbar, he saw
  a chance not just to save a life but to break the cycle. He guided Arnulf toward
  the Felsbach valley, knowing the high ground would be a refuge. At the confrontation
  with Gunnar, Reinmar finally revealed the truth about the reindeer—not as a judgment,
  but as a key to unlock the past. His driving force is not profit but the conviction
  that survival comes from knowledge shared at the right moment. He is the bridge
  between the old world of isolated clans and the new world that must emerge after
  the flood.'
triggers:
- seeing a stranded traveler — will offer aid, shelter, and guidance
- hearing the feud mentioned with false premise — will reveal the truth about the dead
  reindeer herd
