depth: 3
faction: clanless
id: reinmar
lane: dynamic
name: Reinmar
personality: A clanless trader who arrives at the flooded valley from the southeast,
  following the old salt-road. Carries dried fish and a copper knife. Warns that three
  rivers have been loosed and the entire valley will flood within the season. Has
  crossed the pass to the east and found a high valley with game and fresh water.
  Guides the survivors on an eighteen-day journey to the high valley. Claims the valley
  for no one. Leaves after the first winter, returning south.
role: supporting
type: character
backstory: Reinmar was born into no clan. His mother was a woman cast out by the Bärenschädel
  for marrying outside the bloodline, and his father was a trader from the southern
  lowlands who died of fever before Reinmar could walk. He grew up moving between
  isolated settlements, learning the routes through the mountains that the clan people
  never used. He knows the salt-road, the passes, the springs, and the signs of changing
  weather. He was traveling north along the old salt-road when he found the floodwaters
  spreading. He climbed to high ground and saw the survivors. He could have walked
  past them. He chose not to.
arc_summary: Reinmar is the catalyst, not the protagonist. His function is to appear
  at the moment of crisis, offer a path forward, and then disappear when the community
  no longer needs him. He has no personal stake in the feud and no desire to lead.
  He is a wanderer by nature, and the winter he spends in the high valley is the longest
  he has stayed in one place since childhood. In the spring, he leaves because staying
  would make him part of the thing he helped build, and he does not know how to belong.
fears:
- That settling down will trap him in a life he never chose
- That the clans will turn on him once they no longer need his knowledge of the passes
- That he has nothing permanent to offer anyone
goals:
- Guide the survivors to safety
- Leave the high valley before the bonds of community become impossible to break
- Return south and continue the wandering life he knows
relationships:
