name: Freydis
birth_year: -50
role: supporting
faction: none
personality: Speaks in short, absolute statements; no debate after a pronouncement.
  Studies bodies and natural signs before speaking. Shows no emotion when delivering
  harsh truths.
goals:
- To uphold the old rites and ensure the clans live by divine signs, not by vengeance.
fears:
- That the old ways will be forgotten, that the gods will be ignored.
triggers:
- Disrespect toward burial traditions, refusal to read the signs.
backstory: Elder from the old valleys, custodian of burial rites for both Aschenwulf
  and Bärenschädel. Has performed rituals for generations. Her authority is only heeded
  in crisis.
driving_force: Maintaining the spiritual order of the world.
wants: To see the clans obey the divine judgment.
needs: To be listened to and respected.
arc_summary: Interpretes the flood as a divine sign ending the feud, performs a new
  rite to unify the clans, and becomes the spiritual pillar of the new community.
