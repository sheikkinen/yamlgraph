name: Hilde
summary: War-leader of the Aschenwulf who raids the Bärenschädel to avenge her father's
  death and ends up bound to Gunnar.
birth_year: -25
role: protagonist
lane: dynamic
faction: aschenwulf
depth: 0
backstory: 'Hilde was born in the Wittensee valley during the last deep cold of the
  old age. Her father, the war-leader of the Aschenwulf, taught her the lore of the
  high ground and the art of ambush. When she was twelve, her father led a raid against
  the Bärenschädel to recover reindeer that were claimed stolen. The raid turned into
  an ambush. Hilde’s father was cut down by Gunnar’s spearmen. She found his body
  in the mud, a spear through his chest, and swore an oath over his blood: every Bärenschädel
  would pay. She trained harder than any warrior, learned the war-leader’s signs and
  the hidden paths of the high ground. At eighteen, she fought in a border skirmish
  and killed her first Bärenschädel. By twenty, she was named war-leader, the youngest
  of her clan. Her brother Arnulf stood beside her as shield-bearer. For five years,
  she nursed her vengeance, waiting for the moment when the spring thaw swelled the
  rivers and gave her clan cover. The dawn raid on Gunnar’s camp was her plan, her
  chance. She told herself it was justice. She did not know the flood would drown
  the past.'
driving_force: To avenge her father's death; later transformed by survival necessity
  into a drive to unite the clans and forge a new peace.
