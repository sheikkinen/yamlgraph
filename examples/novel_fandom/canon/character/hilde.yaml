name: Hilde
personality: Leader of the Aschenwulf band. Leads a dawn raid against the Bärenschädel
  to avenge her father. Stranded on a ledge with Gunnar for six days during the flood.
  Initiates sex with Gunnar on the fifth night. Refuses to continue the blood-feud
  after the flood. Becomes the co-founder of a new community in the high valley. Mother
  of Reinthilde.
role: protagonist
type: character
backstory: Hilde was raised as the eldest child of the Aschenwulf war-leader. When
  her father was killed by Gunnar in the blood-feud, she took command of the band
  despite being a young woman in a male-dominated clan structure. She spent three
  winters training with the axe, learning the mountain passes, and planning her revenge.
  The dawn raid on the Bärenschädel camp was her first major action as leader. She
  chose the timing carefully—spring meltwater rising, the river loud enough to mask
  footfalls, sunrise in the enemy's eyes.
arc_summary: Starts as a woman driven by vengeance and clan duty. The flood strips
  away the physical and social context of the feud. Stranded on the ledge, she is
  forced to see Gunnar as a person rather than a symbol of her father's death. She
  initiates the sex not as love but as a survival instinct and a recognition of shared
  humanity. After the flood, she makes the conscious choice to end the feud, even
  at the cost of her brother's respect. By the third summer, she has become the mother
  of a child whose name—Reinthilde—merges counsel with her own identity, signaling
  the new kind of leadership she embodies.
fears:
- That the feud will resurrect itself through Arnulf or the younger generation
- That she will be seen as a traitor by her own people
- That Gunnar will one day wake up and see his father's killer when he looks at her
goals:
- Survive the ledge, reunite with survivors, and prevent further bloodshed
- Build a lasting community in the high valley where the blood-feud has no meaning
relationships:
