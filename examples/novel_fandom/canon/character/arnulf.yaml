depth: 3
faction: aschenwulf
id: arnulf
lane: dynamic
name: Arnulf
personality: Hilde's younger brother, nineteen years old. Holding horses at the downstream
  edge of the Bärenschädel camp during the raid. Struck by a floating pine and swept
  two miles downriver. Presumed drowned but rescued by a southern delta fishing band.
  Returns to the high valley on the forty-fifth day. Refuses to accept the end of
  the feud. Calls Hilde a traitor. Eventually speaks the words of release for his
  father's spirit. Kills a bear alongside Gunnar in winter and reconciles.
role: supporting
type: character
backstory: Arnulf was the younger child of the Aschenwulf war-leader, always living
  in his father's shadow and then in Hilde's. When his father was killed, he was too
  young and too untested to take command. Hilde became the leader instead. He resented
  this but never said so. On the morning of the raid, he was assigned to hold the
  horses. It was a task beneath a warrior, and he chafed at it. When the flood hit,
  the pine that struck him broke his arm and knocked him unconscious. He woke among
  strangers in the delta, feverish and alone, believing his sister had either died
  or abandoned him.
arc_summary: 'Arnulf''s arc is the hardest in the story. He is the character who has
  the most to lose from the end of the feud: his father''s death is the defining event
  of his young life, and revenge is the purpose he believed he was meant to fulfill.
  His weeks of solitary recovery among strangers magnify his bitterness. When he returns
  and finds Hilde sleeping with Gunnar, every sacrifice he made during his recovery
  feels betrayed. His journey is from loyalty to the dead father toward acceptance
  of the living sister. The words of release he speaks at the lake are a genuine letting
  go, but it takes the bear kill with Gunnar to transform acceptance into something
  like friendship.'
fears:
- That his father's death will be forgotten and meaningless
- That Hilde has replaced him with Gunnar as the most important person in her life
- That he has no place in the new community because his identity was built on the
  feud
goals:
- Honor his father's memory in a way that does not destroy what remains of his family
- Find a role in the high valley that gives him purpose outside the feud
- Learn to trust Gunnar without feeling like a traitor to his father
relationships:
