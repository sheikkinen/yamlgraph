- prove loyalty to the Aschenwulf
- earn a place in the new settlement beside Hilde
- protect his sister
fears:
- failing his sister
- being seen as a traitor
- losing his family
- being left behind
triggers:
- seeing Hilde with Gunnar
- being told Hilde betrayed the clan
- judgment of elders
- reminders of the flood
backstory: Younger brother of Hilde, nearly drowned in the flood. Survived and later
