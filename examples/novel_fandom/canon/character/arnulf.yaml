id: arnulf
type: character
name: Arnulf
summary: Hilde's brother who is swept downriver, presumed dead, but survives and is
  rescued by Reinmar.
backstory: 'Arnulf was born into a clan already locked in a bitter blood feud with
  the Bärenschädel. His earliest memory is the smell of smoke from a raid that killed
  his uncle. He grew up in the shadow of vengeance, watching his father harden into
  a man of cold fury. When his father was killed in an ambush three years ago, Arnulf
  swore to protect his sister Hilde, the new war-leader. He trained with the spear
  every dawn, determined never to be caught off guard. His loyalty to Hilde was absolute—not
  just as a brother but as a warrior who trusted her judgment above all. The night
  before the dawn raid, Arnulf dreamed of drowning, of water closing over his father''s
  face. He dismissed it as nerves. When the flood hit, he was torn from Hilde''s side,
  swept downstream with the screams of his clansmen. Clinging to a log, he prayed
  to the earth spirit to let him live long enough to find her. That desperation—the
  need to see Hilde safe, to prove that the feud had not claimed everyone—became his
  driving force. On the sandbar, half-dead, he was found by Reinmar, a trader who
  gave him warmth and news that shattered him: his clan was believed dead. But Arnulf
  refused to believe it. He followed Reinmar toward the Felsbach valley, driven by
  a stubborn hope that Hilde had survived. When he finally saw her standing beside
  Gunnar, his first instinct was to attack—only to learn the truth: the feud was built
  on a lie. That revelation reshaped his purpose: not vengeance, but unity.'
