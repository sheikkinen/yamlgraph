  raid, a source of ongoing blood feud. Has no close family left after the flood.
driving_force: Survival and the hope for a new beginning.
wants: To live, and to build a future with Hilde.
needs: To fully let go of the feud and trust in the new alliance.
arc_summary: From enemy chieftain to Hilde's lover and co-leader, he embraces the
  truce and helps unite the clans.
