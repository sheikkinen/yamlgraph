name: Hilde's Father
personality: The unnamed father of Hilde and Arnulf. Former war-leader of the Aschenwulf
  band. Killed by Gunnar in single combat during a raid in the third winter of the
  blood-feud. His death is the origin of the feud that drives the story. Arnulf speaks
  words of release for his spirit at the bonding rite.
role: minor
type: character
backstory: 'He was a hard man by the standards of the mountain clans, respected more
  than loved. He trained both his children in the use of the axe, though he never
  expected Hilde to take command after his death. He was killed in a raid that he
  initiated: he led a strike against the Bärenschädel cattle pens and was caught in
  a counter-attack by Gunnar. The combat was brief and according to the old rules:
  two war-leaders meeting on open ground. Gunnar won cleanly. He did not mutilate
  the body or take trophies beyond the axe he still carries. This restraint is part
  of why Hilde can eventually let go of the feud.'
