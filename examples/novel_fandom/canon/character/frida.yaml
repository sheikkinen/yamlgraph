id: frida
type: character
name: Frida
summary: The keeper of the old rites for the Bärenschädel, who interprets the truce
  as a judgment from the earth spirit and conducts the marriage between Hilde and
  Gunnar.
lane: dynamic
birth_year: -50
role: supporting
faction: bärenschädel
backstory: 'Frida was born beneath the Wolf''s Tooth, a granite peak that shadowed
  the Bärenschädel''s summer camp. Her mother, the keeper of the old rites, died of
  swamp-lung when Frida was twelve. She then apprenticed to Uta, the crone who could
  read the flight of geese and the bend of birch. Uta taught her the songs for birth
  and death, for planting and harvest, and the secret prayers that call the earth
  spirit to witness a pact. At nineteen, Frida married Ulf, a trapper. They had a
  son, Torsten, strong and quick. But when Torsten was seven, a rockfall in the high
  pass killed both Ulf and the boy. Frida never remarried. She poured her grief into
  the old rites, becoming the sole keeper after Uta died of old age. She carried the
  memory of every rite, taboo, and story of why the clan must not spill blood within
  sight of the springs. She watched from the edge of the Bärenschädel camp as Gunnar
  and Hilde''s fathers feuded. She warned Gunnar''s father that the spirits would
  turn their faces away if the killing continued. He laughed. Now, as she stands on
  the mud-slick slope after the flood, she knows the earth spirit spoke. The water
  is the judgment. Her years of holding the old ways have led to this moment: she
  must be the one to bind the survivors into a new law.'
triggers:
- 'sees_unjust_killing: When Frida witnesses killing among the clans, she is compelled
  to intervene with spiritual warnings or rituals to restore balance.'
- 'feels_earth_spirit_near: In natural disasters or unusual events, she senses the
  presence of the earth spirit and interprets the signs as divine judgment or guidance.'
- 'rites_must_be_kept: She feels an overwhelming duty to preserve the old rituals,
  even when survival seems more urgent than ceremony.'
