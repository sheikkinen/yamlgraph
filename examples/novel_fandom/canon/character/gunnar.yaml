backstory: 'Gunnar was born into the Bärenschädel in the twenty-fifth year before
  the Ashfall, the son of a respected hunter who died in a hunting accident when Gunnar
  was twelve. Without a father, Gunnar threw himself into the warrior''s path, honing
  his skill with spear and blade until he became the youngest war-leader the clan
  had ever known. The blood feud with the Aschenwulf was an old wound, passed down
  from grandparents who could no longer recall its true beginning. Gunnar led raids,
  fought skirmishes, and buried friends. To him, it was duty, not hatred. But duty
  demanded one terrible act: in a raid three summers ago, he faced Hilde''s father
  in single combat and killed him. It was a clean kill, face-to-face, but it planted
  a seed of guilt that never fully rotted. He saw the grief in Hilde''s eyes from
  across the battle lines and knew she would come for him one day. He accepted that.
  What he did not expect was the flood. When the riverbank collapsed and the water
  swept away everything—his camp, his warriors, his certainties—he found himself stranded
  on a limestone ledge with the woman sworn to kill him. In those three days of shared
  warmth and whispered confessions, the old hatred dissolved. The moment that forged
  his driving_force came on the third night, when he chose to trust her with his life.
  From then on, he wanted not just to survive, but to build a peace that would outlast
  the feud. Frida''s declaration that the flood was a judgment only confirmed what
  he already felt: the old ways were dead. He would marry Hilde, not out of necessity
  alone, but because she had become his anchor in a drowned world.'
