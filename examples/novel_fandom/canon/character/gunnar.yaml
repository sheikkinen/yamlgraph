depth: 3
faction: barenschadel
id: gunnar
lane: dynamic
name: Gunnar
personality: War-leader of the Bärenschädel clan. Killed Hilde's father in the blood-feud.
  Knew Hilde's raid was coming and was waiting. Stranded with Hilde on a ledge for
  six days. Hauls a dead deer from the river and shares it. Chips handholds with his
  axe to escape. Co-founder of the new community. Fathers Reinthilde with Hilde. Kills
  a bear alongside Arnulf in winter.
role: supporting
type: character
backstory: Gunnar earned his place as war-leader of the Bärenschädel by killing Hilde's
  father in single combat during a raid in the third winter of the feud. He was not
  a cruel man by the standards of his people, but he was a practical one. The feud
  was a fact of mountain life, and he defended his clan. He knew the Aschenwulf would
  come for revenge eventually. When scouts reported Hilde's raiders moving through
  the meltwater, he prepared an ambush. He did not anticipate the flood.
arc_summary: 'Begins as an enemy defined by his role in the feud. The flood and the
  ledge force him into proximity with the woman who came to kill him. He shares the
  deer without being asked. Not as a peace offering but because the survival code
  of the mountains overrides the feud. He chips handholds in the cliff face methodically
  over six days, never saying whether he is making an escape for one or for two. In
  the high valley, he transitions from war-leader to builder and teacher, instructing
  children in rock-climbing. The bear kill with Arnulf completes his arc: he is accepted
  by the brother of the man he killed.'
fears:
- That Arnulf will never truly accept the end of the feud
- That Hilde's choice to spare him was a decision she will come to regret
- That he is only useful as a fighter and will have nothing to offer in peacetime
goals:
- Protect Hilde and the new community from any threat
- Teach the next generation skills that have nothing to do with clan warfare
- Earn the trust of the Aschenwulf survivors who still look at him with suspicion
