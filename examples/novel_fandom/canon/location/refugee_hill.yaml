name: Refugee Hill
description: A low hill that remains above the floodwaters where survivors from both
  clans gather. It becomes the site of Arnulf's death and Freydis's judgment.
location_type: hill
atmosphere:
- Muddy, crowded, tense with suspicion.
sensory:
- The smell of wet wool and unwashed bodies, the sound of murmuring voices and the
  distant water.
significance: Where the truth about Hilde and Gunnar's truce is revealed, and the
  future of the survivors is decided.
