name: Felsbach Valley
type: location
atmosphere:
- The Felsbach Valley is a narrow gorge carved into the limestone highlands, its walls
  rising sheer and dark on either side, blotting out all but a thin strip of sky above.
  The air is perpetually cool and damp, heavy with the scent of wet stone, moss, and
  the faint bitter tang of pine resin that drifts down from the wind-scoured pass.
  A constant, gentle drip echoes from unseen cracks, and the only other sound is the
  soft, steady trickle of the spring that issues from a fissure near the valley's
  head. Light reaches the floor only for a few hours each day, filtering through as
  a muted grey-green glow that makes the moss and ferns appear luminous. The stone
  underfoot is smooth and cold, worn by water and time, and the walls are flecked
  with lichen in shades of ochre and silver. At night, the gorge is silent save for
  the spring, and the darkness is absolute, broken only by firelight from the shelters
  built against the rock.
significance: 'Strategic: Felsbach Valley is the only high ground in the region that
  remained dry during the great flood, accessible only by a single steep pass that
  can be defended by a handful of people. Its spring provides a permanent, clean water
  source, and its enclosed walls offer natural shelter from wind and predators. The
  valley is essentially a fortress, invisible from the lowlands and impossible to
  assault without first taking the pass. Symbolic: For the survivors, the gorge becomes
  a womb—a place of forced intimacy, transformation, and rebirth. It is where the
  blood feud between the Aschenwulf and Bärenschädel ends, where the old laws are
  abandoned, and where the two clans merge into one. The spring is seen as a gift
  from the earth spirit, a sign that the truce is blessed. The valley''s narrowness
  and isolation force enemies to live together, gradually eroding the boundaries of
  hatred.'
inhabitants: 'After the great flood, the merged band of survivors settles here: Hilde
  and Gunnar, Arnulf, Frida, and the other Aschenwulf and Bärenschädel refugees. Frida,
  as keeper of the old rites, acts as spiritual guide. The group builds several huts
  from timber and stone along the valley floor, stores food gathered from the surrounding
  slopes, and plants the first seeds for agriculture. By autumn, the population is
  roughly a dozen adults. No single person rules; decisions are made by council, with
  Hilde and Gunnar leading by mutual respect and experience.'
history: Before the flood, Felsbach Valley was known only to a few members of the
  Bärenschädel clan, particularly the line of wise women. Frida's grandmother used
  the gorge as a summer shelter for herding reindeer and as a site for sacred rites.
  Faint carvings of spirals and animal figures—mammoth, ibex, and bear—still mark
  the walls near the spring, where offerings were once placed to the earth spirit.
  The valley was never permanently inhabited, treated instead as a hidden sanctuary
  for times of crisis. After Frida's grandmother died, the knowledge passed to Frida
  alone, which is why she could lead the survivors there. The valley has no history
  of violence; its mud and stones have soaked in only the quiet drip of water and
  the echoes of chanting from a few old ceremonies.
