id: felsbach_pass
lane: dynamic
location_type: pass
name: Felsbach Pass
type: location
description: Felsbach Pass is a narrow, steeply angled cleft in the limestone ridge
  that separates the flood-prone Wittensee lowlands from the hidden Felsbach valley.
  The pass ascends over several hundred paces, its floor covered in loose scree that
  shifts underfoot with every step. At its crest, a small spring seeps from a crack
  in the rock, feeding a trickle that becomes the Felsbach stream on the valley side.
  The pass is barely wide enough for two people to walk abreast, and the walls rise
  sheer on both sides, blocking the sun for most of the day. Scrubby juniper and stunted
  pine cling to the ledges; their gnarled roots grip the stone like claws.
atmosphere:
- 'The pass is a place of wind and silence. The air carries the sharp smell of wet
  limestone, cold moss, and the faint metallic tang of iron in the spring water. The
  wind funnels through the gap, a constant low moan that rises to a whistle in gusts.
  By day, the sky is a narrow strip of grey or blue overhead; by night, stars seem
  to press close between the walls. The footing is treacherous—loose gravel and sharp-edged
  rocks that slide without warning. Every sound echoes oddly: a footstep becomes a
  clatter that bounces off the cliffs; a spoken word is swallowed or repeated. There
  is a sense of being watched—not by anything visible, but by the ancient weight of
  the stone itself. The pass feels liminal, a threshold between one world and another,
  and those who use it speak in hushed tones.'
strategic_importance: 'Felsbach Pass is the only known dry route into the Felsbach
  valley after the great flood submerged the lower plains. Its narrow width and steep
  grade make it easy to defend: a single person with a spear could hold the pass against
  many. Control of the pass means control of the valley''s spring, its shelter, and
  its winter game. For the merged Aschenwulf and Bärenschädel survivors, holding the
  pass is essential for survival. Traders like Reinmar know it as a shortcut between
  the northern salt routes and the inland highlands. The pass''s strategic value was
  not widely recognized before the flood, but afterward it becomes the key to the
  region''s habitable ground.'
history: 'Generations before the flood, reindeer hunters used the pass to follow herds
  into the high valley. Later, the Bärenschädel clan claimed the area as part of their
  traditional hunting grounds, though they seldom crossed it except in summer. The
  Aschenwulf knew of it but considered it too steep for their cattle. Old Frida''s
  grandmother once told of a vision she had while sleeping in the pass—the earth spirit
  spoke to her there, warning that the blood between the clans would one day drown
  the lowlands. This prophecy was dismissed as an old woman''s dream until the flood
  came. During the events of the floodmark saga, Felsbach Pass witnessed the climax
  of the feud: Arnulf, having followed Reinmar through the pass, emerged to see his
  sister Hilde standing beside Gunnar. The confrontation that nearly killed Gunnar
  took place on the slope just below the pass crest, where Arnulf threw his spear.
  After the marriage truce, the pass became the boundary marker of the new unified
  territory—a symbol of passage from old hatred to new life.'
sensory_details: You see jagged limestone walls streaked with black lichen and rust-colored
  iron stains. The path is littered with pale grey scree that crunches and skitters
  underfoot. At the summit, a tiny spring bubbles from a mossy crack, its water so
  cold it numbs the fingers. You smell damp stone, bruised juniper needles, and the
  distant scent of wet earth from the valley beyond. You hear the unending wind—sometimes
  a sigh, sometimes a sharp cry—and the trickle of the spring, unnaturally clear in
  the stillness. You feel the chill of the rock when you lean against it, the roughness
  of the scree through thin moccasins, the sudden warmth of sun in the rare spots
  where light breaks through. Taste nothing but dry air and grit.
significance: 'Felsbach Pass is more than a geographical feature—it is the pivot point
  of the floodmark saga. It is the place where survival forces former enemies to meet,
  where the lie of the dead reindeer herd is finally exposed, and where the old blood
  feud is abandoned in favor of a new compact. The pass embodies the theme of transition:
  from isolation to community, from revenge to reconciliation, from death to life.
  It is a sacred threshold in the old rites, a place where the earth spirit speaks
  through stone and water. For the survivors, crossing the pass into the valley means
  leaving the drowned world behind and stepping into a fragile future.'
