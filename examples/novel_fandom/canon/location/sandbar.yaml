name: Sandbar
type: location
description: A low, narrow spit of gravel and silt thrust up from the riverbed, half-submerged
  in the muddy brown floodwaters. The sandbar is barely twenty paces long and five
  wide, its surface a jumble of wet stones, waterlogged driftwood, and the carcass
  of a drowned deer. The air smells of wet earth, rotting vegetation, and the metallic
  tang of glacial melt. The river roars past on both sides, carrying debris and the
  occasional bloated animal.
sensory_details: The sandbar is cold and unstable underfoot, the gravel shifting with
  each step. The constant rumble of the swollen river fills the ears, punctuated by
  the crack of snapping branches and the distant crash of collapsing banks. A fine
  mist rises from the churning water, clinging to skin and clothes. The sky above
  is a sullen gray, and the only warmth comes from the occasional patch of sunlight
  breaking through, quickly swallowed by the damp chill.
significance: This sandbar becomes the stage for Arnulf's rescue and his first encounter
  with Reinmar. It is the point where the flood's chaos gives way to human connection,
  and where Arnulf learns that he is not alone. Symbolically, the sandbar is a threshold
  between death and survival, isolation and alliance, the past and an uncertain future.
  It marks the beginning of Arnulf's journey to find his sister and the unraveling
  of the feud's original cause.
inhabitants: The sandbar is uninhabited. It is a temporary refuge, claimed by none.
  Arnulf is washed onto it, exhausted and half-conscious, and Reinmar finds him there.
  No one else stays.
history: The sandbar formed during the spring thaw as the river rose and deposited
  sediment. It had no name until Arnulf's rescue, and even then it was never permanent—a
  transient island that would be reshaped or erased by the next flood. Its only recorded
  event is Arnulf's arrival and Reinmar's discovery, a moment that would ripple through
  the merging of the Aschenwulf and Bärenschädel clans.
