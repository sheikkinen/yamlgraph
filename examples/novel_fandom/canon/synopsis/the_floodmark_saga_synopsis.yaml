text: 'The Aschenwulf band raids the Bärenschädel camp at dawn. Hilde, war-leader
  of the Aschenwulf, intends to kill Gunnar, the Bärenschädel chieftain, to avenge
  her father whom Gunnar killed in a previous raid. Her younger brother Arnulf fights
  beside her. As the raid reaches the center of the camp, the river—swollen by meltwater
  from the glaciers—breaks its banks in a surge. The flood sweeps through the valley
  in minutes. Hilde and Gunnar are trapped on a narrowing rock ledge above the torrent.
  Arnulf is caught by the current and dragged downstream; Hilde sees him go under
  and believes him dead.


  On the ledge, Hilde and Gunnar agree to a truce for survival. They share the small
  amount of food Gunnar had in a pouch. That night, the cold forces them to press
  together for warmth. Over the following days, the truce deepens into a sexual relationship.
  They do not speak of the blood feud. They signal to each other when they hear rescue
  parties, but the water does not recede.


  Meanwhile, Arnulf is not dead. He is swept several miles downstream, where he clings
  to a fallen tree and is pulled ashore by Reinmar, a trader who travels the salt
  routes. Reinmar knows the high country. He has been guiding scattered survivors
  toward Stony Valley, the only valley not yet drowned. Arnulf recovers and learns
  that his sister is still alive; he insists on finding her.


  After eight days, the flood begins to drop. Hilde and Gunnar climb down from the
  ledge and find a mixed group of Aschenwulf and Bärenschädel survivors who have gathered
  on a hill. Reinmar arrives with Arnulf. Arnulf sees Hilde standing next to Gunnar
  and assumes she has been taken captive. When he learns the truth—that she has been
  sharing Gunnar’s bed—he calls her a traitor and draws his knife to kill Gunnar.
  Hilde steps between them. Arnulf swings at Gunnar; Hilde shoves Arnulf, and he slips
  on the wet ground, falls against a rock, and cracks his skull. He dies within minutes.


  Freydis, the keeper of the old burial rites for both clans, arrives with a group
  of elders who have taken refuge in a cave. She examines the bodies of the dead and
  the pattern of the flood. She declares that the truce between Hilde and Gunnar was
  not a betrayal but a judgment from the gods. The flood, she says, was sent to drown
  the old blood feud. The survivors who honor the truce will live; those who cling
  to the feud will die with the water.


  The clans are split. Half the Bärenschädel and most of the Aschenwulf accept Freydis’s
  reading. The others refuse and try to strike out on their own, but Reinmar knows
  the only passable route is over a ridge that still holds snow. The dissenters attempt
  it, are caught by a late avalanche, and die.


  Reinmar leads the remaining survivors—about forty people—up the slope into Stony
  Valley before the autumn snow closes the pass. Hilde and Gunnar stay together. Freydis
  performs a new rite to bind the two clans into one, with Hilde and Gunnar as joint
  leaders. The floodwaters remain in the lowlands; the survivors build shelters on
  the high ground and begin the winter with the knowledge that they will never return
  to the old valleys.'
