text: 'In 10,000 BC, during the great thaw, the Aschenwulf clan lives on the high
  ground of the Wittensee valley. The glaciers are melting, and three rivers are swelling
  the lowlands. Hilde, war-leader of the Aschenwulf, orders a dawn raid on the rival
  Bärenschädel clan. Her goal is to kill Gunnar, the Bärenschädel war-leader, to avenge
  her father''s death. She leads twenty warriors, including her brother Arnulf, into
  the Bärenschädel camp.


  As Hilde and Gunnar engage in single combat, a riverbank upstream collapses, releasing
  a surge of water. The flood sweeps through the valley, drowning both clans'' camps.
  Hilde and Gunnar are thrown onto a narrowing ledge of limestone above the rising
  water. Arnulf is caught in the main current and carried downstream. The other warriors
  either drown or scatter onto higher slopes. Hilde and Gunnar are stranded together,
  surrounded by floodwater.


  On the ledge, Hilde and Gunnar agree to a survival truce: neither will kill the
  other until they reach dry ground. They share a flint knife and a strip of dried
  meat Gunnar had in his pouch. Over three days, as the water rises, they build a
  makeshift shelter from driftwood and sleep pressed together for warmth. On the third
  night, they have sex. This repeats each following night. Hilde begins to feel loyalty
  to Gunnar that conflicts with her oath to her clan.


  Meanwhile, Arnulf is swept two miles downstream. He manages to grab a floating log
  and is washed onto a sandbar. He is found by Reinmar, a salt-road trader traveling
  north with two pack dogs. Reinmar gives Arnulf warm clothes and food. Arnulf learns
  that his clan is believed dead. He asks Reinmar to help him find his sister. Reinmar
  agrees, knowing the only high ground still dry is the Felsbach valley, a narrow
  gorge with a spring, accessible only by a steep pass.


  Back on the ledge, the flood begins to recede. Hilde and Gunnar descend into the
  mud and find scattered survivors from both clans: two Aschenwulf women, four Bärenschädel
  men, and an elderly woman named Frida, the keeper of the old rites for the Bärenschädel.
  Frida interprets the truce between Hilde and Gunnar as a judgment from the earth
  spirit: the flood came because the blood feud offended the spirit, and the truce
  must be made permanent through marriage. Hilde and Gunnar accept this as a necessity
  for survival.


  Reinmar leads Arnulf toward the Felsbach valley. Along the way, they encounter a
  pack of wolves, which Reinmar drives off with fire. They cross the floodplain and
  reach the pass. At the same time, Hilde and Gunnar''s group, guided by Frida''s
  knowledge of the high country, also heads for Felsbach valley. Both groups arrive
  at the gorge on the same day.


  Arnulf sees Hilde with Gunnar. He attacks Gunnar with a spear, believing Gunnar
  has taken Hilde captive. Hilde steps between them and tells Arnulf the truth: she
  and Gunnar are now bound by law and by choice. Arnulf hesitates, then lowers the
  spear. Reinmar reveals he has traded with both clans in the past and knows that
  the feud started over a stolen herd of reindeer that actually died in an early thaw,
  not from a raid. The original cause of the feud is false.


  The combined group settles in the Felsbach valley. Frida conducts a marriage rite
  between Hilde and Gunnar, which both clans witness. Reinmar leaves to continue trading,
  promising to return with news of the lowlands. Arnulf and Hilde reconcile. The Aschenwulf
  and Bärenschädel survivors merge into a single band. By autumn, they have built
  shelters and stored enough food to last the winter. The old laws of the feud are
  abandoned. The flood is remembered not as a judgment but as the event that forced
  them together.'
