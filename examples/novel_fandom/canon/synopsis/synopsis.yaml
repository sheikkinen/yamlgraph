text: 'Hilde of the Aschenwulf band leads a dawn raid against the Bärenschädel clan.
  She wants to kill Gunnar, the Bärenschädel war-leader, to avenge her father, who
  Gunnar killed in a blood-feud that has run for three winters. She and a dozen raiders
  cross the rising meltwater with torches, expecting a quick butchery.


  Gunnar is waiting for them. The Bärenschädel knew the raid was coming. Hilde and
  Gunnar meet in the center of the Bärenschädel camp, both with drawn axes, both within
  killing distance of each other. Before either can strike, the river directly above
  the valley cracks open. A glacial lake has burst. The wall of water hits the camp
  at the same moment Hilde had aimed for sunrise.


  The flood scatters both clans. Bodies, tents, weapons, and cattle are swept south.
  Hilde and Gunnar, still locked in combat, are carried by the surge onto a ledge
  cut into the cliffside on the east wall of the valley. The water rises up to the
  ledge edge over the course of the morning and then stops, leaving them stranded
  on a patch of rock forty feet wide and fifteen feet deep. The ledge sits above a
  boiling channel of brown water. There is no way down and no way up without climbing
  tools they do not have.


  They share the ledge for six days. Neither has food. Neither has water except the
  river they cannot drink because it is thick with silt and bodies. On the second
  day, a dead deer floats past and Gunnar hauls it up with his belt. He shares it
  with Hilde without her asking. On the third night, they sleep back to back for warmth.
  On the fifth night, they have sex. Hilde initiates it. She does not call it love
  and neither does he. It is survival and the fact that he is the only warm thing
  left in the world.


  During the flood, Hilde''s younger brother Arnulf was on the downstream edge of
  the Bärenschädel camp, holding horses. He was struck by a floating pine and swept
  two miles downriver. His body is not recovered. The survivors of both clans, combing
  the mud when the water recedes slightly on the fifth day, find no trace of him.
  The Aschenwulf band declares him drowned. Hilde, from her ledge, cannot see any
  of this.


  On the seventh day, a man named Reinmar arrives at the valley from the southeast,
  following the old salt-road that is now half-submerged. He is a trader, clanless,
  carrying a pack of dried fish and a copper knife. He sees the survivors scattered
  along the higher slopes and he climbs to meet them. He tells them that the flooding
  will not stop. Three rivers have been loosed by the melting ice; the entire valley
  will be underwater within the season. He has crossed the pass to the east and seen
  a high valley that is still dry, with game and fresh water and flat ground that
  will stay above the rising water. He offers to guide anyone who wants to go there.


  No one trusts him. He is a stranger and has no clan. But Heidrun, the keeper of
  the old rites for the combined survivors, speaks for him. She is sixty years old,
  the only person who knows the old songs and the signs. She tells the survivors that
  the flood is a judgment. The blood-feud between Aschenwulf and Bärenschädel has
  soiled the ground and the water, and the gods have sent the thaw to wash them off
  the land. The truce that made Hilde and Gunnar share a ledge, she says, is the first
  sign of what the gods require: a new bond, not a new war. She urges the survivors
  to follow Reinmar to the high valley and to let the old enmities die in the floodwaters.


  On the eighth day, the water on the ledge drops by two feet. Hilde and Gunnar find
  a crack in the cliff wall and climb down, using handholds Gunnar has been chipping
  with his axe. They reunite with the survivors. Hilde is greeted with relief by her
  people, then with suspicion by both clans when they see that she is standing beside
  Gunnar. The blood-feud is not dead. The Bärenschädel who lost kin to Hilde''s raid
  want Gunnar to finish the kill. The Aschenwulf who lost kin to the original feud
  want Hilde to do it herself.


  Hilde refuses. She tells both clans that the feud ends here. She says she will go
  with Reinmar to the high valley and anyone who follows her must leave the feud behind.
  Gunnar says the same. About half of each clan agrees. The rest stay in the valley,
  saying they will find their own way or die on their own ground. Heidrun stays with
  the survivors who leave. Reinmar leads them east.


  The journey takes eighteen days. They cross three passes and two half-frozen rivers.
  The path is narrow and wet. Two children die of cold. One man, a Bärenschädel named
  Berno, slips on a scree slope and breaks his neck. Reinmar keeps them moving. Hilde
  and Gunnar share watch duty and share a sleeping shelter. Heidrun watches them and
  says nothing.


  When they reach the high valley, it is as Reinmar described. It is a bowl of grass
  with a lake in the center, fed by springs and not by glaciers. The game trails show
  bear and deer tracks. The timber line is thick with pine. Reinmar tells them he
  claimed this valley for no one. He is not their leader and will not be. He will
  leave after the first snow and return south.


  The survivors begin building shelters. They hunt. They gather. For three weeks,
  the work is steady and the clan lines start to blur. Hilde and Gunnar share a shelter
  openly. The Aschenwulf do not challenge it. The Bärenschädel do not challenge it.


  Then Arnulf returns.


  He did not drown. The pine that struck him pinned him to a gravel bar a mile downstream,
  where the flood dropped him half-dead. He was found by a small fishing band from
  the southern delta. They nursed him through a fever and healed his broken arm. When
  he was well enough to travel, he followed the trail of survivors north. He climbed
  the eastern pass and walked into the high valley on the forty-fifth day since the
  flood.


  He sees Hilde first. She is hauling water from the lake. He calls her name. She
  drops the skin and runs to him. They hold each other. Then Arnulf sees Gunnar walking
  toward them from the tree line. Hilde tells Arnulf what happened on the ledge. She
  tells him that Gunnar is with her now and that the feud is over.


  Arnulf does not accept this. He is nineteen and has been alone and injured for weeks.
  In his mind, the feud is everything. Their father was killed by Gunnar. Hilde was
  supposed to kill Gunnar. Instead, she slept with him. Arnulf calls her a traitor
  in front of the whole camp. He draws his knife and goes for Gunnar.


  Hilde steps between them. She does not draw a weapon. She tells Arnulf that if he
  kills Gunnar, she will kill him. She says it flat and without tears. Arnulf stares
  at her for a long minute. Then he throws the knife into the lake and walks out of
  the camp. He does not go far. He builds a lean-to a quarter mile away and refuses
  to speak to anyone except Heidrun, who visits him every evening.


  The camp splits again. Half of the survivors, mostly young men from both clans,
  side with Arnulf. They say Hilde has broken the old law and that the gods will punish
  the valley if she is not cast out. The other half, mostly women and older survivors,
  follow Hilde. They say the old law drowned in the flood and that the new ground
  requires a new law.


  Heidrun calls a gathering. She speaks to both sides. She says the gods sent the
  flood to wash away the feud, but the feud has followed them into the high valley.
  She says the judgment is incomplete. She asks Hilde and Gunnar to perform a rite:
  they must stand together before the lake and declare themselves bound, not as clan-mates,
  but as a new kind of pair, one that ends the old lineages and starts a new one.
  And she asks Arnulf to witness the rite and to speak the words of release for his
  father''s spirit.


  Arnulf refuses for three days. Then he goes to the lake at dawn, alone, and he speaks
  the words of release. He tells the spirit of his father that the feud is finished
  because there is no one left to carry it. He says Hilde has chosen and he will not
  fight her. Then he walks into the camp and sits down with the others for the evening
  meal.


  Hilde and Gunnar perform the rite the next day. Heidrun ties their hands together
  with a strip of leather that has been soaked in the lake water. Gunnar speaks first
  and says he lays down his feud against the Aschenwulf. Hilde speaks second and says
  she lays down her feud against the Bärenschädel. Heidrun cuts the leather and throws
  both halves into the lake. The rite is done.


  The survivors build a permanent village before the first snow. Arnulf stays. He
  does not speak to Gunnar for another three months. Then, in the dead of winter,
  a bear comes down from the timber and tears open two of the food caches. Arnulf
  and Gunnar are the first to reach the caches. They kill the bear together, Gunnar
  with a thrusting spear and Arnulf with an axe to the spine. They drag the carcass
  back to the village. That night, Arnulf sits across from Gunnar at the fire and
  asks about the ledge. Gunnar tells him. By the end of the night, they are talking
  about the hunting in the eastern slopes.


  Reinmar stays through the winter. In the spring, he packs his gear and walks south.
  Heidrun dies in the second winter, peaceful, in her sleep. Hilde gives birth to
  a daughter in the third summer and names her Reinthilde, combining the old word
  for counsel and her own name. Arnulf becomes the camp''s hunter. Gunnar teaches
  the children how to climb rock faces without ropes. The valley stays dry. The flood
  never reaches it.'
