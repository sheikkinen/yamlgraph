window: 'After eighteen days of travel, the survivors reach the high valley. It is
  as Reinmar described: a bowl of grass with a lake at the center, fed by springs
  and not by glaciers. The game trails show bear and deer tracks. The timber line
  is thick with pine. Reinmar tells them he claimed this valley for no one and that
  he is not their leader. He says he will leave after the first snow and return south.
  The survivors begin building shelters from the pine timber. They hunt and gather.
  For three weeks, the work is steady and the clan lines start to blur. Hilde and
  Gunnar share a shelter openly. The Aschenwulf do not challenge it. The Bärenschädel
  do not challenge it. For a brief time, the new world seems possible.'
