scope: regional
type: event
window: A glacial lake above the valley, fed by melting ice, bursts its natural dam.
  The wall of water hits the Bärenschädel camp at sunrise, scattering both the raiding
  Aschenwulf and the defending Bärenschädel. The floodwaters rise throughout the morning
  and continue to reshape the valley over the following weeks. Reinmar later reports
  that three rivers have been loosed by the melting ice, warning that the entire region
  will be underwater within the season.
year: 0
summary: The catastrophic glacial flood that destroys both clans' settlements and
  defines the calendar.
