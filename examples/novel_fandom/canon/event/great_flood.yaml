consequences:
- Bodies, tents, weapons, and cattle swept south; both clans scattered
- Hilde and Gunnar carried onto a ledge on the east cliffside
- Arnulf struck by a floating pine and swept two miles downriver
- The valley is permanently transformed; three rivers loosed by melting ice
- The flood becomes the defining event of the era, marking Year 0 in the calendar
id: great_flood
lane: dynamic
participants:
