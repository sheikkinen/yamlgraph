window: In the third year before the flood, Gunnar kills Hilde's father in single
  combat during a Bärenschädel counter-raid. The Aschenwulf war-leader had led a strike
  against the Bärenschädel cattle pens. Gunnar intercepted him on open ground and
  killed him cleanly in single combat. According to the law of blood-feud, the Aschenwulf
  are now obligated to take a life in return. Hilde, as the war-leader's eldest child,
  takes command of the Aschenwulf band and begins three winters of planning her revenge.
