window: 'No one trusts Reinmar. He is a stranger and has no clan. But Heidrun, the
  keeper of the old rites for the combined survivors, speaks for him. She is sixty
  years old, the only person who knows the old songs and the signs. She tells the
  survivors that the flood is a judgment: the blood-feud between Aschenwulf and Bärenschädel
  has soiled the ground and the water, and the gods have sent the thaw to wash them
  off the land. The truce that made Hilde and Gunnar share a ledge, she says, is the
  first sign of what the gods require: a new bond, not a new war. She urges the survivors
  to follow Reinmar to the high valley and to let the old enmities die in the floodwaters.'
year: 0
summary: Heidrun declares the flood a divine judgment and urges the survivors to follow
