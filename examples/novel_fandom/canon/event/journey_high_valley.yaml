window: The journey takes eighteen days. They cross three passes and two half-frozen
  rivers. The path is narrow and wet, with meltwater running across the trail in many
  places. Two children die of cold despite being wrapped in every available skin.
  Berno, a Bärenschädel man, slips on a scree slope and breaks his neck. Reinmar keeps
  them moving with a relentless pace, knowing that delays will kill more than the
  terrain will. Hilde and Gunnar share watch duty and share a sleeping shelter. Heidrun
  watches them and says nothing.
