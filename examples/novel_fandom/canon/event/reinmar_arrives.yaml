window: On the seventh day after the flood, a man named Reinmar arrives at the valley
  from the southeast, following the old salt-road that is now half-submerged. He is
  a trader, clanless, carrying a pack of dried fish and a copper knife. He sees the
  survivors scattered along the higher slopes and climbs to meet them. He warns that
  three rivers have been loosed by the melting ice and the entire valley will be underwater
  within the season. He tells them he has crossed the pass to the east and seen a
  high valley that is still dry, with game and fresh water and flat ground that will
  stay above the rising water. He offers to guide anyone who wants to go there.
