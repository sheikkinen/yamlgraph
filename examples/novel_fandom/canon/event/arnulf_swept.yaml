window: During the flood, Arnulf is on the downstream edge of the Bärenschädel camp
  holding the horses for the Aschenwulf raiders. He is struck by a floating pine and
  swept two miles downriver. The pine pins him to a gravel bar a mile downstream,
  where the flood drops him half-dead. When the survivors comb the mud on the fifth
  day, they find no trace of him. The Aschenwulf band declares him drowned. Hilde,
  stranded on the ledge, cannot see any of this.
