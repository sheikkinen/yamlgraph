consequences:
- Arnulf presumed drowned by the Aschenwulf band
- His body not recovered from the mud when water recedes on the fifth day
- He is actually pinned on a gravel bar a mile downstream, half-dead
- Rescued by a southern delta fishing band who nurse him through a fever
- His absence sets up the shock of his return on the forty-fifth day
