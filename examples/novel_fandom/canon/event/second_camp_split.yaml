window: After Arnulf's confrontation and his isolation, the camp splits again. Half
  of the survivors, mostly young men from both clans, side with Arnulf. They say Hilde
  has broken the old law and that the gods will punish the valley if she is not cast
  out. The other half, mostly women and older survivors, follow Hilde. They say the
  old law drowned in the flood and that the new ground requires a new law. The division
  threatens to turn violent. Heidrun calls a gathering to address the rift before
  it becomes another blood-feeding.
