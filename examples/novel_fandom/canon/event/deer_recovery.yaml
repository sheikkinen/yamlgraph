window: On the second day on the ledge, a dead deer floats past in the brown water.
  Gunnar hauls it up with his leather belt, using a hook he has improvised from a
  splinter of rock. He butchers it with his knife and shares the meat with Hilde without
  her asking. There is no negotiation, no bargain, no condition attached. He simply
  splits the carcass and pushes half toward her.
