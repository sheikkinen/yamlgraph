window: Hilde and Gunnar perform the rite the day after Arnulf's release. The whole
  camp gathers at the lake shore. Heidrun ties their hands together with a strip of
  leather that has been soaked in the lake water. Gunnar speaks first and says he
  lays down his feud against the Aschenwulf. Hilde speaks second and says she lays
  down her feud against the Bärenschädel. Heidrun cuts the leather binding their hands
  and throws both halves into the lake. The rite is done. The survivors watch the
  leather sink. No one speaks for a long moment. Then the building work resumes.
