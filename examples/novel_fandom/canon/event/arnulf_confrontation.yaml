window: Arnulf, nineteen years old and still carrying the bitterness of his weeks
  alone and injured, cannot accept that the feud is over for Hilde. Their father was
  killed by Gunnar. Hilde was supposed to kill Gunnar. Instead, she slept with him.
  Arnulf calls her a traitor in front of the whole camp. He draws his knife and goes
  for Gunnar. Hilde steps between them. She does not draw a weapon. She tells Arnulf
  flatly, without tears, that if he kills Gunnar, she will kill him. Arnulf stares
  at her for a long minute. Then he throws his knife into the lake and walks out of
  the camp. He builds a lean-to a quarter mile away and refuses to speak to anyone
  except Heidrun, who visits him every evening.
