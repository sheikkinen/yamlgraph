window: 'Heidrun calls a gathering by the lake. She speaks to both sides. She says
  the gods sent the flood to wash away the feud, but the feud has followed them into
  the high valley. She says the judgment is incomplete. She asks Hilde and Gunnar
  to perform a rite: they must stand together before the lake and declare themselves
  bound, not as clan-mates, but as a new kind of pair, one that ends the old lineages
  and starts a new one. She asks Arnulf to witness the rite and to speak the words
  of release for his father''s spirit.'
