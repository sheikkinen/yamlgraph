window: Arnulf refuses Heidrun's request for three days. He stays in his lean-to,
  speaking to no one except Heidrun during her evening visits. On the third day, he
  goes to the lake at dawn, alone. He stands at the water's edge and speaks the words
  of release to the spirit of his father. He tells the spirit that the feud is finished
  because there is no one left to carry it. He says Hilde has chosen and he will not
  fight her. Then he walks back into the camp and sits down with the others for the
  evening meal. No one speaks to him. He eats in silence. But he stays.
