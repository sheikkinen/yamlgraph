window: When Hilde and Gunnar climb down from the ledge and reunite with the survivors,
  Hilde is greeted with relief by her people. But then both clans see that she is
  standing beside Gunnar. The blood-feud is not dead. The Bärenschädel who lost kin
  to Hilde's raid want Gunnar to finish the kill. The Aschenwulf who lost kin to the
  original feud want Hilde to do it herself. Hilde refuses. She tells both clans that
  the feud ends here. She says she will go with Reinmar to the high valley and anyone
  who follows her must leave the feud behind. Gunnar says the same. About half of
  each clan agrees. The rest stay in the valley, saying they will find their own way
  or die on their own ground. Heidrun stays with the survivors who leave.
