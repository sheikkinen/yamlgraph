window: In the spring after the first winter, Reinmar packs his gear. He has stayed
  longer than he ever stays anywhere. He walks through the village in the early morning,
  saying goodbye to those who are awake. Hilde and Gunnar see him at the edge of the
  tree line and walk with him to the first pass. He tells them he is not their leader
  and will not be. The valley is theirs. He turns south, following the old routes
  back toward the lowlands. The community watches him until he disappears over the
  ridge. He does not look back.
year: 1
summary: Reinmar leaves the high valley in the spring, returning south to his wandering
  life.
