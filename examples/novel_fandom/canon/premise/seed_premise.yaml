text: Hilde of the Aschenwulf band leads a dawn raid against the Bärenschädel clan
  to avenge her father. When a glacial lake bursts, floodwaters scatter both clans
  and strand Hilde and her enemy Gunnar on a cliff ledge for six days. They survive
  together, share food and warmth, and eventually become intimate. Rescued, they declare
  the blood-feud over and lead a mixed group of survivors to a high valley guided
  by the clanless trader Reinmar. But Hilde's presumed-dead brother Arnulf returns
  and rejects the new bond, splitting the fragile community. Through Heidrun's wisdom,
  a bonding rite is performed, Arnulf eventually speaks release for his father's spirit,
  and a new community is born in the high valley above the floodwaters—a place where
  old enmities drown and new lineages begin.
