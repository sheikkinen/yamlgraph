type: synopsis
id: ashfall_synopsis
lane: dynamic
text: >
  Kaelen, last blade-bearer of the Ashguard, hunts Voss — a former
  Emberwrights artisan he blames for the betrayal that triggered the
  Ashfall. What Kaelen wants is vengeance; what he needs is to forgive
  himself for surviving when his order did not. Maren, an Emberwrights
  elder and Kaelen's reluctant mentor, knows the Ashfall Pact was forged
  on a half-truth: the Emberwrights did not cause the cataclysm, but they
  let the Ashguard believe they did, to end a war both sides were losing.
  Voss, bitter and exiled from his own guild, seeks to reforge the
  Emberbrand — the last dragonsteel blade — not as a weapon but as proof
  that the old forge-craft survives. The Emberbrand can only be reforged
  with dragonsteel, and the only remaining source lies beneath the ruins
  the Ashguard still guard. When Kaelen confronts Voss at the ruins,
  Maren reveals the Pact's lie. Kaelen must choose: destroy Voss and
  preserve the Pact's false peace, or let the blade be reforged and face
  the truth that his order's grief was manufactured. He lets the blade be
  reforged. The Pact shatters, but what replaces it is honest.
