# Novel Fandom — Semantic Entity Deduplication (FR-684, FR-686)
# Self-loading graph-tool: loads canon internally, compares candidate entity
# against existing canon entries to find semantic duplicates.
#
# Finding 2 (FR-686): Agent passes only candidate_id + candidate_summary.
# Graph self-loads canon via reload_canon node.
#
# Input: candidate_id (str), candidate_summary (str)
# Output: merge_map {dropped_id: surviving_id}, reasoning

version: "1.0"
name: semantic-dedup
description: Compare a candidate entity semantically against canon for duplicates
prompts_relative: true
prompts_dir: prompts

state:
  candidate_id: str
  candidate_summary: str
  canon_pages: dict
  canon_count: int
  synopsis_text: str
  merge_map: dict
  reasoning: str

tools:
  reload_canon:
    type: python
    path: nodes/reload_canon.py
    function: reload_canon

nodes:
  load:
    type: python
    tool: reload_canon

  compare:
    type: llm
    prompt: semantic_dedup
    state_key: merge_result
    temperature: 0.1
    variables:
      candidate_id: "{state.candidate_id}"
      candidate_summary: "{state.candidate_summary}"
      canon_pages: "{state.canon_pages}"

edges:
  - from: START
    to: load
  - from: load
    to: compare
  - from: compare
    to: END
