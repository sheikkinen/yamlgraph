# Novel Fandom — World Expansion (FR-686)
# Agent-first architecture: reload → worldgen agent → final_gate → END
# Agent deepens thin entities, creates skeletons for red links.
# Each create_* tool IS a graph-tool pipeline (FR-658 showcase):
#   persist (python) → prefetch (python) → check (LLM)
#
# Usage:
#   yamlgraph graph run examples/novel_fandom/worldgen.yaml --full

version: "1.0"
name: novel-fandom-worldgen
description: Expand wiki — agent deepens thin entities, grows via red links
prompts_relative: true
prompts_dir: prompts

state:
  canon_pages: dict
  canon_count: int
  synopsis_text: str
  worldgen_result: dict
  gate_result: dict

tools:
  reload_canon:
    type: python
    path: nodes/reload_canon.py
    function: reload_canon
    description: "Reload all canon pages from disk into state."
  list_thin_entities:
    type: python
    path: nodes/creation_tools.py
    function: list_thin_entities
    description: "List entities with depth 0 that need enrichment."
  deepen_entity:
    type: python
    path: nodes/creation_tools.py
    function: deepen_entity
    description: "Replace an entity with an enriched version. Args: id, updated_yaml."
  create_character:
    type: graph
    path: create_character.yaml
    description: "Create a character entity with semantic integrity check. Args: id, name, role, faction, summary, related_to."
    input_mapping:
      id: id
      name: name
      role: role
      faction: faction
      summary: summary
      related_to: related_to
    output_key: result
  create_event:
    type: graph
    path: create_event.yaml
    description: "Create an event entity with semantic integrity check. Args: id, year, scope, participants, consequences, summary."
    input_mapping:
      id: id
      year: year
      scope: scope
      participants: participants
      consequences: consequences
      summary: summary
    output_key: result
  create_faction:
    type: graph
    path: create_faction.yaml
    description: "Create a faction entity with semantic integrity check. Args: id, name, description, members."
    input_mapping:
      id: id
      name: name
      description: description
      members: members
    output_key: result
  create_location:
    type: graph
    path: create_location.yaml
    description: "Create a location entity with semantic integrity check. Args: id, name, description, location_type."
    input_mapping:
      id: id
      name: name
      description: description
      location_type: location_type
    output_key: result
  create_rule:
    type: graph
    path: create_rule.yaml
    description: "Create a rule entity with semantic integrity check. Args: id, domain, title, description."
    input_mapping:
      id: id
      domain: domain
      title: title
      description: description
    output_key: result
  lookup_canon_page:
    type: python
    path: nodes/canon_tools.py
    function: lookup_canon_page
    description: "Look up a canon entity by ID. Returns full YAML with calendar rules."
  list_canon_ids:
    type: python
    path: nodes/canon_tools.py
    function: list_canon_ids
    description: "List all entity IDs in the canon with their types."
  ref_check:
    type: graph
    path: ref_check.yaml
    description: "Run semantic referential integrity audit on the full canon. No args needed."
    output_key: result
  dedup_check:
    type: graph
    path: semantic_dedup.yaml
    description: "Check if a candidate entity already exists under a different name. Args: candidate_id, candidate_summary. Returns merge_map."
    input_mapping:
      candidate_id: candidate_id
      candidate_summary: candidate_summary
    output_key: merge_map
  final_gate:
    type: python
    path: nodes/creation_tools.py
    function: final_gate

nodes:
  reload:
    type: python
    tool: reload_canon

  worldgen:
    type: agent
    prompt: worldgen_agent
    tools:
      - list_thin_entities
      - deepen_entity
      - create_character
      - create_event
      - create_faction
      - create_location
      - create_rule
      - lookup_canon_page
      - list_canon_ids
      - ref_check
      - dedup_check
    max_iterations: 100
    state_key: worldgen_result
    temperature: 0.7

  final_gate:
    type: python
    tool: final_gate

edges:
  - from: START
    to: reload

  - from: reload
    to: worldgen

  - from: worldgen
    to: final_gate

  - from: final_gate
    to: END
