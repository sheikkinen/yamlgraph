# Novel Fandom — World Expansion (FR-643v2, FR-657)
# Deepen thin entities, grow wiki via red links, repeat.
#
# Pattern: reload → select thin → split by type →
#          deepen_events (agent) + deepen_other (LLM) →
#          merge → reflect → collect red links →
#          create skeletons (LLM) → gate → persist → reload
#
# FR-657: Events routed to agent with canon lookup tools.
# No LLM diagnoses. Pipeline decides, LLM generates, gate validates.

version: "1.0"
name: novel-fandom-worldgen
description: Expand wiki — deepen thin entities, grow via red links
prompts_relative: true
prompts_dir: prompts

data_files:
  canon: "canon/*.yaml"

state:
  canon_pages: dict
  canon_count: int
  synopsis_text: str
  event_context: dict
  thin_entities: list
  thin_events: list
  thin_other: list
  deepened: list
  reflection: dict
  red_links: list
  red_link_count: int
  semantic_merge_map: dict
  skeletons: list
  max_depth: int
  done: bool
  gate_result: dict
  written_paths: list
  written_count: int

variables:
  max_depth: 2

tools:
  anchor_events:
    type: python
    path: nodes/anchor_events.py
    function: anchor_events
  reload_canon:
    type: python
    path: nodes/reload_canon.py
    function: reload_canon
  select_thin:
    type: python
    path: nodes/select_thin.py
    function: select_thin
  collect_red_links:
    type: python
    path: nodes/collect_red_links.py
    function: collect_red_links
  validate_pages:
    type: python
    path: nodes/validate_pages.py
    function: validate_pages
  persist_pages:
    type: python
    path: nodes/persist_pages.py
    function: persist_pages
  split_thin_by_type:
    type: python
    path: nodes/split_thin_by_type.py
    function: split_thin_by_type
  lookup_canon_page:
    type: python
    path: nodes/canon_tools.py
    function: lookup_canon_page
    description: "Look up a canon entity by ID. Returns full YAML with calendar rules."
  list_canon_ids:
    type: python
    path: nodes/canon_tools.py
    function: list_canon_ids
    description: "List all entity IDs in the canon with their types."
  validate_draft:
    type: python
    path: nodes/canon_tools.py
    function: validate_draft
    description: "Validate a draft page. Returns {valid: bool, errors: list}."
  dedup_entities:
    type: python
    path: nodes/dedup_entities.py
    function: dedup_entities
  ref_check:
    type: graph
    path: ref_check.yaml
    description: "Validate referential integrity of entity pages. Input: pages (JSON list). Output: gate_result with valid/orphan_ids."
    input_mapping:
      pages: str
    output_key: gate_result
  semantic_dedup:
    type: graph
    path: semantic_dedup.yaml
    description: "Compare entities semantically for duplicates. Input: candidates (JSON list), canon_pages (JSON dict). Output: merge_map {dropped_id: surviving_id}."
    input_mapping:
      candidates: str
      canon_pages: str
    output_key: merge_map
  dedup_check:
    type: graph
    path: semantic_dedup.yaml
    description: "Check if an entity already exists under a different name. Input: candidates (JSON list with one entity), canon_pages (JSON dict). Output: merge_map."
    input_mapping:
      candidates: str
      canon_pages: str
    output_key: merge_map
  apply_merge:
    type: python
    path: nodes/apply_merge_map.py
    function: apply_merge_map

nodes:
  anchor:
    type: python
    tool: anchor_events

  reload:
    type: python
    tool: reload_canon

  select:
    type: python
    tool: select_thin

  split:
    type: python
    tool: split_thin_by_type

  deepen_events:
    type: map
    over: "{state.thin_events}"
    as: entity_task
    max_items: 5
    collect: deepened
    timeout: 120
    node:
      type: agent
      prompt: deepen_event_agent
      tools: [lookup_canon_page, list_canon_ids, validate_draft, ref_check, dedup_check]
      max_iterations: 8
      state_key: result
      temperature: 0.7
      variables:
        synopsis_text: "{state.synopsis_text}"

  deepen_other:
    type: map
    over: "{state.thin_other}"
    as: entity_task
    max_items: 5
    collect: deepened
    node:
      type: llm
      prompt: deepen_entity
      state_key: result
      temperature: 0.7
      variables:
        canon_pages: "{state.canon_pages}"
        canon_count: "{state.canon_count}"
        synopsis_text: "{state.synopsis_text}"
        event_context: "{state.event_context}"

  reflect:
    type: llm
    prompt: reflect_canon
    state_key: reflection
    temperature: 0.3
    variables:
      canon_pages: "{state.canon_pages}"
      canon_count: "{state.canon_count}"
      deepened: "{state.deepened}"

  collect:
    type: python
    tool: collect_red_links

  dedup:
    type: python
    tool: dedup_entities

  semantic_dedup_call:
    type: subgraph
    graph: semantic_dedup.yaml
    input_mapping:
      red_links: candidates
      canon_pages: canon_pages
    output_mapping:
      merge_map: semantic_merge_map

  apply_merge:
    type: python
    tool: apply_merge

  create_skeletons:
    type: map
    over: "{state.red_links}"
    as: red_link
    max_items: 10
    collect: skeletons
    node:
      type: llm
      prompt: generate_skeleton
      state_key: page
      temperature: 0.3
      variables:
        canon_pages: "{state.canon_pages}"
        synopsis_text: "{state.synopsis_text}"

  gate:
    type: python
    tool: validate_pages

  persist:
    type: python
    tool: persist_pages

edges:
  - from: START
    to: reload

  - from: reload
    to: anchor

  - from: anchor
    to: select

  - from: select
    to: END
    condition: done == true

  - from: select
    to: split
    condition: done == false

  - from: split
    to: deepen_events

  - from: deepen_events
    to: deepen_other

  - from: deepen_other
    to: reflect

  - from: reflect
    to: collect

  - from: collect
    to: dedup
    condition: red_link_count > 0

  - from: collect
    to: gate
    condition: red_link_count == 0

  - from: dedup
    to: semantic_dedup_call
    condition: red_link_count > 5

  - from: dedup
    to: create_skeletons
    condition: red_link_count > 0 and red_link_count <= 5

  - from: dedup
    to: gate
    condition: red_link_count == 0

  - from: semantic_dedup_call
    to: apply_merge

  - from: apply_merge
    to: create_skeletons

  - from: create_skeletons
    to: gate

  - from: gate
    to: persist

  - from: persist
    to: reload

loop_limits:
  reload: 3
  anchor: 3
  select: 3
  split: 3
  deepen_events: 3
  deepen_other: 3
  reflect: 3
  collect: 3
  dedup: 3
  semantic_dedup_call: 3
  apply_merge: 3
  create_skeletons: 3
  gate: 3
  persist: 3
