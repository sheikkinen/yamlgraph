# Novel Fandom — Genesis: Premise → Seed Canon (FR-655, FR-667)
# Streamlined stub pipeline: premise → synopsis → stubs → validate → persist
# 2 LLM calls only. Character enrichment happens in worldgen.
#
# Usage:
#   yamlgraph graph run examples/novel_fandom/genesis.yaml \
#     --var premise_file=examples/novel_fandom/premises/floodmark-saga.txt \
#     --full

version: "1.0"
name: novel-fandom-genesis
description: Bootstrap seed canon stubs from a premise via 2-call pipeline
prompts_relative: true
prompts_dir: prompts

state:
  premise_file: str
  premise_text: str
  synopsis: str
  structured_world: dict
  gate_result: dict
  written_paths: list
  written_count: int

variables:
  premise_file: "examples/novel_fandom/premises/floodmark-saga.txt"

tools:
  load_premise:
    type: python
    path: nodes/genesis_tools.py
    function: load_premise
  validate_genesis:
    type: python
    path: nodes/ref_integrity.py
    function: ref_check
  persist_genesis:
    type: python
    path: nodes/persist_genesis.py
    function: persist_genesis

nodes:
  load:
    type: python
    tool: load_premise

  synopsis:
    type: llm
    prompt: genesis_synopsis
    state_key: synopsis
    temperature: 0.7

  stubs:
    type: llm
    prompt: generate_stubs
    state_key: structured_world
    temperature: 0.3
    variables:
      premise_text: "{state.premise_text}"
      synopsis: "{state.synopsis}"

  validate:
    type: python
    tool: validate_genesis

  fix_stubs:
    type: llm
    prompt: fix_genesis_refs
    state_key: structured_world
    temperature: 0.3
    variables:
      structured_world: "{state.structured_world}"
      gate_result: "{state.gate_result}"

  persist:
    type: python
    tool: persist_genesis

edges:
  - from: START
    to: load

  - from: load
    to: synopsis

  - from: synopsis
    to: stubs

  - from: stubs
    to: validate

  - from: validate
    to: persist
    condition: gate_result.valid == true

  - from: validate
    to: fix_stubs
    condition: gate_result.valid == false

  - from: fix_stubs
    to: validate

  - from: persist
    to: END

loop_limits:
  validate: 3
  fix_stubs: 3
