# Novel Fandom — Genesis: Premise → Seed Canon (FR-686)
# Agent-first architecture: load → synopsis (LLM) → persist_synopsis →
#   genesis agent → final_gate → END
# Each create_* tool IS a graph-tool pipeline (FR-658 showcase):
#   persist (python) → prefetch (python) → check (LLM)
#
# Usage:
#   yamlgraph graph run examples/novel_fandom/genesis.yaml \
#     --var premise_file=examples/novel_fandom/premises/floodmark-saga.txt \
#     --full

version: "1.0"
name: novel-fandom-genesis
description: Bootstrap seed canon from a premise via agent with graph-tool creation pipelines
prompts_relative: true
prompts_dir: prompts

state:
  premise_file: str
  premise_text: str
  synopsis: str
  genesis_result: dict
  gate_result: dict

variables:
  premise_file: "examples/novel_fandom/premises/floodmark-saga.txt"

tools:
  load_premise:
    type: python
    path: nodes/genesis_tools.py
    function: load_premise
    description: "Read the premise text from file."
  persist_synopsis:
    type: python
    path: nodes/creation_tools.py
    function: persist_synopsis
  create_character:
    type: graph
    path: create_character.yaml
    description: "Create a character entity with semantic integrity check. Args: id, name, role (protagonist/antagonist/supporting/minor), faction, summary, related_to (id:role pairs)."
    input_mapping:
      id: id
      name: name
      role: role
      faction: faction
      summary: summary
      related_to: related_to
    output_key: result
  create_event:
    type: graph
    path: create_event.yaml
    description: "Create an event entity with semantic integrity check. Args: id, year (int, negative=before flood), scope (world/regional/local), participants (comma-sep IDs), consequences, summary."
    input_mapping:
      id: id
      year: year
      scope: scope
      participants: participants
      consequences: consequences
      summary: summary
    output_key: result
  create_faction:
    type: graph
    path: create_faction.yaml
    description: "Create a faction entity with semantic integrity check. Args: id, name, description, members (comma-sep IDs)."
    input_mapping:
      id: id
      name: name
      description: description
      members: members
    output_key: result
  create_location:
    type: graph
    path: create_location.yaml
    description: "Create a location entity with semantic integrity check. Args: id, name, description, location_type."
    input_mapping:
      id: id
      name: name
      description: description
      location_type: location_type
    output_key: result
  create_rule:
    type: graph
    path: create_rule.yaml
    description: "Create a rule entity with semantic integrity check. Args: id, domain (magic_system/character_state/physical_constraint/social_rule/temporal_rule), title, description."
    input_mapping:
      id: id
      domain: domain
      title: title
      description: description
    output_key: result
  create_premise:
    type: graph
    path: create_premise.yaml
    description: "Create the premise entity with semantic integrity check. Args: id, text, genre_tags (comma-sep), era, themes (comma-sep), calendar_note."
    input_mapping:
      id: id
      text: text
      genre_tags: genre_tags
      era: era
      themes: themes
      calendar_note: calendar_note
    output_key: result
  list_canon_ids:
    type: python
    path: nodes/canon_tools.py
    function: list_canon_ids
    description: "List all entity IDs in the canon with their types."
  update_refs:
    type: python
    path: nodes/creation_tools.py
    function: update_refs
    description: "Rewrite all references from old_id to new_id across canon. Use when dedup gate refuses a create and dangling references remain. Args: old_id, new_id."
  ref_check:
    type: graph
    path: ref_check.yaml
    description: "Run semantic referential integrity audit on the full canon. No args needed."
    output_key: result
  final_gate:
    type: python
    path: nodes/creation_tools.py
    function: final_gate

nodes:
  load:
    type: python
    tool: load_premise

  synopsis:
    type: llm
    prompt: genesis_synopsis
    state_key: synopsis
    temperature: 0.7

  persist_synopsis:
    type: python
    tool: persist_synopsis

  genesis:
    type: agent
    prompt: genesis_agent
    tools:
      - load_premise
      - create_character
      - create_event
      - create_faction
      - create_location
      - create_rule
      - create_premise
      - list_canon_ids
      - update_refs
      - ref_check
    max_iterations: 50
    state_key: genesis_result
    temperature: 0.3

  final_gate:
    type: python
    tool: final_gate

edges:
  - from: START
    to: load

  - from: load
    to: synopsis

  - from: synopsis
    to: persist_synopsis

  - from: persist_synopsis
    to: genesis

  - from: genesis
    to: final_gate

  - from: final_gate
    to: END
