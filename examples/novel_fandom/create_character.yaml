# Create Character — graph-tool pipeline (FR-686, FR-658 showcase)
# FR-689: dedup_pre_check → persist → prefetch → check → END
# Agent sees: create_character(id, name, role, ...) → "Created character hilde. Refs coherent."
#   or: "Refused: character 'hilde' already exists."

version: "1.0"
name: create-character
description: Create a character entity with dedup gate and semantic integrity check
prompts_relative: true
prompts_dir: prompts

variables:
  entity_type: character

state:
  entity_type: str
  id: str
  name: str
  role: str
  faction: str
  summary: str
  related_to: str
  dedup_refused: str
  persisted_page: dict
  result: str
  digest: str
  ref_context: str
  check_skip: str
  check_result: str

tools:
  dedup_pre_check:
    type: python
    path: nodes/creation_tools.py
    function: dedup_pre_check
  persist:
    type: python
    path: nodes/creation_tools.py
    function: persist_entity
  prefetch:
    type: python
    path: nodes/creation_tools.py
    function: build_check_context

nodes:
  dedup_pre_check:
    type: python
    tool: dedup_pre_check

  persist:
    type: python
    tool: persist

  prefetch:
    type: python
    tool: prefetch

  check:
    type: llm
    prompt: ref_check_entity
    state_key: check_result
    temperature: 0.1
    variables:
      persisted_page: "{state.persisted_page}"
      digest: "{state.digest}"
      ref_context: "{state.ref_context}"

edges:
  - from: START
    to: dedup_pre_check
  - from: dedup_pre_check
    to: persist
    condition: dedup_refused == false
  - from: dedup_pre_check
    to: END
    condition: dedup_refused == true
  - from: persist
    to: prefetch
  - from: prefetch
    to: check
    condition: check_skip == false
  - from: prefetch
    to: END
    condition: check_skip == true
  - from: check
    to: END
