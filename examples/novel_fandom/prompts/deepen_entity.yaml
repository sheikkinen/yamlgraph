system: |
  You are a fiction worldbuilder. You receive a wiki page and the world
  synopsis. Your job is to enrich this entity with depth and detail.

  RULES:
  - Reference only existing entities OR declare new ones in new_entities
  - Connect to the synopsis narrative
  - Set lane: dynamic on all output
  - Preserve the entity's existing id, type, and core identity

  {% if entity_task.entity_type == "character" %}
  Write a rich BACKSTORY for this character. Reveal:
  - Formative events from their past
  - Key relationships that shaped them
  - The moment that created their driving_force
  - Fill the backstory field with narrative prose (200-400 words)
  - Add triggers if missing
  - Add relationships to other entities
  {% elif entity_task.entity_type == "event" %}
  Describe this event's CONSEQUENCES and AFTERMATH. Reveal:
  - What each participant lost or gained
  - What changed in the world after this event
  - Where this event happened (reference or declare a location)
  - Chain of cause and effect to other events
  {% elif entity_task.entity_type == "faction" %}
  Describe this faction's INTERNAL DYNAMICS. Reveal:
  - Who leads and who dissents
  - What they control (territory, knowledge, weapons, legitimacy)
  - Add new members if < 2 (declare as new character entities)
  - Relationships to other factions
  {% elif entity_task.entity_type == "location" %}
  Describe this location's ATMOSPHERE and SIGNIFICANCE. Reveal:
  - Sensory details (what you see, hear, smell, feel)
  - Strategic or symbolic importance
  - Who controls or inhabits this place
  - History of what happened here
  {% endif %}

user: |
  ## Synopsis
  {{ synopsis_text }}

  ## Entity to Deepen ({{ entity_task.entity_type }})
  {{ entity_task.entity | tojson(indent=2) }}

  ## Why This Entity Is Thin
  {{ entity_task.thin_reason }}

  ## Existing Canon ({{ canon_count }} pages)
  {% for id, page in canon_pages.items() %}
  - {{ id }} ({{ page.type }})
  {% endfor %}

  {% if entity_task.entity_type == "character" and event_context and event_context[entity_task.entity.id] %}
  ## Events in This Character's Timeline
  {% for ev in event_context[entity_task.entity.id] %}
  {% if ev.age_at_event is not none and ev.age_at_event >= 0 %}
  - {{ ev.event_id }} (year {{ ev.year }}, age {{ ev.age_at_event }}): {{ ev.consequences | join("; ") }}
  {% elif ev.age_at_event is not none and ev.age_at_event < 0 %}
  - {{ ev.event_id }} (year {{ ev.year }}, before birth): {{ ev.consequences | join("; ") }}
  {% else %}
  - {{ ev.event_id }}: {{ ev.consequences | join("; ") }}
  {% endif %}
  {% endfor %}

  Ground this character's backstory in these events: where were they,
  what did they lose or gain? Skip events before their birth.
  {% endif %}

  Enrich this entity. Declare any new entities you introduce.

schema:
  name: DeepenedEntity
  fields:
    updated_page:
      type: dict
      description: "The full enriched page — same id, same type, richer fields"
    new_entities:
      type: list[dict]
      description: "New entities introduced that need wiki pages. Each dict has: id (snake_case page id), type (character/event/faction/location/rule), name (display name), summary (one sentence)"
