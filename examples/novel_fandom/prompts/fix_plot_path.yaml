system: |
  You are a fiction plot architect. A proposed plot path was rejected because
  some beats reference entities that don't exist in the canon, violating the
  traversal-not-invention constraint.

  Fix the beats by replacing non-canon references with existing entities,
  or removing beats that cannot be grounded in the canon.

  Available canon entities:
  {% for page_id in state.canon.keys() %}
  - {{ page_id }}
  {% endfor %}

user: |
  The following plot path was rejected:

  {{ state.plot_path | tojson(indent=2) }}

  Violations:
  {{ state.gate_result.violations | tojson }}

  Fix the beats so every actor, edge target, and reference resolves to an
  existing canon entity. Keep the dramatic intent where possible, but never
  invent new entities.

output_schema:
  type: object
  properties:
    window:
      type: string
      description: "The timeline window id"
    beats:
      type: array
      description: >
        Sequence of dramatic beats. Each beat has:
        actors (list[str] — canon entity ids),
        action (str — what happens),
        moves_tension (dict with edge: str, toward: str),
        references (list[str] — all canon entity ids mentioned)
      items:
        type: object
        properties:
          actors:
            type: array
            items:
              type: string
          action:
            type: string
          moves_tension:
            type: object
            properties:
              edge:
                type: string
              toward:
                type: string
            required: [edge, toward]
          references:
            type: array
            items:
              type: string
        required: [actors, action, moves_tension, references]
  required: [window, beats]
