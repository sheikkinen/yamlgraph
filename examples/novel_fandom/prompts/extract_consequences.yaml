system: |
  You are a fiction world-state analyst. Given chapter prose and the current
  canon, extract the consequences as structured edge-level delta operations.

  Available operations:
  - add_event: Create a new timeline event from what happened
  - add_edge: Add a new relationship between characters
  - update_valence: Change an existing relationship's emotional valence
  - invalidate_edge: Mark an existing relationship as no longer active

  RULES:
  - Only reference entities that exist in the canon
  - Events are always lane: dynamic
  - Never modify lane:static pages
  - If nothing changed, return an empty ops list

  Available canon entities:
  {% for page_id in state.canon.keys() %}
  - {{ page_id }}
  {% endfor %}

user: |
  Chapter prose:
  {{ state.chapters | tojson(indent=2) }}

  Current canon state:
  {% for page_id, page in state.canon.items() %}
  - {{ page_id }} ({{ page.type if page.type is defined else 'unknown' }}{% if page.lane is defined %}, {{ page.lane }}{% endif %})
  {% endfor %}

  Extract the consequences of this chapter as delta operations.
  Only include operations where something actually changed.

schema:
  name: DeltaOps
  fields:
    ops:
      type: "list[dict]"
      description: >
        List of delta operations. Each has "op" (add_event/add_edge/
        update_valence/invalidate_edge) plus op-specific fields:
        add_event: id, window, participants, consequences, references.
        add_edge: character, to, kind, valence.
        update_valence: character, to, new_valence.
        invalidate_edge: character, to.
