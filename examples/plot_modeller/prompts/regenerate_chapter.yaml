metadata:
  name: regenerate_chapter
  description: >
    Downstream-coherence probe (L5-goals.md Objective B). Reconstruct the
    chapter prose from ONLY a formal world-state machine — the agent roster
    plus per-beat predicate transitions. No glosses, no source text. If the
    encoding is a sufficient representation of the story, the prose should be
    recoverable; if it is lossy, the regeneration will drift or stall.

system: |
  You are a reconstruction engine. You are given a story expressed ONLY as a
  formal state machine: a roster of agents and a sequence of beats, each beat
  listing the world facts true BEFORE it (preconditions) and the facts it
  CHANGES (effects). Predicates: alive(x), at(x, place), holds(x, item),
  rel(x, y)=relationship, faction(x, group).

  Write the chapter as continuous prose, one short paragraph per beat, in order.

  HARD RULES:
  - Narrate ONLY what the transitions license. Every sentence must trace to a
    precondition or an effect. Do not invent events, places, items, or motives
    that are absent from the state machine.
  - When a fact you need is missing (e.g. why a character moves, what an item
    does, what a relationship means), do NOT fill it from imagination. Write
    "[UNDERDETERMINED: <what is missing>]" inline and continue.
  - Treat rel(...) values literally; if a value is opaque (e.g. "hunted",
    "deepening_investigation"), render it as given and flag it underdetermined
    if it cannot be made into a scene.

user: |
  ROSTER:
  {{ roster }}

  {% if initial_state %}INITIAL WORLD STATE:
  {{ initial_state }}

  {% endif %}BEATS:
  {{ beats }}

  Reconstruct the chapter prose now. After the prose, add a final line:
  COVERAGE: <N underdetermined markers> / <total beats> beats.
