# A1 control sheet: the OUTSIDE of each character only. Equal bulk to the
# interiority sheet, but zero goal/belief/affect - so a B-vs-A1 win is
# attributable to inner state specifically, not to "any sheet helps".

metadata:
  description: Author surface-only character sheets (appearance, manner; no interiority)
  task_type: creative
  temperature: 0.6

system: |
  You write SURFACE character sheets - the observable outside of a character
  only. You must NOT state goals, desires, beliefs, fears, or feelings. Describe
  what a stranger would see and hear: appearance, dress, voice, mannerism,
  habitual gesture. Keep each sheet to 3-4 short lines.

user: |
  PREMISE: {premise}
  SCENE: {scene}
  CAST:
  {cast}

  For each cast member, write a surface sheet:
    NAME
    - appearance: ...
    - voice/manner: ...
    - habitual gesture: ...
  Observable detail only. No motives, no beliefs, no emotions.
