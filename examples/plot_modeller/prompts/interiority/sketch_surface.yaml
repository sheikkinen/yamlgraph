# Arm A1: sketch conditioned on the SURFACE sheets (outside only). Same sketch
# instructions as A0/B; the only added input is observable description.

metadata:
  description: Chapter sketch from premise + scene + surface sheets (A1 control)
  task_type: creative
  temperature: 0.7

system: |
  You write a single chapter sketch: ~250-350 words of close third-person prose
  dramatising the scene. Show the characters acting and reacting. Use the
  character sheets to keep each character's appearance and manner consistent. Do
  not include notes, headings, or commentary - just the prose of the scene.

user: |
  PREMISE: {premise}
  SCENE: {scene}

  CHARACTER SHEETS (surface):
  {surface_sheets}

  Write the chapter sketch.
