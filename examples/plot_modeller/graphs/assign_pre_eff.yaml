metadata:
  name: assign-pre-eff
  description: >
    FR-576 L5 spike: assign world-state and belief preconditions/effects to
    classified beats (gloss + kind). One LLM node emits YAML text; a Python
    validator parses and checks it; on failure the LLM retries with the errors
    in-prompt (max 3 attempts).
  # No hardcoded provider/model — resolved from the PROVIDER env var at run time
  # (FR-570/576 J — provider/model is a run-time decision, not a graph constant).

prompts_relative: true
prompts_dir: ../prompts

state:
  glosses:
    type: list
    description: "Input: classified beats with id, gloss, chapter, kind, subject"
  agents:
    type: list
    description: "Input: agent names (for the membership check)"
  pre_eff_raw:
    type: str
    description: "Raw LLM YAML text (assign output; default parse_json: false)"
  pre_eff:
    type: list
    description: "Output: parsed + validated per-beat pre/eff (written by validator on success)"
  validation:
    type: dict
    description: "Validator result: {ok: bool, flaws: list[str]}"

tools:
  validate_pre_eff:
    type: python
    module: examples.plot_modeller.nodes.tools
    function: validate_pre_eff

nodes:
  assign:
    type: llm
    prompt: assign_pre_eff
    state_key: pre_eff_raw      # J1: raw YAML text lands here, not in `pre_eff`

  validate:
    type: python
    tool: validate_pre_eff
    state_key: validation

edges:
  - from: START
    to: assign
  - from: assign
    to: validate
  - from: validate
    to: assign
    condition: "validation.ok == false"
  - from: validate
    to: END
    condition: "validation.ok == true"

# Loop control is keyed on the re-entered node (`assign`). After 3 assign
# entries the loop exits to END even if validation never passes — evaluate.py
# then scores the genre as all-wrong (FR-570 J6).
loop_limits:
  assign: 3

loop_exits:
  assign: END
