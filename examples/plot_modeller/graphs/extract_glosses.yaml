metadata:
  name: extract-glosses
  description: >
    FR-575 L3 spike: decompose a prose synopsis into discrete story beats
    (id, gloss, chapter). One LLM node emits YAML text; a Python validator
    parses and checks it; on failure the LLM retries with errors in-prompt
    (max 3 attempts).
  # No hardcoded provider/model — resolved from the PROVIDER env var at run time.

prompts_relative: true
prompts_dir: ../prompts

state:
  synopsis:
    type: str
    description: "Input: prose synopsis text"
  glosses_raw:
    type: str
    description: "Raw LLM YAML text (extract output; default parse_json: false)"
  glosses:
    type: list
    description: "Output: parsed beat glosses (written by validator on success)"
  validation:
    type: dict
    description: "Validator result: {ok: bool, flaws: list[str]}"

tools:
  validate_glosses:
    type: python
    module: examples.plot_modeller.nodes.tools
    function: validate_glosses

nodes:
  extract:
    type: llm
    prompt: extract_glosses
    state_key: glosses_raw

  validate:
    type: python
    tool: validate_glosses
    state_key: validation

edges:
  - from: START
    to: extract
  - from: extract
    to: validate
  - from: validate
    to: extract
    condition: "validation.ok == false"
  - from: validate
    to: END
    condition: "validation.ok == true"

loop_limits:
  extract: 3

loop_exits:
  extract: END
