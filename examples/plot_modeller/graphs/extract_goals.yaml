metadata:
  name: extract-goals
  description: >
    FR-574 L2 spike: extract story goals from a prose synopsis and agent list.
    One LLM node emits YAML text; a Python validator parses and checks it;
    on failure the LLM retries with errors in-prompt (max 3 attempts).
  # No hardcoded provider/model — resolved from the PROVIDER env var at run time.

prompts_relative: true
prompts_dir: ../prompts

state:
  synopsis:
    type: str
    description: "Input: prose synopsis text"
  agents:
    type: list
    description: "Input: agent names from L1 (or ground truth for spike isolation)"
  goals_raw:
    type: str
    description: "Raw LLM YAML text (extract output; default parse_json: false)"
  goals:
    type: list
    description: "Output: parsed goal fluents (written by validator on success)"
  validation:
    type: dict
    description: "Validator result: {ok: bool, flaws: list[str]}"

tools:
  validate_goals:
    type: python
    module: examples.plot_modeller.nodes.tools
    function: validate_goals

nodes:
  extract:
    type: llm
    prompt: extract_goals
    state_key: goals_raw

  validate:
    type: python
    tool: validate_goals
    state_key: validation

edges:
  - from: START
    to: extract
  - from: extract
    to: validate
  - from: validate
    to: extract
    condition: "validation.ok == false"
  - from: validate
    to: END
    condition: "validation.ok == true"

loop_limits:
  extract: 3

loop_exits:
  extract: END
