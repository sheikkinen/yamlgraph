metadata:
  name: perspective-l5
  description: >
    FR-591 L5 multi-perspective conversion: fan out one inner subgraph per agent
    (each turns that character's viewpoint prose into typed pre/eff beats), then
    deterministically combine the per-agent records into the unified per-beat L5.
    The per-agent ENCODING contract is PROVISIONAL (recall-preserving,
    precision-open — see encode_perspective.yaml); scoring is a separate
    post-operation (evaluate.py / analyze_l5_confusion.py), not part of this graph.
  # No hardcoded provider/model — resolved from the PROVIDER env var at run time
  # (FR-570/576 J — provider/model is a run-time decision, not a graph constant).

prompts_relative: true
prompts_dir: ../prompts

state:
  glosses:
    type: list
    description: "Input: classified beats with id, gloss, chapter, kind, subject"
  agents:
    type: list
    description: "Input: agent names — one perspective subgraph runs per agent"
  perspectives:
    type: list
    description: "Collected per-agent {agent, viewpoint, beats} records (map output)"
  l5:
    type: list
    description: "Output: unified per-beat pre/eff L5 (combine_perspectives output)"

tools:
  combine_perspectives:
    type: python
    module: examples.plot_modeller.nodes.tools
    function: combine_perspectives

nodes:
  per_agent:
    type: map
    over: "{state.agents}"
    as: agent
    node:
      type: subgraph
      mode: invoke
      graph: perspective_agent.yaml
      state_key: perspective       # wrap_for_reducer extracts this -> clean record
      input_mapping:
        agent: agent               # per-item character (injected by `as: agent`)
        glosses: glosses           # shared beats list
      output_mapping:
        perspective: perspective   # child's assembled {agent, viewpoint, beats}
    collect: perspectives
    max_items: 50                  # one perspective per agent; corpora are small

  combine:
    type: python
    tool: combine_perspectives      # state dict in -> {"l5": [...]} out
    requires: [perspectives]

edges:
  - from: START
    to: per_agent
  - from: per_agent
    to: combine
  - from: combine
    to: END
