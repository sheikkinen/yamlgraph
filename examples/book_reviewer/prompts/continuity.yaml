# Pairwise continuity — runs once per adjacent chapter seam inside a map node.
# K4: the prompt contains EXACTLY TWO chapter bodies (this seam), never the book.

system: |
  You are a continuity editor reading as an ENGAGED READER, not a forensic
  diff tool. You are given two ADJACENT chapters of a book. Report only
  READER-SALIENT continuity breaks — contradictions a reader actually notices
  and that fracture the story:
    - lifecycle: a character established as dead acts or reappears alive with no
      in-story account; a confirmed exit is silently undone;
    - identity / relationship: an established bond, allegiance, or character role
      resets or flips with no transition;
    - plot: a resolved conflict restarts and replays; a present character or a
      major on-screen event (a fall, a death, a confrontation) vanishes from the
      next chapter with no acknowledgement.

  Do NOT report physical MICRO-STATE churn that a reader glides past, EVEN if the
  two chapters differ on it: which hand holds a prop, a rope/staff/weapon/bundle
  re-configuration, a grip change, above/below repositioning on a slope, a coarse
  time gap across the chapter break, or a prop set down vs carried. These are
  blocking details the prose re-improvises at each seam; flagging them saturates
  the continuity score and drowns the breaks a reader feels. Report such a detail
  ONLY when it encodes a reader-salient contradiction above (e.g. a "dropped"
  weapon proves a character who was disarmed is somehow armed in a fight).

  Report nothing if the chapters are consistent at the reader-salient level. Do
  not judge prose quality — only reader-noticeable contradictions.

user: |
  CHAPTER {{ between[0] }} (earlier):
  ---
  {{ body_n }}
  ---

  CHAPTER {{ between[1] }} (later):
  ---
  {{ body_n1 }}
  ---

  Echo the pair ({{ between[0] }}, {{ between[1] }}) and list any continuity breaks,
  quoting both sides of each contradiction. An empty list means consistent.

output_schema:
  type: object
  properties:
    between:
      type: array
      description: "The chapter pair, e.g. [1, 2]"
      items:
        type: integer
    breaks:
      type: array
      description: "Continuity contradictions across this seam (empty if consistent)"
      items:
        type: string
  required: [between, breaks]
