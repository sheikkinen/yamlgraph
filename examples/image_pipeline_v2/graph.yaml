# Critic-filtered single-provider image pipeline.
#
# Pipeline:
#   generate_candidates (LLM) -> score_filter (python) -> save_report (python) -> generate_images (python)
#
# Usage:
#   yamlgraph graph run examples/image_pipeline_v2/graph.yaml \
#     --var style="dark fantasy" --var n_candidates="10" --var top_k="3" --full

name: image-pipeline-v2
version: "1.0"
description: critic-filtered single-provider image pipeline (generate → score → filter → render)
prompts_relative: true
prompts_dir: prompts

state:
  style: str
  candidates: any
  top_k: str
  n_candidates: str
  scored: list
  prompts: list
  report_file: str
  local_report_file: str
  output_dir: str
  images: list

tools:
  score_filter:
    type: python
    module: examples.image_pipeline_v2.nodes.score_filter
    function: score_filter_node
    description: Score candidates with the deviant-daily critic and keep the top-k passing prompts

  save_report:
    type: python
    module: examples.image_pipeline_v2.nodes.save_report
    function: save_report_node
    description: Write sanitized and local rejection tables and set the image output directory

  generate_images:
    type: python
    module: examples.image_pipeline.nodes.generate_images
    function: generate_images_node
    description: Generate images via Replicate z-image from filtered prompts

nodes:
  generate_candidates:
    type: llm
    prompt: generate_candidates
    state_key: candidates
    variables:
      style: "{state.style}"
      n_candidates: "{state.n_candidates}"

  score_filter:
    type: python
    tool: score_filter
    requires: [candidates]

  save_report:
    type: python
    tool: save_report
    requires: [scored]

  generate_images:
    type: python
    tool: generate_images
    state_key: images
    requires: [prompts, output_dir]

edges:
  - from: START
    to: generate_candidates
  - from: generate_candidates
    to: score_filter
  - from: score_filter
    to: save_report
  - from: save_report
    to: generate_images
  - from: generate_images
    to: END
