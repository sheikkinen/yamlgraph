version: "1.0"
name: fr-judge
description: "FR-450 — Standalone FR judge with task-shaped tools and structured verdict output"
prompts_relative: true
prompts_dir: prompts

state:
  fr_path: str
  verdict: dict

tools:
  read_file:
    manifest: ../../shared/toolbelt/read_file.tool.yaml

  search:
    manifest: ../../shared/toolbelt/search.tool.yaml

  list_dir:
    manifest: ../../shared/toolbelt/list_dir.tool.yaml

  git_log:
    manifest: ../../shared/toolbelt/git_log.tool.yaml

  run_tests:
    type: shell
    command: pytest {test_file} -v --no-cov --tb=short 2>&1
    description: "Run a specific test file. Verify acceptance tests fail for the right reasons (criterion 8)."
    parse: text

nodes:
  judge:
    type: agent
    prompt: judge
    temperature: 0
    tools: [read_file, search, list_dir, git_log, run_tests]
    max_iterations: 12
    state_key: verdict

edges:
  - from: START
    to: judge
  - from: judge
    to: END
