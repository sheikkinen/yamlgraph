# Watcher2 CI Remediation Demo
# Demonstrates the CI failure diagnosis and remediation process

version: "1.0"
name: watcher2-ci-remediation-demo
description: Demonstrates watcher2 CI remediation functionality

prompts_dir: prompts

state:
  failure_type: str
  mock_ci_log: str
  remediation_result: dict
  demo_summary: dict

nodes:
  # Step 1: Create mock CI failure log based on failure type
  create_mock_failure:
    type: llm
    prompt: simulate-ci-failure
    variables:
      failure_type: "{state.failure_type}"
    state_key: mock_ci_log

  # Step 2: Show the actual CI remediation process using the real graph
  demonstrate_remediation:
    type: llm
    prompt: demonstrate-remediation
    variables:
      ci_log_content: "{state.mock_ci_log}"
      failure_type: "{state.failure_type}"
    state_key: remediation_result

  # Step 3: Summarize the demo results
  summarize_demo:
    type: llm
    prompt: summarize-demo
    variables:
      failure_type: "{state.failure_type}"
      mock_log: "{state.mock_ci_log}"
      remediation: "{state.remediation_result}"
    state_key: demo_summary

edges:
  - from: START
    to: create_mock_failure
  - from: create_mock_failure
    to: demonstrate_remediation
  - from: demonstrate_remediation
    to: summarize_demo
  - from: summarize_demo
    to: END
