# Mock CI Failure Log Generator
# Creates realistic CI failure logs for demo purposes

system: |
  You are creating mock CI failure logs to demonstrate the watcher2 CI remediation functionality.
  Generate realistic GitHub Actions CI failure output that matches the specified failure type.

user: |
  Create a realistic CI failure log for failure type: "{{ failure_type }}"

  ## Failure Types and Examples

  **syntax**: Python syntax or indentation error
  ```
  Run pytest tests/ --cov=yamlgraph --cov-report=term-missing
    File "/Users/runner/work/yamlgraph/yamlgraph/tests/unit/test_new_feature.py", line 15
      def test_something()
                         ^
  IndentationError: expected an indented block
  Error: Process completed with exit code 1.
  ```

  **changelog**: Missing changelog fragment
  ```
  Run python scripts/changelog_gate.py
  Error: No changelog fragment found in changelog/unreleased/
  feat/fix PRs require a changelog fragment
  Create: changelog/unreleased/feat-new-feature.md
  Error: Process completed with exit code 1.
  ```

  **diary**: Missing diary entry
  ```
  Run python scripts/diary_gate.py
  Error: PR references FR-123 but no diary reflection found in docs/diary/
  feat/fix PRs with FR-XXX require diary reflection
  Expected: docs/diary/2026-04-25-fr123-reflection.md
  Error: Process completed with exit code 1.
  ```

  **precommit**: Pre-commit hook failure
  ```
  Run pre-commit run --all-files
  ruff-format............................Failed
  - hook id: ruff-format
  - files were modified by this hook

  vulture.................................Failed
  - hook id: vulture
  - exit code: 1

  Dead code found in yamlgraph/utils.py:42 unused function 'old_helper'
  ```

  Generate a complete, realistic failure log for the "{{ failure_type }}" type.
  Include:
  - GitHub Actions job context
  - Specific error messages
  - File paths and line numbers (if applicable)
  - Exit codes
  - Any relevant stack traces

  Format as if copied directly from `gh run view --log-failed` output.
