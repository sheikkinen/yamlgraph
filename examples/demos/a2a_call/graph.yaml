# A2A Call Demo — FR-253
# Calls an external A2A agent via type: python + contrib client,
# then summarises the response with a local LLM node.

version: "1.0"
name: a2a-call-demo
description: Invoke an external A2A agent from a YAML graph

prompts_relative: true
prompts_dir: prompts

defaults:
  temperature: 0.7

state:
  name: str
  style: str

tools:
  a2a_send:
    type: python
    module: yamlgraph.contrib.a2a_client
    function: send_a2a_message
    description: "Send message to A2A agent"

nodes:
  ask_agent:
    type: python
    tool: a2a_send
    state_key: agent_response
    variables:
      agent_url: "http://localhost:9240/"
      message: "name={state.name} style={state.style}"
      timeout: "60"

  summarise:
    type: llm
    prompt: summarise
    variables:
      agent_response: "{state.agent_response}"
    state_key: summary

edges:
  - from: START
    to: ask_agent
  - from: ask_agent
    to: summarise
  - from: summarise
    to: END
