name: Watcher2DeduplicationGateDemo
description: Concrete verification demo for FR-287 watcher2 deduplication gate

state_keys:
  - dedup_script_contract
  - runtime_merged_fr_hit
  - runtime_no_fr_token
  - runtime_gh_failure
  - watcher_dedup_flow
  - readme_dedup_docs
  - demo_summary

tools:
  verify_dedup_script_contract:
    type: shell
    command: |
      echo "=== AC-02 / AC-06 / AC-07: dedup_gate.sh contract ==="
      python - <<'PY'
      from pathlib import Path
      import sys

      content = Path(".chaplain/lib/watcher/dedup_gate.sh").read_text()
      checks = [
          ("dedup gate function exists", "dedup_gate()" in content),
          ("FR token regex extraction exists", "FR-[0-9]+" in content),
          ("merged PR query uses gh pr list", "gh pr list" in content),
          ("merged state filter exists", "--state merged" in content),
          ("FR search option exists", "--search" in content),
          ("gh availability guard exists", "command -v gh" in content),
          ("warning path exists for gh/query failure", "log_warn" in content),
          ("non-fatal continue path exists", "return 0" in content),
      ]

      failed = [name for name, ok in checks if not ok]
      for name, ok in checks:
          print(("PASS" if ok else "FAIL") + ": " + name)

      if failed:
          sys.exit(1)
      PY
    description: Verify dedup gate implementation contract
    parse: text

  verify_runtime_merged_fr_hit:
    type: shell
    command: |
      echo "=== AC-03 runtime: merged FR hit returns skip code 2 ==="
      bash -eu -o pipefail <<'BASH'
      tmpdir=$(mktemp -d)
      trap 'rm -rf "$tmpdir"' EXIT
      mkdir -p "$tmpdir/bin"

      cat > "$tmpdir/topic.md" <<'EOF'
      Implement follow-up for FR-277 after merge.
      EOF

      cat > "$tmpdir/bin/gh" <<'EOF'
      #!/usr/bin/env bash
      if [[ "$1" == "pr" && "$2" == "list" ]]; then
          echo "merged-pr-211"
          exit 0
      fi
      exit 1
      EOF
      chmod +x "$tmpdir/bin/gh"

      log_info() ( echo "[demo] $1" )
      log_warn() ( echo "[demo] WARN: $1" )
      source .chaplain/lib/watcher/dedup_gate.sh

      TOPIC_FILE="$tmpdir/topic.md"
      DEDUP_FR_TOKEN=""
      DEDUP_MERGED_PR_REF=""
      old_path="$PATH"
      PATH="$tmpdir/bin:$old_path"

      set +e
      dedup_gate "$TOPIC_FILE"
      status=$?
      set -e

      if [[ "$status" -ne 2 ]]; then
          echo "FAIL: expected dedup_gate exit 2, got $status"
          exit 1
      fi
      if [[ "$DEDUP_FR_TOKEN" != "FR-277" ]]; then
          echo "FAIL: expected DEDUP_FR_TOKEN=FR-277, got $DEDUP_FR_TOKEN"
          exit 1
      fi
      if [[ -z "$DEDUP_MERGED_PR_REF" ]]; then
          echo "FAIL: expected DEDUP_MERGED_PR_REF to be set"
          exit 1
      fi
      echo "PASS: merged FR hit returned skip code 2 and exported merged PR metadata"
      BASH
    description: Prove merged FR topics are skipped by dedup gate
    parse: text

  verify_runtime_no_fr_token:
    type: shell
    command: |
      echo "=== AC-06 runtime: no FR token passes through ==="
      bash -eu -o pipefail <<'BASH'
      tmpdir=$(mktemp -d)
      trap 'rm -rf "$tmpdir"' EXIT
      mkdir -p "$tmpdir/bin"

      cat > "$tmpdir/topic.md" <<'EOF'
      Implement a fresh idea with no explicit FR reference.
      EOF

      cat > "$tmpdir/bin/gh" <<'EOF'
      #!/usr/bin/env bash
      echo "gh should not be called on no-token path" >&2
      exit 99
      EOF
      chmod +x "$tmpdir/bin/gh"

      log_info() ( echo "[demo] $1" )
      log_warn() ( echo "[demo] WARN: $1" )
      source .chaplain/lib/watcher/dedup_gate.sh

      TOPIC_FILE="$tmpdir/topic.md"
      DEDUP_FR_TOKEN=""
      old_path="$PATH"
      PATH="$tmpdir/bin:$old_path"

      set +e
      dedup_gate "$TOPIC_FILE"
      status=$?
      set -e

      if [[ "$status" -ne 0 ]]; then
          echo "FAIL: expected dedup_gate exit 0, got $status"
          exit 1
      fi
      if [[ -n "$DEDUP_FR_TOKEN" ]]; then
          echo "FAIL: expected DEDUP_FR_TOKEN to stay unset"
          exit 1
      fi
      echo "PASS: no FR token path returned success (pipeline continues)"
      BASH
    description: Prove no-token topics continue without skip
    parse: text

  verify_runtime_gh_failure:
    type: shell
    command: |
      echo "=== AC-07 runtime: gh query failure is non-fatal ==="
      bash -eu -o pipefail <<'BASH'
      tmpdir=$(mktemp -d)
      trap 'rm -rf "$tmpdir"' EXIT
      mkdir -p "$tmpdir/bin"

      cat > "$tmpdir/topic.md" <<'EOF'
      Re-run FR-999 diagnostics.
      EOF

      cat > "$tmpdir/bin/gh" <<'EOF'
      #!/usr/bin/env bash
      if [[ "$1" == "pr" && "$2" == "list" ]]; then
          echo "simulated gh failure" >&2
          exit 1
      fi
      exit 1
      EOF
      chmod +x "$tmpdir/bin/gh"

      log_info() ( echo "[demo] $1" )
      log_warn() ( echo "[demo] WARN: $1" )
      source .chaplain/lib/watcher/dedup_gate.sh

      TOPIC_FILE="$tmpdir/topic.md"
      old_path="$PATH"
      PATH="$tmpdir/bin:$old_path"

      set +e
      output=$(dedup_gate "$TOPIC_FILE" 2>&1)
      status=$?
      set -e

      if [[ "$status" -ne 0 ]]; then
          echo "FAIL: expected dedup_gate exit 0 on gh failure, got $status"
          exit 1
      fi
      if [[ "$output" != *"Merged PR dedup query failed"* ]]; then
          echo "FAIL: expected warning output for gh query failure"
          echo "$output"
          exit 1
      fi
      echo "PASS: gh query failure path logged warning and continued"
      BASH
    description: Prove gh failures degrade gracefully
    parse: text

  verify_watcher_dedup_flow:
    type: shell
    command: |
      echo "=== AC-01 / AC-03 / AC-04 / AC-05: watcher2 wiring ==="
      python - <<'PY'
      from pathlib import Path
      import sys

      content = Path(".chaplain/watcher2.sh").read_text()
      dedup_call_pos = content.find('dedup_gate "$TOPIC_FILE"')
      preflight_pos = content.find("if ! preflight; then")
      skip_outcome_pos = content.find('CYCLE_OUTCOME="skipped"')
      skip_metrics_pos = content.find("write_cycle_metrics", skip_outcome_pos)
      checks = [
          ("dedup gate lib is sourced", 'source "$LIB_DIR/dedup_gate.sh"' in content),
          ("dedup gate runs before preflight", dedup_call_pos != -1 and preflight_pos != -1 and dedup_call_pos < preflight_pos),
          ("dedup status branch exists", "dedup_gate_status" in content),
          ("already-completed FR skip log exists", "already-completed FR" in content),
          ("skip path consumes processing topic file", 'rm "$TOPIC_FILE"' in content),
          ("skip path writes skipped metrics", skip_outcome_pos != -1 and skip_metrics_pos != -1 and skip_outcome_pos < skip_metrics_pos),
      ]

      failed = [name for name, ok in checks if not ok]
      for name, ok in checks:
          print(("PASS" if ok else "FAIL") + ": " + name)

      if failed:
          sys.exit(1)
      PY
    description: Verify watcher2 dedup skip control flow wiring
    parse: text

  verify_readme_dedup_docs:
    type: shell
    command: |
      echo "=== AC-09: README dedup contract ==="
      python - <<'PY'
      from pathlib import Path
      import sys

      content = Path(".chaplain/README.md").read_text()
      checks = [
          ("README includes dedup section", "dedup" in content.lower()),
          ("README documents merged state query", "--state merged" in content),
          ("README documents FR-token search pattern", "--search" in content and "FR-" in content),
      ]

      failed = [name for name, ok in checks if not ok]
      for name, ok in checks:
          print(("PASS" if ok else "FAIL") + ": " + name)

      if failed:
          sys.exit(1)
      PY
    description: Verify README documents dedup gate behavior
    parse: text

  summarize_demo:
    type: shell
    command: |
      echo "=== FR-287 DEMO SUMMARY ==="
      echo "PASS: dedup_gate extracts FR tokens and queries merged PRs with gh search."
      echo "PASS: merged FR hit returns skip code 2 and surfaces merged PR metadata."
      echo "PASS: no-token path returns 0 (normal pipeline pass-through)."
      echo "PASS: gh query failure logs warning and stays non-fatal."
      echo "PASS: watcher2 wiring executes dedup before preflight and records skipped metrics."
      echo "PASS: .chaplain/README.md documents dedup gate and merged search contract."
    description: Print final demonstration summary
    parse: text

nodes:
  check_dedup_script_contract:
    type: tool
    tool: verify_dedup_script_contract
    state_key: dedup_script_contract

  check_runtime_merged_fr_hit:
    type: tool
    tool: verify_runtime_merged_fr_hit
    state_key: runtime_merged_fr_hit

  check_runtime_no_fr_token:
    type: tool
    tool: verify_runtime_no_fr_token
    state_key: runtime_no_fr_token

  check_runtime_gh_failure:
    type: tool
    tool: verify_runtime_gh_failure
    state_key: runtime_gh_failure

  check_watcher_dedup_flow:
    type: tool
    tool: verify_watcher_dedup_flow
    state_key: watcher_dedup_flow

  check_readme_docs:
    type: tool
    tool: verify_readme_dedup_docs
    state_key: readme_dedup_docs

  summary:
    type: tool
    tool: summarize_demo
    state_key: demo_summary

edges:
  - from: START
    to: check_dedup_script_contract
  - from: check_dedup_script_contract
    to: check_runtime_merged_fr_hit
  - from: check_runtime_merged_fr_hit
    to: check_runtime_no_fr_token
  - from: check_runtime_no_fr_token
    to: check_runtime_gh_failure
  - from: check_runtime_gh_failure
    to: check_watcher_dedup_flow
  - from: check_watcher_dedup_flow
    to: check_readme_docs
  - from: check_readme_docs
    to: summary
  - from: summary
    to: END
