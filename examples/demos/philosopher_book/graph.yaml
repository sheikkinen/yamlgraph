version: "1.0"
name: philosopher-book
description: >
  The Philosopher writes one chapter at a time.
  Plan → write a single chapter using Copilot with diary search tools.
  Run with --var chapter_num=N (1-21). (FR-404)

prompts_relative: true
prompts_dir: prompts

defaults:
  provider: anthropic
  model: claude-opus-4.6
  temperature: 1

state:
  trap: dict
  chapter_plan: str
  chapter_text: str
  chapter_num: int
  output_dir: str

tools:
  load_trap:
    type: python
    module: examples.demos.philosopher_book.tools
    function: load_trap
    description: "Load one trap by chapter_num from the Knowledge Graph"
  search_diary:
    type: python
    module: examples.demos.philosopher_book.tools
    function: search_diary
    description: "Search diary corpus for entries mentioning a trap or keyword"
  read_file:
    type: python
    module: examples.demos.philosopher_book.tools
    function: read_file
    description: "Read a file by path (diary entry, letter, or Scripture)"

nodes:
  load_trap:
    type: python
    tool: load_trap
    state_key: trap

  plan_chapter:
    type: copilot
    prompt: plan_chapter
    state_key: chapter_plan
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    timeout: 3600
    variables:
      trap_name: "{state.trap.trap_name}"
      definition: "{state.trap.definition}"
      cure: "{state.trap.cure}"
      part_name: "{state.trap.part}"
      chapter_num: "{state.trap.chapter_num}"
      chapter_title: "{state.trap.title}"

  write_chapter:
    type: copilot
    prompt: write_chapter
    state_key: chapter_text
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    timeout: 3600
    variables:
      trap_name: "{state.trap.trap_name}"
      definition: "{state.trap.definition}"
      cure: "{state.trap.cure}"
      part_name: "{state.trap.part}"
      chapter_num: "{state.trap.chapter_num}"
      chapter_title: "{state.trap.title}"
      chapter_plan: "{state.chapter_plan}"
      output_dir: "{state.output_dir}"

edges:
  - from: START
    to: load_trap
  - from: load_trap
    to: plan_chapter
  - from: plan_chapter
    to: write_chapter
  - from: write_chapter
    to: END
