version: "1.0"
name: corpus-census
description: >
  Shared discover-extract-map-reduce census pipeline. Corpus-specific discovery
  and extraction are bound at invocation time through FR-892 tool slots.

prompts_relative: true
prompts_dir: prompts

defaults:
  provider: anthropic
  model: claude-haiku-4-5
  temperature: 0.0

config:
  max_map_items: 200

state:
  source: str
  rubric: str
  model: str
  provider: str
  labels: str
  output_path: str
  items:
    type: list
  contents:
    type: list
    reducer: sorted_add
  findings:
    type: list
    reducer: sorted_add
  ledger: dict
  brief_path: str
  brief_rubric: str
  brief_input:
    type: list
  claims: dict
  brief: dict

tools:
  discover:
    slot: true
    contract:
      args: [source]
  extract:
    slot: true
    contract:
      args: [item]
  reduce_ledger:
    type: python
    path: tools.py
    function: reduce_ledger
    description: "Validate census findings and write markdown plus JSONL ledger artifacts."
  prepare_brief_input:
    type: python
    path: tools.py
    function: prepare_brief_input
    description: "Load reduced ledger JSONL and build bounded public-safe synthesis input."
  render_brief:
    type: python
    path: tools.py
    function: render_brief
    description: "Validate synthesized citations and render accepted or rejected brief artifact."

nodes:
  discover:
    type: python
    tool: discover
    variables:
      source: "{state.source}"
    state_key: items
    on_error: fail

  extract_items:
    type: map
    over: "{state.items}"
    as: item
    max_items: 200
    node:
      type: python
      tool: extract
      state_key: content
      on_error: fail
    collect: contents

  judge_items:
    type: map
    over: "{state.contents}"
    as: judged_content
    max_items: 200
    node:
      type: llm
      prompt: judge_item
      provider: "{state.provider}"
      model: "{state.model}"
      temperature: 0.0
      state_key: finding
      on_error: skip
      variables:
        rubric: "{state.rubric}"
        content: "{state.judged_content.value}"
        source_index: "{state.judged_content._map_index}"
    collect: findings

  reduce_ledger:
    type: python
    tool: reduce_ledger
    state_key: ledger

  prepare_brief_input:
    type: python
    tool: prepare_brief_input
    state_key: brief_input

  synthesize:
    type: llm
    prompt: synthesize_brief
    provider: "{state.provider}"
    model: "{state.model}"
    temperature: 0.0
    state_key: claims
    variables:
      rubric: "{state.brief_rubric}"
      rows: "{state.brief_input}"

  render_brief:
    type: python
    tool: render_brief
    state_key: brief

edges:
  - from: START
    to: discover
  - from: discover
    to: extract_items
  - from: extract_items
    to: judge_items
  - from: judge_items
    to: reduce_ledger
  - from: reduce_ledger
    to: prepare_brief_input
  - from: prepare_brief_input
    to: synthesize
  - from: synthesize
    to: render_brief
  - from: render_brief
    to: END
