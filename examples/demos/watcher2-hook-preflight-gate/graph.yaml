name: Watcher2HookPreflightGateDemo
description: Concrete verification demo for FR-288 watcher2 hook preflight gate

state_keys:
  - preflight_script_contract
  - runtime_hook_gate_matrix
  - watcher_preflight_flow
  - readme_hook_docs
  - demo_summary

tools:
  verify_preflight_script_contract:
    type: shell
    command: |
      echo "=== AC-01 / AC-04 / AC-05: preflight.sh hook gate contract ==="
      python - <<'PY'
      from pathlib import Path
      import sys

      content = Path(".chaplain/lib/watcher/preflight.sh").read_text()
      lower = content.lower()
      checks = [
          ("core.hooksPath local config read exists", "core.hookspath" in lower),
          ("allows default .git/hooks path", ".git/hooks" in content),
          ("pre-commit hook check exists", "pre-commit" in lower),
          ("commit-msg hook check exists", "commit-msg" in lower),
          ("executable-bit check exists (-x)", "-x " in content or " -x" in content),
          ("remediation command: unset core.hooksPath", "git config --local --unset core.hooksPath" in content),
          ("remediation command: pre-commit install", "pre-commit install" in content),
          ("remediation command: pre-commit install --hook-type commit-msg", "pre-commit install --hook-type commit-msg" in content),
      ]

      failed = [name for name, ok in checks if not ok]
      for name, ok in checks:
          print(("PASS" if ok else "FAIL") + ": " + name)

      if failed:
          sys.exit(1)
      PY
    description: Verify preflight hook-gate implementation contract
    parse: text

  verify_runtime_hook_gate_matrix:
    type: shell
    command: |
      echo "=== AC-02 / AC-03 / AC-04 / AC-07: runtime hook gate matrix ==="
      python - <<'PY'
      from __future__ import annotations

      import re
      import stat
      import subprocess
      import sys
      from pathlib import Path
      from tempfile import TemporaryDirectory

      repo_root = Path(".").resolve()
      preflight_sh = repo_root / ".chaplain" / "lib" / "watcher" / "preflight.sh"

      def run(args: list[str], cwd: Path | None = None) -> None:
          subprocess.run(args, cwd=cwd, check=True, text=True, capture_output=True)

      def init_repo(base: Path) -> Path:
          repo = base / "repo"
          repo.mkdir(parents=True, exist_ok=True)
          run(["git", "init", "-q"], cwd=repo)
          run(["git", "checkout", "-b", "main", "-q"], cwd=repo)
          return repo

      def create_hook(path: Path, executable: bool = True) -> None:
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text("#!/usr/bin/env bash\nexit 0\n")
          if executable:
              path.chmod(path.stat().st_mode | stat.S_IXUSR)

      def run_preflight(repo: Path) -> int:
          script = """
      log_info() {{ :; }}
      log_warn() {{ :; }}
      log_error() {{ :; }}
      python3() {{ return 0; }}
      source "__PREFLIGHT_SH__"
      preflight
      rc=$?
      echo "__PREFLIGHT_RC=$rc"
      """
          script = script.replace("__PREFLIGHT_SH__", str(preflight_sh))
          proc = subprocess.run(
              ["bash", "-lc", script],
              cwd=repo,
              text=True,
              capture_output=True,
              check=True,
          )
          match = re.search(r"__PREFLIGHT_RC=(\d+)", proc.stdout)
          if not match:
              raise RuntimeError(
                  "Could not parse preflight return code: " + repr(proc.stdout)
              )
          return int(match.group(1))

      with TemporaryDirectory() as tmp:
          root = Path(tmp)

          # Scenario 1: empty hooksPath must fail.
          repo_empty = init_repo(root / "empty")
          run(["git", "config", "--local", "core.hooksPath", ""], cwd=repo_empty)
          create_hook(repo_empty / ".git" / "hooks" / "pre-commit", executable=True)
          create_hook(repo_empty / ".git" / "hooks" / "commit-msg", executable=True)
          rc_empty = run_preflight(repo_empty)

          # Scenario 2: non-default hooksPath must fail.
          repo_non_default = init_repo(root / "non-default")
          run(
              ["git", "config", "--local", "core.hooksPath", ".githooks"],
              cwd=repo_non_default,
          )
          create_hook(repo_non_default / ".githooks" / "pre-commit", executable=True)
          create_hook(repo_non_default / ".githooks" / "commit-msg", executable=True)
          rc_non_default = run_preflight(repo_non_default)

          # Scenario 3: missing required pre-commit hook must fail.
          repo_missing = init_repo(root / "missing-hook")
          create_hook(repo_missing / ".git" / "hooks" / "commit-msg", executable=True)
          rc_missing = run_preflight(repo_missing)

          # Scenario 4: non-executable commit-msg hook must fail.
          repo_non_exec = init_repo(root / "non-executable")
          create_hook(repo_non_exec / ".git" / "hooks" / "pre-commit", executable=True)
          create_hook(repo_non_exec / ".git" / "hooks" / "commit-msg", executable=False)
          rc_non_exec = run_preflight(repo_non_exec)

          # Scenario 5: healthy default hooks must pass.
          repo_healthy = init_repo(root / "healthy")
          create_hook(repo_healthy / ".git" / "hooks" / "pre-commit", executable=True)
          create_hook(repo_healthy / ".git" / "hooks" / "commit-msg", executable=True)
          rc_healthy = run_preflight(repo_healthy)

      checks = [
          ("empty core.hooksPath fails", rc_empty != 0),
          ("non-default core.hooksPath fails", rc_non_default != 0),
          ("missing pre-commit hook fails", rc_missing != 0),
          ("non-executable commit-msg hook fails", rc_non_exec != 0),
          ("healthy hooks pass", rc_healthy == 0),
      ]

      failed = [name for name, ok in checks if not ok]
      for name, ok in checks:
          print(("PASS" if ok else "FAIL") + ": " + name)

      if failed:
          sys.exit(1)
      PY
    description: Prove runtime hook-path and hook-executable gate behavior
    parse: text

  verify_watcher_preflight_flow:
    type: shell
    command: |
      echo "=== AC-06: watcher2 preflight boundary blocks plan phase ==="
      python - <<'PY'
      from pathlib import Path
      import sys

      watcher = Path(".chaplain/watcher2.sh").read_text()
      preflight = Path(".chaplain/lib/watcher/preflight.sh").read_text()

      preflight_guard_pos = watcher.find("if ! preflight; then")
      plan_pos = watcher.find("Step 1/4: Plan")
      checks = [
          ("watcher has explicit preflight guard", preflight_guard_pos != -1),
          ("watcher has plan step", plan_pos != -1),
          ("preflight guard runs before plan", preflight_guard_pos != -1 and plan_pos != -1 and preflight_guard_pos < plan_pos),
          ("preflight script includes core.hooksPath gate", "core.hooksPath" in preflight or "core.hookspath" in preflight.lower()),
      ]

      failed = [name for name, ok in checks if not ok]
      for name, ok in checks:
          print(("PASS" if ok else "FAIL") + ": " + name)

      if failed:
          sys.exit(1)
      PY
    description: Verify watcher2 still fail-closes at preflight boundary
    parse: text

  verify_readme_hook_docs:
    type: shell
    command: |
      echo "=== AC-09: README hook preflight contract ==="
      python - <<'PY'
      from pathlib import Path
      import sys

      content = Path(".chaplain/README.md").read_text()
      lower = content.lower()
      checks = [
          ("README documents core.hooksPath validation", "core.hookspath" in lower),
          ("README documents pre-commit executable requirement", "pre-commit" in lower and "executable" in lower),
          ("README documents commit-msg executable requirement", "commit-msg" in lower and "executable" in lower),
          ("README includes unset core.hooksPath remediation", "git config --local --unset core.hooksPath" in content),
      ]

      failed = [name for name, ok in checks if not ok]
      for name, ok in checks:
          print(("PASS" if ok else "FAIL") + ": " + name)

      if failed:
          sys.exit(1)
      PY
    description: Verify README documents enforced hook preflight gate
    parse: text

  summarize_demo:
    type: shell
    command: |
      echo "=== FR-288 DEMO SUMMARY ==="
      echo "PASS: preflight validates core.hooksPath and required executable hooks."
      echo "PASS: empty/non-default hooksPath fail closed."
      echo "PASS: missing or non-executable required hooks fail closed."
      echo "PASS: healthy .git/hooks pre-commit + commit-msg still pass preflight."
      echo "PASS: watcher2 keeps preflight guard before plan and blocks unsafe cycles."
      echo "PASS: .chaplain/README.md documents enforced contract and remediation."
    description: Print final demonstration summary
    parse: text

nodes:
  check_preflight_script_contract:
    type: tool
    tool: verify_preflight_script_contract
    state_key: preflight_script_contract

  check_runtime_hook_gate_matrix:
    type: tool
    tool: verify_runtime_hook_gate_matrix
    state_key: runtime_hook_gate_matrix

  check_watcher_preflight_flow:
    type: tool
    tool: verify_watcher_preflight_flow
    state_key: watcher_preflight_flow

  check_readme_docs:
    type: tool
    tool: verify_readme_hook_docs
    state_key: readme_hook_docs

  summary:
    type: tool
    tool: summarize_demo
    state_key: demo_summary

edges:
  - from: START
    to: check_preflight_script_contract
  - from: check_preflight_script_contract
    to: check_runtime_hook_gate_matrix
  - from: check_runtime_hook_gate_matrix
    to: check_watcher_preflight_flow
  - from: check_watcher_preflight_flow
    to: check_readme_docs
  - from: check_readme_docs
    to: summary
  - from: summary
    to: END
