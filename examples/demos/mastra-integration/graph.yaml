# Mastra Integration Demo — Per-Graph Typed MCP Tools
# Demonstrates how YAMLGraph graphs auto-generate typed MCP tools
# that any MCP client (Mastra, Copilot, Claude Desktop) can discover.

version: "1.0"
name: hello-mastra
description: Greeting generator exposed as a typed MCP tool for Mastra

prompts_relative: true
prompts_dir: prompts

defaults:
  temperature: 0.7

state:
  name: str
  style: str

nodes:
  greet:
    type: llm
    prompt: greet
    variables:
      name: "{state.name}"
      style: "{state.style}"
    state_key: greeting

edges:
  - from: START
    to: greet
  - from: greet
    to: END
