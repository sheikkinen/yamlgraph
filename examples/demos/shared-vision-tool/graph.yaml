version: "1.0"
name: shared-vision-tool-demo
description: Minimal demo for the shared image description tool.

state:
  image: str
  described: dict

tools:
  describe_image:
    manifest: ../../shared/describe_image.tool.yaml

nodes:
  describe:
    type: tool_call
    tool: describe_image
    args:
      image: "{state.image}"
      instruction: "Title, 2-sentence description, and 8 DeviantArt tags."
      provider: google
      model: gemini-3.5-flash
    state_key: described

edges:
  - from: START
    to: describe
  - from: describe
    to: END
