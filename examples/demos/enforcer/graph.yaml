version: "1.0"
name: fr-enforcer
description: "FR-462 — Standalone FR enforcer with task-shaped tools and structured implementation result"
prompts_relative: true
prompts_dir: prompts

state:
  fr_path: str
  implementation_result: dict

tools:
  read_file:
    manifest: ../../shared/toolbelt/read_file.tool.yaml

  search:
    manifest: ../../shared/toolbelt/search.tool.yaml

  list_dir:
    manifest: ../../shared/toolbelt/list_dir.tool.yaml

  git_log:
    manifest: ../../shared/toolbelt/git_log.tool.yaml

  git_diff:
    type: shell
    command: git diff {path}
    description: "Show unstaged changes for a file or all files (pass '.' for all)."
    parse: text

  lint:
    type: shell
    command: ruff check {file} 2>&1
    description: "Run ruff linter on a Python file to check for style and correctness issues."
    parse: text

  run_tests:
    type: shell
    command: pytest {test_file} -v --no-cov --tb=short 2>&1
    description: "Run a specific test file to verify implementation."
    parse: text

  write_file:
    type: python
    path: tools/write_file.py
    function: write_file
    description: "Write content to a file. Creates parent directories if needed. Rejects paths outside project root."

  edit_file:
    type: python
    path: tools/edit_file.py
    function: edit_file
    description: "Replace old_text with new_text in a file. old_text must appear exactly once. Use for surgical edits to existing files."

  run_command:
    type: python
    path: tools/run_command.py
    function: run_command
    description: "Run an arbitrary shell command. Use only when no other tool fits."

nodes:
  enforcer:
    type: agent
    prompt: enforcer
    temperature: 0.3
    tools: [read_file, search, list_dir, git_log, git_diff, lint, run_tests, write_file, edit_file, run_command]
    max_iterations: 25
    state_key: implementation_result

edges:
  - from: START
    to: enforcer
  - from: enforcer
    to: END
