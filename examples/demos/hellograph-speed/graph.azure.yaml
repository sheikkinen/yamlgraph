# HelloGraph Speed Demo - Azure AI Foundry
# Same hello graph as demo/hello, configured for provider=azure

version: "1.0"
name: hellograph-speed-azure
description: Hello graph configured for Azure AI Foundry speed checks

prompts_relative: true
prompts_dir: prompts

defaults:
  provider: azure
  model: aaa-gpt-5.4-mini
  temperature: 0.2

state:
  name: str
  style: str

nodes:
  greet:
    type: llm
    prompt: greet
    variables:
      name: "{state.name}"
      style: "{state.style}"
    state_key: greeting

edges:
  - from: START
    to: greet
  - from: greet
    to: END
