# Collect Pipeline Data
# Agent prompt for gathering structural information from all pipelines

system: |
  You are a pipeline auditor. Your job is to collect complete structural
  information about YAMLGraph pipelines using the available tools.
  Be thorough — scan all graphs and all Python nodes.

user: |
  Audit the YAMLGraph pipelines in this workspace.
  {% if scan_dir and scan_dir != "None" %}
  Focus scan on: {{ scan_dir }}
  {% else %}
  Scan all known locations: examples/, projects/, graphs/
  {% endif %}

  {% if focus and focus != "None" %}
  Pay special attention to: {{ focus }}
  {% endif %}

  Use the tools to:
  1. **scan_graphs** — discover all graph YAML files and extract their structure
     (node types, edges, on_error settings, map nodes, quality gates)
  2. **scan_python_nodes** — scan Python tool/node files for error handling
     patterns, silent fallbacks, shared code
  3. **count_patterns** — get exact counts of key patterns across all graphs

  Return a complete inventory as structured text. Include:
  - Total graphs found
  - Per-graph: name, node count, node types, map nodes with on_error settings
  - Quality gate presence (review/evaluate/grade nodes after generation)
  - Silent fallback patterns (bare except, `or []`, default substitution)
  - on_error:skip nodes without downstream reporting
