name: "Watcher2 Remediation Demo"
description: "Demonstrates enhanced watcher2 remediation with progressive ruff fixing"

prompts_relative: true
prompts_dir: prompts

state:
  topic: str
  generated_code: str
  remediation_result: str

nodes:
  generate_code:
    type: llm
    state_key: generated_code
    prompt: generate_code_with_sim117
    variables:
      topic: "{state.topic}"

  demonstrate_remediation:
    type: llm  
    state_key: remediation_result
    prompt: explain_remediation
    variables:
      generated_code: "{state.generated_code}"

edges:
  - from: START
    to: generate_code
  - from: generate_code
    to: demonstrate_remediation
  - from: demonstrate_remediation
    to: END