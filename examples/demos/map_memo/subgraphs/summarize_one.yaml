version: "1.0"
name: map-memo-summarize-one
description: Read one note and summarize it in one sentence.

prompts_relative: true
prompts_dir: ../prompts

defaults:
  provider: inception
  model: mercury-2.5

state:
  path: str
  note: dict
  summary: str

tools:
  read_note:
    type: python
    module: examples.demos.map_memo.tools
    function: read_note
    description: Read one note as UTF-8 text.

nodes:
  read_note:
    type: python
    tool: read_note
    state_key: note

  summarize:
    type: llm
    prompt: summarize_note
    on_error: fail
    state_key: summary
    variables:
      path: "{state.note.path}"
      text: "{state.note.text}"

edges:
  - from: START
    to: read_note
  - from: read_note
    to: summarize
  - from: summarize
    to: END
