version: "1.0"
name: person-profile-census
description: >
  GitHub authored-PR person profile census memoizes extract + classify per PR
  keyed by GitHub `updatedAt`; `memo_store` is required.

prompts_relative: true
prompts_dir: prompts

defaults:
  provider: azure
  temperature: 0.0

config:
  max_map_items: 500
  max_concurrency: 4

state:
  source: str
  visibility: str
  rubric: str
  problem_labels: str
  surface_labels: str
  azure_model: str
  output_path: str
  brief_path: str
  brief_rubric: str
  canary: dict
  run_metadata: dict
  preflight_ok: bool
  memo_store: str
  memo_inputs: dict
  memo_query: dict
  memo_prepared: dict
  items:
    type: list
  versions: dict
  memo: dict
  executed_contents:
    type: list
    reducer: sorted_add
  executed_findings:
    type: list
    reducer: sorted_add
  paired:
    type: list
  merged: dict
  ledger: dict
  brief_input:
    type: list
  claims: dict
  brief: dict

tools:
  preflight:
    slot: true
    contract:
      runtimes: [python]
  discover:
    slot: true
    contract:
      runtimes: [python]
      args: [source]
  versions:
    slot: true
    contract:
      runtimes: [python]
  extract:
    slot: true
    contract:
      runtimes: [python]
      args: [item]
  map_memo_split:
    manifest: ../../shared/map_memo_split.tool.yaml
  map_memo_merge:
    manifest: ../../shared/map_memo_merge.tool.yaml
  memo_prepare:
    type: python
    path: tools.py
    function: memo_prepare
    description: "Prepare census memo inputs and require memo_store."
  pair:
    type: python
    path: tools.py
    function: pair_executed
    description: "Join executed PR bundles with judge outcomes by map index."
  reduce_ledger:
    type: python
    path: tools.py
    function: reduce_pr_ledger
    description: "Validate authored-PR findings and write markdown plus JSONL ledger artifacts."
  prepare_brief_input:
    type: python
    path: tools.py
    function: prepare_brief_input
    description: "Load the reduced PR ledger JSONL and build bounded URL-bearing synthesis input."
  render_brief:
    type: python
    path: tools.py
    function: render_brief
    description: "Validate synthesized PR URL citations and render the person profile brief artifact."

nodes:
  preflight:
    type: python
    tool: preflight
    state_key: preflight_ok
    on_error: fail

  memo_prepare:
    type: python
    tool: memo_prepare
    state_key: memo_prepared
    on_error: fail

  discover:
    type: python
    tool: discover
    variables:
      source: "{state.source}"
    state_key: items
    on_error: fail

  versions:
    type: tool_call
    tool: versions
    args:
      state: "{state.memo_query}"
    state_key: versions
    on_error: fail

  memo_split:
    type: tool_call
    tool: map_memo_split
    on_error: fail
    state_key: memo
    args:
      items: "{state.items}"
      versions: "{state.versions.result}"
      store: "{state.memo_store}"
      inputs: "{state.memo_inputs}"
      signature_files:
        - examples/demos/person_profile_census/graph.yaml
        - examples/demos/person_profile_census/prompts/classify_pr.yaml
        - examples/demos/person_profile_census/tools.py
        - examples/demos/corpus_census/adapters/corpus_adapters.py

  extract_items:
    type: map
    over: "{state.memo.result.todo}"
    as: item
    max_items: 500
    node:
      type: python
      tool: extract
      state_key: content
      on_error: fail
    collect: executed_contents

  judge_items:
    type: map
    over: "{state.executed_contents}"
    as: judged_content
    max_items: 500
    node:
      type: llm
      prompt: classify_pr
      provider: azure
      model: "{state.azure_model}"
      temperature: 0
      state_key: finding
      on_error: skip
      variables:
        rubric: "{state.rubric}"
        evidence_bundle: "{state.judged_content.value}"
        source_index: "{state.judged_content._map_index}"
        problem_labels: "{state.problem_labels}"
        surface_labels: "{state.surface_labels}"
    collect: executed_findings

  pair:
    type: python
    tool: pair
    state_key: paired
    on_error: fail

  memo_merge:
    type: tool_call
    tool: map_memo_merge
    on_error: fail
    state_key: merged
    args:
      plan: "{state.memo.result}"
      results: "{state.paired}"
      # Judge failures are stored inside `paired` as `error` records so a
      # re-run reuses them as row_failed; the reducer's coverage floor remains
      # the threshold.
      failures: []
      map_name: judge_items
      map_dispatch: "{state._map_verdict.judge_items.dispatch}"
      min_success: 0

  reduce_ledger:
    type: python
    tool: reduce_ledger
    state_key: ledger

  prepare_brief_input:
    type: python
    tool: prepare_brief_input
    state_key: brief_input

  synthesize:
    type: llm
    prompt: synthesize_person_brief
    provider: azure
    model: "{state.azure_model}"
    temperature: 0
    state_key: claims
    variables:
      rubric: "{state.brief_rubric}"
      rows: "{state.brief_input}"

  render_brief:
    type: python
    tool: render_brief
    state_key: brief

edges:
  - from: START
    to: preflight
  - from: preflight
    to: memo_prepare
  - from: memo_prepare
    to: discover
  - from: discover
    to: versions
  - from: versions
    to: memo_split
  - from: memo_split
    to: extract_items
  - from: extract_items
    to: judge_items
  - from: judge_items
    to: pair
  - from: pair
    to: memo_merge
  - from: memo_merge
    to: reduce_ledger
  - from: reduce_ledger
    to: prepare_brief_input
  - from: prepare_brief_input
    to: synthesize
  - from: synthesize
    to: render_brief
  - from: render_brief
    to: END
