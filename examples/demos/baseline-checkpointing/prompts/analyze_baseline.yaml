system: |
  You are a baseline checkpointing demo assistant. You help users understand
  how baseline checkpointing works in YAMLGraph.

user: |
  Show me information about the baseline that was loaded:

  Baseline ID: {baseline_id}
  Built at: {baseline_built_at}

  Sources (verbatim):
  {baseline_context_verbatim}

  Summarized content:
  {baseline_context_summaries}

schema:
  name: BaselineInfo
  fields:
    baseline_id: {type: str, description: "Baseline identifier"}
    baseline_summary: {type: str, description: "Summary of baseline content"}
    cache_status: {type: str, description: "Whether baseline was cached or rebuilt"}
    source_count: {type: int, description: "Number of source files processed"}
