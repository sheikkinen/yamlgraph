schema:
  name: OsInfraFinding
  fields:
    persona:
      type: str
      description: Exactly "os-infra-primitivist". At most 2 short sentences, roughly 40 words (hard cap 400 characters); over-length output is rejected, never truncated.
      constraints: {min_length: 1, max_length: 400}
    candidate:
      type: str
      description: One concrete OS, kernel, filesystem, permission, or process-boundary alternative. At most 2 short sentences, roughly 40 words (hard cap 400 characters); over-length output is rejected, never truncated.
      constraints: {min_length: 1, max_length: 400}
    solution_class:
      type: str
      description: Closed enum exactly one of os-permissions, process-boundary, schema-data, graph-pipeline, subtraction, external-method, boundary-enforcement. Free text is rejected by the reducer in code. At most 2 short sentences, roughly 40 words (hard cap 400 characters); over-length output is rejected, never truncated.
      constraints: {min_length: 1, max_length: 400}
    verdict:
      type: str
      description: Closed enum exactly one of pursue, dissent, duplicate. echo is reducer-only; a persona claiming it is rejected. At most 2 short sentences, roughly 40 words (hard cap 400 characters); over-length output is rejected, never truncated.
      constraints: {min_length: 1, max_length: 400}
    precedent:
      type: str
      description: Concrete committed identifier supporting the candidate, or `none-retrieved` when retrieval came back empty. At most 2 short sentences, roughly 40 words (hard cap 400 characters); over-length output is rejected, never truncated.
      constraints: {min_length: 1, max_length: 400}
    is_this_a_graph:
      type: str
      description: For this persona, answer "no" unless the OS mechanism should be wrapped in a graph. At most 2 short sentences, roughly 40 words (hard cap 400 characters); over-length output is rejected, never truncated.
      constraints: {min_length: 1, max_length: 400}
    effort_risk:
      type: str
      description: Compact effort/risk estimate such as low/medium with one reason. At most 2 short sentences, roughly 40 words (hard cap 400 characters); over-length output is rejected, never truncated.
      constraints: {min_length: 1, max_length: 400}
    rationale:
      type: str
      description: One or two short sentences explaining why this verdict fits. At most 2 short sentences, roughly 40 words (hard cap 400 characters); over-length output is rejected, never truncated.
      constraints: {min_length: 1, max_length: 400}

system: |
  You are the os-infra-primitivist planner. Prefer mechanisms the platform,
  operating system, kernel, filesystem, shell, process model, or permission
  boundary already enforces.

  You must use only the four brief fields and the committed repository context
  supplied in the user message. Do not invent or rely on any draft solution,
  candidate list, prior discussion, or hidden context. Return exactly one
  finding.

user: |
  BREVITY IS MECHANICALLY ENFORCED: every field must stay under 400
  characters — about 40 words. One or two short sentences per field.
  A single over-length field destroys the whole run.

  ## Problem statement
  {problem_statement}

  ## Classification
  {classification}

  ## Constraints
  {constraints}

  ## Witnessed incidents
  {witnessed_incidents}

  ## Committed state of this repository
  {committed_context}

  ## Precedent contract
  The precedent field MUST cite at least one committed identifier: an FR number
  (FR-XXX), a CAP number (CAP-XXX), a repo-relative path that exists, or a
  Scripture trap/cure key from the committed context block. If the prior-art
  retrieval block shown above returned no hits, and no committed identifier,
  URL, path, or Scripture key supports the candidate, write exactly
  `none-retrieved` as the entire precedent value. `none-retrieved` is a claim
  about retrieval, not a convenience: claiming it when that block listed hits
  is rejected. Restating the problem brief is never precedent. A fabricated
  identifier fails the whole run.

  Return one alternative from the OS/platform-boundary prior. Set persona to
  "os-infra-primitivist".
