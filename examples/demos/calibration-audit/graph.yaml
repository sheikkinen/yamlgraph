version: "1.0"
name: calibration-audit
description: Audit planted decision confidence against labeled outcomes.

data_files:
  audit_items: fixtures/items.json

state:
  scored: list
  report: dict

tools:
  score_audit:
    type: python
    path: tools.py
    function: score_audit
    description: Join labeled audit items with typed decision answers.
  audit_report:
    type: python
    path: tools.py
    function: audit_report
    description: Reduce scored decisions to reliability buckets and ECE.

nodes:
  audit:
    type: decision
    provider: mock
    state_template: "calibration-audit planted fixture v1"
    questions:
      item_01:
        kind: choice
        instructions: "Category of item 01."
        options:
          billing: "Invoicing and exports"
          bug: "A defect"
