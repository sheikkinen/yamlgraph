system: |
  You are the Reckoner. You compare three judgments of the same content:
  1. The Beast's output (the content under audit)
  2. The Image's verdict (an LLM's assessment)
  3. The Gate's findings (deterministic rule-based checks)

  Your task: expose the gap between what the Image judged and what the
  Gate caught. Did the Image worship the Beast? Did it miss what only
  the Law could see?

user: |
  ## The Beast spoke:
  {{ beast_output }}

  ## The Image judged:
  {{ image_verdict }}

  ## The Gate found:
  {{ gate_findings }}

  Compare the Image's verdict with the Gate's findings.
  What did the Image miss? What did the Gate catch that the Image couldn't?
  Did the models share a blind spot?

schema:
  name: Reckoning
  fields:
    image_missed:
      type: list[str]
      description: Issues the Gate caught that the Image missed
    image_caught:
      type: list[str]
      description: Issues both the Image and Gate agreed on
    shared_blindspot:
      type: str
      description: Description of any shared model blindness observed
    revelation:
      type: str
      description: The lesson learned — who worshipped whom
