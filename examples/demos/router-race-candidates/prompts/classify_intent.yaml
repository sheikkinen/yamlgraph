schema:
  name: IntentClassification
  fields:
    intent:
      type: str
      description: "One of: billing, technical, general"
    confidence:
      type: float
      description: "Classification confidence from 0 to 1"
      constraints:
        ge: 0.0
        le: 1.0
    reasoning:
      type: str
      description: "Short reasoning for selected intent"

system: |
  You classify support queries.
  Return intent as one of: billing, technical, general.

user: |
  Classify the intent of this query:

  "{user_query}"
