version: "1.0"
name: recap
description: Timeframe change recap for any git repository — deterministic git collection, one synthesis judgement
prompts_relative: true
prompts_dir: prompts

state:
  since: str        # e.g. "1 week ago", "yesterday", "2026-07-01"
  repo_path: str    # path to any git repository, e.g. "."
  referenced: str   # FR-702: partition pre-pass output (commits with refs)
  unreferenced: str # FR-702: partition pre-pass output (orphan candidates)

tools:
  commits_since:
    type: shell
    command: git -C {repo_path} log --since={since} -n 300 --pretty=format:'%h|%ad|%s' --date=short
    description: "Commits in the window, capped at 300 (F5)."
    parse: text

  file_churn:
    type: shell
    command: git -C {repo_path} log --since={since} -n 300 --numstat --pretty=format:'%h'
    description: "Per-file added/removed lines per commit in the window."
    parse: text

  changed_frs:
    type: shell
    command: "git -C {repo_path} log --since={since} --name-only --pretty=format: -- feature-requests/"
    description: "Feature-request files touched in the window (empty if convention absent)."
    parse: text

  new_changelog_fragments:
    type: shell
    command: "git -C {repo_path} log --since={since} --diff-filter=A --name-only --pretty=format: -- changelog/unreleased/"
    description: "Changelog fragments added in the window (empty if convention absent)."
    parse: text

  fr_statuses:
    type: shell
    command: "git -C {repo_path} grep -H -m 1 -e '^\\*\\*Status' HEAD -- 'feature-requests/*.md' || [ $? -eq 1 ]"
    description: "Verbatim FR Status lines at HEAD (FR-702). Exit 1 (no matches / no convention) is normalized to success at the boundary; exit >=2 (not a repo) fails loudly."
    parse: text

  partition_commits:
    type: python
    module: examples.demos.recap.nodes.partition
    function: partition_commits
    description: "Deterministic reference partition (FR-702): commits with (FR|NC)-N or #N anywhere in the subject -> referenced; rest -> unreferenced."

  attach_statuses_fn:
    type: python
    module: examples.demos.recap.nodes.partition
    function: attach_statuses
    description: "Deterministic status join (FR-703): appends verbatim [Status: ...] tags to workstream lines from the fr_statuses map; the model never joins."

nodes:
  get_commits:
    type: tool
    tool: commits_since
    state_key: commits
    variables:
      repo_path: "{state.repo_path}"
      since: "{state.since}"

  get_churn:
    type: tool
    tool: file_churn
    state_key: churn
    variables:
      repo_path: "{state.repo_path}"
      since: "{state.since}"

  get_frs:
    type: tool
    tool: changed_frs
    state_key: fr_changes
    variables:
      repo_path: "{state.repo_path}"
      since: "{state.since}"

  get_fragments:
    type: tool
    tool: new_changelog_fragments
    state_key: fragments
    variables:
      repo_path: "{state.repo_path}"
      since: "{state.since}"

  get_fr_statuses:
    type: tool
    tool: fr_statuses
    state_key: fr_statuses
    variables:
      repo_path: "{state.repo_path}"

  partition:
    type: python
    tool: partition_commits
    requires: [commits]

  synthesize:
    type: llm
    prompt: recap
    requires: [commits, churn, fr_changes, fragments, unreferenced]
    state_key: recap
    variables:
      commits: "{state.commits}"
      churn: "{state.churn}"
      fr_changes: "{state.fr_changes}"
      fragments: "{state.fragments}"
      referenced: "{state.referenced}"
      unreferenced: "{state.unreferenced}"

  attach_statuses:
    type: python
    tool: attach_statuses_fn
    requires: [recap, fr_statuses]

edges:
  - from: START
    to: get_commits
  - from: get_commits
    to: get_churn
  - from: get_churn
    to: get_frs
  - from: get_frs
    to: get_fragments
  - from: get_fragments
    to: get_fr_statuses
  - from: get_fr_statuses
    to: partition
  - from: partition
    to: synthesize
  - from: synthesize
    to: attach_statuses
  - from: attach_statuses
    to: END
