# Timeframe Recap Prompt (FR-700)
# ONE judgement: group the collected change inventory into workstreams and
# flag orphans. All mechanizable work (partitioning, truncation detection,
# convention detection inputs) is done by Jinja2 below, not by the model.

schema:
  name: Recap
  fields:
    workstreams:
      type: list[str]
      description: "One line per workstream: '<FR-ref or theme>: <summary> (commits: N) [Status: <verbatim status from input>]' — or '[no FR status]' when the input has no status line for that FR."
    orphans:
      type: list[str]
      description: "Copy of the UNREFERENCED commit lines, plus graph/prompt file changes with no changelog fragment. Empty list if none. Quote hashes verbatim."
    hotspots:
      type: list[str]
      description: "File paths touched by more than one workstream. Empty list if none."
      default: []

system: |
  You summarize git change inventories. You group commits into workstreams
  and report orphan changes. Rules:
  - Use ONLY the commits, file paths, and status lines given in the input.
    Never invent commit hashes, FR references, file paths, or statuses.
  - A commit belongs to a workstream if its subject shares an FR/issue
    reference (FR-123, NC-123, #123) or an obvious common theme.
  - Disposition: if the FR STATUSES input contains a status line for a
    workstream's FR id, append it VERBATIM as '[Status: ...]'. Do NOT
    infer, normalize, or translate statuses — copy the given text. If no
    status line matches, append '[no FR status]'.
  - The commit list is pre-partitioned by code: REFERENCED commits carry
    a reference; UNREFERENCED commits do not. Your orphans list is the
    UNREFERENCED lines copied verbatim, plus any graph/prompt YAML change
    with no matching changelog fragment. Never move a REFERENCED commit
    into orphans.
  - If the convention sections say none were detected, do NOT report
    convention-based orphans — report only the UNREFERENCED lines.
  - Do not editorialize, rank, or recommend. Inventory and grouping only.

user: |
  Recap the changes in this repository for the requested window.

  ## Commits ({{ commits.split('\n') | length }} shown)
  {% if commits.split('\n') | length >= 300 %}
  NOTE: commit list capped at 300 — the window is TRUNCATED; say so in a workstream line.
  {% endif %}

  ### REFERENCED (carry an FR/NC/issue reference — partitioned by code, never orphans)
  {{ referenced }}

  ### UNREFERENCED (no reference — copy these verbatim into orphans)
  {{ unreferenced }}

  ## FR STATUSES (verbatim, at HEAD)
  {% if fr_statuses.strip() %}
  {{ fr_statuses }}
  {% else %}
  (No FR status lines detected — tag every workstream '[no FR status]'.)
  {% endif %}

  {% set churn_lines = churn.split('\n') %}
  ## Code changes (.py — added/removed/path)
  {% for line in churn_lines if line.endswith('.py') %}
  {{ line }}
  {% endfor %}

  ## Graph/prompt YAML changes (added/removed/path)
  {% for line in churn_lines if line.endswith('.yaml') and ('graphs/' in line or 'prompts/' in line) %}
  {{ line }}
  {% endfor %}

  ## Other file changes (added/removed/path)
  {% for line in churn_lines if '\t' in line and not line.endswith('.py') and not (line.endswith('.yaml') and ('graphs/' in line or 'prompts/' in line)) %}
  {{ line }}
  {% endfor %}

  ## Conventions
  {% if fr_changes.strip() %}
  Feature-request files changed:
  {{ fr_changes }}
  {% else %}
  (No feature-request convention detected.)
  {% endif %}
  {% if fragments.strip() %}
  Changelog fragments added:
  {{ fragments }}
  {% else %}
  (No changelog-fragment convention detected.)
  {% endif %}
