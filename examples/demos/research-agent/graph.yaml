version: "1.0"
name: research-agent
description: >
  5-step agentic research: extract intent, plan approach,
  execute research with tools, validate findings, synthesize report.

prompts_relative: true
prompts_dir: prompts

state:
  query: str
  scope: str

variables:
  query:
    description: Research question to investigate
    example: "How does the agent node type work?"
  scope:
    description: Directory scope for research
    default: yamlgraph/

tools:
  read_file:
    manifest: ../../shared/toolbelt/read_file.tool.yaml
  search:
    manifest: ../../shared/toolbelt/search.tool.yaml
  list_dir:
    manifest: ../../shared/toolbelt/list_dir.tool.yaml
  git_log:
    manifest: ../../shared/toolbelt/git_log.tool.yaml
  count_lines:
    type: shell
    command: wc -l {file}
    description: Count lines in a file

nodes:
  extract_intent:
    type: llm
    prompt: extract_intent
    state_key: intent
    variables:
      query: "{state.query}"

  plan_research:
    type: agent
    prompt: plan_research
    tools: [search, list_dir]
    max_iterations: 5
    state_key: plan
    requires: [intent]
    variables:
      intent: "{state.intent}"
      scope: "{state.scope}"

  execute_research:
    type: agent
    prompt: execute_research
    tools: [search, list_dir, read_file, count_lines, git_log]
    max_iterations: 10
    state_key: findings
    tool_results_key: _research_tools
    requires: [plan]
    variables:
      plan: "{state.plan}"
      scope: "{state.scope}"

  validate_findings:
    type: llm
    prompt: validate_findings
    state_key: validation
    requires: [intent, findings]
    variables:
      intent: "{state.intent}"
      findings: "{state.findings}"

  synthesize_report:
    type: llm
    prompt: synthesize_report
    state_key: report
    requires: [intent, findings, validation]
    variables:
      query: "{state.query}"
      intent: "{state.intent}"
      findings: "{state.findings}"
      validation: "{state.validation}"

edges:
  - from: START
    to: extract_intent
  - from: extract_intent
    to: plan_research
  - from: plan_research
    to: execute_research
  - from: execute_research
    to: validate_findings
  - from: validate_findings
    to: END
    condition: "validation.confidence == 'low' or findings == ''"
  - from: validate_findings
    to: synthesize_report
    condition: "validation.confidence != 'low' and findings != ''"
  - from: synthesize_report
    to: END
