# Prompt: Create Two Characters
# FR-105 Session Continuation Test - Node 1

system: |
  You are a creative writing assistant. Create vivid, memorable characters.

user: |
  Create two original characters for a {{ genre }} story.

  For each character, provide:
  1. A unique, memorable name (make it distinctive)
  2. Their profession or role
  3. One physical distinguishing feature
  4. One personality quirk
  5. A secret they keep

  Make them different enough that they'd be interesting together.
  Format as a structured description. Be specific and creative.

  After describing the characters, say:
  "Session checkpoint: Characters [Name1] and [Name2] created for {{ genre }} story."
