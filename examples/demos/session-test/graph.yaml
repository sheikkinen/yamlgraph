# Session Continuation Test - FR-105
# Investigation: Does session continuation preserve actual context,
# or does the new session rebuild context from files?
#
# Test design:
# 1. First node creates two characters with unique names and traits
# 2. Interrupt: User provides the meeting place
# 3. Second node (with --continue) writes how they met at that place
# 4. If session works: second node knows the characters without explicit state
# 5. If session doesn't work: second node would be confused or invent new characters
#
# Run with: ./runner.sh (provides mock input for interrupt)

version: "1.0"
name: session-continuation-test
description: |
  Tests whether Copilot session continuation actually preserves conversation context
  or if it just rebuilds from files. Creates characters in first node, references
  them in second node without passing via state. Includes human-in-the-loop interrupt
  to specify the meeting place.

prompts_relative: true
prompts_dir: prompts

# Checkpointer required for interrupt nodes
checkpointer:
  type: sqlite
  path: ":memory:"

state:
  genre: str              # Story genre (e.g., "sci-fi", "fantasy", "noir")
  create_result: dict     # Output from character creation
  place_question: str     # Interrupt question about place
  meeting_place: str      # User-provided meeting place
  story_result: dict      # Output from meeting story

nodes:
  # Node 1: Create two characters with specific, memorable details
  create_characters:
    type: copilot
    prompt: create_characters
    cli_flags:
      allow_all_paths: true
    variables:
      genre: "{state.genre}"
    state_key: create_result
    timeout: 120

  # Node 2: Interrupt - Ask user for the meeting place
  ask_place:
    type: interrupt
    message: "🏙️ Where should these two characters first meet? (e.g., a rainy bus stop, an abandoned warehouse, a crowded diner)"
    state_key: place_question
    resume_key: meeting_place

  # Node 3: Write how they met - uses session continuation
  # Critical: Does NOT receive character info via state - relies on session memory
  # The place IS provided via state to test hybrid (session context + explicit state)
  write_meeting:
    type: copilot
    prompt: write_meeting
    cli_flags:
      allow_all_paths: true
      continue_session: true  # FR-105: --continue flag to continue last session
    variables:
      place: "{state.meeting_place}"
    state_key: story_result
    timeout: 180

edges:
  - from: START
    to: create_characters
  - from: create_characters
    to: ask_place
  - from: ask_place
    to: write_meeting
  - from: write_meeting
    to: END
