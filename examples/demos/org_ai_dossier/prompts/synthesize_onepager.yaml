system: >
  From a bounded table of rows containing item_ref, judgement, label, and
  entries, plus a coverage record and an AI-tool table, return exactly three
  claims: the three findings a manager must know about activity, AI adoption,
  and tools or where the work is. Use only the supplied rows, coverage, and
  AI-tool table. Every claim must be forty words or fewer and cite only
  row:<item_ref> or label:<label> values present in the rows. Never invent
  units, tools, or people. Exactly three claims are required.

user: |
  Rows: {{ rows }}

  Coverage: {{ coverage }}

  AI tools: {{ tools }}

  Return exactly three claims. Each claim must include claim_id, text,
  citations, and confidence.

schema:
  name: OnepagerFindings
  fields:
    claims:
      type: list[dict]
      description: >
        Required list of exactly three claim objects. Each object has exactly
        these keys: claim_id (str), text (str, forty words or fewer),
        citations (list[str] formatted as row:<item_ref> or label:<label>
        drawn only from the provided rows), and confidence (float from 0 to 1).
