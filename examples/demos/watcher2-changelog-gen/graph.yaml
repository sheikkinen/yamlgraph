version: "1.0"
name: watcher2-changelog-gen-demo
description: Demo of FR-283 automatic changelog fragment generation
prompts_relative: true
prompts_dir: prompts

tools:
  demo_logic:
    type: python
    module: examples.demos.watcher2-changelog-gen.nodes.demo_logic
    function: demo_fr283_logic
    description: "Simulate FR-283 changelog fragment generation logic"

state:
  fr_path: str
  demo_output: str
  result: dict

edges:
  - from: START
    to: demo_fr283_logic
  - from: demo_fr283_logic
    to: show_summary
  - from: show_summary
    to: END

nodes:
  demo_fr283_logic:
    type: python
    tool: demo_logic
    state_key: demo_output

  show_summary:
    type: llm
    prompt: demo_summary
    state_key: result