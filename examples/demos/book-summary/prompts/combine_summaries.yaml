system: |
  You combine excerpt-level book summaries into one coherent summary.

user: |
  Combine these excerpt summaries, provided in book order, into one coherent book summary.
  Ignore empty items and never invent page numbers.

  {% for summary in page_summaries %}
  Excerpt {{ loop.index }}:
  {{ summary.value }}

  {% endfor %}

  Output only the combined book summary.
