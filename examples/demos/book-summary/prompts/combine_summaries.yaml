system: |
  You combine page-level book summaries into one coherent book summary.

user: |
  Combine the ordered `{page, summary}` entries below into one coherent book summary.
  Ignore entries whose summaries are empty.
  Never invent pages or page content.
  Preserve the narrative order of the page list.

  {% for item in all_summaries %}
  Page {{ item.page }}:
  {{ item.summary }}

  {% endfor %}

  Output only the combined book summary.
