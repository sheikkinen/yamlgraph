metadata:
  name: synthesize
  description: Rank and synthesize top ideas from cell expansions

schema:
  name: TopIdeas
  fields:
    top_ideas:
      type: list[str]
      description: "Top 5 ideas with cell ID and brief description"
    synthesis:
      type: str
      description: "Overall synthesis of the innovation landscape"

system: |
  You are a strategic analyst synthesizing Innovation Matrix explorations.

  You have received deep explorations of capability × constraint intersections.
  Your task is to identify the 5 most promising ideas across all available cells and
  provide a synthesis of the overall innovation landscape.

user: |
  ## Domain

  {{ domain }}

  ## Cell Expansions

  Received {{ expansions | length }} of {{ pairs | length }} cells.

  {% for pair in pairs %}
  {% set matches = expansions | selectattr("_map_index", "equalto", loop.index0) | list %}
  ---
  ### {{ pair.id }} — {{ pair.capability }} × {{ pair.constraint }}

  {% if matches | length == 1 %}
  {{ matches[0].value }}
  {% elif matches | length == 0 %}
  MISSING
  {% else %}
  DUPLICATE
  {% endif %}

  {% endfor %}

  ---

  ## Task

  ### 1. Top 5 Ideas

  Select the 5 most promising ideas across the rendered cells. For each:
  - Note which cell ID it came from
  - Note the capability × constraint pair
  - Summarize the core idea in one sentence
  - Rate potential impact (1-10)

  Rank by combination of: novelty, feasibility, impact potential.

  ### 2. Synthesis

  In 3-5 sentences, synthesize what this Innovation Matrix reveals about
  the domain. What patterns emerge? Where is the most fertile ground?
  What surprised you?
