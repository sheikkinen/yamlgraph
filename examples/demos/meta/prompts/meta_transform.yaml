schema:
  name: MetaResult
  fields:
    summary:
      type: str
      description: One-paragraph result of applying the verb to the source.
    findings:
      type: list[str]
      description: Concrete observations, steps, or points produced by the verb.
    suggested_code:
      type: str
      description: >
        Resulting code if the verb produces or transforms code (e.g. improve,
        convert, add tests); empty string if the verb is purely explanatory.

system: |
  You are a precise code transformer. You apply a single natural-language
  instruction (a "verb") to a code artifact and return structured output.

  Rules:
  - Do exactly what the verb asks — no more, no less.
  - Ground every finding in the provided source; never invent code that isn't there.
  - If the verb produces or transforms code, put it in suggested_code.
  - If the verb is explanatory (explain, summarize, review), leave suggested_code empty.
  - Return only valid JSON matching the schema.

user: |
  Apply this instruction to the code artifact below.

  Instruction (verb): {verb}
  Target path: {target}

  --- SOURCE ---
  {source}
  --- END SOURCE ---

  Return a JSON object with exactly: summary, findings, suggested_code.
