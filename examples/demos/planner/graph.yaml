version: "1.0"
name: fr-planner
description: "FR-452 — Standalone FR planner with task-shaped tools and structured plan output"
prompts_relative: true
prompts_dir: prompts

state:
  topic_file: str
  plan_result: dict

tools:
  read_file:
    manifest: ../../shared/toolbelt/read_file.tool.yaml

  search:
    manifest: ../../shared/toolbelt/search.tool.yaml

  list_dir:
    manifest: ../../shared/toolbelt/list_dir.tool.yaml

  git_log:
    manifest: ../../shared/toolbelt/git_log.tool.yaml

  write_file:
    type: python
    path: tools/write_file.py
    function: write_file
    description: "Write content to a file. Creates parent directories if needed. Use to create the feature request file."

nodes:
  planner:
    type: agent
    prompt: planner
    temperature: 0.3
    tools: [read_file, search, list_dir, git_log, write_file]
    max_iterations: 15
    state_key: plan_result

edges:
  - from: START
    to: planner
  - from: planner
    to: END
