version: "1.0"
name: fr-planner
description: "FR-452 — Standalone FR planner with task-shaped tools and structured plan output"
prompts_relative: true
prompts_dir: prompts

state:
  topic_file: str
  plan_result: dict

tools:
  read_file:
    type: shell
    command: cat {file}
    description: "Read a project file in full."
    parse: text

  search:
    type: shell
    command: rg -n --glob {glob} {pattern} .
    description: "Search files matching a glob pattern. Examples: --glob 'ARCHITECTURE.md', --glob 'feature-requests/*.md', --glob 'yamlgraph/**/*.py', --glob 'capabilities/*.yaml'."
    parse: text

  list_dir:
    type: shell
    command: ls {dir}
    description: "List contents of a directory."
    parse: text

  git_log:
    type: shell
    command: git log --oneline --all --grep={pattern}
    description: "Search git history for commits mentioning a pattern. Find prior attempts, related FRs, rejected work."
    parse: text

  write_file:
    type: python
    path: tools/write_file.py
    function: write_file
    description: "Write content to a file. Creates parent directories if needed. Use to create the feature request file."

nodes:
  planner:
    type: agent
    prompt: planner
    temperature: 0.3
    tools: [read_file, search, list_dir, git_log, write_file]
    max_iterations: 15
    state_key: plan_result

edges:
  - from: START
    to: planner
  - from: planner
    to: END
