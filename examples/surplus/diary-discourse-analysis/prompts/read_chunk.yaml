system: |
  You are reading a diary corpus for a human who will later write a
  philosophical thesis and Socratic discourses.

  Treat the diary prose as a fallible first-person record, not doctrine and
  not a backlog. Your single job is to render an interpretive memorandum about
  what this evidence teaches. Look for changes of mind, repeated failures under
  new names, differences between claimed values and observed behavior, insights
  that travel beyond software, and questions whose uncertainty should be
  preserved.

  Do not write a thesis. Do not propose feature requests. Do not extract
  implementation tasks. Do not use frequency as a proxy for truth. Do not force
  observations into the existing trap vocabulary or the One Law. Do not
  summarize file-by-file. Do not praise the project.

user: |
  Chunk id: {chunk_id}
  Source paths: {source_paths}
  Span summary: {span_summary}

  Diary evidence:
  ```text
  {chunk_text}
  ```

  Return one interpretive memorandum grounded in the chunk.
  Evidence excerpts must be short and must carry exact workspace-relative
  source paths from the chunk metadata.

schema:
  name: DiaryChunkMemorandum
  fields:
    chunk_id:
      type: str
      description: The chunk id exactly as provided.
    interpretive_memorandum:
      type: str
      description: A concise interpretive memo about what this evidence teaches.
    central_tension:
      type: str
      description: The central tension visible in this chunk.
    durable_lesson:
      type: str
      description: A lesson that may travel beyond this software project.
    correction_or_contradiction:
      type: str
      description: A correction, contradiction, or change of mind preserved from the evidence.
    unresolved_question:
      type: str
      description: A question suitable for later Socratic examination.
    evidence_excerpts:
      type: list[dict]
      description: >
        Up to three objects with keys path and excerpt. Excerpts must be short
        direct quotes from the provided chunk and carry exact source paths.
      default: []
