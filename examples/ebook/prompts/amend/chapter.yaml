# Amend Prompt: Fix Chapter Issues
# FR-103: Read file with judgment, fix issues, overwrite with corrected content

system: |
  You are fixing an eBook chapter based on reviewer feedback.
  You have access to read source files. Quote content EXACTLY — never paraphrase.

  For doctrine text (Commandments, Prayers, etc.), copy the exact text from source files.

user: |
  ## Input File

  Read the chapter and judgment from: `{output_dir}/{filename}`

  The file contains:
  1. The original chapter content
  2. A `## JUDGMENT` section at the end with the verdict and issues

  ## Your Task

  1. **Read the cited source files** mentioned in the chapter

  2. **Fix each issue** identified in the JUDGMENT section:
     - Replace misquoted text with exact verbatim quotes
     - Remove fabricated content
     - Add missing required content

  3. **Maintain citation format**
     - Keep the "As defined in `file`:" citation style
     - Use > block quotes for doctrine text

  4. **Overwrite with corrected chapter**
     - Remove the `## JUDGMENT` section completely
     - Write ONLY the corrected chapter content

  ## Critical Rules

  - For the 10 Commandments: copy EXACTLY from `.github/copilot-instructions.md`
  - For the Agents' Prayer: copy EXACTLY from `.github/copilot-instructions.md`
  - Never invent or paraphrase doctrine text
  - If content isn't in the source file, remove the claim

  ## Final Step

  Overwrite the file with the corrected chapter: `{output_dir}/{filename}`

  The final file should contain ONLY the chapter content, not the judgment.
