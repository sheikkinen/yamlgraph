  - What drift looks like when detected
  - The correction flow back through the traceability chain

  Include a real diary entry example showing a verification run.

  ### 8. Why This Matters

  The closed loop prevents:
  - Untested features (requirements without tests)
  - Orphan tests (tests proving nothing)
  - Doctrine drift (scripture disconnected from code)
  - Commit chaos (features without traceability)

