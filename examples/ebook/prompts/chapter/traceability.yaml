  ## Chapter Requirements

  Write "Chapter 06: Requirement Traceability Matrix" covering:

  ### 1. The Vision: Living Documentation

  Requirements that live in code, not PDFs. How YAMLGraph creates a closed loop:
  - Scripture (`.github/copilot-instructions.md`) defines doctrine
  - ARCHITECTURE.md translates doctrine into numbered requirements (REQ-YG-XXX)
  - Tests prove requirements via `@pytest.mark.req("REQ-YG-XXX")`
  - Pre-commit hooks enforce coverage
  - LLM agents verify and correct drift

  ### 2. The Requirement Structure

  Show the ARCHITECTURE.md pattern:
  ```markdown
  ### CAP-XX: Capability Name

  | ID | Requirement | Acceptance |
  |----|-------------|------------|
  | REQ-YG-XXX | Requirement text | How to verify |
  ```

  Explain REQ-YG numbering: `REQ-YG-001` through `REQ-YG-100+`

  ### 3. Test Tagging with @pytest.mark.req

  Show the pattern:
  ```python
  @pytest.mark.req("REQ-YG-042")
  def test_feature_x():
      ...
  ```

  Explain:
  - One test can cover multiple requirements
  - One requirement can have multiple tests
  - The marker creates the traceability link

  ### 4. The Enforcement Script: req_coverage.py

  Explain `scripts/req_coverage.py`:
  - `--detail` mode: shows which tests cover each requirement
  - `--strict` mode: fails if any requirement has zero tests
  - How it integrates with pre-commit hooks

  Show example output from running the script.

  ### 5. Conventional Commits Integration

  How requirements flow into commit messages:
  - `feat(scope): FR-XXX description` — Feature requests link to requirements
  - CHANGELOG.md entries reference capabilities
  - The chain: REQ → test → code → commit → changelog

  ### 6. Pervasive Verification

  The LLM's role in maintaining traceability:
  - When adding a capability: add requirement, tag tests, update script
  - When tests fail: trace back to which requirement is violated
  - When doctrine changes: which requirements need updating?

  ### 7. The Inquisitor's Verification Runs

  Quote from diary entries showing periodic verification:
