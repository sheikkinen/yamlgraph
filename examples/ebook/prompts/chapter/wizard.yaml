  ## Chapter Structure

  ### 1. The Engine at a Glance
  - Module map: show the directory structure of `yamlgraph/`
  - Total lines (~12k) across ~50 modules — a small, focused engine
  - Key design: each compiler stage is a separate module

  ### 2. The Compiler Pipeline (the real code)
  - `graph_loader.py` orchestrates: load → validate → build state → compile nodes → wire edges
  - `node_compiler.py` registers nodes into the StateGraph
  - `edge_compiler.py` wires edges (including conditional routing)
  - `map_compiler.py` handles fan-out for map nodes
  - Show real function signatures and docstrings from these files

  ### 3. The Node Factory
  - Factory pattern: `node_factory/` with one module per node category
  - `base.py` — shared pre-checks, loop protection, skip_if_exists
  - `llm_nodes.py` — LLM and router node creation
  - `control_nodes.py` — python and passthrough
  - `tool_nodes.py` — agent and tool_call
  - `copilot_node.py` — GitHub Copilot integration
  - Show how a node function is constructed

  ### 4. The Linter
  - `graph_linter.py` orchestrates all checks
  - Check categories: structural (`checks.py`), contracts (`checks_contracts.py`), providers (`checks_providers.py`), semantic (`checks_semantic.py`)
  - Pattern-specific linters in `linter/patterns/` (router, map, agent, subgraph, interrupt)
  - Show real check function names and what they catch
  - The linter catches at YAML-load time what would otherwise fail at runtime

  ### 5. The Quality Toolchain
  - **Commandment 8** demands: "kill all entropy and false idols"
  - Walk through every hook in `.pre-commit-config.yaml`:
    - `ruff` — linting and formatting
    - `radon` — cyclomatic complexity gate (block grade D, CC ≥ 21)
    - `vulture` — dead code detection (min-confidence 80)
    - `jscpd` — duplicate code detection (threshold 10, min-lines 10)
    - `file-size-gate` — module size enforcement (>450 error, >400 warn)
    - `forbid-terms` — TODO/FIXME/backward-compatibility drift
    - `hedging-check` — silent fallback detection
    - `inline-llm-check` — inline LLM orchestration detection
    - `req-coverage-strict` — requirement traceability
    - `noqa-confession` — noqa suppression documentation
    - `pytest` — unit tests
    - `conventional-pre-commit` — commit message format
    - `feat-requires-fr` — FR reference enforcement
    - `changelog-required` — CHANGELOG enforcement
    - `absolution` — final summary with Distill reminder
    - `inquisitor-background` — async post-commit audit

  ### 6. The Utilities
  - `llm_factory.py` — provider abstraction
  - `expressions.py` — the expression parser that resolves `{state.field.subfield}`
  - `sanitize.py` — shell injection protection (shlex.quote)
  - `template.py` — Jinja2 integration
  - `token_tracker.py` — cost awareness

