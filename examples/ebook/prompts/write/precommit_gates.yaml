user: |
  ## Task
  Write Chapter 02: Pre-commit Gates for the YAMLGraph Development Pipeline eBook.

  ## Research Findings
  {research}

  ## Chapter Requirements

  ### Title
  # Pre-commit Gates: Quality at the Threshold

  ### Content
  1. **Why Pre-commit Hooks?** — Catch problems before they enter history. Prevention > cure.

  2. **Complete Hook Table** — A Markdown table with ALL hooks:
     | Hook ID | Purpose | What It Catches | When It Fires |
     |---------|---------|-----------------|---------------|
     | ruff | ... | ... | pre-commit |
     (Include ALL hooks from .pre-commit-config.yaml)

  3. **Standard Hooks** — Brief section on common hooks (ruff, trim whitespace, check yaml, etc.)

  4. **Custom Scripts** — Detailed sections on:

     #### absolution.py
     - What does "absolution" mean in this context?
     - What message does it print?
     - Why is it the final hook?

     #### req_coverage.py
     - What is requirement traceability?
     - What does `@pytest.mark.req("REQ-YG-XXX")` do?
     - What does `--strict` enforce?

     #### noqa_confession.py
     - What is a noqa confession?
     - The CONF-XXX pattern
     - Link to docs/confessions.md

     #### diary_rotate.py
     - When does rotation happen?
     - What triggers it? (date change detection)
     - How are archives named?

     #### changelog-required
     - What commits require CHANGELOG updates?
     - feat and fix commits

     #### feat-requires-fr
     - Why must feat commits reference FR-XXX?
     - How does this connect to planned work?

  5. **Annotated Configuration** — Show 2-3 hook configurations with inline comments explaining each option.

  6. **The Absolution Pattern** — Final paragraph on why absolution is granted (all checks passed; you may commit).

  ## Formatting
  - Use Markdown tables
  - Use code blocks with yaml syntax highlighting
  - Use #### for each script section

  ## Output
  Return the complete chapter as Markdown, ready to save as `02-precommit-gates.md`.
