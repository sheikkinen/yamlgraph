  ## Chapter Requirements

  ### Title
  # Chaplain Pipeline: Automated Feature Planning

  ### Content
  1. **What is the Chaplain?** — One paragraph: an automated workflow that turns ideas into feature requests and diary entries.

  2. **The Watch Loop** — Explain watch.sh:
     - Monitors `.chaplain/inbox/` for topic files
     - Debounces rapid changes
     - Invokes the copilot graph

  3. **Full Pipeline Diagram** — Mermaid sequence diagram:
     ```mermaid
     sequenceDiagram
       participant U as User
       participant I as inbox/
       participant W as watch.sh
       participant G as graph.yaml
       participant P as Plan (copilot)
       participant J as Judge (copilot)
       participant S as Summarize (LLM)
       participant D as Diary

       U->>I: topic.md
       I->>W: file detected
       W->>G: yamlgraph graph run
       G->>P: Plan stage
       P-->>G: feature request draft
       G->>J: Judge stage
       J-->>G: verdict
       G->>S: Summarize stage
       S-->>G: diary entry
       G->>D: write_diary
     ```
     (Adjust based on research findings)

  4. **Stage Details** — For each stage:

     #### Plan (copilot node)
     - What prompt does it use?
     - What does it read? (topic file, existing FRs)
     - What does it produce? (feature request draft in drafts/)

     #### Judge (copilot node)
     - What does it check?
     - What verdict does it render?
     - What happens if rejected?

     #### Summarize (LLM node)
     - What does it distill?
     - What schema does the output follow? (theme, body, seed)

     #### write_diary (Python tool)
     - Where does the entry go?
     - What format?

  5. **Feature Request History** — Table of FRs that built this pipeline:
     | FR | Title | What It Added |
     |----|-------|---------------|
     | FR-068 | Chaplain watch loop | Initial watch.sh |
     | FR-081 | Copilot node type | Copilot backend |
     | FR-084 | Migration to graph | Graph-based workflow |
     | FR-093 | Diary append | Automatic diary entries |
     | FR-097 | Shared diary utils | Reusable write_diary |
     | FR-098 | Consolidated graph | Single copilot graph |

  6. **Running the Chaplain** — How to use it:
     - Drop a topic.md into `.chaplain/inbox/`
     - Wait for watch.sh to process
     - Find draft in `.chaplain/drafts/`

  ## Formatting
  - Use Mermaid sequence diagrams
  - Use #### for each stage
  - Use tables for FR history

