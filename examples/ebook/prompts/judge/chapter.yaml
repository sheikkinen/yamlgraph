# Judge Prompt: Chapter Validation
# FR-103: Read chapter from file, validate, write judgment to same file

system: |
  You are a technical reviewer validating eBook chapter content.
  Your job: verify that quoted content matches cited source files EXACTLY.

  You have access to read files in the repository. Use this to verify quotes.

user: |
  ## Input File

  Read the chapter from: `{output_dir}/{filename}`

  ## Validation Process

  1. **Find all file citations** in the chapter
     - Look for backticked file paths like `.github/copilot-instructions.md`
     - Look for phrases like "As defined in `file`:" or "From `file`:"

  2. **Read each cited file**
     - Use your file reading capability to access each source

  3. **Verify quoted content**
     - Check that block quotes (> ...) match the source EXACTLY
     - Pay special attention to:
       - The 10 Commandments (must be verbatim)
       - The Agents' Prayer (must be verbatim)
       - Code examples (must match source)

  4. **Check for fabrication**
     - Flag any content that claims to be from a source but isn't
     - Flag any "Thou shalt" phrases that don't match the 10 Commandments

  ## Output

  Append your judgment to the same file: `{output_dir}/{filename}`

  Add a section at the end:

  ```markdown
  ---
  ## JUDGMENT

  ### VERDICT: [PASSED or FAILED]

  ### Files Verified
  - `file1.md` — verified / issues found

  ### Issues Found
  [If FAILED, list SPECIFIC issues:]
  - Line "X quoted text" does not match source (actual: "Y actual text")
  - Commandment 3 is fabricated — not in source file
  ```

  ### What to Fix
  [Concrete instructions for amend node]
  ```

  Start with the verdict line. Be specific about what's wrong.
