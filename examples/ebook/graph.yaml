# eBook Authoring Pipeline
# FR-103: Merged write + judge-amend subgraph pattern
# Uses copilot nodes for writing with inline file citations
# Judge-amend subgraph validates each chapter against cited sources

version: "1.0"
name: ebook-pipeline
description: Write the YAMLGraph development pipeline eBook chapter by chapter

prompts_relative: true
prompts_dir: prompts

subgraphs:
  validate_chapter: subgraphs/validate_chapter.yaml

state:
  output_dir: str
  date: str
  chapter_introduction: str
  chapter_doctrine: str
  chapter_precommit: str
  chapter_chaplain: str
  chapter_inquisitor: str
  chapter_diary: str
  written: list

tools:
  persist_introduction:
    type: python
    module: examples.ebook.nodes.writing
    function: persist_introduction
  persist_doctrine:
    type: python
    module: examples.ebook.nodes.writing
    function: persist_doctrine
  persist_precommit:
    type: python
    module: examples.ebook.nodes.writing
    function: persist_precommit
  persist_chaplain:
    type: python
    module: examples.ebook.nodes.writing
    function: persist_chaplain
  persist_inquisitor:
    type: python
    module: examples.ebook.nodes.writing
    function: persist_inquisitor
  persist_diary:
    type: python
    module: examples.ebook.nodes.writing
    function: persist_diary

nodes:
  # ── Chapter 00: Introduction ──
  write_introduction:
    type: copilot
    prompt: chapter/introduction
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    state_key: chapter_introduction
    timeout: 300

  validate_introduction:
    type: subgraph
    graph: subgraphs/validate_chapter.yaml
    input_mapping:
      chapter: chapter_introduction
    output_mapping:
      chapter_introduction: amended_chapter

  save_introduction:
    type: python
    tool: persist_introduction

  # ── Chapter 01: Doctrine ──
  write_doctrine:
    type: copilot
    prompt: chapter/doctrine
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    state_key: chapter_doctrine
    timeout: 300

  validate_doctrine:
    type: subgraph
    graph: subgraphs/validate_chapter.yaml
    input_mapping:
      chapter: chapter_doctrine
    output_mapping:
      chapter_doctrine: amended_chapter

  save_doctrine:
    type: python
    tool: persist_doctrine

  # ── Chapter 02: Pre-commit Gates ──
  write_precommit:
    type: copilot
    prompt: chapter/precommit_gates
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    state_key: chapter_precommit
    timeout: 300

  validate_precommit:
    type: subgraph
    graph: subgraphs/validate_chapter.yaml
    input_mapping:
      chapter: chapter_precommit
    output_mapping:
      chapter_precommit: amended_chapter

  save_precommit:
    type: python
    tool: persist_precommit

  # ── Chapter 03: Chaplain Pipeline ──
  write_chaplain:
    type: copilot
    prompt: chapter/chaplain_pipeline
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    state_key: chapter_chaplain
    timeout: 300

  validate_chaplain:
    type: subgraph
    graph: subgraphs/validate_chapter.yaml
    input_mapping:
      chapter: chapter_chaplain
    output_mapping:
      chapter_chaplain: amended_chapter

  save_chaplain:
    type: python
    tool: persist_chaplain

  # ── Chapter 04: Inquisitor ──
  write_inquisitor:
    type: copilot
    prompt: chapter/inquisitor
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    state_key: chapter_inquisitor
    timeout: 300

  validate_inquisitor:
    type: subgraph
    graph: subgraphs/validate_chapter.yaml
    input_mapping:
      chapter: chapter_inquisitor
    output_mapping:
      chapter_inquisitor: amended_chapter

  save_inquisitor:
    type: python
    tool: persist_inquisitor

  # ── Chapter 05: Diary System ──
  write_diary:
    type: copilot
    prompt: chapter/diary_system
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    state_key: chapter_diary
    timeout: 300

  validate_diary:
    type: subgraph
    graph: subgraphs/validate_chapter.yaml
    input_mapping:
      chapter: chapter_diary
    output_mapping:
      chapter_diary: amended_chapter

  save_diary:
    type: python
    tool: persist_diary

edges:
  - from: START
    to: write_introduction
  - from: write_introduction
    to: validate_introduction
  - from: validate_introduction
    to: save_introduction

  - from: save_introduction
    to: write_doctrine
  - from: write_doctrine
    to: validate_doctrine
  - from: validate_doctrine
    to: save_doctrine

  - from: save_doctrine
    to: write_precommit
  - from: write_precommit
    to: validate_precommit
  - from: validate_precommit
    to: save_precommit

  - from: save_precommit
    to: write_chaplain
  - from: write_chaplain
    to: validate_chaplain
  - from: validate_chaplain
    to: save_chaplain

  - from: save_chaplain
    to: write_inquisitor
  - from: write_inquisitor
    to: validate_inquisitor
  - from: validate_inquisitor
    to: save_inquisitor

  - from: save_inquisitor
    to: write_diary
  - from: write_diary
    to: validate_diary
  - from: validate_diary
    to: save_diary
  - from: save_diary
    to: END
