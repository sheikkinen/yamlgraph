# eBook Authoring Pipeline
# FR-103: Merged write + judge-amend subgraph pattern
# Uses copilot nodes for writing with inline file citations
# Judge-amend subgraph validates each chapter against cited sources

version: "1.0"
name: ebook-pipeline
description: Write the YAMLGraph development pipeline eBook chapter by chapter

prompts_relative: true
prompts_dir: prompts

subgraphs:
  validate_chapter: subgraphs/validate_chapter.yaml

state:
  output_dir: str          # Target directory (docs/ebook/)
  date: str                # Authoring date (YYYY-MM-DD)
  # Chapter outputs (copilot nodes produce markdown directly)
  chapter_introduction: str
  chapter_doctrine: str
  chapter_precommit: str
  chapter_chaplain: str
  chapter_inquisitor: str
  chapter_diary: str
  # Validated chapter outputs (after judge-amend)
  validated_introduction: str
  validated_doctrine: str
  validated_precommit: str
  validated_chaplain: str
  validated_inquisitor: str
  validated_diary: str

tools:
  persist_chapter:
    type: python
    module: examples.ebook.nodes.writing
    function: persist_chapter

nodes:
  # ── Chapter 00: Introduction ──
  write_introduction:
    type: copilot
    prompt: chapter/introduction
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    state_key: chapter_introduction
    timeout: 300

  validate_introduction:
    type: subgraph
    graph: subgraphs/validate_chapter.yaml
    input_mapping:
      chapter: chapter_introduction
    output_mapping:
      validated_introduction: chapter
    state_key: validated_introduction

  persist_introduction:
    type: tool
    tool: persist_chapter
    variables:
      content: "{state.validated_introduction}"
      filename: "00-introduction.md"
      output_dir: "{state.output_dir}"

  # ── Chapter 01: Doctrine ──
  write_doctrine:
    type: copilot
    prompt: chapter/doctrine
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    state_key: chapter_doctrine
    timeout: 300

  validate_doctrine:
    type: subgraph
    graph: subgraphs/validate_chapter.yaml
    input_mapping:
      chapter: chapter_doctrine
    output_mapping:
      validated_doctrine: chapter
    state_key: validated_doctrine

  persist_doctrine:
    type: tool
    tool: persist_chapter
    variables:
      content: "{state.validated_doctrine}"
      filename: "01-doctrine.md"
      output_dir: "{state.output_dir}"

  # ── Chapter 02: Pre-commit Gates ──
  write_precommit:
    type: copilot
    prompt: chapter/precommit_gates
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    state_key: chapter_precommit
    timeout: 300

  validate_precommit:
    type: subgraph
    graph: subgraphs/validate_chapter.yaml
    input_mapping:
      chapter: chapter_precommit
    output_mapping:
      validated_precommit: chapter
    state_key: validated_precommit

  persist_precommit:
    type: tool
    tool: persist_chapter
    variables:
      content: "{state.validated_precommit}"
      filename: "02-precommit-gates.md"
      output_dir: "{state.output_dir}"

  # ── Chapter 03: Chaplain Pipeline ──
  write_chaplain:
    type: copilot
    prompt: chapter/chaplain_pipeline
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    state_key: chapter_chaplain
    timeout: 300

  validate_chaplain:
    type: subgraph
    graph: subgraphs/validate_chapter.yaml
    input_mapping:
      chapter: chapter_chaplain
    output_mapping:
      validated_chaplain: chapter
    state_key: validated_chaplain

  persist_chaplain:
    type: tool
    tool: persist_chapter
    variables:
      content: "{state.validated_chaplain}"
      filename: "03-chaplain-pipeline.md"
      output_dir: "{state.output_dir}"

  # ── Chapter 04: Inquisitor ──
  write_inquisitor:
    type: copilot
    prompt: chapter/inquisitor
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    state_key: chapter_inquisitor
    timeout: 300

  validate_inquisitor:
    type: subgraph
    graph: subgraphs/validate_chapter.yaml
    input_mapping:
      chapter: chapter_inquisitor
    output_mapping:
      validated_inquisitor: chapter
    state_key: validated_inquisitor

  persist_inquisitor:
    type: tool
    tool: persist_chapter
    variables:
      content: "{state.validated_inquisitor}"
      filename: "04-inquisitor.md"
      output_dir: "{state.output_dir}"

  # ── Chapter 05: Diary System ──
  write_diary:
    type: copilot
    prompt: chapter/diary_system
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    state_key: chapter_diary
    timeout: 300

  validate_diary:
    type: subgraph
    graph: subgraphs/validate_chapter.yaml
    input_mapping:
      chapter: chapter_diary
    output_mapping:
      validated_diary: chapter
    state_key: validated_diary

  persist_diary:
    type: tool
    tool: persist_chapter
    variables:
      content: "{state.validated_diary}"
      filename: "05-diary-system.md"
      output_dir: "{state.output_dir}"

edges:
  # Chapter 00: Introduction
  - from: START
    to: write_introduction
  - from: write_introduction
    to: validate_introduction
  - from: validate_introduction
    to: persist_introduction

  # Chapter 01: Doctrine
  - from: persist_introduction
    to: write_doctrine
  - from: write_doctrine
    to: validate_doctrine
  - from: validate_doctrine
    to: persist_doctrine

  # Chapter 02: Pre-commit Gates
  - from: persist_doctrine
    to: write_precommit
  - from: write_precommit
    to: validate_precommit
  - from: validate_precommit
    to: persist_precommit

  # Chapter 03: Chaplain Pipeline
  - from: persist_precommit
    to: write_chaplain
  - from: write_chaplain
    to: validate_chaplain
  - from: validate_chaplain
    to: persist_chaplain

  # Chapter 04: Inquisitor
  - from: persist_chaplain
    to: write_inquisitor
  - from: write_inquisitor
    to: validate_inquisitor
  - from: validate_inquisitor
    to: persist_inquisitor

  # Chapter 05: Diary System
  - from: persist_inquisitor
    to: write_diary
  - from: write_diary
    to: validate_diary
  - from: validate_diary
    to: persist_diary

  # End
  - from: persist_diary
    to: END
