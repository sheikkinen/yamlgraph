# eBook Authoring Pipeline
# FR-103: File-based write → judge → amend pattern
# Each node reads/writes directly to the chapter file

version: "1.0"
name: ebook-pipeline
description: Write the YAMLGraph development pipeline eBook chapter by chapter

prompts_relative: true
prompts_dir: prompts

state:
  output_dir: str
  # Per-chapter filenames (passed as initial vars)
  filename_introduction: str
  filename_doctrine: str
  filename_precommit: str
  filename_chaplain: str
  filename_inquisitor: str
  filename_diary: str
  filename_traceability: str
  # Tracking
  current_chapter: str

nodes:
  # ══════════════════════════════════════════════════════════════════
  # Chapter 00: Introduction
  # ══════════════════════════════════════════════════════════════════
  write_introduction:
    type: copilot
    prompt: chapter/introduction
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_introduction}"
    state_key: current_chapter
    timeout: 300

  judge_introduction:
    type: copilot
    prompt: judge/chapter
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_introduction}"
    state_key: current_chapter
    timeout: 300

  amend_introduction:
    type: copilot
    prompt: amend/chapter
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_introduction}"
    state_key: current_chapter
    timeout: 300

  # ══════════════════════════════════════════════════════════════════
  # Chapter 01: Doctrine
  # ══════════════════════════════════════════════════════════════════
  write_doctrine:
    type: copilot
    prompt: chapter/doctrine
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_doctrine}"
    state_key: current_chapter
    timeout: 300

  judge_doctrine:
    type: copilot
    prompt: judge/chapter
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_doctrine}"
    state_key: current_chapter
    timeout: 300

  amend_doctrine:
    type: copilot
    prompt: amend/chapter
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_doctrine}"
    state_key: current_chapter
    timeout: 300

  # ══════════════════════════════════════════════════════════════════
  # Chapter 02: Pre-commit Gates
  # ══════════════════════════════════════════════════════════════════
  write_precommit:
    type: copilot
    prompt: chapter/precommit_gates
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_precommit}"
    state_key: current_chapter
    timeout: 300

  judge_precommit:
    type: copilot
    prompt: judge/chapter
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_precommit}"
    state_key: current_chapter
    timeout: 300

  amend_precommit:
    type: copilot
    prompt: amend/chapter
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_precommit}"
    state_key: current_chapter
    timeout: 300

  # ══════════════════════════════════════════════════════════════════
  # Chapter 03: Chaplain Pipeline
  # ══════════════════════════════════════════════════════════════════
  write_chaplain:
    type: copilot
    prompt: chapter/chaplain_pipeline
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_chaplain}"
    state_key: current_chapter
    timeout: 300

  judge_chaplain:
    type: copilot
    prompt: judge/chapter
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_chaplain}"
    state_key: current_chapter
    timeout: 300

  amend_chaplain:
    type: copilot
    prompt: amend/chapter
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_chaplain}"
    state_key: current_chapter
    timeout: 300

  # ══════════════════════════════════════════════════════════════════
  # Chapter 04: Inquisitor
  # ══════════════════════════════════════════════════════════════════
  write_inquisitor:
    type: copilot
    prompt: chapter/inquisitor
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_inquisitor}"
    state_key: current_chapter
    timeout: 300

  judge_inquisitor:
    type: copilot
    prompt: judge/chapter
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_inquisitor}"
    state_key: current_chapter
    timeout: 300

  amend_inquisitor:
    type: copilot
    prompt: amend/chapter
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_inquisitor}"
    state_key: current_chapter
    timeout: 300

  # ══════════════════════════════════════════════════════════════════
  # Chapter 05: Diary System
  # ══════════════════════════════════════════════════════════════════
  write_diary:
    type: copilot
    prompt: chapter/diary_system
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_diary}"
    state_key: current_chapter
    timeout: 300

  judge_diary:
    type: copilot
    prompt: judge/chapter
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_diary}"
    state_key: current_chapter
    timeout: 300

  amend_diary:
    type: copilot
    prompt: amend/chapter
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_diary}"
    state_key: current_chapter
    timeout: 300

  # ══════════════════════════════════════════════════════════════════
  # Chapter 06: Requirement Traceability Matrix
  # ══════════════════════════════════════════════════════════════════
  write_traceability:
    type: copilot
    prompt: chapter/traceability
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_traceability}"
    state_key: current_chapter
    timeout: 300

  judge_traceability:
    type: copilot
    prompt: judge/chapter
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_traceability}"
    state_key: current_chapter
    timeout: 300

  amend_traceability:
    type: copilot
    prompt: amend/chapter
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename_traceability}"
    state_key: current_chapter
    timeout: 300

edges:
  # Chapter 00: Introduction
  - from: START
    to: write_introduction
  - from: write_introduction
    to: judge_introduction
  - from: judge_introduction
    to: amend_introduction

  # Chapter 01: Doctrine
  - from: amend_introduction
    to: write_doctrine
  - from: write_doctrine
    to: judge_doctrine
  - from: judge_doctrine
    to: amend_doctrine

  # Chapter 02: Pre-commit Gates
  - from: amend_doctrine
    to: write_precommit
  - from: write_precommit
    to: judge_precommit
  - from: judge_precommit
    to: amend_precommit

  # Chapter 03: Chaplain Pipeline
  - from: amend_precommit
    to: write_chaplain
  - from: write_chaplain
    to: judge_chaplain
  - from: judge_chaplain
    to: amend_chaplain

  # Chapter 04: Inquisitor
  - from: amend_chaplain
    to: write_inquisitor
  - from: write_inquisitor
    to: judge_inquisitor
  - from: judge_inquisitor
    to: amend_inquisitor

  # Chapter 05: Diary System
  - from: amend_inquisitor
    to: write_diary
  - from: write_diary
    to: judge_diary
  - from: judge_diary
    to: amend_diary

  # Chapter 06: Requirement Traceability Matrix
  - from: amend_diary
    to: write_traceability
  - from: write_traceability
    to: judge_traceability
  - from: judge_traceability
    to: amend_traceability
  - from: amend_traceability
    to: END
