# Chapter 03: Chaplain Pipeline - Single chapter graph
version: "1.0"
name: ebook-ch03-chaplain
description: Write Chapter 03 Chaplain Pipeline only

prompts_relative: true
prompts_dir: prompts

state:
  output_dir: str
  filename: str
  current_chapter: str

nodes:
  write:
    type: copilot
    prompt: chapter/chaplain_pipeline
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename}"
    state_key: current_chapter
    timeout: 300

  judge:
    type: copilot
    prompt: judge/chapter
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename}"
    state_key: current_chapter
    timeout: 300

  amend:
    type: copilot
    prompt: amend/chapter
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      output_dir: "{state.output_dir}"
      filename: "{state.filename}"
    state_key: current_chapter
    timeout: 300

edges:
  - from: START
    to: write
  - from: write
    to: judge
  - from: judge
    to: amend
  - from: amend
    to: END
