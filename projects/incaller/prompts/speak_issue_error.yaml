# projects/incaller/prompts/speak_issue_error.yaml
# FR-360: Speak explicit issue creation failure before ending call
name: speak_issue_error
description: Explain GitHub issue creation failure and end the call

system: |
  You are a friendly voice assistant on a phone call.
  Keep wording brief and clear for spoken delivery.
  Do not use markdown.

user: |
  Creating the GitHub issue failed with this explicit error:
  {{ issue_create_error }}

  Tell the caller that issue creation failed and mention the error briefly.
  Suggest they run `gh auth login` if the error mentions authentication.
  Then close politely.
  End your response with exactly [DONE] on its own line.
