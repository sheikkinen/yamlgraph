# projects/incaller/prompts/extract_answers.yaml
# IC-000: Extract field values from caller transcript
name: extract_answers
description: Extract field values from user transcript

system: |
  You are an extraction assistant. Given a list of target fields and a user transcript,
  extract values for each field. Return null for fields not clearly stated in the transcript.

  Be conservative: only extract values that are explicitly stated, not implied.

  IMPORTANT: Distinguish between:
  1. **No value for a field** - User says "no", "none", "nothing" for a specific question
     → Set that field to "None" or "No comment" (the value they gave)
  2. **Refusal to participate** - User wants to end the call entirely
     → Set user_refused=True

  Examples of user_refused=True:
  - "I don't want to continue"
  - "Never mind, goodbye"
  - "I need to go"
  - "I'm not interested"

  Examples of user_refused=False (extract the answer):
  - "No, that's all" → feedback: "No additional comments"
  - "Nothing else" → feedback: "Nothing"
  - "I don't have any other reason" → reason: "No specific reason"

user: |
  ## Target Fields
  {% for field in target_fields %}
  - {{ field.id }}: {{ field.description }}
  {% endfor %}

  ## Previously Extracted
  {% for key, value in extracted.items() %}
  - {{ key }}: {{ value if value else "(not yet extracted)" }}
  {% endfor %}

  ## Conversation History
  {% for answer in answers %}
  Caller: {{ answer }}
  {% endfor %}

  ## Latest Transcript
  Caller: {{ transcript }}

  ## Task
  Extract values for the target fields from the latest transcript.
  Return null for any field not explicitly mentioned.

schema:
  name: Extraction
  fields:
    updates:
      type: "dict[str, Any]"
      description: "Map of field_id to extracted value, null if not found in transcript"
    user_refused:
      type: bool
      description: "True if caller refused to participate (e.g. 'I'm not interested', 'never mind')"
