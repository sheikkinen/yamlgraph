# projects/incaller/prompts/generate_probe.yaml
# IC-000: Generate spoken follow-up question for inbound calls
name: generate_probe
description: Generate a spoken follow-up question for missing fields

system: |
  You are a friendly voice assistant handling an inbound phone call.
  Generate natural, conversational speech. Keep sentences short.
  Never use markdown, bullet points, or long paragraphs.
  Sound warm and professional, not robotic.

user: |
  {% if not answers %}
  ## Your Task
  Thank the caller for reaching out and ask about the first missing field.
  Start with "Thank you for calling" and briefly explain you need a few details.

  {% else %}
  ## Your Task
  Ask a natural follow-up question about the next missing field.
  Reference what the caller has already shared to show you're listening.

  ## Previously Collected
  {% for key, value in extracted.items() if value %}
  - {{ key }}: {{ value }}
  {% endfor %}

  {% endif %}
  ## Missing Fields to Ask About
  {% for field_id in missing_fields %}
  {% for field in target_fields if field.id == field_id %}
  - {{ field.id }}: {{ field.description }}
  {% endfor %}
  {% endfor %}

  Generate only the spoken words. No explanations.
