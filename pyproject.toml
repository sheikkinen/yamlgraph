[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yamlgraph"
version = "0.4.63"
description = "YAML-first framework for building LLM pipelines with LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Sami Heikkinen"}]
keywords = ["yaml", "llm", "langgraph", "pipeline", "ai", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-mistralai>=0.2.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "langsmith>=0.1.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "radon>=6.0.0",
    "vulture>=2.0",
    "pre-commit>=3.0.0",
]
analysis = [
    "jedi>=0.19.0",
]
websearch = [
    "ddgs>=6.0.0",
]
tavily = [
    "tavily-python>=0.5.0",
]
storyboard = [
    "replicate>=0.25.0",
]
replicate = [
    "langchain-litellm>=0.3.0",  # includes litellm as dependency
]
redis = [
    "langgraph-checkpoint-redis>=0.3.0",
]
redis-simple = [
    "redis>=5.0.0",
    "orjson>=3.9.0",
]
rag = [
    "lancedb>=0.4.0",
    "openai>=1.0.0",
]
booking = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "uvicorn>=0.27.0",
]
npc = [
    "fastapi>=0.110.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.27.0",
]
digest = [
    "feedparser>=6.0.0",
    "resend>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "slowapi>=0.1.9",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",
]
fsm = [
    "statemachine-engine>=1.0.70",
]
mcp = [
    "mcp>=1.0.0",
]
a2a = [
    "a2a-sdk[http-server]>=0.3,<1.0",
]
telco = [
    "twilio>=9.0.0",
    "elevenlabs>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
yamlgraph = "yamlgraph.cli:main"

[project.urls]
Homepage = "https://github.com/sheikkinen/yamlgraph"
Repository = "https://github.com/sheikkinen/yamlgraph"
Documentation = "https://github.com/sheikkinen/yamlgraph#readme"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "examples*", "scripts*", "docs*", "docs-planning*", "feature-requests*", "projects*", "research*", "htmlcov*", "build*", "outputs*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# Vulture whitelist uses bare expressions and grouped imports by design
"vulture_whitelist.py" = ["B018", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "--cov=yamlgraph --cov-report=term-missing --cov-fail-under=70"
markers = [
    "req(id): links test to requirement(s) e.g. @pytest.mark.req('REQ-YG-014')",
    "integration: marks tests requiring external services",
]

[tool.coverage.run]
source = ["yamlgraph"]
omit = [
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
