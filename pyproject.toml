[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yamlgraph"
version = "0.5.24"
description = "YAML-first framework for building LLM pipelines with LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Sami Heikkinen"}]
keywords = ["yaml", "llm", "langgraph", "pipeline", "ai", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-anthropic>=0.3.0",
    "langchain-core>=1.5.1",
    "langchain-google-genai>=2.0.0",
    "langchain-mistralai>=0.2.0",
    "langchain-openai>=0.3.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "langsmith>=0.1.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.0",
    "radon>=6.0.0",
    "vulture>=2.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.0.0",
    "import-linter>=2.0",
    # FR-945 (REQ-YG-635): WinRM client for the LAN recon skill.
    # Pinned to stable 0.9.x; 1.0 pre-releases require httpx pin conflict.
    "pypsrp>=0.9,<1.0",
]
analysis = [
    "jedi>=0.19.0",
]
verify = [
    # FR-719: SMT condition verification (W803–W805). Never a core dep.
    # mac-x86_64 wheels stop at 4.13.x; other platforms track latest.
    "z3-solver<4.14; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "z3-solver>=4.12; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
websearch = [
    "ddgs>=6.0.0",
]
tavily = [
    "tavily-python>=0.5.0",
]
storyboard = [
    "replicate>=0.25.0",
]
replicate = [
    "langchain-litellm>=0.3.0",  # includes litellm as dependency
    "litellm>=1.0.0",  # FR-762: declared directly (direct-import honesty), not just transitive
]
azure = [
    "langchain-azure-ai>=1.2.0",  # Azure AI Foundry + Azure OpenAI unified client
]
vertex = [
    "langchain-google-vertexai>=3.2.0",
]
redis = [
    "langgraph-checkpoint-redis>=0.3.0",
]
redis-simple = [
    "redis>=5.0.0",
    "orjson>=3.9.0",
]
rag = [
    "lancedb>=0.4.0",
    "openai>=1.0.0",
    "pyarrow>=14.0.0",  # FR-762: direct-import honesty (transitive via lancedb)
]
booking = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "uvicorn>=0.27.0",
]
npc = [
    "fastapi>=0.110.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.27.0",
]
digest = [
    "feedparser>=6.0.0",
    "resend>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "slowapi>=0.1.9",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",
]
fsm = [
    "statemachine-engine>=1.0.89",
]
chatterbox = [
    "chatterbox-tts>=0.1.0",
    # FR-762: direct-import honesty. torch==2.6.0 has no macOS Intel (x86_64) wheel
    # (see examples/demos/chatterbox/README.md Platform Requirements) — excluded there.
    "torch==2.6.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchaudio==2.6.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
examples-dungeon-master = [
    # FR-762: extra-backed classification for examples/dungeon_master/ (FastAPI + HTMX
    # app entry point plus the unified-planning plot solver and tiktoken salience witness).
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "tiktoken>=0.7.0",
    "unified-planning>=1.0.0",
]
openai-proxy = [
    # FR-762: extra-backed classification for examples/openai_proxy/ (FastAPI proxy server).
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "starlette>=0.36.0",  # FR-762: direct-import honesty (transitive via fastapi)
    "openai>=1.0.0",  # FR-762: PR #464 review — demo.py imports openai.OpenAI directly
]
telco = [
    "twilio>=9.0.0",
    "elevenlabs>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]
otel = [
    # FR-759: opt-in OpenTelemetry observability boundary. Never a core dep.
    "opentelemetry-api>=1.0.0",
    "opentelemetry-sdk>=1.0.0",
    "opentelemetry-exporter-otlp>=1.0.0",
]
vision = [
    # FR-781: opt-in image downscale (describe_image max_dim). Never a core dep.
    "Pillow>=10.0.0",
]
corpus-census = [
    # FR-892/FR-899: the corpus-census PDF extract adapter. Demo-only.
    "pypdf>=5.0.0",
]

[project.scripts]
yamlgraph = "yamlgraph.cli:main"

[project.urls]
Homepage = "https://github.com/sheikkinen/yamlgraph"
Repository = "https://github.com/sheikkinen/yamlgraph"
Documentation = "https://github.com/sheikkinen/yamlgraph#readme"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "examples*", "scripts*", "docs*", "docs-planning*", "feature-requests*", "projects*", "research*", "htmlcov*", "build*", "outputs*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# FR-951: preview is enabled solely to reach PLW1514; explicit-preview-rules
# keeps every other selected prefix on its stable rule set.
preview = true
explicit-preview-rules = true
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "C901",   # mccabe cognitive complexity (FR-221)
    "S",      # flake8-bandit (security)
    "PLW1514",  # open() without an explicit encoding (FR-951)
]
ignore = [
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Vulture whitelist uses bare expressions and grouped imports by design
"vulture_whitelist.py" = ["B018", "E402"]
# C901 gate scoped to yamlgraph/ per FR-221; examples/projects/scripts excluded
"examples/**/*.py" = ["C901"]
"projects/**/*.py" = ["C901"]
"scripts/**/*.py" = ["C901"]
# Tests use assert statements and subprocess calls by design
"tests/**" = ["S101", "S602", "S603", "S607", "S108"]
"scripts/vscode/tests/**" = ["S101"]
"scripts/tests/**" = ["S101"]
".github/hooks/tests/**" = ["S101", "S603"]
# Examples demonstrate patterns; subprocess/binding/assert-in-tests are intentional
"examples/**" = ["S101", "S603", "S607", "S104", "S105", "S108", "S112"]
# Scripts use partial executable paths (git, etc.) by design
"scripts/**" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "--cov=yamlgraph --cov-report=term-missing --cov-fail-under=85"
filterwarnings = []
markers = [
    "req(id): links test to requirement(s) e.g. @pytest.mark.req('REQ-YG-014')",
    "integration: marks tests requiring external services",
    "slow: marks tests that take >1 second to complete",
    "process: marks tests coupled to process/repo boundaries (.chaplain, examples, scripts)",
]

[tool.coverage.run]
source = ["yamlgraph"]
omit = [
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
