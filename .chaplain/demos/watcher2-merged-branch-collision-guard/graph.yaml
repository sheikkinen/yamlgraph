name: Watcher2MergedBranchCollisionGuardDemo
description: Concrete verification demo for FR-286 merged-branch collision guard

state_keys:
  - worktree_guard_result
  - watcher_skip_result
  - readme_result
  - demo_summary

tools:
  verify_worktree_guard:
    type: shell
    command: |
      echo "=== AC-01 / AC-02 / AC-06 / AC-07 ==="
      python - <<'PY'
      from pathlib import Path
      import sys

      content = Path(".chaplain/lib/watcher/worktree_setup.sh").read_text()
      checks = [
          ("merged PR query uses gh pr list", "gh pr list" in content),
          ("merged state filter exists", "--state merged" in content),
          ("head filter uses WT_BRANCH", '--head "$WT_BRANCH"' in content),
          ("returns dedicated skip code 2", "return 2" in content),
          (
              "query is guarded to degrade gracefully",
              "gh pr list" in content and "|| true" in content,
          ),
          (
              "normal worktree creation path remains",
              'git worktree add "$WT_DIR" -b "$WT_BRANCH" main' in content,
          ),
      ]

      failed = [name for name, ok in checks if not ok]
      for name, ok in checks:
          print(("PASS" if ok else "FAIL") + ": " + name)

      if failed:
          sys.exit(1)
      PY
    description: Verify merged-branch guard in worktree setup
    parse: text

  verify_watcher_skip_flow:
    type: shell
    command: |
      echo "=== AC-03 / AC-04 / AC-05 ==="
      python - <<'PY'
      from pathlib import Path
      import sys

      content = Path(".chaplain/watcher2.sh").read_text()
      skip_outcome_pos = content.find('CYCLE_OUTCOME="skipped"')
      skip_metrics_pos = content.find("write_cycle_metrics", skip_outcome_pos)
      checks = [
          (
              "explicit worktree status handling is present",
              "if worktree_setup; then" in content and "worktree_setup_status=$?" in content,
          ),
          (
              "skip code 2 branch exists",
              'if [[ "$worktree_setup_status" == 2 ]]; then' in content,
          ),
          (
              "skip path consumes processing topic file",
              "Skipping topic due to merged branch collision guard" in content
              and 'rm "$TOPIC_FILE"' in content,
          ),
          (
              "skip path records metrics with explicit outcome",
              skip_outcome_pos != -1 and skip_metrics_pos != -1 and skip_outcome_pos < skip_metrics_pos,
          ),
      ]

      failed = [name for name, ok in checks if not ok]
      for name, ok in checks:
          print(("PASS" if ok else "FAIL") + ": " + name)

      if failed:
          sys.exit(1)
      PY
    description: Verify watcher2 skip flow for collision code 2
    parse: text

  verify_documentation:
    type: shell
    command: |
      echo "=== AC-09 ==="
      python - <<'PY'
      from pathlib import Path
      import sys

      content = Path(".chaplain/README.md").read_text().lower()
      checks = [
          ("README mentions merged-branch guard", "merged" in content and "branch" in content),
          ("README documents --state merged query", "--state merged" in content),
      ]

      failed = [name for name, ok in checks if not ok]
      for name, ok in checks:
          print(("PASS" if ok else "FAIL") + ": " + name)

      if failed:
          sys.exit(1)
      PY
    description: Verify README includes merged-branch guard docs
    parse: text

  summarize_demo:
    type: shell
    command: |
      echo "=== FR-286 DEMO SUMMARY ==="
      echo "PASS: worktree merged-branch collision guard is implemented."
      echo "PASS: watcher2 handles skip code 2 as a non-failure skip path."
      echo "PASS: processing topic file is consumed and skip metrics are written."
      echo "PASS: .chaplain/README.md documents merged branch checks."
    description: Print final demonstration summary
    parse: text

nodes:
  check_worktree_guard:
    type: tool
    tool: verify_worktree_guard
    state_key: worktree_guard_result

  check_skip_flow:
    type: tool
    tool: verify_watcher_skip_flow
    state_key: watcher_skip_result

  check_docs:
    type: tool
    tool: verify_documentation
    state_key: readme_result

  summary:
    type: tool
    tool: summarize_demo
    state_key: demo_summary

edges:
  - from: START
    to: check_worktree_guard
  - from: check_worktree_guard
    to: check_skip_flow
  - from: check_skip_flow
    to: check_docs
  - from: check_docs
    to: summary
  - from: summary
    to: END
