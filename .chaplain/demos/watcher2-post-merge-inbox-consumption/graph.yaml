name: Watcher2PostMergeInboxConsumptionDemo
description: Concrete verification demo for FR-289 post-merge inbox consumption

state_keys:
  - post_merge_script_contract
  - runtime_pr_number_resolution
  - runtime_pr_title_fallback_collision
  - runtime_no_token_noop
  - readme_post_merge_docs
  - demo_summary

tools:
  verify_post_merge_script_contract:
    type: shell
    command: |
      echo "=== AC-01 / AC-02 / AC-03 / AC-04 / AC-05 / AC-06 / AC-07 ==="
      python - <<'PY'
      from pathlib import Path
      import sys

      content = Path(".chaplain/lib/watcher/post_merge.sh").read_text()
      checks = [
          ("post_merge helper exists", "resolve_post_merge_fr_token()" in content),
          ("FR token regex extraction exists", "FR-[0-9]+" in content),
          ("PR metadata lookup uses gh pr view", 'gh pr view "$PR_NUMBER" --json title --jq \'.title\'' in content),
          ("fallback path uses PR_TITLE and TOPIC_FILE", "PR_TITLE" in content and "TOPIC_FILE" in content),
          ("inbox scan path exists", ".chaplain/inbox" in content and "grep" in content),
          ("done queue path exists", ".chaplain/done" in content),
          ("done directory creation exists", "mkdir -p" in content),
          ("collision guard exists", "[[ -e " in content and "date +%Y%m%d%H%M%S" in content),
          ("explicit no-token no-op exists", "No FR token" in content and "return 0" in content),
          ("token and consumed-count logging exists", "resolved FR token" in content and "consumed count" in content),
      ]

      failed = [name for name, ok in checks if not ok]
      for name, ok in checks:
          print(("PASS" if ok else "FAIL") + ": " + name)

      if failed:
          sys.exit(1)
      PY
    description: Verify post-merge script contract for FR-token cleanup
    parse: text

  verify_runtime_pr_number_resolution:
    type: shell
    command: |
      echo "=== Runtime: PR_NUMBER title lookup resolves token and consumes matching inbox files ==="
      bash -eu -o pipefail <<'BASH'
      tmpdir=$(mktemp -d)
      trap 'rm -rf "$tmpdir"' EXIT

      mkdir -p "$tmpdir/repo/.chaplain/lib/watcher" \
               "$tmpdir/repo/.chaplain/inbox" \
               "$tmpdir/repo/.chaplain/processing" \
               "$tmpdir/bin"

      cp .chaplain/lib/watcher/post_merge.sh "$tmpdir/repo/.chaplain/lib/watcher/post_merge.sh"

      cat > "$tmpdir/repo/.chaplain/processing/topic.md" <<'EOF'
      topic without explicit FR token
      EOF
      cat > "$tmpdir/repo/.chaplain/inbox/matching.md" <<'EOF'
      follow-up item referencing FR-289 should be consumed
      EOF
      cat > "$tmpdir/repo/.chaplain/inbox/non-matching.md" <<'EOF'
      unrelated note
      EOF

      cat > "$tmpdir/bin/gh" <<'EOF'
      #!/usr/bin/env bash
      if [[ "$1" == "pr" && "$2" == "view" ]]; then
          echo "feat(watcher2): FR-289 consume inbox duplicates"
          exit 0
      fi
      if [[ "$1" == "issue" && "$2" == "close" ]]; then
          exit 0
      fi
      exit 1
      EOF
      chmod +x "$tmpdir/bin/gh"

      log_info() ( echo "[demo] $1" )
      log_warn() ( echo "[demo] WARN: $1" )

      cd "$tmpdir/repo"
      source .chaplain/lib/watcher/post_merge.sh

      TOPIC_FILE=".chaplain/processing/topic.md"
      PR_NUMBER="289"
      unset PR_TITLE
      old_path="$PATH"
      PATH="$tmpdir/bin:$old_path"

      output=$(post_merge 2>&1)

      if [[ ! -f .chaplain/done/matching.md ]]; then
          echo "FAIL: expected matching.md in done queue"
          exit 1
      fi
      if [[ -f .chaplain/inbox/matching.md ]]; then
          echo "FAIL: matching.md should be removed from inbox"
          exit 1
      fi
      if [[ ! -f .chaplain/inbox/non-matching.md ]]; then
          echo "FAIL: non-matching.md should remain in inbox"
          exit 1
      fi
      if [[ "$output" != *"resolved FR token: FR-289"* ]]; then
          echo "FAIL: expected resolved token log"
          echo "$output"
          exit 1
      fi
      if [[ "$output" != *"consumed count: 1 for FR-289"* ]]; then
          echo "FAIL: expected consumed count log"
          echo "$output"
          exit 1
      fi

      echo "PASS: PR_NUMBER->gh title token resolution consumed only matching inbox files"
      BASH
    description: Prove PR_NUMBER title lookup drives post-merge consumption
    parse: text

  verify_runtime_pr_title_fallback_collision:
    type: shell
    command: |
      echo "=== Runtime: PR_TITLE fallback + collision-safe move to done queue ==="
      bash -eu -o pipefail <<'BASH'
      tmpdir=$(mktemp -d)
      trap 'rm -rf "$tmpdir"' EXIT

      mkdir -p "$tmpdir/repo/.chaplain/lib/watcher" \
               "$tmpdir/repo/.chaplain/inbox" \
               "$tmpdir/repo/.chaplain/processing" \
               "$tmpdir/repo/.chaplain/done"

      cp .chaplain/lib/watcher/post_merge.sh "$tmpdir/repo/.chaplain/lib/watcher/post_merge.sh"

      cat > "$tmpdir/repo/.chaplain/processing/topic.md" <<'EOF'
      no FR token in topic content
      EOF
      cat > "$tmpdir/repo/.chaplain/inbox/duplicate.md" <<'EOF'
      this inbox file references FR-289 and must be consumed
      EOF
      cat > "$tmpdir/repo/.chaplain/done/duplicate.md" <<'EOF'
      already present done artifact
      EOF

      log_info() ( echo "[demo] $1" )
      log_warn() ( echo "[demo] WARN: $1" )

      cd "$tmpdir/repo"
      source .chaplain/lib/watcher/post_merge.sh

      TOPIC_FILE=".chaplain/processing/topic.md"
      PR_NUMBER=""
      PR_TITLE="fix(watcher2): FR-289 consume stale inbox items"

      output=$(post_merge 2>&1)

      if [[ -f .chaplain/inbox/duplicate.md ]]; then
          echo "FAIL: duplicate.md should be moved out of inbox"
          exit 1
      fi
      if [[ ! -f .chaplain/done/duplicate.md ]]; then
          echo "FAIL: original done file missing"
          exit 1
      fi
      if ! grep -q "already present done artifact" .chaplain/done/duplicate.md; then
          echo "FAIL: original done file should not be overwritten"
          exit 1
      fi

      collision_count=$(find .chaplain/done -maxdepth 1 -type f -name 'duplicate-*.md' | wc -l | tr -d '[:space:]')
      if [[ "$collision_count" != "1" ]]; then
          echo "FAIL: expected exactly one collision-suffixed done file"
          ls -1 .chaplain/done
          exit 1
      fi

      collision_file=$(find .chaplain/done -maxdepth 1 -type f -name 'duplicate-*.md' | head -1)
      if ! grep -q "references FR-289" "$collision_file"; then
          echo "FAIL: collision file missing moved content"
          exit 1
      fi
      if [[ "$output" != *"consumed count: 1 for FR-289"* ]]; then
          echo "FAIL: expected consumed count log"
          echo "$output"
          exit 1
      fi

      echo "PASS: PR_TITLE fallback resolved token and moved duplicate safely with timestamp suffix"
      BASH
    description: Prove PR_TITLE fallback and collision-safe done handling
    parse: text

  verify_runtime_no_token_noop:
    type: shell
    command: |
      echo "=== Runtime: no token path is explicit no-op ==="
      bash -eu -o pipefail <<'BASH'
      tmpdir=$(mktemp -d)
      trap 'rm -rf "$tmpdir"' EXIT

      mkdir -p "$tmpdir/repo/.chaplain/lib/watcher" \
               "$tmpdir/repo/.chaplain/inbox" \
               "$tmpdir/repo/.chaplain/processing"

      cp .chaplain/lib/watcher/post_merge.sh "$tmpdir/repo/.chaplain/lib/watcher/post_merge.sh"

      cat > "$tmpdir/repo/.chaplain/processing/topic.md" <<'EOF'
      no FR marker here
      EOF
      cat > "$tmpdir/repo/.chaplain/inbox/still-here.md" <<'EOF'
      no FR marker here either
      EOF

      log_info() ( echo "[demo] $1" )
      log_warn() ( echo "[demo] WARN: $1" )

      cd "$tmpdir/repo"
      source .chaplain/lib/watcher/post_merge.sh

      TOPIC_FILE=".chaplain/processing/topic.md"
      PR_NUMBER=""
      PR_TITLE="feat: watcher2 cleanup task without fr token"

      output=$(post_merge 2>&1)

      if [[ ! -f .chaplain/inbox/still-here.md ]]; then
          echo "FAIL: inbox file should remain when no FR token resolves"
          exit 1
      fi
      if [[ -d .chaplain/done ]]; then
          echo "FAIL: done directory should not be created on no-token path"
          exit 1
      fi
      if [[ "$output" != *"No FR token"* ]]; then
          echo "FAIL: expected no-token log output"
          echo "$output"
          exit 1
      fi

      echo "PASS: no-token path returned success and preserved inbox contents"
      BASH
    description: Prove no-token path is explicit no-op
    parse: text

  verify_readme_post_merge_docs:
    type: shell
    command: |
      echo "=== AC-09: README documents post-merge inbox consumption ==="
      python - <<'PY'
      from pathlib import Path
      import sys

      content = Path(".chaplain/README.md").read_text()
      checks = [
          ("README includes post_merge section", "post_merge.sh" in content and "post_merge()" in content),
          ("README includes FR token contract", "FR-[0-9]+" in content or "FR token" in content),
          ("README includes done queue semantics", ".chaplain/done" in content and "consumed-completed queue" in content),
      ]

      failed = [name for name, ok in checks if not ok]
      for name, ok in checks:
          print(("PASS" if ok else "FAIL") + ": " + name)

      if failed:
          sys.exit(1)
      PY
    description: Verify README documents FR-289 behavior
    parse: text

  summarize_demo:
    type: shell
    command: |
      echo "=== FR-289 DEMO SUMMARY ==="
      echo "PASS: post_merge resolves FR token from PR metadata with fallback chain."
      echo "PASS: matching inbox files are consumed into .chaplain/done and non-matches remain."
      echo "PASS: done directory is auto-created and filename collisions are handled safely."
      echo "PASS: no-token path is explicit no-op and keeps merge success."
      echo "PASS: .chaplain/README.md documents post-merge FR-token cleanup semantics."
    description: Print final demonstration summary
    parse: text

nodes:
  check_post_merge_script_contract:
    type: tool
    tool: verify_post_merge_script_contract
    state_key: post_merge_script_contract

  check_runtime_pr_number_resolution:
    type: tool
    tool: verify_runtime_pr_number_resolution
    state_key: runtime_pr_number_resolution

  check_runtime_pr_title_fallback_collision:
    type: tool
    tool: verify_runtime_pr_title_fallback_collision
    state_key: runtime_pr_title_fallback_collision

  check_runtime_no_token_noop:
    type: tool
    tool: verify_runtime_no_token_noop
    state_key: runtime_no_token_noop

  check_readme_docs:
    type: tool
    tool: verify_readme_post_merge_docs
    state_key: readme_post_merge_docs

  summary:
    type: tool
    tool: summarize_demo
    state_key: demo_summary

edges:
  - from: START
    to: check_post_merge_script_contract
  - from: check_post_merge_script_contract
    to: check_runtime_pr_number_resolution
  - from: check_runtime_pr_number_resolution
    to: check_runtime_pr_title_fallback_collision
  - from: check_runtime_pr_title_fallback_collision
    to: check_runtime_no_token_noop
  - from: check_runtime_no_token_noop
    to: check_readme_docs
  - from: check_readme_docs
    to: summary
  - from: summary
    to: END
