# Watcher2 Pipeline Worker FSM
# Runs the full plan → judge → enforce → merge cycle for a single topic.
# Phase 1.5: Paths aligned to .chaplain/graphs/, splitting + committing_tests removed (FR-292).

metadata:
  name: "Watcher2 Pipeline Worker"
  machine_name: watcher-pipeline
  version: "0.2.0"

initial_state: preflight

states:
  # === PLANNING PHASE ===
  - preflight
  - worktree_setup
  - planning
  - committing_plan
  - researching
  - committing_research
  - writing_tests
  - verifying_red
  - judging

  # === ENFORCEMENT PHASE ===
  - implementing
  - committing_implementation
  - testing_demo
  - critiquing
  - changelog_gen
  - finalizing
  - pushing
  - creating_pr
  - waiting_ci
  - remediating_ci
  - merging
  - cleaning_up

  # === TERMINAL STATES ===
  - completed
  - failed
  - forensics
  - stopped

events:
  # Dict format required for context_map support (NC-120)
  preflight_done: {}
  worktree_ready:
    context_map:
      wt_dir: payload.wt_dir
      wt_branch: payload.wt_branch
      main_dir: payload.main_dir
  plan_done: {}
  plan_committed: {}
  research_done: {}
  research_committed: {}
  tests_written: {}
  red_verified: {}
  approve: {}
  reject: {}
  amend: {}
  split: {}
  implement_done: {}
  implementation_committed: {}
  test_demo_done: {}
  critique_done: {}
  changelog_done: {}
  finalize_done: {}
  precommit_retry: {}
  pushed: {}
  pr_created:
    context_map:
      pr_number: payload.pr_number
      pr_url: payload.pr_url
  ci_passed: {}
  ci_failed: {}
  remediated: {}
  merged: {}
  cleaned_up: {}
  analyze: {}
  forensics_done: {}
  stop: {}
  "timeout(600)": {}

transitions:
  # ── PLANNING PHASE ──────────────────────────────────────────────────

  - from: preflight
    to: worktree_setup
    event: preflight_done

  - from: worktree_setup
    to: planning
    event: worktree_ready

  - from: planning
    to: committing_plan
    event: plan_done

  - from: committing_plan
    to: researching
    event: plan_committed

  - from: researching
    to: committing_research
    event: research_done

  - from: committing_research
    to: writing_tests
    event: research_committed

  - from: writing_tests
    to: verifying_red
    event: tests_written

  - from: verifying_red
    to: judging
    event: red_verified

  # ── VERDICT ROUTING ─────────────────────────────────────────────────

  - from: judging
    to: implementing
    event: approve

  - from: judging
    to: failed
    event: reject

  - from: judging
    to: failed
    event: amend

  - from: judging
    to: failed
    event: split

  # ── ENFORCEMENT PHASE ──────────────────────────────────────────────

  - from: implementing
    to: committing_implementation
    event: implement_done

  - from: committing_implementation
    to: testing_demo
    event: implementation_committed

  - from: testing_demo
    to: critiquing
    event: test_demo_done

  - from: critiquing
    to: changelog_gen
    event: critique_done

  - from: changelog_gen
    to: finalizing
    event: changelog_done

  # Finalizing retry loop (pre-commit fix cycle, capped at 5)
  - from: finalizing
    to: finalizing
    event: precommit_retry

  - from: finalizing
    to: pushing
    event: finalize_done

  - from: pushing
    to: creating_pr
    event: pushed

  - from: creating_pr
    to: waiting_ci
    event: pr_created

  # CI loop
  - from: waiting_ci
    to: merging
    event: ci_passed

  - from: waiting_ci
    to: remediating_ci
    event: ci_failed

  - from: remediating_ci
    to: waiting_ci
    event: remediated

  - from: merging
    to: cleaning_up
    event: merged

  - from: cleaning_up
    to: completed
    event: cleaned_up

  # ── FAILURE PATH ───────────────────────────────────────────────────

  - from: failed
    to: forensics
    event: analyze

  - from: forensics
    to: completed
    event: forensics_done

  # ── TIMEOUTS (all yamlgraph_async states) ──────────────────────────

  - from: planning
    to: failed
    event: "timeout(600)"

  - from: researching
    to: failed
    event: "timeout(600)"

  - from: writing_tests
    to: failed
    event: "timeout(600)"

  - from: judging
    to: failed
    event: "timeout(600)"

  - from: implementing
    to: failed
    event: "timeout(600)"

  - from: testing_demo
    to: failed
    event: "timeout(600)"

  - from: critiquing
    to: failed
    event: "timeout(600)"

  - from: remediating_ci
    to: failed
    event: "timeout(600)"

  - from: forensics
    to: failed
    event: "timeout(600)"

  # ── GLOBAL SHUTDOWN ────────────────────────────────────────────────

  - from: "*"
    to: stopped
    event: stop

actions:
  # ── PLANNING PHASE ──────────────────────────────────────────────────

  preflight:
    - type: bash_context
      command: "bash .chaplain/lib/watcher/preflight.sh"
      capture_keys: []
      success: preflight_done
      error: error
      description: "🔧 Running preflight checks"

  worktree_setup:
    - type: bash_context
      command: "bash .chaplain/lib/watcher/worktree_setup.sh --topic {topic_file}"
      capture_keys: [wt_dir, wt_branch, main_dir]
      success: worktree_ready
      error: error
      description: "📁 Setting up worktree"

  planning:
    - type: yamlgraph_async
      graph: .chaplain/graphs/watcher-plan/step-plan.yaml
      vars:
        topic_file: "{topic_file}"
      success: plan_done
      error: error
      description: "📝 Planning"

  committing_plan:
    - type: git_commit
      message: "feat: FR plan — {topic_file}"
      add_paths: ["feature-requests/"]
      capture_fr_path: true
      success: plan_committed
      error: error
      description: "💾 Committing plan"

  researching:
    - type: yamlgraph_async
      graph: .chaplain/graphs/watcher-plan/step-research.yaml
      vars:
        topic_file: "{topic_file}"
        fr_path: "{fr_path}"
      success: research_done
      error: error
      description: "🔬 Researching"

  committing_research:
    - type: git_commit
      message: "docs: research — {topic_file}"
      add_paths: ["."]
      success: research_committed
      error: error
      description: "💾 Committing research"

  writing_tests:
    - type: yamlgraph_async
      graph: .chaplain/graphs/watcher-plan/step-acceptance.yaml
      vars:
        topic_file: "{topic_file}"
        fr_path: "{fr_path}"
      success: tests_written
      error: error
      description: "🧪 Writing acceptance tests"

  verifying_red:
    - type: bash
      command: "cd {wt_dir} && python -m pytest tests/ --no-cov -x 2>&1 | tail -5; test ${PIPESTATUS[0]} -ne 0"
      success: red_verified
      error: error
      description: "🔴 Verifying RED"

  judging:
    - type: yamlgraph_async
      graph: .chaplain/graphs/watcher-plan/step-judge.yaml
      vars:
        topic_file: "{topic_file}"
        fr_path: "{fr_path}"
      event_map:
        APPROVE: approve
        REJECT: reject
        AMEND: amend
        SPLIT: split
      success: approve
      error: error
      description: "⚖️ Judging feature request"

  # ── ENFORCEMENT PHASE ──────────────────────────────────────────────

  implementing:
    - type: yamlgraph_async
      graph: .chaplain/graphs/watcher-enforce/step-implement.yaml
      vars:
        topic_file: "{topic_file}"
        fr_path: "{fr_path}"
      success: implement_done
      error: error
      description: "🔨 Implementing"

  committing_implementation:
    - type: git_commit
      message: "feat: implementation — {topic_file}"
      add_paths: ["."]
      success: implementation_committed
      error: error
      description: "💾 Committing implementation"

  testing_demo:
    - type: yamlgraph_async
      graph: .chaplain/graphs/watcher-enforce/step-test-demo.yaml
      vars:
        topic_file: "{topic_file}"
        fr_path: "{fr_path}"
      success: test_demo_done
      error: error
      description: "🧪 Running tests and demo"

  critiquing:
    - type: yamlgraph_async
      graph: .chaplain/graphs/watcher-enforce/step-critique.yaml
      vars:
        topic_file: "{topic_file}"
        fr_path: "{fr_path}"
      success: critique_done
      error: error
      description: "🔍 Critiquing implementation"

  changelog_gen:
    - type: bash
      command: |
        FR_NUM=$(basename "{fr_path}" | grep -oE 'FR-[0-9]+' | sed 's/FR-//' || true)
        FR_ID="FR-${FR_NUM}"
        SLUG=$(basename "{fr_path}" .md | sed "s/FR-${FR_NUM}-//" | head -c 40)
        SCOPE=$(echo "$SLUG" | cut -d- -f1)
        FRAG="changelog/unreleased/fr-${FR_NUM}-${SLUG}.md"
        if [ ! -f "$FRAG" ] && ! ls changelog/unreleased/fr-"${FR_NUM}"-*.md 1>/dev/null 2>&1; then
          REQ_ID=$(grep -l "fr: $FR_ID" capabilities/CAP-*.yaml 2>/dev/null | head -1 | xargs -I{} grep -oE 'REQ-YG-[0-9]+' {} 2>/dev/null | head -1 || true)
          mkdir -p "$(dirname "$FRAG")"
          echo "---" > "$FRAG"
          echo "type: feat" >> "$FRAG"
          echo "scope: $SCOPE" >> "$FRAG"
          [ -n "$REQ_ID" ] && echo "req: $REQ_ID" >> "$FRAG"
          echo "---" >> "$FRAG"
          echo "- **$FR_ID**: Generated changelog fragment. ($REQ_ID)" >> "$FRAG"
        fi
      success: changelog_done
      error: error
      description: "📋 Generating changelog fragment"

  finalizing:
    - type: precommit
      max_attempts: 5
      success: finalize_done
      retry: precommit_retry
      description: "✨ Finalizing (pre-commit)"

  pushing:
    - type: bash
      command: "cd {wt_dir} && git push origin {wt_branch} --force-with-lease"
      success: pushed
      error: error
      description: "📤 Pushing to remote"

  creating_pr:
    - type: bash_context
      command: "bash .chaplain/lib/watcher/create_pr.sh --branch {wt_branch} --dir {wt_dir}"
      capture_keys: [pr_number, pr_url]
      success: pr_created
      error: error
      description: "🔗 Creating PR"

  waiting_ci:
    - type: bash_context
      command: "bash .chaplain/lib/watcher/wait_ci.sh --pr {pr_number}"
      capture_keys: [ci_result]
      success: ci_passed
      error: ci_failed
      description: "⏳ Waiting for CI"

  remediating_ci:
    - type: yamlgraph_async
      graph: .chaplain/graphs/watcher-enforce/step-ci-remediate.yaml
      vars:
        topic_file: "{topic_file}"
        fr_path: "{fr_path}"
        pr_number: "{pr_number}"
      success: remediated
      error: error
      description: "🔧 Remediating CI failure"

  merging:
    - type: bash
      command: "gh pr merge {pr_number} --squash --delete-branch"
      success: merged
      error: error
      description: "🔀 Merging PR"

  cleaning_up:
    - type: bash
      command: |
        bash .chaplain/lib/watcher/worktree_teardown.sh --dir {wt_dir}
        rm -f {topic_file}
      success: cleaned_up
      error: error
      description: "🧹 Cleaning up worktree and topic file"

  # ── TERMINAL STATES ────────────────────────────────────────────────

  completed:
    - type: bash
      command: "bash .chaplain/lib/watcher/post_merge.sh 2>/dev/null || true"
      description: "✅ Pipeline completed"

  failed:
    - type: bash
      command: |
        mkdir -p .chaplain/failed
        if [ -n "{topic_file}" ] && [ -f "{topic_file}" ]; then
          mv "{topic_file}" .chaplain/failed/
        fi
      success: analyze
      description: "❌ Pipeline failed — moving topic to failed/"

  forensics:
    - type: yamlgraph_async
      graph: .chaplain/graphs/watcher-forensic/graph.yaml
      vars:
        topic_file: "{topic_file}"
        fr_path: "{fr_path}"
      success: forensics_done
      error: error
      description: "🔍 Running forensic analysis"
