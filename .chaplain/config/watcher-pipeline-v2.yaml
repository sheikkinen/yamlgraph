# Watcher2 Pipeline Worker FSM — v2
# FR-305: Collapsed 20+ states into operational states + terminals.
# FR-310: Added validate + precommit_check post-enforce gate.
# FR-316: Split post-enforce validation into validate_fix + validate_gate.
#
# Flow: setup → plan → capture_fr → judge →(approve)→ enforce_session
#                              ↑ revise       │ enforce_done
#                              └────────┘     ▼
#                     validate_fix ← fix_needed ← validate_gate
#                           │ validate_done
#                           ▼
#                       sanity_check
#                        │ pass/warn
#                        └──────────→ validate_gate ──→ done
#                                   │ error (max 5)
#                                   ▼
#                                 failed

metadata:
  name: "Watcher2 Pipeline Worker v2"
  machine_name: watcher-pipeline-v2
  version: "1.0.0"

initial_state: setup

states:
  # === OPERATIONAL STATES ===
  - setup
  - plan
  - capture_fr
  - judge
  - enforce_session
  - validate_fix
  - sanity_check
  - validate_gate
  - done

  # === TERMINAL STATES ===
  - completed
  - failed
  - stopped

events:
  setup_done:
    context_map:
      wt_dir: payload.wt_dir
      wt_branch: payload.wt_branch
      main_dir: payload.main_dir
  plan_done: {}
  fr_captured: {}
  approve: {}
  revise: {}
  reject: {}
  enforce_done: {}
  validate_done: {}
  fix_needed: {}
  pass: {}
  warn: {}
  completed: {}
  cleanup_done: {}
  error: {}
  stop: {}
  "timeout(600)": {}
  "timeout(3600)": {}

transitions:
  # ── HAPPY PATH ─────────────────────────────────────────────────────

  - from: setup
    to: plan
    event: setup_done

  - from: plan
    to: capture_fr
    event: plan_done

  - from: capture_fr
    to: judge
    event: fr_captured

  - from: judge
    to: enforce_session
    event: approve

  - from: enforce_session
    to: validate_fix
    event: enforce_done

  - from: validate_fix
    to: sanity_check
    event: validate_done

  - from: sanity_check
    to: validate_gate
    event: pass

  - from: sanity_check
    to: validate_gate
    event: warn

  - from: validate_gate
    to: done
    event: pass

  - from: done
    to: completed
    event: completed

  # ── VALIDATE / PRECOMMIT LOOP ──────────────────────────────────────

  - from: validate_gate
    to: validate_fix
    event: fix_needed

  - from: validate_gate
    to: failed
    event: error

  - from: sanity_check
    to: failed
    event: error

  # ── REVISE LOOP ────────────────────────────────────────────────────

  - from: judge
    to: plan
    event: revise

  # ── FAILURE PATHS ──────────────────────────────────────────────────

  - from: setup
    to: failed
    event: error

  - from: plan
    to: failed
    event: error

  - from: capture_fr
    to: failed
    event: error

  - from: judge
    to: failed
    event: reject

  - from: judge
    to: failed
    event: error

  - from: enforce_session
    to: failed
    event: error

  - from: done
    to: failed
    event: error

  # ── TIMEOUTS ───────────────────────────────────────────────────────

  - from: plan
    to: failed
    event: "timeout(600)"

  - from: judge
    to: failed
    event: "timeout(600)"

  - from: enforce_session
    to: failed
    event: "timeout(3600)"

  # ── FAILED → TERMINAL ──────────────────────────────────────────────

  - from: failed
    to: stopped
    event: cleanup_done

  # ── GLOBAL SHUTDOWN ────────────────────────────────────────────────

  - from: "*"
    to: stopped
    event: stop

actions:
  # ── SETUP ──────────────────────────────────────────────────────────
  # Preflight checks + worktree creation. Captures wt_dir, wt_branch, main_dir.

  setup:
    - type: bash_context
      command: "bash .chaplain/lib/watcher/preflight.sh && bash .chaplain/lib/watcher/worktree_setup.sh --topic {topic_file} --branch-prefix {branch_prefix} --work-dir {work_dir}"
      capture_keys: [wt_dir, wt_branch, main_dir]
      success: setup_done
      error: error
      timeout: 30
      description: "🔧 Preflight + worktree setup"

  # ── PLAN ───────────────────────────────────────────────────────────
  # Single copilot invocation: FR drafting + research + acceptance tests +
  # verify-red. Captures session_id for continuation by judge + enforce.

  plan:
    - type: yamlgraph_async
      graph: .chaplain/graphs/watcher-plan/step-plan-unified.yaml
      vars:
        topic_file: "{topic_file}"
        worktree_dir: "{wt_dir}"
        branch: "{wt_branch}"
        project: "{project}"
        fr_template: "{fr_template}"
        architecture_doc: "{architecture_doc}"
      success: plan_done
      error: error
      timeout: 600
      description: "📝 Planning (unified: FR + research + tests + verify-red)"

  # ── CAPTURE FR PATH ─────────────────────────────────────────────────
  # Lightweight state: find the newest FR created by the plan step (not inherited from main).

  capture_fr:
    - type: bash_context
      command: "cd {wt_dir} && FR_TEMPLATE=\"{fr_template}\" && FR_DIR=$(dirname \"$FR_TEMPLATE\") && FR_GLOB=\"$FR_DIR/FR-*.md\" && FR=$( { git diff --name-only main -- \"$FR_GLOB\" 2>/dev/null; git ls-files --others --exclude-standard -- \"$FR_GLOB\" 2>/dev/null; } | sort -u | tail -1) && [ -n \"$FR\" ] && echo \"{\\\"fr_path\\\": \\\"$FR\\\"}\" || (echo \"No new FR found under $FR_GLOB — plan did not create one\" >&2 && exit 1)"
      capture_keys: [fr_path]
      success: fr_captured
      error: error
      timeout: 10
      description: "🔍 Capture FR path from plan artifacts (changed or untracked, not inherited from main)"

  # ── JUDGE ──────────────────────────────────────────────────────────
  # Fresh session, DIFFERENT MODEL from plan — no shared context, no anchoring.
  # Evaluates only committed artifacts (FR + research), not plan's reasoning.

  judge:
    - type: yamlgraph_async
      graph: .chaplain/graphs/watcher-plan/step-judge-v2.yaml
      vars:
        topic_file: "{topic_file}"
        fr_path: "{fr_path}"
      event_map:
        APPROVE: approve
        AMEND: revise
        REJECT: reject
        SPLIT: revise
      success: error
      error: error
      timeout: 600
      description: "⚖️ Judging feature request (model B — fresh eyes)"

  # ── ENFORCE SESSION ────────────────────────────────────────────────
  # Single copilot session with resume: the implement→precommit→pytest→fix
  # loop runs INSIDE one invocation. No FSM transitions for retries.

  enforce_session:
    - type: yamlgraph_async
      graph: .chaplain/graphs/watcher-enforce/enforce-session.yaml
      vars:
        fr_path: "{fr_path}"
        worktree_dir: "{wt_dir}"
        branch: "{wt_branch}"
      success: enforce_done
      error: error
      timeout: 3600
      description: "🔨 Enforce session (implement only)"

  # ── VALIDATE FIX ───────────────────────────────────────────────────
  # Fresh copilot session: reads FR + precommit failure output,
  # runs ruff fix/format + pytest, commits remediation.

  validate_fix:
    - type: yamlgraph_async
      graph: .chaplain/graphs/watcher-enforce/validate-session.yaml
      vars:
        fr_path: "{fr_path}"
        worktree_dir: "{wt_dir}"
        branch: "{wt_branch}"
        precommit_output: "{precommit_output}"
        validate_gate_output: "{validate_gate_output}"
      success: validate_done
      error: error
      timeout: 600
      description: "🛠️ Validate fix session (mechanical remediation)"

  # ── SANITY CHECK ────────────────────────────────────────────────────
  # Fresh copilot session: post-validate review of FR/code alignment,
  # diff proportionality, test quality, and diary reflection output.

  sanity_check:
    - type: yamlgraph_async
      graph: .chaplain/graphs/watcher-enforce/sanity-check-session.yaml
      vars:
        fr_path: "{fr_path}"
        worktree_dir: "{wt_dir}"
        branch: "{wt_branch}"
        topic_file: "{topic_file}"
      event_map:
        PASS: pass
        WARN: warn
      success: pass
      error: error
      timeout: 600
      description: "🧭 Sanity check (post-validate review + diary)"

  # ── VALIDATE GATE ──────────────────────────────────────────────────
  # Deterministic CI-parity gate — no LLM.

  validate_gate:
    - type: validate_gate
      max_attempts: 5
      success: pass
      retry: fix_needed
      error: error
      cwd: "{wt_dir}"
      description: "🔒 Validate gate (pre-commit + title + branch + diary parity)"

  # ── DONE ───────────────────────────────────────────────────────────
  # Push, create PR, wait CI, merge, cleanup — single compound script.

  done:
    - type: bash
      command: |
        set -e
        cd {wt_dir}
        git push origin {wt_branch} --force-with-lease
        # Derive PR title from branch primary implementation commit.
        PR_TITLE=$(bash .chaplain/lib/watcher/select_primary_pr_title.sh)
        if PR_URL=$(gh pr create --title "$PR_TITLE" --body "" --head {wt_branch} 2>/dev/null); then
          :
        else
          PR_URL=$(gh pr view {wt_branch} --json url -q .url)
        fi
        PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
        gh pr edit "$PR_NUM" --title "$PR_TITLE" >/dev/null 2>&1 || true
        echo "Created/found PR #${PR_NUM}: ${PR_URL}"
        bash {main_dir}/.chaplain/lib/watcher/wait_ci.sh --pr "$PR_NUM"
        bash {main_dir}/.chaplain/lib/watcher/merge_pr.sh --pr "$PR_NUM"
        bash {main_dir}/.chaplain/lib/watcher/worktree_teardown.sh --dir {wt_dir}
        cd {main_dir}
        PR_NUMBER="$PR_NUM" PR_TITLE="$PR_TITLE" TOPIC_FILE="{main_dir}/{topic_file}" bash {main_dir}/.chaplain/lib/watcher/post_merge.sh 2>/dev/null || true
      success: completed
      error: error
      timeout: 300
      description: "📤 Push → PR → CI → Merge → Cleanup"

  # ── TERMINAL STATES ────────────────────────────────────────────────

  failed:
    - type: bash
      command: |
        mkdir -p .chaplain/failed
        if [ -n "{topic_file}" ] && [ -f "{topic_file}" ]; then
          mv "{topic_file}" .chaplain/failed/
        fi
      success: cleanup_done
      error: cleanup_done
      description: "❌ Pipeline failed — moving topic to failed/"

  stopped:
    - type: bash
      command: "echo 'Pipeline stopped via external signal'"
      description: "🛑 Pipeline stopped"
