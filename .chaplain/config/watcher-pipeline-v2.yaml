# Watcher2 Pipeline Worker FSM — v2
# FR-305: Collapsed 20+ states into operational states + terminals.
# FR-310: Added validate + precommit_check post-enforce gate.
#
# Flow: setup → plan → commit_plan → judge →(approve)→ enforce_session
#                                      ↑ revise       │ enforce_done
#                                      └────────┘     ▼
#                               validate ← fix_needed ← precommit_check
#                                  │ validate_done         │ pass
#                                  └──→ precommit_check ──→ done
#                                          │ error (max 5)
#                                          ▼
#                                        failed

metadata:
  name: "Watcher2 Pipeline Worker v2"
  machine_name: watcher-pipeline-v2
  version: "1.0.0"

initial_state: setup

states:
  # === OPERATIONAL STATES ===
  - setup
  - plan
  - commit_plan
  - judge
  - enforce_session
  - validate
  - precommit_check
  - done

  # === TERMINAL STATES ===
  - completed
  - failed
  - stopped

events:
  setup_done:
    context_map:
      wt_dir: payload.wt_dir
      wt_branch: payload.wt_branch
      main_dir: payload.main_dir
  plan_done: {}
  committed: {}
  approve: {}
  revise: {}
  reject: {}
  enforce_done: {}
  validate_done: {}
  fix_needed: {}
  pass: {}
  completed: {}
  error: {}
  stop: {}
  "timeout(600)": {}
  "timeout(900)": {}

transitions:
  # ── HAPPY PATH ─────────────────────────────────────────────────────

  - from: setup
    to: plan
    event: setup_done

  - from: plan
    to: commit_plan
    event: plan_done

  - from: commit_plan
    to: judge
    event: committed

  - from: judge
    to: enforce_session
    event: approve

  - from: enforce_session
    to: validate
    event: enforce_done

  - from: validate
    to: precommit_check
    event: validate_done

  - from: precommit_check
    to: done
    event: pass

  - from: done
    to: completed
    event: completed

  # ── VALIDATE / PRECOMMIT LOOP ──────────────────────────────────────

  - from: precommit_check
    to: validate
    event: fix_needed

  - from: precommit_check
    to: failed
    event: error

  # ── REVISE LOOP ────────────────────────────────────────────────────

  - from: judge
    to: plan
    event: revise

  # ── FAILURE PATHS ──────────────────────────────────────────────────

  - from: setup
    to: failed
    event: error

  - from: plan
    to: failed
    event: error

  - from: commit_plan
    to: failed
    event: error

  - from: judge
    to: failed
    event: reject

  - from: judge
    to: failed
    event: error

  - from: enforce_session
    to: failed
    event: error

  - from: done
    to: failed
    event: error

  # ── TIMEOUTS ───────────────────────────────────────────────────────

  - from: plan
    to: failed
    event: "timeout(600)"

  - from: judge
    to: failed
    event: "timeout(600)"

  - from: enforce_session
    to: failed
    event: "timeout(900)"

  # ── GLOBAL SHUTDOWN ────────────────────────────────────────────────

  - from: "*"
    to: stopped
    event: stop

actions:
  # ── SETUP ──────────────────────────────────────────────────────────
  # Preflight checks + worktree creation. Captures wt_dir, wt_branch, main_dir.

  setup:
    - type: bash_context
      command: "bash .chaplain/lib/watcher/preflight.sh && bash .chaplain/lib/watcher/worktree_setup.sh --topic {topic_file}"
      capture_keys: [wt_dir, wt_branch, main_dir]
      success: setup_done
      error: error
      timeout: 30
      description: "🔧 Preflight + worktree setup"

  # ── PLAN ───────────────────────────────────────────────────────────
  # Single copilot invocation: FR drafting + research + acceptance tests +
  # verify-red. Captures session_id for continuation by judge + enforce.

  plan:
    - type: yamlgraph_async
      graph: .chaplain/graphs/watcher-plan/step-plan-unified.yaml
      vars:
        topic_file: "{topic_file}"
        worktree_dir: "{wt_dir}"
        branch: "{wt_branch}"
      success: plan_done
      error: error
      timeout: 600
      description: "📝 Planning (unified: FR + research + tests + verify-red)"

  # ── COMMIT PLAN ────────────────────────────────────────────────────
  # Commits all planning artifacts in one atomic commit.

  commit_plan:
    - type: git_commit
      message: "chore(watcher): plan artifacts — {topic_file}"
      add_paths: ["."]
      capture_fr_path: true
      success: committed
      error: error
      description: "💾 Committing plan artifacts"

  # ── JUDGE ──────────────────────────────────────────────────────────
  # Fresh session, DIFFERENT MODEL from plan — no shared context, no anchoring.
  # Evaluates only committed artifacts (FR + research), not plan's reasoning.

  judge:
    - type: yamlgraph_async
      graph: .chaplain/graphs/watcher-plan/step-judge-v2.yaml
      vars:
        topic_file: "{topic_file}"
        fr_path: "{fr_path}"
      event_map:
        APPROVE: approve
        AMEND: revise
        REJECT: reject
        SPLIT: revise
      success: error
      error: error
      timeout: 600
      description: "⚖️ Judging feature request (model B — fresh eyes)"

  # ── ENFORCE SESSION ────────────────────────────────────────────────
  # Single copilot session with resume: the implement→precommit→pytest→fix
  # loop runs INSIDE one invocation. No FSM transitions for retries.

  enforce_session:
    - type: yamlgraph_async
      graph: .chaplain/graphs/watcher-enforce/enforce-session.yaml
      vars:
        fr_path: "{fr_path}"
        worktree_dir: "{wt_dir}"
        branch: "{wt_branch}"
      success: enforce_done
      error: error
      timeout: 900
      description: "🔨 Enforce session (implement only)"

  # ── VALIDATE ───────────────────────────────────────────────────────
  # Fresh copilot session: reads FR + precommit failure output,
  # runs ruff fix/format + pytest, commits remediation.

  validate:
    - type: yamlgraph_async
      graph: .chaplain/graphs/watcher-enforce/validate-session.yaml
      vars:
        fr_path: "{fr_path}"
        worktree_dir: "{wt_dir}"
        branch: "{wt_branch}"
        precommit_output: "{precommit_output}"
      success: validate_done
      error: error
      timeout: 600
      description: "🔍 Validate session (ruff + pytest remediation)"

  # ── PRECOMMIT CHECK ────────────────────────────────────────────────
  # Mechanical gate — no LLM. Uses precommit action with retry loop.

  precommit_check:
    - type: precommit
      max_attempts: 5
      success: pass
      retry: fix_needed
      cwd: "{wt_dir}"
      description: "🔒 Pre-commit gate (mechanical)"

  # ── DONE ───────────────────────────────────────────────────────────
  # Push, create PR, wait CI, merge, cleanup — single compound script.

  done:
    - type: bash
      command: |
        set -e
        cd {wt_dir}
        git push origin {wt_branch} --force-with-lease
        # Derive PR title from latest commit (already Conventional Commits format)
        PR_TITLE=$(git log -1 --format=%s)
        PR_URL=$(gh pr create --title "$PR_TITLE" --body "" --head {wt_branch} 2>/dev/null || gh pr view {wt_branch} --json url -q .url)
        PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
        echo "Created/found PR #${PR_NUM}: ${PR_URL}"
        bash {main_dir}/.chaplain/lib/watcher/wait_ci.sh --pr "$PR_NUM"
        gh pr merge "$PR_NUM" --squash --delete-branch
        bash {main_dir}/.chaplain/lib/watcher/worktree_teardown.sh --dir {wt_dir}
        rm -f {topic_file}
        bash {main_dir}/.chaplain/lib/watcher/post_merge.sh 2>/dev/null || true
      success: completed
      error: error
      timeout: 300
      description: "📤 Push → PR → CI → Merge → Cleanup"

  # ── TERMINAL STATES ────────────────────────────────────────────────

  failed:
    - type: bash
      command: |
        mkdir -p .chaplain/failed
        if [ -n "{topic_file}" ] && [ -f "{topic_file}" ]; then
          mv "{topic_file}" .chaplain/failed/
        fi
      description: "❌ Pipeline failed — moving topic to failed/"

  stopped:
    - type: bash
      command: "echo 'Pipeline stopped via external signal'"
      description: "🛑 Pipeline stopped"
