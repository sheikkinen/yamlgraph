# Watcher2 Integration Dispatcher — No-LLM End-to-End Test
# FR-301: Polls .chaplain/inbox-integration/ and runs watcher-pipeline.yaml with stubs.
# FR-303: Uses unified pipeline with --actions-dir .chaplain/actions-stub.
# Same structure as watcher-dispatcher.yaml but isolated inbox + stub actions.

metadata:
  name: "Integration Dispatcher (No-LLM)"
  machine_name: integration-dispatcher
  version: "1.0.0"

# Override with --initial-context '{"inbox_dir":".chaplain/inbox-integration"}'
context:
  inbox_dir: ".chaplain/inbox-integration"

initial_state: idle

states:
  # === OPERATIONAL ===
  - idle
  - syncing_inbox
  - processing_topic
  # === TERMINAL ===
  - stopped

events:
  - "timeout(10)"
  - topic_found
  - no_topics
  - topic_done
  - error
  - stop

transitions:
  # Polling loop: idle waits 10s then syncs inbox
  - from: idle
    to: syncing_inbox
    event: "timeout(10)"

  # Topic found — move to processing/ and run pipeline
  - from: syncing_inbox
    to: processing_topic
    event: topic_found

  # No topics — return to idle
  - from: syncing_inbox
    to: idle
    event: no_topics

  # Pipeline completed — return to idle
  - from: processing_topic
    to: idle
    event: topic_done

  # Pipeline error — return to idle (topic moved to failed/ by pipeline)
  - from: processing_topic
    to: idle
    event: error

  # Global shutdown
  - from: "*"
    to: stopped
    event: stop

actions:
  syncing_inbox:
    # Find first topic in integration inbox, move to processing/
    # No GitHub issue sync — integration test uses local files only
    - type: bash_context
      command: |
        topic=$(ls -1 {inbox_dir}/*.md 2>/dev/null | head -1)
        if [ -z "$topic" ]; then
          echo '{"found": "false"}'
          exit 1
        fi
        mkdir -p .chaplain/processing
        basename=$(basename "$topic")
        mv "$topic" ".chaplain/processing/$basename"
        echo "{\"topic_file\": \".chaplain/processing/$basename\", \"found\": \"true\"}"
      capture_keys: ["topic_file"]
      success: topic_found
      error: no_topics
      description: "📥 Find next integration test topic"

  processing_topic:
    # Run the unified pipeline FSM for this topic (with stubs via --actions-dir)
    - type: bash
      command: |
        TOPIC="{topic_file}"
        BASENAME=$(basename "$TOPIC" .md)
        LOG="logs/fsm-integration-${BASENAME}-$(date +%Y%m%d-%H%M%S).log"
        ls -1t logs/fsm-integration-*.log 2>/dev/null | tail -n +11 | xargs rm -f 2>/dev/null || true
        statemachine .chaplain/config/watcher-pipeline.yaml \
          --actions-dir .chaplain/actions-stub \
          --initial-context "{\"topic_file\":\"$TOPIC\",\"merge_flags\":\"\",\"pr_title_flag\":\"--title \\\"docs(integration): smoke test\\\"\",\"post_merge_cmd\":\"echo done\",\"plan_commit_msg\":\"docs: integration plan — $TOPIC\"}" \
          --debug \
          2>&1 | tee "$LOG"
      success: topic_done
      error: error
      timeout: 900
      description: "🚀 Run unified pipeline for topic (stub profile)"
