# Watcher2 Integration Pipeline — No-LLM End-to-End Test
# FR-301: All yamlgraph_async (LLM) steps replaced with bash stubs.
# Purpose: Prove mechanical pipeline (git, PR, CI, merge) works without tokens.
#
# ── STATE MAPPING (production → integration) ──────────────────────
# REAL (same action type as production):
#   preflight         bash_context   — real preflight.sh
#   worktree_setup    bash_context   — real worktree_setup.sh
#   committing_plan   git_commit     — real git_commit action (A1)
#   committing_research git_commit   — real git_commit action (A1)
#   committing_implementation git_commit — real git_commit action (A1)
#   finalizing        precommit      — real pre-commit run
#   pushing           bash           — real git push
#   creating_pr       bash_context   — real create_pr.sh
#   waiting_ci        bash_context   — real wait_ci.sh
#   merging           bash           — real gh pr merge
#   cleaning_up       bash           — real worktree_teardown.sh
#
# STUBBED (yamlgraph_async → bash echo):
#   planning          bash           — echo timestamp to docs/watcher-integration.md
#   researching       bash           — echo timestamp to docs/watcher-integration.md
#   judging           bash           — echo timestamp, always emits "approve"
#   implementing      bash           — echo timestamp to docs/watcher-integration.md
#
# REMOVED (not needed without real LLM):
#   writing_tests     — no test code to write in stub mode
#   verifying_red     — no tests to verify
#   testing_demo      — no implementation to demo
#   critiquing        — no implementation to critique
#   remediating_ci    — docs-only changes; CI won't fail
#   forensics         — replaced by simplified failure path (A3)
# ──────────────────────────────────────────────────────────────────

metadata:
  name: "Integration Pipeline (No-LLM)"
  machine_name: integration-pipeline
  version: "1.0.0"

initial_state: preflight

states:
  # === PLANNING PHASE ===
  - preflight
  - worktree_setup
  - planning
  - committing_plan
  - researching
  - committing_research
  - judging

  # === ENFORCEMENT PHASE ===
  - implementing
  - committing_implementation
  - finalizing
  - pushing
  - creating_pr
  - waiting_ci
  - merging
  - cleaning_up

  # === TERMINAL STATES ===
  - completed
  - failed
  - stopped

events:
  preflight_done: {}
  worktree_ready:
    context_map:
      wt_dir: payload.wt_dir
      wt_branch: payload.wt_branch
      main_dir: payload.main_dir
  plan_done: {}
  plan_committed: {}
  research_done: {}
  research_committed: {}
  approve: {}
  implement_done: {}
  implementation_committed: {}
  finalize_done: {}
  precommit_retry: {}
  pushed: {}
  pr_created:
    context_map:
      pr_number: payload.pr_number
      pr_url: payload.pr_url
  ci_passed: {}
  ci_failed: {}
  merged: {}
  cleaned_up: {}
  stop: {}
  error: {}
  failed: {}
  job_done: {}
  "timeout(300)": {}

transitions:
  # ── PLANNING PHASE ──────────────────────────────────────────────────

  - from: preflight
    to: worktree_setup
    event: preflight_done

  - from: worktree_setup
    to: planning
    event: worktree_ready

  - from: planning
    to: committing_plan
    event: plan_done

  - from: committing_plan
    to: researching
    event: plan_committed

  - from: researching
    to: committing_research
    event: research_done

  - from: committing_research
    to: judging
    event: research_committed

  - from: judging
    to: implementing
    event: approve

  # ── ENFORCEMENT PHASE ──────────────────────────────────────────────

  - from: implementing
    to: committing_implementation
    event: implement_done

  - from: committing_implementation
    to: finalizing
    event: implementation_committed

  # Finalizing retry loop (pre-commit fix cycle, capped at 5)
  - from: finalizing
    to: finalizing
    event: precommit_retry

  - from: finalizing
    to: pushing
    event: finalize_done

  # precommit action emits "failed" (not "error") when max_attempts exceeded
  - from: finalizing
    to: failed
    event: failed

  # failed cleanup completes → stop the machine
  - from: failed
    to: stopped
    event: job_done

  # completed action completes → stop the machine
  - from: completed
    to: stopped
    event: job_done

  - from: pushing
    to: creating_pr
    event: pushed

  - from: creating_pr
    to: waiting_ci
    event: pr_created

  - from: waiting_ci
    to: merging
    event: ci_passed

  # CI failure goes straight to failed (no remediation in integration test)
  - from: waiting_ci
    to: failed
    event: ci_failed

  - from: merging
    to: cleaning_up
    event: merged

  - from: cleaning_up
    to: completed
    event: cleaned_up

  # ── FAILURE PATH (A3) ─────────────────────────────────────────────

  - from: preflight
    to: failed
    event: error

  - from: worktree_setup
    to: failed
    event: error

  - from: planning
    to: failed
    event: error

  - from: committing_plan
    to: failed
    event: error

  - from: researching
    to: failed
    event: error

  - from: committing_research
    to: failed
    event: error

  - from: judging
    to: failed
    event: error

  - from: implementing
    to: failed
    event: error

  - from: committing_implementation
    to: failed
    event: error

  - from: finalizing
    to: failed
    event: error

  - from: pushing
    to: failed
    event: error

  - from: creating_pr
    to: failed
    event: error

  - from: merging
    to: failed
    event: error

  - from: cleaning_up
    to: failed
    event: error

  # ── TIMEOUTS ───────────────────────────────────────────────────────

  - from: planning
    to: failed
    event: "timeout(300)"

  - from: researching
    to: failed
    event: "timeout(300)"

  - from: judging
    to: failed
    event: "timeout(300)"

  - from: implementing
    to: failed
    event: "timeout(300)"

  - from: waiting_ci
    to: failed
    event: "timeout(300)"

  # ── GLOBAL SHUTDOWN ────────────────────────────────────────────────

  - from: "*"
    to: stopped
    event: stop

actions:
  # ── PLANNING PHASE ──────────────────────────────────────────────────

  preflight:
    - type: bash_context
      command: "bash .chaplain/lib/watcher/preflight.sh"
      capture_keys: []
      success: preflight_done
      error: error
      description: "🔧 Running preflight checks"

  worktree_setup:
    - type: bash_context
      command: "bash .chaplain/lib/watcher/worktree_setup.sh --topic {topic_file}"
      capture_keys: [wt_dir, wt_branch, main_dir]
      success: worktree_ready
      error: error
      description: "📁 Setting up worktree"

  # STUB: replaces yamlgraph_async planning
  planning:
    - type: bash
      command: |
        cd {wt_dir}
        mkdir -p docs
        echo "## $(date -u +%Y-%m-%dT%H:%M:%SZ) — planning" >> docs/watcher-integration.md
        echo "" >> docs/watcher-integration.md
        git add docs/watcher-integration.md
        git commit -m "docs: integration — planning" --no-verify
      success: plan_done
      error: error
      timeout: 30
      description: "📝 [STUB] Planning"

  # REAL: same git_commit action type as production (A1)
  committing_plan:
    - type: git_commit
      message: "docs: integration plan — {topic_file}"
      add_paths: ["docs/"]
      success: plan_committed
      error: error
      description: "💾 Committing plan"

  # STUB: replaces yamlgraph_async researching
  researching:
    - type: bash
      command: |
        cd {wt_dir}
        echo "## $(date -u +%Y-%m-%dT%H:%M:%SZ) — researching" >> docs/watcher-integration.md
        echo "" >> docs/watcher-integration.md
        git add docs/watcher-integration.md
        git commit -m "docs: integration — researching" --no-verify
      success: research_done
      error: error
      timeout: 30
      description: "🔬 [STUB] Researching"

  # REAL: same git_commit action type as production (A1)
  committing_research:
    - type: git_commit
      message: "docs: integration research — {topic_file}"
      add_paths: ["."]
      success: research_committed
      error: error
      description: "💾 Committing research"

  # STUB: replaces yamlgraph_async judging — always approves
  judging:
    - type: bash
      command: |
        cd {wt_dir}
        echo "## $(date -u +%Y-%m-%dT%H:%M:%SZ) — judging (auto-approve)" >> docs/watcher-integration.md
        echo "" >> docs/watcher-integration.md
        git add docs/watcher-integration.md
        git commit -m "docs: integration — judging" --no-verify
      success: approve
      error: error
      timeout: 30
      description: "⚖️ [STUB] Judging (auto-approve)"

  # ── ENFORCEMENT PHASE ──────────────────────────────────────────────

  # STUB: replaces yamlgraph_async implementing
  implementing:
    - type: bash
      command: |
        cd {wt_dir}
        echo "## $(date -u +%Y-%m-%dT%H:%M:%SZ) — implementing" >> docs/watcher-integration.md
        echo "" >> docs/watcher-integration.md
        git add docs/watcher-integration.md
        git commit -m "docs: integration — implementing" --no-verify
      success: implement_done
      error: error
      timeout: 30
      description: "🔨 [STUB] Implementing"

  # REAL: same git_commit action type as production (A1)
  committing_implementation:
    - type: git_commit
      message: "docs: integration implementation — {topic_file}"
      add_paths: ["."]
      success: implementation_committed
      error: error
      description: "💾 Committing implementation"

  finalizing:
    - type: precommit
      max_attempts: 5
      success: finalize_done
      retry: precommit_retry
      description: "✨ Finalizing (pre-commit)"

  pushing:
    - type: bash
      command: "cd {wt_dir} && git push origin {wt_branch} --force-with-lease"
      success: pushed
      error: error
      description: "📤 Pushing to remote"

  creating_pr:
    - type: bash_context
      command: >-
        bash .chaplain/lib/watcher/create_pr.sh
        --branch {wt_branch}
        --dir {wt_dir}
        --title "docs(integration): smoke test"
      capture_keys: [pr_number, pr_url]
      success: pr_created
      error: error
      description: "🔗 Creating PR"

  waiting_ci:
    - type: bash_context
      command: "bash .chaplain/lib/watcher/wait_ci.sh --pr {pr_number}"
      capture_keys: [ci_result]
      timeout: 660
      success: ci_passed
      error: ci_failed
      description: "⏳ Waiting for CI"

  merging:
    - type: bash
      command: "gh pr merge {pr_number} --squash --delete-branch"
      success: merged
      error: error
      description: "🔀 Merging PR"

  cleaning_up:
    - type: bash
      command: |
        bash .chaplain/lib/watcher/worktree_teardown.sh --dir {wt_dir}
        rm -f {topic_file}
      success: cleaned_up
      error: error
      description: "🧹 Cleaning up worktree and topic file"

  # ── TERMINAL STATES ────────────────────────────────────────────────

  completed:
    - type: bash
      command: "echo '✅ Integration pipeline completed successfully'"
      description: "✅ Pipeline completed"

  # A3: Simplified failure path — cleanup without forensics
  failed:
    - type: bash
      command: |
        echo "❌ Integration pipeline failed"
        # Tear down worktree if it exists
        if [ -n "{wt_dir}" ] && [ -d "{wt_dir}" ]; then
          bash .chaplain/lib/watcher/worktree_teardown.sh --dir {wt_dir} || true
        fi
        # Delete remote branch if it exists
        if [ -n "{wt_branch}" ]; then
          git push origin --delete {wt_branch} 2>/dev/null || true
        fi
        # Close PR if it exists
        if [ -n "{pr_number}" ]; then
          gh pr close {pr_number} 2>/dev/null || true
        fi
        # Move topic to failed/
        mkdir -p .chaplain/failed
        if [ -n "{topic_file}" ] && [ -f "{topic_file}" ]; then
          mv "{topic_file}" .chaplain/failed/
        fi
      description: "❌ Integration test failed — cleaning up"
