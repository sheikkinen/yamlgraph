# Watcher2 Dispatcher FSM
# Sequential controller: poll inbox → pick one topic → run pipeline → repeat.
# Phase 2: inbox_dir configurable via --initial-context for test/production isolation.

metadata:
  name: "Watcher2 Dispatcher"
  machine_name: watcher-dispatcher
  version: "1.2.0"

# Default context — override with --initial-context '{"inbox_dir":".chaplain/inbox-fsm"}'
context:
  inbox_dir: ".chaplain/inbox"
  last_audit_ts: 0

initial_state: idle

states:
  # === OPERATIONAL ===
  - idle
  - syncing_inbox
  - auditing
  - processing_topic
  # === TERMINAL ===
  - stopped

events:
  - "timeout(10)"
  - topic_found
  - no_topics
  - audit_needed
  - audit_done
  - topic_done
  - error
  - stop

transitions:
  # Polling loop: idle waits 10s then syncs inbox
  - from: idle
    to: syncing_inbox
    event: "timeout(10)"

  # Topic found — move to processing/ and run pipeline
  - from: syncing_inbox
    to: processing_topic
    event: topic_found

  # No topics — return to idle
  - from: syncing_inbox
    to: idle
    event: no_topics

  # No topics and cadence elapsed — run inquisitor audit
  - from: syncing_inbox
    to: auditing
    event: audit_needed

  # Audit completed or failed — continue polling loop
  - from: auditing
    to: idle
    event: audit_done

  - from: auditing
    to: idle
    event: error

  # Pipeline completed — return to idle
  - from: processing_topic
    to: idle
    event: topic_done

  # Pipeline error — return to idle (topic moved to failed/ by pipeline)
  - from: processing_topic
    to: idle
    event: error

  # Global shutdown
  - from: "*"
    to: stopped
    event: stop

actions:
  syncing_inbox:
    # Sync GitHub issues, find first topic, move to processing/
    # inbox_dir is configurable via --initial-context '{"inbox_dir":".chaplain/inbox-fsm"}'
    - type: syncing_inbox
      capture_keys:
        - topic_file
        - project
        - branch_prefix
        - work_dir
        - test_cmd
        - precommit_config
        - fr_template
        - architecture_doc
      audit_needed: audit_needed
      success: topic_found
      error: no_topics
      description: "📥 Sync inbox and find next topic"

  auditing:
    - type: audit
      success: audit_done
      error: error
      description: "🔎 Run inquisitor audit cadence"

  processing_topic:
    # Run the pipeline FSM for this topic
    # Note: {topic_file} is substituted by bash action from context.
    # The remaining {..} in the JSON string triggers a harmless placeholder warning.
    - type: bash
      command: |
        TOPIC="{topic_file}"
        mkdir -p logs
        BASENAME=$(basename "$TOPIC" .md)
        LOG="logs/fsm-pipeline-${BASENAME}-$(date +%Y%m%d-%H%M%S).log"
        ls -1t logs/fsm-pipeline-*.log 2>/dev/null | tail -n +21 | xargs rm -f 2>/dev/null || true
        echo "Pipeline log: $LOG"
        statemachine .chaplain/config/watcher-pipeline-v2.yaml \
          --actions-dir .chaplain/actions \
          --initial-context "{\"topic_file\":\"$TOPIC\",\"project\":\"{project}\",\"branch_prefix\":\"{branch_prefix}\",\"work_dir\":\"{work_dir}\",\"test_cmd\":\"{test_cmd}\",\"precommit_config\":\"{precommit_config}\",\"fr_template\":\"{fr_template}\",\"architecture_doc\":\"{architecture_doc}\",\"merge_flags\":\"\",\"pr_title_flag\":\"\",\"post_merge_cmd\":\"bash .chaplain/lib/watcher/post_merge.sh 2>/dev/null || true\",\"plan_commit_msg\":\"chore(watcher): plan artifacts\"}" \
          --debug \
          2>&1 | tee "$LOG"
      success: topic_done
      error: error
      timeout: 1800
      description: "🚀 Run pipeline for topic"
