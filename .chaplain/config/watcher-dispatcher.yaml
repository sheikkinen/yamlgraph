# Watcher2 Dispatcher FSM
# Sequential controller: poll inbox → pick one topic → run pipeline → repeat.
# Phase 1: Real actions wired, sequential single-topic processing.

metadata:
  name: "Watcher2 Dispatcher"
  machine_name: watcher2_dispatcher
  version: "1.0.0"

initial_state: idle

states:
  - idle
  - syncing_inbox
  - processing_topic
  - stopped

events:
  - "timeout(10)"
  - topic_found
  - no_topics
  - topic_done
  - error
  - stop

transitions:
  # Polling loop: idle waits 10s then syncs inbox
  - from: idle
    to: syncing_inbox
    event: "timeout(10)"

  # Topic found — move to processing/ and run pipeline
  - from: syncing_inbox
    to: processing_topic
    event: topic_found

  # No topics — return to idle
  - from: syncing_inbox
    to: idle
    event: no_topics

  # Pipeline completed — return to idle
  - from: processing_topic
    to: idle
    event: topic_done

  # Pipeline error — return to idle (topic moved to failed/ by pipeline)
  - from: processing_topic
    to: idle
    event: error

  # Global shutdown
  - from: "*"
    to: stopped
    event: stop

actions:
  syncing_inbox:
    # Sync GitHub issues, find first topic, move to processing/
    - type: bash_context
      command: |
        bash .chaplain/lib/watcher/inbox_sync.sh 2>/dev/null || true
        topic=$(ls -1 .chaplain/inbox/*.md 2>/dev/null | head -1)
        if [ -z "$topic" ]; then
          echo '{"found": "false"}'
          exit 1
        fi
        mkdir -p .chaplain/processing
        basename=$(basename "$topic")
        mv "$topic" ".chaplain/processing/$basename"
        echo "{\"topic_file\": \".chaplain/processing/$basename\", \"found\": \"true\"}"
      capture_keys: ["topic_file"]
      success: topic_found
      error: no_topics
      description: "📥 Sync inbox and find next topic"

  processing_topic:
    # Run the pipeline FSM for this topic
    - type: bash
      command: >-
        statemachine .chaplain/config/watcher-pipeline.yaml
        --actions-dir .chaplain/actions
        --context topic_file={topic_file}
      success: topic_done
      error: error
      timeout: 1800
      description: "🚀 Run pipeline for topic"
