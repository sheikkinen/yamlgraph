# FR-305: Judge step v2 — fresh session, different model
# Design: judge MUST NOT share session with plan (no anchoring bias).
# Uses a DIFFERENT model from plan to catch different classes of errors.
# Evaluates only committed artifacts (FR file + research), not plan reasoning.

version: "1.0"
name: watcher-judge-v2
description: "FR-305 — Judge with model independence (fresh session, different model)"

prompts_relative: true
prompts_dir: ../copilot/prompts

state:
  topic_file: str
  fr_path: str
  judge_result: dict

nodes:
  judge:
    type: copilot
    prompt: judge
    backend: cli
    cli_flags:
      model: claude-sonnet-4
      allow_all_paths: true
      allow_all_tools: true
    variables:
      fr_path: "{state.fr_path}"
      topic_file: "{state.topic_file}"
    state_key: judge_result
    timeout: 600

edges:
  - from: START
    to: judge
  - from: judge
    to: END
