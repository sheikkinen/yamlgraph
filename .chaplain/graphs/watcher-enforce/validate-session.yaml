# FR-310/FR-316: Validate Fix Session graph
# Fresh copilot session for post-enforce remediation.
# Reads FR + deterministic gate diagnostics, applies mechanical fixes, commits.

version: "1.0"
name: watcher-validate-session
description: "FR-316 — Fresh session for validate_fix remediation"

prompts_relative: true
prompts_dir: ./prompts

state:
  fr_path: str
  worktree_dir: str
  branch: str
  precommit_output: str
  validate_result: dict

nodes:
  validate_fix:
    type: copilot
    prompt: validate-session
    backend: cli
    cli_flags:
      model: claude-sonnet-4-6
      allow_all_paths: true
      allow_all_tools: true
    variables:
      fr_path: "{state.fr_path}"
      worktree_dir: "{state.worktree_dir}"
      branch: "{state.branch}"
      precommit_output: "{state.precommit_output}"
    state_key: validate_result
    timeout: 600

edges:
  - from: START
    to: validate_fix
  - from: validate_fix
    to: END
