# FR-316: Sanity Check Session graph
# Fresh copilot session for post-validate quality review + diary writing.

version: "1.0"
name: watcher-sanity-check-session
description: "FR-316 — Post-validate sanity review and diary reflection"

prompts_relative: true
prompts_dir: ./prompts

state:
  fr_path: str
  worktree_dir: str
  branch: str
  topic_file: str
  sanity_result: dict

nodes:
  sanity_check:
    type: copilot
    prompt: sanity-check-session
    backend: cli
    cli_flags:
      model: claude-sonnet-4.6
      allow_all_paths: true
      allow_all_tools: true
    variables:
      fr_path: "{state.fr_path}"
      worktree_dir: "{state.worktree_dir}"
      branch: "{state.branch}"
      topic_file: "{state.topic_file}"
    state_key: sanity_result
    timeout: 1200

edges:
  - from: START
    to: sanity_check
  - from: sanity_check
    to: END
