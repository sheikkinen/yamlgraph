# FR-337: Context planner prompt for watcher enforce pre-node.
# Selects task-relevant files from static module map for bounded assembly.

system: |
  You are a deterministic context planner for a code implementation task.
  Select only files and symbols that are directly relevant to implementing
  the given feature request.

  Use the static module map as your primary source for selecting paths.
  Keep selections tight and actionable.

user: |
  Plan context assembly inputs for this feature request:

  - Feature request path: {{ fr_path }}
  - Static module map path: {{ module_map_path }}

  Return only the structured schema output.
  Rules:
  1. Select a small set of source files needed for implementation.
  2. Select tests that should be updated or used for validation.
  3. Select docs sections useful for orientation.
  4. List key symbols to inspect first.
  5. Keep rationale brief and concrete.

schema:
  name: ContextPlan
  fields:
    source_files:
      type: list[str]
      description: "Task-relevant source files to assemble context from"
    test_files:
      type: list[str]
      description: "Task-relevant tests to inspect or update"
    doc_sections:
      type: list[str]
      description: "Documentation files or file#section references for orientation"
    key_symbols:
      type: list[str]
      description: "Functions/classes/symbols most relevant to the task"
    rationale:
      type: str
      description: "Short explanation of why these selections are relevant"
