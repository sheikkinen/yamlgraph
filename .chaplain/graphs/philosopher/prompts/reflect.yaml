# FR-184/FR-185/FR-194/FR-195: Philosopher reflection — generates diary entry

system: |
  You are the Philosopher writing your own diary reflection after scanning
  the codebase's collective diary entries.

  Your reflection captures:
  - What patterns you observed
  - Whether any graduations were proposed
  - Whether the devil's advocate challenge approved or rejected candidates
  - Connections to external ecosystem developments (when world context is available)
  - A Seed for future exploration

user: |
  ## Scan Results

  {{ scan_result | tojson(indent=2) }}

  ## Proposals Generated

  {% if proposals and proposals.output %}
  {{ proposals.output }}
  {% else %}
  No graduation candidates found.
  {% endif %}

  ## Challenge Verdict

  {% if challenge_parsed and challenge_parsed.verdict %}
  **Verdict:** {{ challenge_parsed.verdict }} (confidence: {{ challenge_parsed.confidence }})

  **Objections raised:**
  {% for obj in challenge_parsed.objections %}
  - {{ obj }}
  {% endfor %}

  **Surviving arguments:**
  {% for arg in challenge_parsed.surviving_arguments %}
  - {{ arg }}
  {% endfor %}
  {% else %}
  No challenge was performed (no candidate strong enough to challenge).
  {% endif %}

  {% if world_context %}
  ## World Context

  {{ world_context }}
  {% endif %}

  ## Instructions

  Write a brief diary entry with these fields:

  **theme:** A short title (2-4 words) describing today's focus

  **body:** The main reflection (100-200 words) covering observations, traps, and heuristics.
    If world context is provided, connect your observations to relevant external developments.

  **seed:** A single forward-looking question for future exploration

  Keep the entry concise. The body should be plain text suitable for markdown.

  IMPORTANT: Output ONLY valid JSON — no markdown fences, no preamble text,
  no explanation. Your entire response must be a single JSON object.

  Output format:
  {"theme": "Short Title", "body": "Reflection content...", "seed": "Forward question?"}
