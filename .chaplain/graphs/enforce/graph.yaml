# FR-106: End-to-End Enforce Pipeline via Git Worktree
# FR-183: Simplified from 7 nodes to 4 linear nodes
#
# Four-phase pipeline:
# 1. implement         - Read FR, implement with TDD
# 2. test_and_demo     - Run tests, create example/demo
# 3. critique_and_distill - Evaluate against FR criteria + generate diary reflection
# 4. finalize          - Pre-commit checks + commit/push/PR
#
# All phases chain via session continuations (FR-105), creating a single
# conversation thread where each phase has full context from prior phases.
#
# Usage via orchestration script:
#   scripts/enforce_worktree.sh feature-requests/FR-XXX.md

version: "1.0"
name: enforce-pipeline
description: |
  End-to-end feature enforcement in isolated worktree.
  Four phases: implement → test/demo → critique+distill → finalize.
  All phases chain via session continuations (FR-105).

prompts_relative: true
prompts_dir: prompts

state:
  fr_path: str                # Path to the approved feature request
  branch: str                 # Git branch name
  implement_result: dict      # TDD implementation output
  test_result: dict           # Test and demo output
  critique_and_distill_result: dict  # Combined critique + diary reflection
  finalize_result: dict       # Pre-commit + PR output

nodes:
  # Phase 1: Implement with TDD
  # Read the FR, write failing tests, implement minimal change, refactor
  implement:
    type: copilot
    prompt: enforce-implement
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      fr_path: "{state.fr_path}"
      branch: "{state.branch}"
    state_key: implement_result
    timeout: 3600  # 60 min for TDD cycle

  # Phase 2: Test and Demo
  # Run full test suite, create/update examples if applicable
  test_and_demo:
    type: copilot
    prompt: enforce-test-demo
    cli_flags:
      model: gpt-5.3-codex
      allow_all_paths: true
      allow_all_tools: true
      resume: "{state.implement_result.session_id}"
    state_key: test_result
    timeout: 900  # 15 min

  # Phase 3: Critique and Distill (FR-183 merged phase)
  # Evaluate implementation against FR acceptance criteria
  # Generate diary reflection with Scripture trap vocabulary
  critique_and_distill:
    type: copilot
    prompt: enforce-critique-and-distill
    cli_flags:
      model: gpt-5.3-codex
      allow_all_paths: true
      allow_all_tools: true
      resume: "{state.implement_result.session_id}"
    variables:
      fr_path: "{state.fr_path}"
    state_key: critique_and_distill_result
    timeout: 600  # 10 min

  # Phase 4: Finalize (FR-183 merged phase)
  # Pre-commit checks + fix failures + commit + push + create PR
  finalize:
    type: copilot
    prompt: enforce-finalize
    cli_flags:
      model: gpt-5.3-codex
      allow_all_paths: true
      allow_all_tools: true
      resume: "{state.implement_result.session_id}"
    variables:
      branch: "{state.branch}"
      fr_path: "{state.fr_path}"
    state_key: finalize_result
    timeout: 1500  # 25 min (precommit iterations + PR creation)

edges:
  - from: START
    to: implement
  - from: implement
    to: test_and_demo
  - from: test_and_demo
    to: critique_and_distill
  - from: critique_and_distill
    to: finalize
  - from: finalize
    to: END
