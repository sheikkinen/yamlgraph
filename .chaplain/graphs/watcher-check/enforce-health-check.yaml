# FR-317 health-check graph: enforce boundary
# Forbidden operations: file edits, git commit, git push, PR operations.

version: "1.0"
name: watcher-check-enforce
description: "Read-only health check for watcher2 enforce boundary"

prompts_relative: true
prompts_dir: ./prompts

state:
  topic_file: str
  enforce_check_result: dict

nodes:
  enforce_health_check:
    type: copilot
    prompt: enforce-health-check
    backend: cli
    cli_flags:
      model: gpt-5.3-codex
      allow_all_paths: true
      allow_all_tools: true
    variables:
      topic_file: "{state.topic_file}"
    state_key: enforce_check_result
    timeout: 600

edges:
  - from: START
    to: enforce_health_check
  - from: enforce_health_check
    to: END
