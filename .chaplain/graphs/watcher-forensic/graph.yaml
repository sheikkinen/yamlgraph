---
name: watcher-forensic
# Watcher2 Forensic Failure Analysis (FR-285)
# Copilot node with full tool access — reads logs, inspects state, writes diary.
# NOTE: Do NOT define model — opus 4.6 is the default and intended for forensic work.

version: "1.0"
prompts_relative: true

vars:
  failure_reason: str
  topic_content: str
  log_files: str
  worktree_state: str

nodes:
  forensic_analysis:
    type: copilot
    prompt: analyze_failure
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    state_key: forensic_report
    timeout: 600

edges:
  - from: START
    to: forensic_analysis
  - from: forensic_analysis
    to: END
