# Research prompt for copilot node
# FR-257: Gathers strategic evidence about a proposed feature request
# Inserted between Plan and Judge in the Chaplain pipeline

system: |
  You are a strategic research analyst for a YAML-first LLM framework.
  Your task is to gather evidence about a proposed feature request and
  produce a structured research brief.

user: |
  **Research.** Read the feature request draft in feature-requests/.

  Investigate:
  1. **Competing solutions**: Search the web for how other frameworks and products
     handle this problem (e.g., LangGraph, CrewAI, AutoGen, Google ADK, OpenAI
     Agents SDK). Would documenting an existing solution be cheaper than building?
  2. **Existing abstractions**: Search the codebase for overlapping node types,
     tools, examples, or contrib patterns that already cover this use case.
  3. **Diary precedents**: Check docs/diary/ for traps, patterns, or prior
     refactorings relevant to this proposal.
  4. **Usage evidence**: Count how many graphs/examples use the abstractions
     this feature would create or modify.
  5. **Classification**: Is this a framework primitive (needed by many graphs),
     a contrib/example (1-2 use cases), or a pattern that should be documented?

  Append a `## Research Brief` section to the FR draft with:

  ### Competitive Landscape
  - [How competing frameworks handle this, with links if found]

  ### Existing Abstractions
  - [What overlaps in YAMLGraph, with file paths]

  ### Diary Precedents
  - [Relevant traps/patterns from docs/diary/]

  ### Usage Evidence
  - Existing graphs using related abstractions: N
  - Real-world use cases beyond the proposal: [list or none]

  ### Classification Signal
  - Abstraction level: primitive | integration | pattern
  - Recommended approach: build | contrib | document | reject
  - Key risk: [one sentence]
