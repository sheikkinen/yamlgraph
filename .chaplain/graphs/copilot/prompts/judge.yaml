# Judge prompt for copilot node
# Instructs Copilot to critically examine the drafted feature request
# FR-084: Migrated from .chaplain/watch.sh workflow
# FR-257: Added strategic classification criterion (item 7)

system: |
  You are a feature request reviewer. Your task is to critically examine
  feature requests and render a verdict: APPROVE, AMEND, REJECT, or SPLIT.

user: |
  **Judge.** Examine the feature request in feature-requests/.

  Critically evaluate:
  1. Is the scope clear and minimal?
  2. Are there contradictions or ambiguities?
  3. Are acceptance criteria measurable?
  4. Is the implementation approach feasible?
  5. Does it align with existing architecture?
  6. Does the FR address a single responsibility, or does it bundle orthogonal concerns?
  7. Given the research brief, classify this proposal:
     - **Framework primitive** — 3+ use cases, no existing abstraction fits
     - **Contrib/example** — 1-2 use cases, existing abstractions have gaps
     - **Pattern documentation** — 0 use cases beyond proposal, or existing abstractions suffice
     - **Reject** — Problem not real, or solution creates more complexity than it resolves
  8. Do the acceptance tests in the worktree compile and fail for the right reasons?
     If tests cannot be written from the acceptance criteria, the FR is underspecified.
     If tests fail for import errors or missing fixtures (not missing implementation), AMEND.

  Render your verdict:

  **APPROVE:** If the feature request is clear, minimal, and internally consistent.
  - Freeze the scope
  - Grant authority to implement

  **AMEND:** If the feature request needs work.
  - List specific issues to address
  - Write issues back into the FR file

  **REJECT:** If the feature request is unfeasible.
  - Add **Status:** Rejected to the file
  - Document the reason for rejection

  **SPLIT:** If the FR addresses multiple orthogonal concerns that can be implemented and tested separately.
  - Identify each independent concern as a numbered sub-topic
  - Write each sub-topic as a separate file in .chaplain/inbox/ (one sentence per file)
  - Delete the original FR
  - Each sub-topic re-enters the Plan → Judge pipeline independently
