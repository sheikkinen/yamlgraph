# Copilot Node Demo - Plan → Judge → Summarize → Write Diary
# FR-081: Demonstrates copilot node type delegating to GitHub Copilot CLI
# FR-084: Based on .chaplain/watch.sh Plan-Judge workflow
# FR-093: Added summarize + write_diary for automatic diary append
# FR-098: Consolidated from .chaplain/graph.yaml
# FR-105: Session continuation - judge resumes plan's session
# FR-196: Relocated from examples/copilot/ to .chaplain/graphs/copilot/

version: "1.0"
name: copilot-workflow
description: Feature request workflow using copilot nodes with session continuation

prompts_relative: true
prompts_dir: prompts

defaults:
  provider: anthropic
  model: claude-haiku-4-5

state:
  topic_file: str        # Path to the topic file (e.g., .chaplain/inbox/topic.md)
  drafts_dir: str        # Output directory for drafts
  date: str              # Date for diary entry (YYYY-MM-DD)
  diary_prefix: str      # Diary entry prefix (default: Chaplain)
  research_brief: dict   # Output from research node (FR-257)
  worktree_dir: str      # Path to feature worktree (FR-260, output of create_worktree)
  branch: str            # Git branch name for worktree (FR-260, output of create_worktree)
  acceptance_tests_result: dict  # Output from write_acceptance_tests node (FR-260)
  diary_entry: dict      # Output from summarize node (theme, body, seed)
  written: bool          # True after diary append

tools:
  write_diary_tool:
    type: python
    path: .chaplain/lib/diary.py
    function: write_diary
  create_worktree_tool:
    type: python
    path: .chaplain/lib/worktree.py
    function: create_worktree

nodes:
  # Stage 1: Plan - Copilot reads topic and drafts feature request
  plan:
    type: copilot
    prompt: plan
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
    variables:
      topic_file: "{state.topic_file}"
      drafts_dir: "{state.drafts_dir}"
    state_key: plan_result
    timeout: 500

  # Stage 2: Research - Copilot gathers strategic evidence about the draft
  # FR-257: Research step between Plan and Judge
  # FR-105: Resumes the plan node's Copilot session for context continuity
  research:
    type: copilot
    prompt: research
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
      resume: "{state.plan_result.session_id}"
    variables:
      drafts_dir: "{state.drafts_dir}"
    state_key: research_brief
    timeout: 1000

  # Stage 2b: Create Worktree - Commit FR draft and create isolated worktree
  # FR-260: Worktree needed before acceptance tests can be written
  create_worktree:
    type: python
    tool: create_worktree_tool
    # Returns dict with worktree_dir + branch as top-level state keys

  # Stage 2c: Write Acceptance Tests - Generate failing tests from FR criteria
  # FR-260: Tests committed as RED before Judge evaluates
  write_acceptance_tests:
    type: copilot
    prompt: write-acceptance-tests
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
      resume: "{state.plan_result.session_id}"
    variables:
      drafts_dir: "{state.drafts_dir}"
      worktree_dir: "{state.worktree_dir}"
      branch: "{state.branch}"
    state_key: acceptance_tests_result
    timeout: 600

  # Stage 3: Judge - Copilot examines the draft and renders verdict
  # FR-105: Resumes the plan node's Copilot session for context continuity
  judge:
    type: copilot
    prompt: judge
    backend: cli
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
      resume: "{state.plan_result.session_id}"  # FR-105: Continue same session
    variables:
      drafts_dir: "{state.drafts_dir}"
    state_key: judge_result
    timeout: 1000

  # Stage 4: Summarize - LLM distills Plan→Research→Judge into diary entry
  summarize:
    type: llm
    prompt: summarize
    variables:
      plan_output: "{state.plan_result}"
      judge_output: "{state.judge_result}"
    state_key: diary_entry

  # Stage 5: Write - Append formatted entry to docs/diary/
  write_diary:
    type: python
    tool: write_diary_tool
    state_key: written

edges:
  - from: START
    to: plan
  - from: plan
    to: research
  - from: research
    to: create_worktree          # FR-260
  - from: create_worktree
    to: write_acceptance_tests   # FR-260
  - from: write_acceptance_tests
    to: judge
  - from: judge
    to: summarize
  - from: summarize
    to: write_diary
  - from: write_diary
    to: END
