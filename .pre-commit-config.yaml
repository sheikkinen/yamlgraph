# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
fail_fast: true
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-ast
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key

  - repo: local
    hooks:
      - id: authoring-proof
        name: authoring proof (FR-767 sole-route backstop, local-only)
        entry: .venv/bin/python scripts/check_authoring_proof.py
        language: system
        pass_filenames: false
        files: (^examples/.*graph\.ya?ml$|^examples/.*/prompts/.*\.ya?ml$|^graphs/[^/]+\.ya?ml$|^graphs/[^/]+/[^/]+\.ya?ml$|^graphs/[^/]+/prompts/[^/]+\.ya?ml$|^scripts/check_authoring_proof\.py$)
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: diary-rotate
        name: diary import (scheduled entries)
        entry: .venv/bin/python scripts/diary_rotate.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: diary-reflection-check
        name: diary-reflection-check
        entry: >-
          bash -c 'FILES=$(git diff --cached --name-only -- "docs/diary/*reflection*.md"); if [ -n "$FILES" ]; then STUBS=$(echo "$FILES" | xargs grep -l "\[What cognitive trap\|\[What lesson\|\[What question" 2>/dev/null); if [ -n "$STUBS" ]; then echo "❌ Unfilled diary reflection stubs:"; echo "$STUBS"; echo "Fill Trap/Heuristic/Seed sections before committing."; exit 1; fi; MISSING_SEED=$(echo "$FILES" | xargs grep -L "Seed:" 2>/dev/null); if [ -n "$MISSING_SEED" ]; then echo "❌ Diary reflections missing Seed: marker:"; echo "$MISSING_SEED"; echo "Add literal Seed: marker to each reflection before committing."; exit 1; fi; fi'
        language: system
        pass_filenames: false
        files: ^docs/diary/
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: req-coverage-strict
        name: req_coverage --strict
        entry: .venv/bin/python scripts/req_coverage.py --strict
        language: system
        pass_filenames: false
        files: (^yamlgraph/|^tests/|^ARCHITECTURE\.md$|^capabilities/|^scripts/req_coverage\.py$)
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: validate-capabilities
        name: Capability registry schema validation
        entry: .venv/bin/python scripts/validate_capabilities.py
        language: system
        pass_filenames: false
        files: (^capabilities/|^scripts/validate_capabilities\.py$)
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: validate-id-registry
        name: ID registry validation
        entry: .venv/bin/python scripts/validate_id_registry.py
        language: system
        pass_filenames: false
        files: (^capabilities/|^scripts/validate_id_registry\.py$)
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: cap-architecture-sync
        name: capability architecture sync
        entry: .venv/bin/python scripts/aggregate_capabilities.py
        language: system
        pass_filenames: false
        files: (^capabilities/.*\.yaml$|^scripts/aggregate_capabilities\.py$)
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: noqa-confession
        name: noqa_coverage --strict
        entry: .venv/bin/python scripts/noqa_coverage.py --strict
        language: system
        pass_filenames: false
        files: (\.py$|^docs/confessions\.md$|^scripts/noqa_coverage\.py$)
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: dependency-rationale
        name: dependency-rationale --strict
        entry: .venv/bin/python scripts/dependency_rationale.py --strict
        language: system
        pass_filenames: false
        files: (pyproject\.toml|docs/dependency-rationale\.yaml)
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: direct-import-scan
        name: direct-import-scan --strict
        entry: .venv/bin/python scripts/direct_import_scan.py --strict
        language: system
        pass_filenames: false
        files: (pyproject\.toml|^yamlgraph/.*\.py$|^scripts/direct_import_scan\.py$)
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: inline-llm-check
        name: inline LLM orchestration check
        entry: .venv/bin/python scripts/lint_inline_llm.py
        language: system
        pass_filenames: false
        files: (\.py$|^scripts/lint_inline_llm\.py$)
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: radon-complexity
        name: radon CC gate (block grade D)
        entry: bash -c 'output=$(.venv/bin/python -m radon cc yamlgraph/ -n D -s 2>&1); if [ -n "$output" ]; then echo "$output"; echo ""; echo "FAIL -- functions with cyclomatic complexity >= 21 (grade D) detected"; exit 1; fi'
        language: system
        pass_filenames: false
        files: \.py$
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: bandit-security
        name: bandit security gate (medium+ severity, FR-714)
        entry: bash -c '.venv/bin/python -m bandit -r yamlgraph/ -ll -q || { echo ""; echo "FAIL -- bandit medium+ finding without nosec confession (FR-714)"; exit 1; }'
        language: system
        pass_filenames: false
        files: \.py$
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: file-size-gate
        name: file size gate (>450 error, >400 warn)
        entry: python scripts/size_gate.py
        language: system
        pass_filenames: false
        files: \.(py|sh)$|^(CLAUDE\.md|\.github/copilot-instructions\.md)$
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: forbid-terms
        name: forbid TODOs and compatibility drift
        entry: bash -c '! find yamlgraph -type f -name "*.py" ! -path "*/__pycache__/*" ! -path "*/.pytest_cache/*" ! -path "*/.mypy_cache/*" ! -path "*/.ruff_cache/*" ! -path "*/.venv/*" -print0 | xargs -0 grep -nE "TODO|FIXME|backward compati(bility)?"'
        language: system
        pass_filenames: false
        files: \.py$
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: jscpd-dup
        name: jscpd duplicate check (local)
        entry: bash -c 'npx --yes jscpd@4.0.5 yamlgraph --threshold 10 --min-lines 10 --min-tokens 80 --format python --gitignore --reporters console'
        language: system
        pass_filenames: false
        files: \.py$
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter architectural boundaries
        entry: bash -c 'PATH="$PWD/.venv/bin:$PATH" lint-imports'
        language: system
        pass_filenames: false
        files: (\.py$|^\.importlinter$)
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: vulture-dead-code
        name: vulture (dead code)
        entry: bash -c '.venv/bin/python -m vulture yamlgraph vulture_whitelist.py --min-confidence 60'
        language: system
        pass_filenames: false
        files: (\.py$|^vulture_whitelist\.py$)
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: hedging-check
        name: hedging check (silent fallbacks)
        entry: bash -c '.venv/bin/python scripts/hedging_check.py yamlgraph scripts --strict'
        language: system
        pass_filenames: false
        files: \.py$
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: gitignore-boundary-guard
        name: gitignore-boundary-guard
        entry: scripts/check_gitignore_boundary.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: demo-proof-check
        name: demo-proof-check
        entry: scripts/check_demo_proof.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: changelog-req-cross-check
        name: changelog req cross-check
        entry: .venv/bin/python scripts/check_changelog_req.py --strict --skip-llm
        language: system
        pass_filenames: false
        files: (^changelog/|^capabilities/|^scripts/check_changelog_req\.py$)
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: changelog-release-sync
        name: changelog release sync
        entry: .venv/bin/python scripts/check_changelog_release_sync.py
        language: system
        pass_filenames: false
        files: (^changelog/|^pyproject\.toml$|^scripts/check_changelog_release_sync\.py$|^scripts/release\.sh$)
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: diary-filename-check
        name: diary filename pattern validation
        entry: >-
          bash -c 'BAD_FILES=$(git ls-files "docs/diary/*reflection*fr*.md" |
          grep -vEi "docs/diary/.*reflection.*fr-[0-9]+[^0-9]");
          if [ -n "$BAD_FILES" ]; then
          echo "❌ Diary files with invalid filename pattern:";
          echo "$BAD_FILES";
          echo "Required: docs/diary/YYYY-MM-DD-reflection-fr-NNN-topic.md";
          exit 1;
          fi'
        language: system
        pass_filenames: false
        files: ^docs/diary/
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: prior-art-gate
        name: prior-art disposition gate (FR-738)
        entry: .venv/bin/python .github/hooks/scripts/checks/prior_art_gate.py
        language: system
        files: ^feature-requests/.*\.md$
        stages: [pre-commit]
      - id: triage-gate
        name: triage disposition gate (FR-745)
        entry: .venv/bin/python .github/hooks/scripts/checks/triage_gate.py
        language: system
        files: ^feature-requests/.*\.md$
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: pytest
        name: pytest (unit only, ~20s)
        entry: bash -c 'export PATH=".venv/bin:$PATH" && .venv/bin/python -m pytest tests/unit/ -q --tb=short --no-cov -m "not slow" -n auto && echo "" && echo "✓ Unit tests passed. Run integration tests separately:" && echo "  pytest tests/integration/ -v"'
        language: system
        pass_filenames: false
        files: (\.py$|\.yaml$|\.yml$|^pyproject\.toml$)
        stages: [pre-commit]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, chore, docs, refactor, test, ci, perf, style, build, revert]

  - repo: local
    hooks:
      - id: feat-requires-fr
        name: feat commits require FR-XXX
        entry: "bash -c 'msg=$(cat \"$1\"); if echo \"$msg\" | grep -qE \"^feat(\\(.*\\))?:\" && ! echo \"$msg\" | grep -qE \"FR-[0-9]+\"; then echo \"ERROR: feat: commits require FR-XXX reference\"; echo \"Example: feat: FR-038 add commit enforcement\"; exit 1; fi' _"
        language: system
        stages: [commit-msg]
        always_run: true

  - repo: local
    hooks:
      - id: changelog-required
        name: feat/fix commits require changelog fragment
        entry: "bash -c 'msg=$(cat \"$1\"); if echo \"$msg\" | grep -qE \"^(feat|fix)(\\(.*\\))?:\" && ! git diff --cached --name-only | grep -qE \"^changelog/unreleased/.*\\.md$\"; then echo \"ERROR: feat/fix commits must include a changelog fragment\"; echo \"Create a file in changelog/unreleased/ (see reference/release-checklist.md)\"; exit 1; fi' _"
        language: system
        stages: [commit-msg]
        always_run: true

  - repo: local
    hooks:
      - id: block-wip-main-subject
        name: block wip subject on main
        entry: "bash -c 'subject=$(head -n1 \"$1\"); branch=$(git rev-parse --abbrev-ref HEAD); if [ \"$branch\" = \"main\" ] && echo \"$subject\" | grep -Eiq \"\\bwip\\b\"; then echo \"ERROR: main commit subject cannot contain standalone wip\"; echo \"Subject: $subject\"; exit 1; fi' _"
        language: system
        stages: [commit-msg]
        always_run: true

  - repo: local
    hooks:
      - id: block-ai-coauthor
        name: "Block AI co-author trailers"
        entry: .venv/bin/python scripts/block_ai_coauthor.py
        language: system
        always_run: true
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: final-summary
        name: "Final summary"
        entry: .venv/bin/python scripts/final_summary.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-commit, commit-msg]
