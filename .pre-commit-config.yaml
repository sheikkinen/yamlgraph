# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
fail_fast: true
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-ast
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key

  - repo: local
    hooks:
      - id: diary-rotate
        name: diary import (scheduled entries)
        entry: .venv/bin/python scripts/diary_rotate.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: diary-reflection-check
        name: diary-reflection-check
        entry: bash -c 'STUBS=$(git ls-files "docs/diary/*reflection*.md" | xargs grep -l "\[What cognitive trap\|\[What lesson\|\[What question" 2>/dev/null); if [ -n "$STUBS" ]; then echo "❌ Unfilled diary reflection stubs:"; echo "$STUBS"; echo "Fill Trap/Heuristic/Seed sections before committing."; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: req-coverage-strict
        name: req_coverage --strict
        entry: .venv/bin/python scripts/req_coverage.py --strict
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: validate-capabilities
        name: Capability registry schema validation
        entry: .venv/bin/python scripts/validate_capabilities.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: validate-id-registry
        name: ID registry validation
        entry: .venv/bin/python scripts/validate_id_registry.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: noqa-confession
        name: noqa_coverage --strict
        entry: .venv/bin/python scripts/noqa_coverage.py --strict
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: dependency-rationale
        name: dependency-rationale --strict
        entry: .venv/bin/python scripts/dependency_rationale.py --strict
        language: system
        pass_filenames: false
        files: (pyproject\.toml|docs/dependency-rationale\.yaml)
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: inline-llm-check
        name: inline LLM orchestration check
        entry: .venv/bin/python scripts/lint_inline_llm.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: radon-complexity
        name: radon CC gate (block grade D)
        entry: bash -c 'output=$(.venv/bin/python -m radon cc yamlgraph/ -n D -s 2>&1); if [ -n "$output" ]; then echo "$output"; echo ""; echo "FAIL -- functions with cyclomatic complexity >= 21 (grade D) detected"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: file-size-gate
        name: file size gate (>450 error, >400 warn)
        entry: bash -c 'fail=0; warn=0; for f in $(find yamlgraph -type f -name "*.py" ! -path "*/__pycache__/*"); do lines=$(wc -l < "$f"); if [ "$lines" -gt 450 ]; then echo "ERROR $f -- $lines lines (max 450)"; fail=1; elif [ "$lines" -gt 400 ]; then echo "WARN  $f -- $lines lines (target <=400)"; warn=1; fi; done; if [ "$fail" -eq 1 ]; then echo ""; echo "FAIL -- code files exceeding 450 lines detected"; exit 1; fi; if [ "$warn" -eq 1 ]; then echo ""; echo "(warnings only -- hook passes)"; fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: forbid-terms
        name: forbid TODOs and compatibility drift
        entry: bash -c '! find yamlgraph -type f -name "*.py" ! -path "*/__pycache__/*" ! -path "*/.pytest_cache/*" ! -path "*/.mypy_cache/*" ! -path "*/.ruff_cache/*" ! -path "*/.venv/*" -print0 | xargs -0 grep -nE "TODO|FIXME|backward compati(bility)?"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: jscpd-dup
        name: jscpd duplicate check (local)
        entry: bash -c 'npx jscpd yamlgraph --threshold 10 --min-lines 10 --min-tokens 80 --format python --gitignore --reporters console'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter architectural boundaries
        entry: bash -c 'PATH="$PWD/.venv/bin:$PATH" lint-imports'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: vulture-dead-code
        name: vulture (dead code)
        entry: bash -c '.venv/bin/python -m vulture yamlgraph vulture_whitelist.py --min-confidence 60'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: hedging-check
        name: hedging check (silent fallbacks)
        entry: bash -c '.venv/bin/python scripts/hedging_check.py yamlgraph --strict'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: demo-proof-check
        name: demo-proof-check
        entry: scripts/check_demo_proof.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: changelog-req-cross-check
        name: changelog req cross-check
        entry: .venv/bin/python scripts/check_changelog_req.py --strict --skip-llm
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: changelog-release-sync
        name: changelog release sync
        entry: .venv/bin/python scripts/check_changelog_release_sync.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: diary-filename-check
        name: diary filename pattern validation
        entry: >-
          bash -c 'BAD_FILES=$(git ls-files "docs/diary/*reflection*fr*.md" |
          grep -vEi "docs/diary/.*reflection.*fr-[0-9]+[^0-9]");
          if [ -n "$BAD_FILES" ]; then
          echo "❌ Diary files with invalid filename pattern:";
          echo "$BAD_FILES";
          echo "Required: docs/diary/YYYY-MM-DD-reflection-fr-NNN-topic.md";
          exit 1;
          fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: pytest
        name: pytest (unit only, ~20s)
        entry: bash -c '.venv/bin/python -m pytest tests/unit/ -q --tb=short --no-cov -m "not slow" -n auto && echo "" && echo "✓ Unit tests passed. Run integration tests separately:" && echo "  pytest tests/integration/ -v"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, chore, docs, refactor, test, ci, perf, style, build, revert]

  - repo: local
    hooks:
      - id: feat-requires-fr
        name: feat commits require FR-XXX
        entry: "bash -c 'msg=$(cat \"$1\"); if echo \"$msg\" | grep -qE \"^feat(\\(.*\\))?:\" && ! echo \"$msg\" | grep -qE \"FR-[0-9]+\"; then echo \"ERROR: feat: commits require FR-XXX reference\"; echo \"Example: feat: FR-038 add commit enforcement\"; exit 1; fi' _"
        language: system
        stages: [commit-msg]
        always_run: true

  - repo: local
    hooks:
      - id: changelog-required
        name: feat/fix commits require changelog fragment
        entry: "bash -c 'msg=$(cat \"$1\"); if echo \"$msg\" | grep -qE \"^(feat|fix)(\\(.*\\))?:\" && ! git diff --cached --name-only | grep -qE \"^changelog/unreleased/.*\\.md$\"; then echo \"ERROR: feat/fix commits must include a changelog fragment\"; echo \"Create a file in changelog/unreleased/ (see reference/release-checklist.md)\"; exit 1; fi' _"
        language: system
        stages: [commit-msg]
        always_run: true

  - repo: local
    hooks:
      - id: block-ai-coauthor
        name: "Block AI co-author trailers"
        entry: .venv/bin/python scripts/block_ai_coauthor.py
        language: system
        always_run: true
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: absolution
        name: "Absolution"
        entry: .venv/bin/python scripts/absolution.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-commit, commit-msg]
