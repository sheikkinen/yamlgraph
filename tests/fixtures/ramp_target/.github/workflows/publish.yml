name: publish-daily
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: publish
        env:
          GALLERY_TOKEN: ${{ secrets.GALLERY_TOKEN }}
        run: python -m publisher.publish
