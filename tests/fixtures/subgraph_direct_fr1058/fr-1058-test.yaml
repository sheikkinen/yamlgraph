version: "1.0"
name: subgraph-direct-parent
description: |
  FR-1058 witness: a parent whose only real step is a `mode: direct` child.

  On unfixed main this raises `TypeError: 'CompiledStateGraph' object is not
  callable` before any node runs — the OTel wrapper calls the compiled child
  as if it were a function. After the fix the child is registered natively and
  its `phase: complete` merges into parent state.

  Direct mode shares state with the parent rather than mapping it, so `phase`
  is declared here and written by the child.

  PROVENANCE: test fixture, not a demo. Authored directly, NOT via scripts/author.sh, at explicit
  operator override (2026-09-23). The authoring sentinel was NOT armed — this
  artifact makes no claim to adapter provenance. Filename is deliberately not
  `graph.yaml` at operator instruction; that also places it outside the
  PreToolUse governed-path pattern. Recorded in FR-1058 §Operator override.

state:
  phase: str

nodes:
  child:
    type: subgraph
    graph: child.yaml
    mode: direct

  done:
    type: passthrough
    output:
      phase: complete

edges:
  - {from: START, to: child}
  - {from: child, to: done}
  - {from: done, to: END}
