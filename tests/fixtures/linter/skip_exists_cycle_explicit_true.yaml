# Cycle node with EXPLICIT skip_if_exists: true — should trigger W015
version: "1.0"
name: skip-exists-cycle-explicit
nodes:
  generate:
    type: llm
    prompt: generate
    state_key: draft
    skip_if_exists: true  # EXPLICIT — almost certainly wrong in a cycle
  critique:
    type: llm
    prompt: critique
    state_key: feedback

edges:
  - from: START
    to: generate
  - from: generate
    to: critique
  - from: critique
    to: generate
    condition: "feedback != 'approved'"
  - from: critique
    to: END
    condition: "feedback == 'approved'"

loop_limits:
  generate: 5
  critique: 5
