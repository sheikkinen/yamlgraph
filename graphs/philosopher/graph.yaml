# FR-184/FR-185/FR-194/FR-195/FR-196: Philosopher Daemon
# Scans diary entries for recurring patterns and proposes graduations to Scripture
# FR-195: Adds distill/challenge adversarial gate before propose
# FR-194: Adds world context loading for grounded reflection
# FR-196 moved this graph out of examples/philosopher/ into the chaplain runtime; FR-1011 relocated it to graphs/philosopher/

version: "1.0"
name: philosopher-scan
description: |
  Scan diary entries for recurring patterns and propose graduations.
  Nine phases: scan → analyze → distill → unwrap_distill → [challenge → unwrap_challenge →] propose → load_context → reflect → write_diary.
  The distill/challenge gate (FR-195) prevents weak patterns from reaching the proposals inbox.

prompts_relative: true
prompts_dir: prompts

# NOTE: Do NOT define default provider/model — opus 4.6 is the project default.

state:
  diary_dir: str                # Path to docs/diary/
  inbox_dir: str                # Path to the proposals inbox (proposals/ on the operator's main checkout)
  lookback_days: int            # How many days back to scan (default: 30)
  graduation_threshold: int     # Min occurrences to propose graduation (default: 3)
  date: str                     # Current date for diary entry
  diary_prefix: str             # Diary entry prefix (default: Philosopher)
  world_context_path: str       # Path to world context file (default: docs/world-context.md)
  scan_result: dict             # Extracted markers with counts
  proposals: dict               # CopilotResult envelope (FR-185)
  distill_result: dict          # CopilotResult envelope from distill copilot node (FR-195)
  top_candidate: dict           # Unwrapped single strongest candidate or null (FR-195)
  challenge_result: dict        # CopilotResult envelope from challenge copilot node (FR-195)
  challenge_parsed: dict        # Unwrapped ChallengeVerdict dict (FR-195)
  world_context: str            # External ecosystem context (FR-194)
  diary_entry: dict             # CopilotResult envelope (FR-185)
  written: bool                 # True after diary append

tools:
  scan_diary_tool:
    type: python
    path: tools.py
    function: scan_diary_markers
  load_context_tool:
    type: python
    path: tools.py
    function: load_world_context
  write_diary_tool:
    type: python
    path: tools.py
    function: write_diary
  write_proposal_tool:
    type: python
    path: tools.py
    function: write_proposals
  unwrap_distill_tool:
    type: python
    path: tools.py
    function: unwrap_distill
  unwrap_challenge_tool:
    type: python
    path: tools.py
    function: unwrap_challenge

nodes:
  # Stage 1: Scan — Extract markers from diary files
  scan:
    type: python
    tool: scan_diary_tool
    state_key: scan_result

  # Stage 2: Analyze — Copilot detects patterns and proposes graduations (FR-185)
  analyze:
    type: copilot
    prompt: analyze
    variables:
      scan_result: "{state.scan_result}"
      graduation_threshold: "{state.graduation_threshold}"
    state_key: proposals
    timeout: 300

  # Stage 3: Distill — Select single strongest candidate (FR-195)
  distill:
    type: copilot
    prompt: distill
    variables:
      proposals: "{state.proposals}"
      scan_result: "{state.scan_result}"
    state_key: distill_result
    timeout: 300

  # Stage 4: Unwrap distill result into validated Proposal or None (FR-195)
  unwrap_distill:
    type: python
    tool: unwrap_distill_tool
    state_key: top_candidate

  # Stage 5: Challenge — Devil's advocate gate (FR-195)
  challenge:
    type: copilot
    prompt: challenge
    variables:
      top_candidate: "{state.top_candidate}"
      scan_result: "{state.scan_result}"
    state_key: challenge_result
    timeout: 300

  # Stage 6: Unwrap challenge result into validated ChallengeVerdict (FR-195)
  unwrap_challenge:
    type: python
    tool: unwrap_challenge_tool
    state_key: challenge_parsed

  # Stage 7: Write proposals to inbox (if approved)
  propose:
    type: python
    tool: write_proposal_tool
    state_key: proposals_written

  # Stage 8: Load external world context for reflection (FR-194)
  load_context:
    type: python
    tool: load_context_tool
    state_key: world_context

  # Stage 9: Write Philosopher's own diary entry (FR-185/FR-194/FR-195)
  reflect:
    type: copilot
    prompt: reflect
    variables:
      scan_result: "{state.scan_result}"
      proposals: "{state.proposals}"
      challenge_parsed: "{state.challenge_parsed}"
      world_context: "{state.world_context}"
    state_key: diary_entry
    timeout: 300

  # Stage 10: Write diary entry to file
  write_diary:
    type: python
    tool: write_diary_tool
    state_key: written

edges:
  - from: START
    to: scan
  - from: scan
    to: analyze
  - from: analyze
    to: distill
  - from: distill
    to: unwrap_distill
  - from: unwrap_distill
    to: challenge
    condition: "top_candidate != None"
  - from: unwrap_distill
    to: reflect
    condition: "top_candidate == None"
  - from: challenge
    to: unwrap_challenge
  - from: unwrap_challenge
    to: propose
    condition: "challenge_parsed.verdict == 'approve'"
  - from: unwrap_challenge
    to: reflect
    condition: "challenge_parsed.verdict != 'approve'"
  - from: propose
    to: load_context
  - from: load_context
    to: reflect
  - from: reflect
    to: write_diary
  - from: write_diary
    to: END
