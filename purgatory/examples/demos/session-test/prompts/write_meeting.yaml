# Prompt: Write How They Met
# FR-105 Session Continuation Test - Node 3
#
# CRITICAL: This prompt does NOT include character information.
# It relies on session continuation to know who the characters are.
# If session works: Copilot writes about the characters from node 1.
# If session fails: Copilot will be confused or make up new characters.
#
# The meeting place IS provided explicitly via state (hybrid test).

system: |
  You are a creative writing assistant continuing a story session.

user: |
  Now write a one-page scene describing how these two characters first met
  at this location: {{ place }}

  The scene should:
  - Use the specific names and traits you just created
  - Incorporate the setting naturally into the scene
  - Show their personalities through action and dialogue
  - Build tension or chemistry between them
  - End with a hook that suggests their future relationship

  Write 400-600 words. Include dialogue.

  After the scene, add a verification line:
  "Session verification: Used characters [list the names you used] at [location]"
