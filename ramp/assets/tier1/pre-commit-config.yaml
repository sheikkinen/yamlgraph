# Ramp Tier-1 pre-commit config (curated for domain-free basics).
# Source repo's root config carries repo-specific gates; this file is a
# curated ramp asset — see ramp/curation-diffs.md#pre-commit-config.
# Activate with: pre-commit install
fail_fast: true
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-ast
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key

  - repo: local
    hooks:
      - id: forbidden-phrases
        name: forbidden phrases (doctrine)
        language: pygrep
        entry: 'backward[- ]compat|pre[- ]existing failure'
        types: [text]
        exclude: '(^|/)\.pre-commit-config\.yaml$'
