id: CAP-101
name: A2A Consumer Contrib Client
description: >
  A2A consumer functionality via yamlgraph.contrib.a2a_client.send_a2a_message(),
  invoked as a type: python node. Sends Jinja2-templated message to external A2A
  agent via HTTP JSON-RPC (message/send), extracts text artifacts from the
  response, and returns {"response": text}. Supports timeout, Agent Card fetch,
  skill validation, and SSE streaming. Configuration via variables: on the
  python node. Replaces dedicated type: a2a_call (FR-253).
modules:
  - yamlgraph/contrib/a2a_client.py
  - yamlgraph/tools/python_tool.py
requirements:
  - id: REQ-YG-243
    description: >
      yamlgraph.contrib.a2a_client.send_a2a_message() sends Jinja2-templated
      message to external A2A agent URL via HTTP JSON-RPC message/send; extracts
      text artifacts from response; returns {"response": text}; invoked via
      type: python node with variables: for agent_url, message/message_template,
      skill, streaming, timeout; supports Agent Card fetch, skill validation,
      SSE streaming; uses httpx for sync and A2AClient for streaming transport
    modules:
      - yamlgraph/contrib/a2a_client.py
      - yamlgraph/tools/python_tool.py
      - tests/unit/test_a2a_contrib_client.py
fr: FR-240
