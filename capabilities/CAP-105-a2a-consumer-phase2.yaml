id: CAP-105
status: retired
name: A2A Consumer Phase 2 — Agent Card, Skill Selection & Streaming
description: >
  RETIRED by FR-909. No consumer for four months; the A2A server,
  contrib client, CLI subcommand, demos, and optional extra were deleted.
  Historical record only.
  A2A consumer features in yamlgraph.contrib.a2a_client: Agent Card discovery
  via sync httpx.get() to /.well-known/agent.json, ContextVar-scoped caching
  per graph invocation, skill selection validated against Agent Card skills at
  runtime, and SSE streaming via A2AClient.send_message_streaming() in a
  dedicated thread. Replaces dedicated a2a_call node type linter checks
  (W901/E904) with runtime validation in contrib function (FR-253).
modules:
  - yamlgraph/contrib/a2a_client.py
requirements:
  - id: REQ-YG-250
    description: >
      send_a2a_message() fetches Agent Card via sync httpx.get() to
      {agent_url}/.well-known/agent.json; parsed into SDK AgentCard model
      via ParseDict; cached per agent_url within graph invocation using
      ContextVar; cache isolated across invocations; timeout configurable
    modules:
      - yamlgraph/contrib/a2a_client.py
      - tests/unit/test_a2a_contrib_client.py
  - id: REQ-YG-251
    description: >
      skill parameter in state selects a specific agent skill; validated
      against Agent Card skills at runtime; ValueError raised on skill ID miss
      with available skills listed in error message; no card fetch when skill
      not specified
    modules:
      - yamlgraph/contrib/a2a_client.py
      - tests/unit/test_a2a_contrib_client.py
  - id: REQ-YG-252
    description: >
      streaming: true in state uses A2AClient.send_message_streaming()
      via dedicated thread with own event loop; requires
      card.capabilities.streaming == True; result returned as complete string;
      streaming events logged at DEBUG level; transport-only (not FR-030
      graph-level streaming)
    modules:
      - yamlgraph/contrib/a2a_client.py
      - tests/unit/test_a2a_contrib_client.py
  - id: REQ-YG-253
    description: >
      Dedicated type: a2a_call node type replaced by type: python +
      yamlgraph.contrib.a2a_client contrib function; NodeType.A2A_CALL removed
      from constants; a2a_nodes.py and linter/patterns/a2a.py deleted;
      W901/E904 linter checks removed (skill/streaming validated at runtime
      in contrib); FR-252 enables variables: resolution on type: python nodes
    modules:
      - yamlgraph/contrib/a2a_client.py
      - yamlgraph/tools/python_tool.py
      - tests/unit/test_a2a_contrib_client.py
fr: FR-248
