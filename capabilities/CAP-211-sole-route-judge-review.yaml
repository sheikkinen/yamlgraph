name: Sole-Route Judge and Review Wrappers
id: CAP-211
status: active
fr: FR-758, FR-960
feature_request: FR-758
description: >
  The judge and review governance pipelines execute through exactly one
  operational route each: scripts/judge.sh and scripts/review.sh (ports
  of csap NC-415/NC-413). Each wrapper serializes runs with an atomic
  mkdir lock (10-minute stale detection, holder metadata, cleanup on
  exit), blocks re-entry via lineage sentinels (JUDGE_EXECUTION /
  REVIEW_EXECUTION), resolves the yamlgraph executor explicitly
  (YAMLGRAPH_BIN, then PATH, then uv run — failing loudly otherwise),
  and verifies completion by artifact contract, never exit code: the
  judge draft must contain a "**Verdict:**" line; the review draft must
  open with "**Merge verdict:**" on line one. The wrappers contain zero
  judging or reviewing doctrine — the YAMLGraph adapter graphs under
  .github/skills/{judge-fr,review-pr}/adapters/ remain the sole
  execution routes.
modules:
  - scripts/judge.sh
  - scripts/review.sh
  - .github/skills/judge-fr/adapters/graph.yaml
  - .github/skills/judge-fr/adapters/prompts/judge.yaml
  - .github/skills/review-pr/adapters/graph.yaml
requirements:
  - id: REQ-YG-642
    description: >
      Judge adapter backend selection (FR-960). The judge graph holds two
      copilot nodes sharing one prompt — `judge` (Copilot CLI, the
      default) and `judge_claude` (`backend: claude`, FR-959) — routed by
      a state-conditioned edge on `backend`; the Claude node restricts
      tool availability and approval to exactly Read, Glob, Grep, Write
      with no bypass flag. scripts/judge.sh reads JUDGE_BACKEND
      (copilot | claude), exits 64 on any other value before taking the
      lock, derives a per-backend-per-FR artifact path
      tmp/draft-judgement-<backend>-<fr-slug>.md (a same-backend rerun
      replaces only its own draft; other backends' and other FRs' drafts
      survive), and passes backend and artifact_path as graph vars. Each
      live run is recorded in a committed witness whose dual-backend
      section inventories both drafts claim by claim (matched /
      contradicted / backend-only, or the explicit convergence sentinel)
      and carries two separate human signatures. Witnessed by stubbed
      wrapper tests and mocked graph-routing tests; pytest and CI never
      launch a judge.
    modules:
      - scripts/judge.sh
      - .github/skills/judge-fr/adapters/graph.yaml
      - .github/skills/judge-fr/adapters/prompts/judge.yaml
      - tests/unit/test_fr960_claude_judge_variant.py
      - tests/unit/test_fr758_judge_review_wrappers.py
  - id: REQ-YG-569
    description: >
      Sole-route judge/review wrapper contract (FR-758). Both wrappers
      exit 64 on usage error and 66 on missing FR; exit 70 when the
      matching lineage sentinel is set (re-entry guard); exit 73 when a
      fresh lock is held (printing holder metadata) and 75 on a stale
      lock (never auto-removing it); remove their lock on exit. The
      executor resolution order is YAMLGRAPH_BIN over PATH yamlgraph
      over uv, exiting 69 when none resolves. The artifact contract
      exits 65 when the draft is missing/empty, when the judge draft
      lacks a "**Verdict:**" line, or when the review draft's line one
      is not "**Merge verdict:**"; a conforming artifact from a
      successful graph run yields exit 0. Contract witnessed by stubbed
      YAMLGRAPH_BIN tests (no API keys, no real graph execution) plus
      one recorded manual smoke per wrapper in FR-758.
    modules:
      - scripts/judge.sh
      - scripts/review.sh
      - tests/unit/test_fr758_judge_review_wrappers.py
  - id: REQ-YG-632
    description: >
      Explicit model pin on both sole routes (FR-931; re-scoped by
      FR-960). The judge and review adapter graphs each define exactly
      one Copilot-CLI copilot node whose cli_flags.model is non-empty —
      never inherited from the CLI ambient default, which would change
      cost and behaviour with no diff in the repo — and every other
      copilot node on either route (FR-960's `judge_claude`) carries its
      own explicit, non-empty model. The two Copilot-CLI pins are equal
      to each other and equal to the model this repository chose
      deliberately (gpt-5.6-sol); changing either requires editing the
      witness, which requires an FR. The authoring adapter is
      deliberately outside this invariant and may diverge.
    modules:
      - .github/skills/judge-fr/adapters/graph.yaml
      - .github/skills/review-pr/adapters/graph.yaml
      - tests/unit/test_fr931_sole_route_model_pin.py
