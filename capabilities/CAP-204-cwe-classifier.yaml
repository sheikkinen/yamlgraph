name: CWE Vulnerability Classifier Example
id: CAP-204
status: active
fr: FR-733
feature_request: FR-733
description: >
  Second instance of the coded-classification pattern
  (reference/patterns/coded-classification.md): map/reason/reduce
  YAMLGraph example classifying free-text vulnerability descriptions
  into CWE weakness codes. View-699 category fan-out (40 categories of
  which 39 brief — CAT-1225 Documentation Issues is entirely Prohibited
  and drops out; 399 live members, 345 candidates after the build-time
  Prohibited strip) over a catalog GENERATED locally from cwec_v4.20.xml (versioned URL +
  sha256 pin; MITRE CWE is free with attribution); per-cluster LLM
  verdicts validate at the python reducer boundary; ranking is fully
  deterministic; the crosscheck harness scores against NVD gold labels
  partitioned by MITRE's own Mapping_Notes usage.
modules:
  - examples/cwe-classifier/nodes/build_catalog.py
  - examples/cwe-classifier/nodes/catalog.py
  - examples/cwe-classifier/nodes/reduce.py
  - examples/cwe-classifier/nodes/crosscheck.py
requirements:
  - id: REQ-YG-557
    description: >
      Catalog builder + provenance (FR-733). parse_cwec derives rows
      from Weakness elements of cwec_v4.20.xml (Deprecated skipped:
      969 total, 944 live); cluster_ids = CAT-<category id> for each
      view-699 Has_Member (multi-membership duplicates the code into
      every member cluster; other View_IDs never count); Prohibited
      codes keep their catalog row but get NO cluster membership —
      stripped from candidacy at BUILD time, never shown to the model
      (F3); every row carries abstraction, mapping_usage, ChildOf
      parents, source_tier=1, source_reference=cwec_v4.20/<code>;
      coverage meta declares view 699 / candidates 345 /
      excluded_prohibited 54 / catalog_total 944 (F1); check_pins
      asserts two-level usage counts (catalog-wide live 58/44/93,
      in-population 54/5/13 — F5, corrected at enforce: the judgement's
      83 counted Deprecated rows) so a catalog bump is loud;
      verify_source refuses a zip whose sha256 differs from the
      versioned pin (cwec_latest is a moving pointer).
    modules:
      - examples/cwe-classifier/nodes/build_catalog.py
  - id: REQ-YG-558
    description: >
      Catalog loader (FR-733). load_cwe_clusters groups rows into
      view-699 category clusters via each row's cluster_ids
      (multi-membership rows appear in every member cluster; Prohibited
      rows, having no memberships, never reach a brief); briefs render
      code — title | description only (F4: Description-only; caps are
      code-side, usage/abstraction never shown to the model); a missing
      generated catalog raises FileNotFoundError naming
      build_catalog.py.
    modules:
      - examples/cwe-classifier/nodes/catalog.py
  - id: REQ-YG-559
    description: >
      Reducer determinism (FR-733). Candidates validate against a
      Pydantic model at the reducer boundary; evidence spans align to
      the input description via the icpc _align_span discipline
      (case-fold + quote-strip + difflib repair >= 0.85, below the
      floor raises); bare numeric codes repair to CWE-<n> when the
      prefixed form is in the catalog (sigil analog), anything else —
      including Prohibited codes, absent from all clusters — raises
      not-in-catalog; Discouraged match claims demote to partial_match
      with evidence preserved (capped, primary/secondary unreachable);
      Allowed-with-Review matches stay primary-capable flagged
      review:true (analyst-assistance posture — review is an outcome,
      not a demotion); lowest-abstraction guard: a match whose ChildOf
      descendant (transitive, catalog-derived) is also matched demotes
      to partial, lone Class matches survive (F2 both directions);
      per-code dedup keeps best-ranked; no match yields explicit
      low_confidence naming best partials; meta carries
      catalog_version and the builder's coverage block.
    modules:
      - examples/cwe-classifier/nodes/reduce.py
  - id: REQ-YG-560
    description: >
      NVD-gold crosscheck harness (FR-733). Labels live beside fixture
      descriptions in data/labeled/ (cve_id + nvd_cwes + provenance
      rationale comment, rejected without one); evaluate_result scores
      surfaced codes against nvd_cwes PARTITIONED by MITRE usage
      (judgement addendum): a miss on an Allowed/Review gold code is
      our_miss and fails; a miss on a Discouraged/Prohibited gold code
      is label_questionable and never fails alone; a fixture whose
      ENTIRE gold set violates MITRE guidance is gold_unscoreable
      (passed=None, our primary reported for human read — the
      "more specific Allowed code than NVD's Discouraged label"
      success narrative); usage is computed from the generated catalog
      at evaluation time, committed label files stay raw provenance;
      agreement reports raw k-of-n counts, no significance.
    modules:
      - examples/cwe-classifier/nodes/crosscheck.py
