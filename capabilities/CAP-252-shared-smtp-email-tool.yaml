id: CAP-252
name: Shared SMTP Email Tool
description: >
  FR-907: a reusable FR-768 python-runtime tool manifest that sends email
  over SMTP for any graph that has produced text a human should receive.
  The tool is transport only — it accepts already-rendered strings and has
  no opinion about what it carries, so digests, audit findings, review
  verdicts, and pipeline failure notices share one delivery primitive.
  Replaces the vendor-bound Resend node in examples/daily_digest, whose
  module-level API-key read made a late-set key silently unauthenticated.
  Configuration is validated before any socket is opened, credentials are
  read at call time, header injection is refused, and every failure raises
  rather than returning a success-shaped result.
modules:
  - examples
requirements:
  - id: REQ-YG-627
    description: >
      examples/shared/smtp_email.tool.yaml validates as a python-runtime
      ToolManifest and examples/shared/smtp_email.py exposes send_email
      with subject/text/html/to/cc/attachments plus keyword-only
      smtp_factory/smtp_ssl_factory test seams; every missing SMTP_*
      key is reported in one error before any socket is opened; a
      missing recipient and a missing attachment path both raise before
      connecting; SMTP_PORT 465 selects implicit TLS and any other port
      selects STARTTLS; html=None yields a single text part while html
      yields multipart/alternative with a non-empty text part; to and cc
      accept single or comma-separated addresses; CR or LF in subject,
      to, or cc is refused; and SMTP_PASSWORD reaches neither log records
      nor exception strings, with the raw smtplib exception unchained.
    modules:
      - examples
fr: FR-907
