name: Timeframe Recap Demo
id: CAP-195
status: active
fr: FR-700, FR-930, FR-1027
feature_request: FR-700
description: >
  Example graph (examples/demos/recap/) that answers "what changed in this
  repository in a given timeframe?" for any git repository. Deterministic
  collection via `type: tool` shell nodes (git log --since, --numstat,
  convention pathspecs); exactly one LLM node synthesizes workstreams,
  orphan changes (commits without FR/issue references, prompt/graph edits
  without changelog fragments), and hotspots. YAMLGraph-specific conventions
  (feature-requests/, changelog/unreleased/) are optional enrichment — a
  repository without them yields "convention not detected" template input,
  never an error or hallucinated findings. Mechanizes the Scripture's
  changelog_first_diagnostic cure as a runnable graph.
modules:
  - examples
requirements:
  - id: REQ-YG-531
    description: >
      The recap demo graph loads, lints clean, and has exactly one LLM node
      (synthesize) with all collection done by `type: tool` nodes. All git
      commands use `git -C {repo_path}` (portable to any repo, no reflog
      syntax, no cwd assumptions). Commit collection is capped (-n 300) with
      truncation surfaced to the prompt via Jinja2. A repo_path that is not
      a git repository fails loudly (tool node on_error: fail raises); missing
      convention paths yield empty output without error. The synthesis prompt
      uses an inline schema (workstreams, orphans, hotspots) with file-kind
      partitioning and convention detection done by Jinja2 path heuristics in
      the template, not by the model (W026-clean: judgement fields only).
      Model-authored FR/NC references are claims (FR-930): finalize_recap
      reconciles them against the model-visible deterministic universe
      (commits/referenced, churn, fr_changes, fragments — never fr_statuses),
      strips unverified tokens before the status join, and records them in
      recap.unverified_refs. Hallucinated references cannot reach the output.
    modules:
      - examples
  - id: REQ-YG-534
    description: >
      Disposition axis and mechanized orphan detection (FR-702). fr_statuses
      tool collects verbatim FR Status lines at HEAD via anchored git grep
      (^**Status, -m 1 per file); git grep exit 1 (no matches / no convention)
      is normalized to success at the boundary while exit >=2 (not a repo)
      fails loudly. Workstream lines carry verbatim [Status: ...] tags — the
      model never infers disposition. Commit reference detection is a
      deterministic type:python pre-pass (nodes/partition.py, pattern
      (FR|NC)-[0-9]+|#[0-9]+ anywhere in subject) splitting commits into
      referenced/unreferenced state keys; mid-subject references can no
      longer be flagged as orphans. Schema stays at three fields (W026).
    modules:
      - examples
  - id: REQ-YG-535
    description: >
      Status join as deterministic post-pass (FR-703). attach_statuses runs
      after synthesize: parses fr_statuses grep lines to an id->status map
      (path and **Status:** prefix stripped, duplicate id first-wins) and
      appends [Status: ...] to each workstream line by joining ALL FR/NC ids
      found (finditer, IGNORECASE) — single tag when statuses agree, per-id
      tags when they differ, [no FR status] when no id resolves, untouched
      when the line names no id. The post-pass normalizes recap at its
      boundary (dict or Pydantic model). The synthesis prompt carries no
      disposition instructions and no fr_statuses input; it does carry a
      full-id formatting bound (no range/slash shorthand) so mechanical
      extraction cannot be starved. The model can no longer fail the join.
    modules:
      - examples
  - id: REQ-YG-536
    description: >
      Orphans bypass the model (FR-704). finalize_recap post-pass copies the
      unreferenced commit lines bit-exact into recap.orphans (zero model
      transit — kills the reproducible one-character hash corruption
      703b72d->703b72e observed in two field runs) and appends deterministic
      convention orphans: graph/prompt-path churn entries when the window
      added no changelog fragment. The synthesis schema carries only
      judgement fields (workstreams, hotspots); the prompt has no orphan or
      copy instructions and no unreferenced input. Integration asserts the
      orphan hash field by exact equality — tolerant matching is for LLM
      output and orphans no longer are.
    modules:
      - examples
  - id: REQ-YG-669
    description: >
      Pull-request axis (FR-1027). One graph-local python node
      (examples/demos/recap/nodes/prs.py, type: python tool collect_prs_fn)
      derives owner/name from repo_path's origin remote and returns a single
      code-owned state key, pr_axis. Three accepted remote families
      (https://, ssh://, scp-style git@host:owner/name), each with an optional
      .git suffix; a missing, malformed, local/file, or non-GitHub origin ends
      the node with a stable reason and NO gh invocation, while a path that is
      not a git repository still fails loudly. The window boundary is the
      exact epoch returned by git rev-parse --since=<since> (passed as one
      argv element); UTC date conversion is display-only, so midnight
      truncation cannot move a row in or out of the window. Membership is
      inclusive: merged when mergedAt >= epoch, closed_unmerged when mergedAt
      is null and closedAt >= epoch, open for every state == OPEN row at any
      age. Collection is exactly ONE gh subprocess invocation per recap
      (gh pr list --repo <slug> --state all --limit 300 --json
      number,title,state,createdAt,mergedAt,closedAt), fixed argv,
      shell=False, 60-second timeout; four narrow failure classes
      (FileNotFoundError, TimeoutExpired, CalledProcessError with and without
      stderr, unparseable JSON or a row missing a required field) each yield
      available: False with empty buckets and a stable non-empty reason, and
      no broad handler absorbs anything else. Ordering is code-owned and
      stable: decided buckets by decision timestamp descending then number
      descending, open rows by createdAt descending then number descending.
      Lines are assembled in code as #<number>|<created>→<end>|<N>d|<title>
      with the title byte-identical to the gh JSON, so every number is
      paste-safe (FR-704 rule). available: True with empty buckets (a window
      with no pull requests) is a different value from available: False (an
      axis that could not be read), and 300 returned rows set cap_reached
      whose note says results MAY be truncated — a 301st row is not
      observable. finalize_recap attaches pr_merged, pr_closed_unmerged,
      pr_open and one pr_axis_note without disturbing workstreams, orphans,
      hotspots or unverified_refs; absent pr_axis state renders as unavailable
      rather than empty. scripts/weekly_recap.py emits the note once before
      the three PR sections so a cap warning cannot be suppressed by non-empty
      buckets, renders (none) for an available empty bucket and
      (not collected) for an unavailable one, and leaves the three original
      section headings and their order unchanged. The axis is invisible to the
      model: prompts/recap.yaml is unmodified, its schema stays
      {workstreams, hotspots}, and synthesize carries no pr_* variable.
      .github/workflows/weekly-recap.yml passes the existing
      secrets.RECAP_PAT as GH_TOKEN to the recap step only — no new secret,
      no new workflow permission.
    modules:
      - examples
