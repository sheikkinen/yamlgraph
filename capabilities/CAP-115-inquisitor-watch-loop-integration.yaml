id: CAP-115
name: Inquisitor Watch Loop Integration
description: >
  Moves the Inquisitor from a fire-and-forget post-commit hook into the
  watch.sh polling loop, making watch.sh the single orchestrator for all
  audit and enforcement activity. The Inquisitor runs with --propose after
  each successful enforce cycle, feeding findings back into the inbox.
modules:
  - .chaplain/watch.sh
  - .chaplain/inquisitor.sh
  - .pre-commit-config.yaml
  - tests/unit/test_inquisitor_watch_integration
requirements:
  - id: REQ-YG-262
    description: >
      `inquisitor-background` post-commit hook removed from
      `.pre-commit-config.yaml`; `.chaplain/watch.sh` runs
      `.chaplain/inquisitor.sh --propose` after each successful enforce
      cycle with `|| true` failure tolerance; log output captured to
      timestamped file in `tmp/`; inquisitor step placed after enforce
      and before post-merge finalization; existing gates (worktree
      FR-142, commit-delta FR-131) unchanged; `--force` manual
      invocation still works
    modules:
      - .chaplain/watch.sh
      - .pre-commit-config.yaml
      - tests/unit/test_inquisitor_watch_integration
fr: FR-261
