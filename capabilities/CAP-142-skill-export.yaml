id: CAP-142
name: Skill Export Portable Packaging
description: >
  Add `yamlgraph skill export` to package existing graphs into portable Skills
  bundles with deterministic filesystem artifacts for skill discovery.

modules:
  - yamlgraph/skill_export.py
  - yamlgraph/skill_export_writer.py
  - yamlgraph/cli/__init__.py
  - yamlgraph/cli/skill_commands.py
  - reference/cli.md
  - reference/skills-export.md
  - reference/README.md
  - tests/unit/test_fr348_skill_export_red.py

requirements:
  - id: REQ-YG-320
    description: >
      CLI parser registers `yamlgraph skill export` with `--format` and
      `--output-dir` options and dispatches to skill command handlers.
    modules:
      - yamlgraph/cli/__init__.py
      - yamlgraph/cli/skill_commands.py
      - tests/unit/test_fr348_skill_export_red.py

  - id: REQ-YG-321
    description: >
      Export generates required package artifacts: `SKILL.md`,
      executable `scripts/run.sh`, `references/`, and `assets/schema.json`.
    modules:
      - yamlgraph/skill_export.py
      - yamlgraph/skill_export_writer.py
      - tests/unit/test_fr348_skill_export_red.py

  - id: REQ-YG-322
    description: >
      `SKILL.md` includes skill metadata, typed input/output sections, and
      runnable CLI invocation example.
    modules:
      - yamlgraph/skill_export.py
      - yamlgraph/skill_export_writer.py
      - tests/unit/test_fr348_skill_export_red.py

  - id: REQ-YG-323
    description: >
      `assets/schema.json` contains top-level `input` and `output` schema
      objects derived from graph input vars and output state keys.
    modules:
      - yamlgraph/skill_export.py
      - yamlgraph/skill_export_writer.py
      - tests/unit/test_fr348_skill_export_red.py

  - id: REQ-YG-324
    description: >
      Format variants map to expected paths for `skill-md`, `copilot`, and
      `cursor` package layouts.
    modules:
      - yamlgraph/skill_export.py
      - yamlgraph/skill_export_writer.py
      - tests/unit/test_fr348_skill_export_red.py

  - id: REQ-YG-325
    description: >
      Export is deterministic and non-LLM with explicit errors for invalid
      graph input, unsupported format, and target collisions.
    modules:
      - yamlgraph/skill_export.py
      - yamlgraph/skill_export_writer.py
      - yamlgraph/cli/skill_commands.py
      - tests/unit/test_fr348_skill_export_red.py

  - id: REQ-YG-326
    description: >
      CLI/reference docs include `yamlgraph skill export` usage and output
      layout examples for all format variants.
    modules:
      - reference/cli.md
      - reference/skills-export.md
      - reference/README.md
      - tests/unit/test_fr348_skill_export_red.py

fr: FR-348
