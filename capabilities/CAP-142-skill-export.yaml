id: CAP-142
status: retired
retired_by: FR-1012
name: Skill Export Portable Packaging
description: >
  RETIRED by FR-912. Four months, zero committed artifacts: every file under
  `.github/skills/` is hand-authored (CAP-158/FR-446), including the flagship
  graph-authoring skill written by hand while this generator existed. No
  script, CI job, hook, or chaplain pipeline ever invoked the exporter; its
  only importers were its own CLI dispatch and its own RED tests. The format
  specs survive in FR-348/FR-350/FR-351 and git history. Historical record
  only: packaged existing graphs into portable Skills bundles with
  deterministic filesystem artifacts for skill discovery.

modules:
  - skill_export

requirements:
  - id: REQ-YG-320
    description: >
      CLI parser registered the skill export command with `--format` and
      `--output-dir` options and dispatched to skill command handlers.
    modules:
      - skill_export

  - id: REQ-YG-321
    description: >
      Export generated required package artifacts: `SKILL.md`, executable
      `scripts/run.sh`, `references/`, and `assets/schema.json`.
    modules:
      - skill_export

  - id: REQ-YG-322
    description: >
      `SKILL.md` included skill metadata, typed input/output sections, and a
      runnable CLI invocation example.
    modules:
      - skill_export

  - id: REQ-YG-323
    description: >
      `assets/schema.json` contained top-level `input` and `output` schema
      objects derived from graph input vars and output state keys.
    modules:
      - skill_export

  - id: REQ-YG-324
    description: >
      Format variants mapped to expected paths for the three package layouts.
    modules:
      - skill_export

  - id: REQ-YG-325
    description: >
      Export was deterministic and non-LLM with explicit errors for invalid
      graph input, unsupported format, and target collisions.
    modules:
      - skill_export

  - id: REQ-YG-326
    description: >
      CLI/reference docs carried export usage and output layout examples for
      all format variants.
    modules:
      - skill_export

