id: CAP-300
name: Test Corpus Map
description: >
  FR-1137: a corpus-map-reduce demo that maps every framework test function
  (tests/unit + tests/integration) to a one-sentence description, a primary
  target, and a test type, with deterministic freeze, AST extraction,
  partitioning, reconciliation, a withheld canary, and JSON plus Markdown
  rendering.
modules:
  - examples/demos/test_map/graph.yaml
  - examples/demos/test_map/tools.py
  - tests/unit/test_fr1137_test_map.py
requirements:
  - id: REQ-YG-723
    description: >
      The test-map demo freezes a clean committed test scope (per-file path,
      SHA-256, bytes) and enforces its file, byte, per-payload token and
      partition ceilings before any LLM call; extracts path-qualified
      nodeids, lines, inherited markers (req excluded) and reqs equal to
      req_coverage.extract_req_markers; partitions each file into payloads
      of whole test functions carrying the import block; maps one
      structured-output call per payload at the default provider/model and
      temperature 0; rejects the run on any missing, unknown, duplicate,
      wrong-partition, out-of-enum, malformed-description, map-error or
      canary defect by writing only a diagnostic report; and otherwise
      writes canonical JSON with full provenance and a Markdown rendering
      derived only from that JSON.
    modules:
      - examples/demos/test_map/graph.yaml
      - examples/demos/test_map/tools.py
      - tests/unit/test_fr1137_test_map.py
fr: FR-1137
