id: CAP-157
name: Graph Loader Strict Tool Load Fail Fast
fr: FR-444
description: >
  Graph compilation enforces explicit Python tool loading policy with strict
  fail-fast default and warn-mode opt-out for partial registries.
modules:
  - yamlgraph/graph_loader.py
  - tests/unit/test_fr444_graph_loader_tool_load_mode_red.py
  - reference/graph-yaml.md
  - ARCHITECTURE.md
requirements:
  - id: REQ-YG-420
    description: >
      Graph compilation defaults to strict Python tool loading and raises a
      compile-time ValueError when any Python tool import/symbol load fails,
      reporting each failed tool and root cause in one actionable error.
    modules:
      - yamlgraph/graph_loader.py
      - tests/unit/test_fr444_graph_loader_tool_load_mode_red.py
  - id: REQ-YG-421
    description: >
      Graph config supports config.tool_load_mode: warn to preserve
      warn-and-continue behavior: failed Python tools emit warnings during
      compile and unresolved tools surface as runtime Unknown tool errors in
      tool_call nodes.
    modules:
      - yamlgraph/graph_loader.py
      - tests/unit/test_fr444_graph_loader_tool_load_mode_red.py
      - reference/graph-yaml.md
