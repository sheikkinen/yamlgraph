name: Example Dependency Taxonomy Generator
id: CAP-213
status: active
fr: FR-762
feature_request: FR-762
description: >
  scripts/example_taxonomy_scan.py mechanically discovers every example
  root under examples/ (every directory at any nesting depth is
  independently evaluated; a directory qualifies when it contains a
  structural graph YAML — top-level mapping with a `nodes` mapping key —
  a Python file with an `if __name__ == "__main__"` guard, or a
  README.md with a fenced runnable usage command; noise/hidden
  directories are pruned) and classifies each as extra-backed (every
  third-party import resolves to a distribution
  declared in pyproject.toml; the owning extra(s) are recorded) or
  externally-provisioned (at least one import remains undeclared; the
  specific package is cited, never silently added to pyproject.toml per
  FR-762 C-4). Reuses FR-761's scanner internals (import extraction,
  distribution resolution, PEP 503 normalization) rather than
  reimplementing them. Local sibling-module imports (the sys.path-insert
  fixture idiom common in example tests, e.g. `import tools`) are
  recognized as local, not third-party. Writes
  examples/dependency-taxonomy.yaml as the generated allowlist; --check
  mode fails when the committed file drifts from a fresh discovery run.
modules:
  - scripts/example_taxonomy_scan.py
requirements:
  - id: REQ-YG-571
    description: >
      Example dependency taxonomy contract (FR-762). Root discovery is
      mechanical: every directory under examples/ at any nesting depth
      is independently evaluated (nested roots get their own rows even
      inside another qualifying root); noise and hidden directories are
      pruned. A candidate becomes a root if it has a structural graph
      YAML (parsed document is a mapping with a top-level `nodes`
      mapping key — substring matches on `nodes:` are insufficient, per
      PR #464 review P1), a Python file with an
      `if __name__ == "__main__":` guard, or a README.md containing a
      fenced code block with a recognizable runnable command (python,
      yamlgraph, pytest, uvicorn, node, npm, docker, make, curl, or go
      as first token) — mere README existence is not sufficient.
      Classification has exactly two states, no third: extra-backed
      (owning extra(s) recorded, None when core-only) or
      externally-provisioned (specific undeclared distribution cited).
      Local per-example modules imported via sys.path-insert (matching
      a .py stem or subdirectory name anywhere under the same root) are
      excluded from third-party classification. build_taxonomy() and
      classify_root() accept overridable examples_root/pyproject_path/
      repo_root so tests exercise isolated fixture trees, never the
      live repo.
    modules:
      - scripts/example_taxonomy_scan.py
      - tests/unit/test_example_taxonomy_scan.py
