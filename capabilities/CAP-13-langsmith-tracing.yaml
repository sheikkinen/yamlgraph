id: CAP-13
name: LangSmith Tracing
description: >
  Observability via LangSmith: trace URL retrieval, public sharing, and tracer
  injection.
modules:
  - cli/graph_commands
  - utils/tracing
requirements:
  - id: REQ-YG-047
    description: LangSmith trace URL retrieval and sharing
    modules:
      - utils/tracing
      - cli/graph_commands
  - id: REQ-YG-547
    description: >
      Race-loser trace spans close on cancellation (FR-720): the candidate
      wrapper pre-generates a run_id per ainvoke attempt (passed as
      config={"run_id": ...} — the handle, since tracing is ambient and no
      callback handle exists), and on CancelledError enqueues
      client.update_run with end_time, terminal error ("cancelled: lost
      race to {provider}/{model}" on the winner path, "cancelled: race
      timed out" on the FR-707 drain path) and
      extra.metadata.race_outcome=lost before re-raising. Enqueue-only:
      the verdict path never waits for losers (FR-707 discipline
      unchanged). Skipped cleanly when tracing is disabled. Spawned by
      NC-367 census: 38/38 deployed vertex loser spans pending-forever
      rendered "cancelled by design" as "hung", taxing every trace-based
      investigation and blinding FR-711's deployed A/B.
    modules:
      - node_factory/race_node
fr: legacy
