id: CAP-73
name: Philosopher Challenge Node (FR-195)
fr: FR-195
description: >
  Adds distill + challenge copilot nodes with unwrap gates to the philosopher
  graph, creating an adversarial quality gate (devil's advocate) that prevents
  weak or coincidental patterns from reaching the proposals/ inbox. Implements
  ChallengeVerdict Pydantic model, unwrap_distill/unwrap_challenge tool
  functions, conditional routing on verdict, and distill/challenge prompt YAMLs.
modules:
  - graphs/philosopher/tools.py
  - graphs/philosopher/graph.yaml
  - graphs/philosopher/prompts/distill.yaml
  - graphs/philosopher/prompts/challenge.yaml
  - graphs/philosopher/prompts/reflect.yaml
requirements:
  - id: REQ-YG-193
    description: >
      ChallengeVerdict model with verdict/confidence/objections/surviving_arguments,
      unwrap_distill parses CopilotResult into Proposal or None, unwrap_challenge
      parses CopilotResult into ChallengeVerdict, write_proposals reads top_candidate,
      graph topology with conditional edges, distill/challenge prompts, reflect
      enriched with challenge context
    modules:
      - graphs/philosopher/tools.py
      - graphs/philosopher/graph.yaml
      - graphs/philosopher/prompts/
      - tests/unit/test_philosopher.py
