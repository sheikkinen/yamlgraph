id: CAP-262
name: Map Fan-Out Concurrency Limit
description: >
  Graph-level `config.max_concurrency` and the `--max-concurrency` CLI
  override reach LangGraph's `RunnableConfig["max_concurrency"]`, bounding
  how many parallel `Send` branches run at once for every map node in an
  invocation. Absent everywhere, no key is passed and LangGraph's default
  pool width applies. Throttling is wholly delegated to LangGraph.
modules:
  - yamlgraph/compile/graph_loader.py
  - yamlgraph/cli/__init__.py
  - yamlgraph/cli/graph_run_helpers.py
  - yamlgraph/schemas/graph-v1.json
  - tests/unit/test_fr984_map_max_concurrency.py
requirements:
  - id: REQ-YG-645
    description: >
      `GraphConfig.max_concurrency` is `None` when `config.max_concurrency`
      is absent and a positive int when present; booleans, strings,
      fractional, zero and negative values fail at load naming
      `max_concurrency`. `--max-concurrency` accepts a positive int and
      rejects zero/negative at the parser naming the option. The run-config
      builder omits the key when neither source supplies it, uses the YAML
      value when the CLI is silent, and lets the CLI override YAML.
      `graph-v1.json` publishes the key as integer, minimum 1. A compiled
      map over 40 python-tool items peaks at <= 2 with `max_concurrency: 2`
      and > 2 unthrottled, on both `invoke` and `ainvoke`, returning every
      result.
    modules:
      - yamlgraph/compile/graph_loader.py
      - yamlgraph/cli/__init__.py
      - yamlgraph/cli/graph_run_helpers.py
      - yamlgraph/schemas/graph-v1.json
      - tests/unit/test_fr984_map_max_concurrency.py
fr: FR-984
