id: CAP-06
name: "Routing & Flow Control"
description: >
  Route across nodes using explicit routes, expression evaluation, and control
  nodes.
modules:
  - node_factory/control_nodes
  - routing
  - utils/conditions
requirements:
  - id: REQ-YG-021
    description: "Control node creation (interrupt, passthrough)"
    modules:
      - node_factory/control_nodes
  - id: REQ-YG-022
    description: Conditional routing functions
    modules:
      - routing
  - id: REQ-YG-023
    description: Condition expression evaluation
    modules:
      - utils/conditions
  - id: REQ-YG-214
    description: "Router route mapping redirects interrupt targets to *_prepare and subgraph interrupt targets to *__run in conditional edge route mappings (FR-211)"
    modules:
      - edge_compiler
      - graph_loader
  - id: REQ-YG-552
    description: "Route evidence record and regulated profile (FR-723/FR-807/FR-808). Opted-in runs emit a content-bound run header, timestamped frozen-grammar routes, and a run_end loss count; route and OTEL surfaces share UUIDv7 identity. Overlay export requires a matching header. The regulated artifact profile requires a preflighted per-run filesystem sink and judgement reference, enables evidence by default, records permitted disable overrides, and can fail strict runs on counted evidence loss. Ordinary graphs remain opt-in and non-strict."
    modules:
      - routing
      - utils/route_log
fr: FR-211
