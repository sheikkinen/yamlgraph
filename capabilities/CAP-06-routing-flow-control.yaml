id: CAP-06
name: "Routing & Flow Control"
description: >
  Route across nodes using explicit routes, expression evaluation, and control
  nodes.
modules:
  - node_factory/control_nodes
  - routing
  - utils/conditions
requirements:
  - id: REQ-YG-021
    description: "Control node creation (interrupt, passthrough)"
    modules:
      - node_factory/control_nodes
  - id: REQ-YG-022
    description: Conditional routing functions
    modules:
      - routing
  - id: REQ-YG-023
    description: Condition expression evaluation
    modules:
      - utils/conditions
  - id: REQ-YG-214
    description: "Router route mapping redirects interrupt targets to *_prepare and subgraph interrupt targets to *__run in conditional edge route mappings (FR-211)"
    modules:
      - edge_compiler
      - graph_loader
  - id: REQ-YG-552
    description: "Route decision hook (FR-723). Every routing decision — simple router, expression match, loop-limit exit, map fan-out, no-match fallthrough — emits one JSON line on the public yamlgraph.route logger when opted in (YAMLGRAPH_ROUTE_LOG env or observability.route_log graph flag). Map fan-outs emit map-node name + count, never Send payloads (R-2 privacy). thread_id carried by a contextvar set at run entrypoints, null never fabricated (R-1). Zero serialization when off; emission never raises."
    modules:
      - routing
      - utils/route_log
fr: FR-211
