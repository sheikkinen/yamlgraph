id: CAP-16
name: Linter Cross-Reference
description: >
  Linter cross-reference and semantic checks for edge endpoints, loop limits,
  state references, and contract warnings.
modules:
  - linter/checks
  - linter/checks_contracts
  - linter/checks_semantic
  - linter/graph_linter
  - map_compiler
  - node_factory/llm_nodes
  - scripts/hedging_check
  - utils/prompts
requirements:
  - id: REQ-YG-053
    description: >
      Linter cross-reference & semantic checks: edge endpoint validation (E006),
      loop_limits references (E008), passthrough output (E601), tool_call fields
      (E701/E702), condition syntax (W801), variable prefix (W007), fallback
      config (E010), conditional edge type (E802)
    modules:
      - linter/checks
      - linter/graph_linter
  - id: REQ-YG-054
    description: >
      Chaplain audit fixes: `wrap_for_reducer` non-dict return handling, LLM
      SKIP error recording, linter E011 retry/fallback on tool/python nodes,
      `prompts_relative` warning
    modules:
      - map_compiler
      - node_factory/llm_nodes
      - linter/checks
      - utils/prompts
  - id: REQ-YG-069
    description: >
      Linter E007: error when `{state.X}` in node
      `variables`/`output`/`over`/`args`/`input_mapping` references a field not
      in known state (declared `state:` + node `state_key` +
      `BUILTIN_STATE_FIELDS` + `COMMON_INPUT_FIELDS` + `data_files` + map
      `collect`). Promoted from W014 warning to E007 error (FR-110)
    modules:
      - linter/checks_semantic
  - id: REQ-YG-114
    description: >
      Linter W017: warn when node uses `on_error: skip` — silent fallback that
      drops failures without trace
    modules:
      - linter/checks_contracts
      - linter/graph_linter
  - id: REQ-YG-408
    description: >
      hedging_check enforces fallback-token hygiene in production Python by
      reporting lexical `fallback` usage as FB001, validating confession-backed
      allowlist mappings (`file:line -> CONF-XXX` with Code=FB001), preserving
      existing Pattern 1 detection, adding Pattern 2 (`X = expr or fallback`),
      and running pre-commit scope on both `yamlgraph/` and `scripts/`.
    modules:
      - scripts/hedging_check
      - .pre-commit-config.yaml
      - docs/confessions.md
fr: legacy
