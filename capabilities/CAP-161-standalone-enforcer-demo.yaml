id: CAP-161
name: Standalone Enforcer Demo
fr: FR-462
description: >
  Standalone FR enforcer demo using agent node with 10 task-shaped tools
  (7 shell + 3 python). Implements planned and judged feature requests.
  Portable — runs without VS Code runtime. Completes the
  plan→judge→enforce trilogy.

modules:
  - examples/demos/enforcer/graph.yaml
  - examples/demos/enforcer/prompts/enforcer.yaml
  - examples/demos/enforcer/tools/write_file.py
  - examples/demos/enforcer/tools/edit_file.py
  - examples/demos/enforcer/tools/run_command.py
  - examples/demos/enforcer/demo.sh

requirements:
  - id: REQ-YG-426
    description: >
      Enforcer demo has 10 tools (read_file, search, list_dir, git_log,
      git_diff, lint, run_tests, write_file, edit_file, run_command),
      agent node with max_iterations 25, ImplementationResult schema
      with 4 fields, write_file/edit_file as path-restricted python
      tools, no hardcoded model, and produces structured implementation
      result.
    modules:
      - examples/demos/enforcer/graph.yaml
      - examples/demos/enforcer/prompts/enforcer.yaml
      - examples/demos/enforcer/tools/write_file.py
      - examples/demos/enforcer/demo.sh
