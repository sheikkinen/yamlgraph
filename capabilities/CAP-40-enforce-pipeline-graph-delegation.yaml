id: CAP-40
name: Enforce Pipeline Graph Delegation
description: >
  enforce_worktree.sh delegates all LLM orchestration to
  examples/enforce/graph.yaml instead of inline copilot -p calls, completing the
  three-layer separation.
modules:
  - examples/enforce/graph.yaml
  - scripts/enforce_worktree.sh
  - tests/unit/test_enforce_yamlgraphication
requirements:
  - id: REQ-YG-128
    description: >
      `scripts/enforce_worktree.sh` calls `yamlgraph graph run
      examples/enforce/graph.yaml` with `--var fr_path` and `--var branch`; no
      inline prompts (`IMPLEMENT_PROMPT`, `TEST_PROMPT`, `FIX_PROMPT`), no
      `copilot -p` calls, no pre-commit retry loop, no inline git/PR commands
      remain
    modules:
      - scripts/enforce_worktree.sh
      - examples/enforce/graph.yaml
      - tests/unit/test_enforce_yamlgraphication
fr: FR-128
