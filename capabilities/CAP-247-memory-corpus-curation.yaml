name: Memory-Corpus Curation (Selective Amnesia)
id: CAP-247
status: active
fr: FR-875
feature_request: feature-requests/FR-875-memory-corpus-curation-graph.md
description: >
  examples/memory-curation judges every repo-scope memory note against a
  declared audience premise and renders a human-review disposition draft
  (keep/redact/forget + audience + staleness) under tmp/memory-curation/
  only. Deterministic collect freezes the corpus (manifest + copies);
  a map-node graph judges the frozen snapshot; reconcile validates
  count-in == count-out with zero unknown verdicts; apply executes
  amnesia only under a hash-bound written human sign-off and refuses on
  live-file drift.
modules:
  - examples
requirements:
  - id: REQ-YG-620
    description: >
      memory-curation code-stage contract: collect reads only the
      repo scope of an explicitly configured memory root, writes
      manifest (path, sha256, size, mtime) plus note copies strictly
      under the out-dir, and rejects symlink escapes; reconcile
      Pydantic-validates dispositions with exact enums and cross-field
      invariants (redacted_draft iff redact, staleness_evidence iff
      dated/expired), proves count-in == count-out with each manifest
      path exactly once and zero unknown verdicts, and stamps outputs
      with the manifest hash; apply refuses without a sign-off line
      binding manifest and disposition hashes, refuses all mutation on
      any live-hash drift, executes forget=delete / redact=replace /
      keep=untouched, and is idempotent on re-run.
    modules:
      - examples
  - id: REQ-YG-621
    description: >
      FR-878 reversible amnesia and tiered approval: forget archives to
      an op-id collision-safe shelf and redact stashes its original as a
      backup, both tombstoned with schema rows in a protected
      _tombstones.md that apply refuses to forget or redact; restore is
      conflict-safe (refuses diverged live bytes) and idempotent only for
      recorded restorations; approval tier is computed from disposition
      content with precedence export_publication > forget > redact >
      keep-only, where premise_kind is a validated enum failing closed to
      tier 3, tier 1 requires a machine-checked DELEGATION provenance
      line plus an audit record, tiers 2/3 require recorded human
      response artifacts; re-derivation advisory fires only against
      forget tombstones (never redaction backups) with zero LLM or
      network calls.
    modules:
      - examples
