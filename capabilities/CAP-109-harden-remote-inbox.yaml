name: Harden GitHub Issues Remote Inbox
description: >
  Author allowlisting, body size cap (10,000 chars), and forensic
  author audit header for the GitHub Issues remote inbox (FR-243
  hardening). Prevents prompt injection via untrusted issue bodies.
modules:
  - .chaplain/watch.sh
  - .chaplain/allowed-authors.txt
requirements:
  - id: REQ-YG-256
    description: >
      watch.sh gates GitHub Issue import on .chaplain/allowed-authors.txt
      (one login per line); issues from unlisted authors are skipped with
