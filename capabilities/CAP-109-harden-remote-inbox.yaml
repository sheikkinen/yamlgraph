      body truncated at BODY_SIZE_CAP (10000) with warning; every imported
      file starts with <!-- author: @login --> audit header; author login
      fetched before title/body for early rejection (FR-251)
    modules:
      - .chaplain/watch.sh
      - .chaplain/allowed-authors.txt
      - tests/unit/test_harden_remote_inbox.py
