id: CAP-28
name: Graph-Level Thinking Budget and Effort
description: >
  Graph-level and per-node reasoning controls: the thinking_budget YAML field
  for Anthropic extended thinking (and Google/Vertex/DeepSeek), and the effort
  field for Anthropic output_config.effort (FR-1151).
modules:
  - yamlgraph/models/graph_schema.py
  - yamlgraph/models/node_schema.py
  - yamlgraph/node_factory/llm_nodes.py
  - yamlgraph/utils/llm_factory.py
  - yamlgraph/utils/llm_providers.py
  - yamlgraph/utils/anthropic_thinking.py
requirements:
  - id: REQ-YG-083
    description: >
      `thinking_budget` YAML field on graph `defaults` and per-node; validated
      as `0` or `≥ 1024`; `≥ 1024` is passed as
      `thinking={"type":"enabled","budget_tokens":N}` to `ChatAnthropic` with
      forced `temperature=1` (override before cache key); `0` turns thinking
      off in the form each model takes (`{"type":"between_tools"}` on
      `claude-sonnet-5-5`, `{"type":"disabled"}` elsewhere) and raises
      `ValueError` before any request on `claude-opus-5-5` and `claude-fable-5*`,
      which cannot turn it off; `0` does not force `temperature=1`; omitted
      leaves the request unchanged (FR-1148); raises on non-Anthropic provider
      for `≥ 1024`; included in LLM cache key
    modules:
      - yamlgraph/models/graph_schema.py
      - yamlgraph/utils/llm_factory.py
      - yamlgraph/utils/llm_providers.py
      - yamlgraph/utils/anthropic_thinking.py
  - id: REQ-YG-725
    description: >
      `effort` YAML field (`low`, `medium`, `high`, `xhigh`, `max`) on graph
      `defaults` and on `llm` nodes and `router` nodes without `candidates`,
      node over defaults; sent to `ChatAnthropic` as `reasoning_effort`
      (`output_config.effort`); omitted leaves the request unchanged; any
      other resolved provider raises `ValueError` before a client is built;
      a value outside the five, or `effort` on a race node or a router with
      `candidates`, is refused at load; included in the LLM cache key
    modules:
      - yamlgraph/models/node_schema.py
      - yamlgraph/models/graph_schema.py
      - yamlgraph/node_factory/llm_nodes.py
      - yamlgraph/utils/llm_factory.py
fr: FR-071, FR-1148, FR-1151
