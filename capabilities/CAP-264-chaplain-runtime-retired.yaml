description: >
  Phase 2 of FR-1010: the Chaplain FSM runtime (.chaplain/) is absent from
  main. A model-assisted census (docs/census/chaplain-test-disposition.jsonl,
  reconciled row by row with confirmed operator resolutions) decided which
  chaplain-coupled tests and capability records witnessed only the retired
