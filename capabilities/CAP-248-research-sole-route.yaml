name: Research Sole Route (Closed-Input Alternatives)
id: CAP-248
status: active
fr: FR-890, FR-896, FR-926, FR-938, FR-1005
feature_request: feature-requests/FR-890-research-sole-route-closed-input-alternatives.md
description: >
  scripts/research.sh runs the examples/demos/research-route map+reduce
  graph — five personas with orthogonal priors (OS/infra primitivist,
  data/process planner, YAMLGraph-native planner, subtractionist,
  web-grounded librarian), each receiving only a closed problem brief —
  producing tmp/draft-alternatives.md: a dispositioned alternatives
  table with precedent citations and planner disagreement preserved as
  rows. A deterministic stdlib preflight rejects solution-contaminated
  briefs before any tokens are spent; the wrapper serializes runs,
  exports a lineage sentinel, and verifies the artifact by schema shape
  rather than graph exit code.
modules:
  - examples
requirements:
  - id: REQ-YG-623
    description: >
      Research route contract: the brief preflight is deterministic
      stdlib code requiring problem statement, closed-enum
      classification, constraints, and witnessed incidents while
      rejecting proposed-solution/candidate sections (exit 64); the
      LLM-free reducer writes tmp/draft-alternatives.md with the frozen
      columns candidate/persona/class/verdict/precedent/is_this_a_graph/
      effort-risk/rationale, closed solution_class and verdict enums
      (echo is reducer-only), no empty required cells, max_length=400
      rejection (never truncation), disagreement preserved as separate
      rows, convergence annotated convergent xN with distinct-class
      count advisory only, and a grounding gate of at least three
      non-echo traceable findings (FR-896); precedent claims are
      validated in code — committed FR/CAP/path/Scripture-key/demo-dir
      identifiers pass, a bounded none-retrieved claim is accepted only
      when the retrieval block came back empty, brief-echo is rejected
      outright, markers count only when claimed as the whole cell or as
      a leading marker: prefix, fabricated identifiers fail with named
      violations, and the librarian citation URL is reconciled against
      recorded librarian_tool_results, failing closed on error strings,
      missing URLs, or fabrication; personas receive a deterministic
      bounded committed-context block; scripts/research.sh enforces
      usage (64), missing brief (66), re-entry sentinel (70), lock
      (73/75), and artifact contract (65) taxonomy, verifies the
      artifact by schema shape, and appends an integrity provenance
      line (brief/artifact SHA-256, code git SHA) to
      feature-requests/research-runs.jsonl checkable via
      research_preflight.py --verify-promotion; when a persona key is
      missing, the gather boundary cites the causes already recorded in
      state["errors"] (node, category, exception type, message) for
      PipelineError and dict entries alike, ignoring unstructured ones
      and preserving the terse missing-key message when the channel is
      empty (FR-926).
    modules:
      - examples
  - id: REQ-YG-665
    description: >
      Research route row-failure containment (FR-1005): gather_findings
      emits exactly one entry per canonical persona slot, and a missing
      persona key becomes a typed FailedPersona record (outcome, canonical
      state_key, non-empty cause) only when exactly one recorded error
      belongs to that key's explicitly mapped graph node and is a
      model-owned structured-output/schema validation failure; the
      librarian, zero or ambiguous matches, and non-model failures stay
      fatal with FR-926's diagnostics. The reducer attributes by slot: a
      present finding that fails PersonaFinding validation (over-length,
      closed-enum miss, empty cell) is contained with a cause naming the
      field and Pydantic error type, never truncated or repaired; more
      findings than slots, non-mapping entries, misplaced records, a
      failed librarian, two failures, fewer than four valid or three
      grounded rows, fabricated precedent and librarian reconciliation
      failures raise before any artifact is written. The artifact carries
      JSON accounting (persona keys executed / personas failed) whose
      invariants — unique known keys, disjoint, conserved against the
      five persona keys, row count equal to executed count, non-empty
      cause, at most one failure, librarian executed, no failure line on
      a full run — are enforced by the reducer and re-checked by
      research_preflight.verify_artifact with mirrored constants.
    modules:
      - examples
