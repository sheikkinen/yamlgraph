id: CAP-143
name: Agent Markdown Export
description: >
  Add `agent-md` format to `yamlgraph skill export` so graphs can be exported as
  `.agent.md` mode files scoped to YAMLGraph MCP tools.

modules:
  - yamlgraph/skill_export.py
  - yamlgraph/skill_export_writer.py
  - yamlgraph/cli/__init__.py
  - reference/cli.md
  - reference/skills-export.md
  - tests/unit/test_fr351_agent_export_red.py

requirements:
  - id: REQ-YG-327
    description: >
      CLI parser accepts `yamlgraph skill export ... --format agent-md`.
    modules:
      - yamlgraph/cli/__init__.py
      - tests/unit/test_fr351_agent_export_red.py

  - id: REQ-YG-328
    description: >
      Export writes a single agent mode artifact to
      `.github/agents/<skill-name>.agent.md`.
    modules:
      - yamlgraph/skill_export.py
      - yamlgraph/skill_export_writer.py
      - tests/unit/test_fr351_agent_export_red.py

  - id: REQ-YG-329
    description: >
      Generated `.agent.md` frontmatter includes graph description and
      `tools: [yamlgraph/*]` scope.
    modules:
      - yamlgraph/skill_export_writer.py
      - tests/unit/test_fr351_agent_export_red.py

  - id: REQ-YG-330
    description: >
      Generated body includes graph-scoped persona and explicit YAMLGraph
      MCP-only execution guidance.
    modules:
      - yamlgraph/skill_export_writer.py
      - tests/unit/test_fr351_agent_export_red.py

  - id: REQ-YG-331
    description: >
      Missing/invalid graph and output target collisions fail explicitly with
      non-zero CLI behavior via existing error handling path.
    modules:
      - yamlgraph/skill_export.py
      - yamlgraph/cli/skill_commands.py
      - tests/unit/test_fr351_agent_export_red.py

  - id: REQ-YG-332
    description: >
      CLI and skill export reference docs include `agent-md` usage and output
      layout for `.github/agents/*.agent.md`.
    modules:
      - reference/cli.md
      - reference/skills-export.md
      - tests/unit/test_fr351_agent_export_red.py

fr: FR-351
