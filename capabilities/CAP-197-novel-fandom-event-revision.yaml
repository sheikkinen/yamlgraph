name: Novel Fandom Event Revision
id: CAP-197
status: active
fr: FR-693
feature_request: FR-693
description: >
  Latent-thread closure layer for the novel_fandom example: an additive pass
  that gives every latent plot thread on-page events (a raise and a release) or
  an explicit waiver. Three pure mechanical gates enforce it — latent closure,
  waiver integrity, and byte-identity of pre-existing event files — and the
  create_event tool is taught to emit a total-order `sequence` value (FR-690)
  so revision events carry it while genesis/worldgen creates that omit it still
  validate. Gates are set/dict computation, not LLM tasks.
modules:
  - examples
requirements:
  - id: REQ-YG-537
    description: >
      Latent-thread closure and waiver integrity. Every thread with
      status=latent must carry a non-empty raises AND releases list, or its id
      must appear in the waiver set — the exit condition is zero unwaived
      latents, not zero latents. Each waiver must name a live thread id (ref
      check against the current thread set) and carry a non-empty reason and
      decided_by; dangling or under-documented waivers are violations.
      Non-latent threads are ignored. Pure functions returning
      {valid, violations}.
    modules:
      - examples
  - id: REQ-YG-538
    description: >
      Additive event revision. The create_event tool emits an optional
      `sequence` field when supplied (int total order, FR-690) and omits it
      otherwise so genesis/worldgen creates keep validating. A byte-identity
      gate over pre-existing event-file snapshots ({id: bytes} before/after)
      flags any pre-existing file whose bytes changed or that vanished; new
      files are permitted (revision is additive-only). Pure functions returning
      {valid, violations}.
    modules:
      - examples
