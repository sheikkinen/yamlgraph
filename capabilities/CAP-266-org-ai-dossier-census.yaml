id: CAP-266
name: Org AI dossier census (GitHub + Jira)
fr: FR-1029
description: >
  Contrib/example graph `examples/demos/org_ai_dossier/` built on the
  corpus-census pattern with a frozen two-source topology: GitHub active
  repositories and Jira active projects are discovered, extracted and
  classified (one Azure judgement per unit, temperature 0, every LLM node
  pinned `provider: azure`); typed LLM-free reducers own identities,
  coverage denominators, evidence reconciliation (model claims survive only
  with bundle-present evidence), two hidden semantic canary families, an
  AI-tool inventory, and two source-qualified person rankings (no
  cross-system join); an explicitly authorized (`persons_llm` required,
  no default, ack recorded) Azure map writes per-person summaries; two
  bounded synthesis judgements write dossier findings and a ≤800-word
  onepager. Numeric ceilings abort at N+1 before any LLM spend; the
  output root is enforced beneath gitignored `research/org-ai-dossier/`
  (smoke: `tmp/`), artifacts are written atomically only after
  reconciliation and canaries pass, and a mechanical locality audit keeps
  private identifiers out of the public repo. Adapters:
  `gh_ai_adapters.py` (active discover, AI-signal extract, org code
  search), `jira_adapters.py` (REST v3 discover/extract + smoke fixtures).
modules:
  - examples/demos/org_ai_dossier/graph.yaml
  - examples/demos/org_ai_dossier/tools.py
  - examples/demos/corpus_census/adapters/gh_ai_adapters.py
  - examples/demos/corpus_census/adapters/jira_adapters.py
  - tests/unit/test_fr1029_gh_ai_adapters.py
  - tests/unit/test_fr1029_jira_adapters.py
requirements:
  - id: REQ-YG-670
    description: >
      GitHub discover filters visibility/archived/window, returns sorted
      unique ids and aborts at MAX_REPOS+1; extract emits a typed bounded
      GitHubBundle (instruction files, manifest/workflow AI hits with paths,
      in-window PR authors with bot flags, tree truncation, absent markers);
      org code search respects term/result/rate ceilings and flags caps;
      Jira discover paginates with a page-cap overflow abort, validates keys,
      counts activity via approximate-count and reports dormant keys; Jira
      extract emits a typed bounded JiraBundle (≤30 issues, accountId-keyed
      persons, ADF flattened to ≤300 chars, AI-term clauses, non-2xx raise,
      single 429 retry); reducers reconcile identities exactly once, drop
      unsupported model claims, enforce both canary families and all
      ceilings, keep persons source-qualified with two rankings, gate
      person summaries on a required no-default policy input with ack,
      render denominator-qualified shares and a ≤800-word onepager, and
      write artifacts atomically only under the enforced output root; the
      locality audit passes on every committed artifact.
    modules:
      - examples/demos/org_ai_dossier/tools.py
      - examples/demos/corpus_census/adapters/gh_ai_adapters.py
      - examples/demos/corpus_census/adapters/jira_adapters.py
