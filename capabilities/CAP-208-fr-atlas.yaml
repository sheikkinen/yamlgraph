name: FR Atlas Onboarding Demo
id: CAP-208
status: active
fr: FR-748
feature_request: FR-748
description: >
  Portable onboarding atlas demo (examples/demos/fr-atlas): renders any
  project's feature-requests/ corpus as a newcomer narrative — 8-15
  theme arcs ordered by last git activity, module axis joined
  mechanically (CAP registry where present, path regex otherwise), a
  3-paragraph story opener whose input is the taxonomy never the raw
  corpus, and a graveyard section of rejected FRs. Pipeline copies the
  recap discipline: deterministic collection, three bounded LLM
  judgements (chunk themes, merge, story), code-side joins with
  count-in == count-out asserted.
modules:
  - examples/demos/fr-atlas/nodes/collect.py
  - examples/demos/fr-atlas/nodes/coverage.py
  - examples/demos/fr-atlas/nodes/render.py
requirements:
  - id: REQ-YG-566
    description: >
      FR Atlas deterministic spine (FR-748). Collector: population id
      = filename stem, never a prefix regex (unprefixed elder files
      are population members — the graveyard exemplars); TEMPLATE.md
      and *.judgement.md companions excluded and counted in
      parse_notes; headerless files reported by id, never dropped;
      digests carry verbatim Status line, first-word status_bucket
      with visible other, and a Problem/Summary excerpt; a missing
      feature-requests/ dir raises naming the path. Chunker: every
      population id appears in exactly one chunk. Coverage post-pass:
      themes referencing unknown ids raise; duplicate assignments keep
      the first occurrence; unassigned ids land in an explicit misc
      theme; total assigned count equals population count (silent
      join drops impossible). Render: graveyard section lists exactly
      the rejected-bucket FRs with verbatim status lines.
    modules:
      - examples/demos/fr-atlas/nodes/collect.py
      - examples/demos/fr-atlas/nodes/coverage.py
      - examples/demos/fr-atlas/nodes/render.py
