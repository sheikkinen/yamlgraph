id: CAP-232
name: API Discovery Browser-Sniff Step
description: >
  Example-level browser-sniff step for the API discovery pipeline
  (FR-789): a single-agent graph under
  examples/api-discovery/steps/browser-sniff/ that loads a SPA URL in
  headless Chromium via the FR-784 network_sniff shell manifest,
  retains only data-classified XHR/fetch requests as CapturedRequest
  entries, excludes telemetry/analytics noise, and maps auth/CAPTCHA
  evidence to a typed needs_manual verdict hint instead of an error.
  Exposed to the FR-791 orchestrator as a graph-runtime tool manifest
  (browser_sniff.tool.yaml) — the expensive last resort when
  page-analysis finds a SPA with no visible API.
modules:
  - examples
fr: FR-789
requirements:
  - id: REQ-YG-593
    description: >
      The browser-sniff step graph compiles, references the shared
      FR-784 network_sniff manifest without reimplementation, and
      emits SniffResult via the output_schema JSON-Schema dialect:
      api_calls items require url/method/status/content_type/
      body_preview, auth_required is a required boolean, and the
      needs_manual path is typed (verdict_hint enum + manual_reason)
      with prompt doctrine retaining only data-classified requests,
      excluding telemetry, and treating auth/CAPTCHA as a legitimate
      result rather than an error.
    modules:
      - examples
