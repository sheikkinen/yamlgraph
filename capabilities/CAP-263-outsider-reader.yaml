id: CAP-263
name: Outsider Reader for PR Descriptions
description: >
  A reader with no project context reads a pull request's title and body —
  and nothing else — and reports what it understood, what it could not
  understand, and what a merge decision would still need. The model's text is
  normalised at the boundary into a typed report or rejected; the YES/NO
  verdict is derived in code from the validated report, never taken from the
  model; only validated runs against real PRs become ledger rows. Manual,
  advisory, runs from a directory outside the repository with no file or tool
  access. Spike record: docs/spikes/outsider-reader-2026-09-05/.
modules:
  - .github/skills/outsider-view/adapters/outsider_tools.py
  - .github/skills/outsider-view/adapters/graph.yaml
  - scripts/outsider.sh
  - tests/unit/test_fr995_outsider_reader.py
  - tests/unit/test_fr995_outsider_wrapper.py
requirements:
  - id: REQ-YG-660
    description: >
      Model output is parsed into a Pydantic report requiring the four
      numbered headings exactly once and in order, a non-empty restatement,
      a YES/NO opinion line, at most 8 quoted section-3 items and at most 10
      section-4 items; the literal `nothing` is an empty list; missing,
      duplicate, reordered, malformed or over-cap sections raise
      ReportFormatError (fail closed). The rendered report front-loads the
      derived verdict and labels the model's opinion as non-authoritative.
    modules:
      - .github/skills/outsider-view/adapters/outsider_tools.py
  - id: REQ-YG-661
    description: >
      The derived verdict is YES iff the validated report has at most 2
      section-3 items and its restatement contains none of the hedge markers
      "does not say", "something called", "not stated", "cannot tell"
      (case-insensitive); otherwise NO. All nine committed spike reports
      derive NO or are rejected; none derives YES.
    modules:
      - .github/skills/outsider-view/adapters/outsider_tools.py
  - id: REQ-YG-662
    description: >
      A ledger row carries UTC timestamp, repo, PR number, PR head SHA,
      SHA-256 of the exact title+body input, pinned model, prompt digest,
      local tool git SHA, derived verdict, section-3 and section-4 counts and
      report path; rows are appended only for mode "pr" (self-test, dry-run
      and failed runs write none); the distinct-PR count deduplicates by
      (repo, pr).
    modules:
      - .github/skills/outsider-view/adapters/outsider_tools.py
  - id: REQ-YG-663
    description: >
      The wrapper runs the graph with the child working directory outside the
      repository and containing no `.github/`, pins gpt-5.6-sol with neither
      allow_all_paths nor allow_all_tools in the adapter, removes the
      temporary input on success and failure, preserves the validated report
      under repo tmp/, rejects recursive execution via OUTSIDER_EXECUTION,
      and calls `gh pr comment` only under explicit --comment.
    modules:
      - scripts/outsider.sh
      - .github/skills/outsider-view/adapters/graph.yaml
fr: FR-995
