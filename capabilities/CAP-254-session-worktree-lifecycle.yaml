id: CAP-254
name: Session Worktree Lifecycle
description: >
  Manual session-lane tooling: `scripts/worktree.sh session <id>` creates
  an isolated worktree lane (tmp/worktrees/session/<session-id>, branch
  session/<session-id>) idempotently, lossless GC classifies lanes and
  prunes only merged/stale-clean ones, now.py lists lanes read-only, and
  a join script correlates event-store requests to historical checkpoint
  commits with model/credit provenance. The FR-902 hook machinery
  (SessionStart lane creation, PreToolUse ownership guard, Stop-hook
  checkpoints) was retired by FR-927.
fr: FR-902, FR-925, FR-927
modules:
  - scripts/worktree.sh
  - scripts/vscode/now.py
  - scripts/vscode/session_join.py
requirements:
  - id: REQ-YG-629
    description: >
      Session lane creation is idempotent and refusal-safe (full-UUID ids
      only, never deletes session branches, setup leaves the tree clean),
      and lane creation is manual only: no SessionStart/Stop lane hooks,
      no PreToolUse lane-ownership arbitration, and no lane escape
      variable exist in the hook chain.
    modules:
      - scripts/worktree.sh
      - .github/hooks/tests/test_fr902_retired.py
  - id: REQ-YG-630
    description: >
      GC classifies session lanes losslessly and prunes only merged or
      stale-clean lanes without --force or -D; now.py lists session
      lanes without deleting; the join script correlates requests to
      checkpoint shas with model and credit provenance.
    modules:
      - scripts/worktree.sh
      - scripts/vscode/now.py
      - scripts/vscode/session_join.py
      - .github/hooks/tests/test_session_lane_gc_join.py
