id: CAP-254
name: Session Worktree Lifecycle
description: >
  Every agent session works in its own git worktree lane
  (tmp/worktrees/session/<session-id>, branch session/<session-id>):
  SessionStart hook creates the lane idempotently (live-flag gated),
  a PreToolUse ownership guard fences writes to the owning lane, a Stop
  hook commits fenced per-turn checkpoints with Session-Id and
  Request-Index trailers, lossless GC classifies and prunes only
  merged/stale-clean lanes, and a join script correlates requests to
  checkpoint commits with model/credit provenance.
fr: FR-902, FR-925
modules:
  - scripts/worktree.sh
  - .github/hooks/scripts/session-worktree.sh
  - .github/hooks/scripts/session-checkpoint.sh
  - .github/hooks/scripts/pre-command-guard.sh
  - scripts/vscode/now.py
  - scripts/vscode/session_join.py
  - .github/hooks/session-probe.json
requirements:
  - id: REQ-YG-629
    description: >
      Session lane creation is idempotent and refusal-safe (full-UUID ids
      only, never deletes session branches, setup leaves the tree clean),
      and once a lane record exists the PreToolUse guard denies
      write-shaped tool calls targeting this repository outside the
      owning lane with redirection to the lane, without weakening any
      existing guard; escape FR902_ALLOW_OUTSIDE=1 is audited and lifts
      only the lane fence.
    modules:
      - scripts/worktree.sh
      - .github/hooks/scripts/session-worktree.sh
      - .github/hooks/scripts/pre-command-guard.sh
      - .github/hooks/tests/test_fr902_session_worktree.py
      - .github/hooks/tests/test_fr902_lane_guard.py
  - id: REQ-YG-630
    description: >
      Stop-hook checkpoints commit all lane changes with Session-Id and
      Request-Index trailers derived by replaying the transcript event
      store (never fabricated; skip-with-audit when unflushed); GC
      classifies session lanes losslessly and prunes only merged or
      stale-clean lanes without --force or -D; now.py lists session
      lanes without deleting; the join script correlates requests to
      checkpoint shas with model and credit provenance.
    modules:
      - .github/hooks/scripts/session-checkpoint.sh
      - scripts/worktree.sh
      - scripts/vscode/now.py
      - scripts/vscode/session_join.py
      - .github/hooks/tests/test_fr902_checkpoint.py
      - .github/hooks/tests/test_fr902_gc_join.py
