name: Novel Fandom Plot Threads and Throughlines
id: CAP-194
status: active
fr: FR-691
feature_request: FR-691
description: >
  Derived story layer for the novel_fandom example: plot threads (decomposition
  by conflict) and throughlines (decomposition by character), extracted from
  canon by an LLM pipeline and validated by pure mechanical gates. Threads carry
  a raise/release event ledger walked in `sequence` order (FR-690); throughlines
  walk a character's emotional deltas over the events they appear in. Gates are
  arithmetic set/ledger checks, not LLM tasks.
modules:
  - examples
requirements:
  - id: REQ-YG-530
    description: >
      Story gates validate threads and throughlines against canon. Citation
      integrity: every carrier/source/raise/release id resolves to a canon id.
      Ledger walk: for each thread, walking its raise/release events in FR-690
      sequence order, a release without a prior open raise fails, and
      status=released requires a non-empty releases list. Cap and distinctness:
      at most eight threads, each with a distinct carrier set and non-empty
      opposition. Id stability: regeneration preserves ids for persisting
      threads and lists every dropped prior id with a reason (no-op on first
      run). Throughlines: every entry cites a canon event carrying a sequence,
      entries walk in non-decreasing sequence order, each throughline has at
      least one slack point or an explicit arc_taut claim, and a major
      character's arc may not be zero-delta. All gates are pure functions
      returning {valid, violations}; arithmetic, not LLM tasks.
    modules:
      - examples
