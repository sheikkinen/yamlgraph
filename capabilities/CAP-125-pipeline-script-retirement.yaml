    description: >
      All three obsolete scripts (.chaplain/watch.sh, scripts/enforce_worktree.sh,
      scripts/bugfix_worktree.sh) are deleted from the filesystem; any documentation
      references to them are updated to point to `.chaplain/scripts/start-system.sh`;
      start-system.sh is documented
      as the single entry point; failure paths preserve worktree and topic file in
