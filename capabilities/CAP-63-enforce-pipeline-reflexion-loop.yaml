requirements:
  - id: REQ-YG-159
    description: >
      Enforce pipeline reflexion loop: Critique → refine reflexion loop between
      `test_and_demo` and `precommit_check` in `examples/enforce/graph.yaml`.
      Critique evaluates implementation against FR acceptance criteria with
      score 0.0–1.0; refine addresses feedback when score < 0.85; loop bounded
      by `loop_limits` (critique: 3, refine: 2) with `loop_exits: { critique:
      distill_reflection }` (FR-172). `distill_reflection` generates diary entry
      from Scripture trap vocabulary. `finalize_merge.sh` skips stub creation
      when pipeline-generated reflection exists. Three new prompts:
      `enforce-critique.yaml`, `enforce-refine.yaml`, `enforce-distill.yaml`
    modules:
      - examples/enforce/graph.yaml
      - examples/enforce/prompts/
      - scripts/finalize_merge.sh
      - tests/unit/test_enforce_reflexion_loop
fr: FR-169
