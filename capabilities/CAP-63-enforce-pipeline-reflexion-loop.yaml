id: CAP-63
name: Enforce Pipeline Reflexion Loop
description: >
  Critique-refine reflexion loop between test_and_demo and precommit_check in
  examples/enforce/graph.yaml.
modules:
  - examples/enforce/graph.yaml
  - examples/enforce/prompts/
  - scripts/finalize_merge.sh
