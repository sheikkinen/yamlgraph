name: Ramp Installer
id: CAP-244
status: active
fr: FR-865
feature_request: FR-865
description: >
  Mechanical, idempotent, reversible installer (scripts/ramp.sh →
  scripts/ramp_installer.py) that copies curated domain-free governance
  assets from ramp/assets/tier{1,2,3}/ into a target repository per
  ramp/manifest.yaml. No LLM, no network, no git command against the
  target. Tier 1 = live basics (curated pre-commit config, curated
  Copilot guard, inert CI setup stub, AGENTS.md stub); Tier 2 adds
  governance templates, judge/review wrappers and skill doctrine; Tier 3
  adds the capability-registry shape and a generic req-coverage gate.
  Curated assets stay consumed here: mirror_exact entries are
  byte-equality-tested against live counterparts, curated entries carry
  curation-diff records, and the curated Tier-1 pre-commit config runs
  against a committed fixture scratch repo in the test path (FR-865
  A-1/A-2).
modules:
  - scripts
requirements:
  - id: REQ-YG-610
    description: >
      ramp/manifest.yaml enumerates every shipped asset file-by-file with
      relative normalized source and destination, tier, overwrite policy
      matching implemented behavior, executable-mode metadata where
      needed, and exactly one provenance field (authored, mirror_exact,
      or curation_diff); validation rejects absolute paths, ".."
      traversal, directory sources, missing sources, symlink sources
      unless explicitly allowed, generated/cache/log paths, and duplicate
      destinations; tier expansion is monotonic set containment derived
      from the manifest, never a hardcoded list.
    modules:
      - scripts
  - id: REQ-YG-611
    description: >
      The installer plans create/skip-exists/overwrite actions per tier;
      --dry-run prints every action plus any would-be consumer row and
      writes zero files with exit 0; a Tier-1 install into a scratch
      supported repo creates all Tier-1 destinations byte-identical to
      curated sources; a second identical run changes no asset content or
      mtime and reports skips; the installer prints the pre-commit
      install command for the operator and never executes it.
    modules:
      - scripts
  - id: REQ-YG-612
    description: >
      The installer refuses with non-zero exit and zero writes: a
      non-repo path, a linked worktree (.git file), a nested
      subdirectory, this repository itself, an unsupported target shape
      (Tier-1 contract: pyproject.toml + pytest tests/ + ruff config),
      and any destination escaping the target root; an already-present
      AGENTS.md survives without --force; --force backs up before
      overwriting and records before/after hashes;
      <target>/docs/ramp-manifest.md records destination, source, action,
      source commit SHA and content hashes sufficient for rollback; and
      rollback deletes only created files and restores forced-overwrite
      backups.
    modules:
      - scripts
  - id: REQ-YG-613
    description: >
      Consumption and provenance stay mechanical: the curated Tier-1
      pre-commit config is validated and executed against the committed
      fixture scratch repo in the test path; every mirror_exact entry
      matches its live counterpart byte-for-byte and every curation_diff
      entry has a record in ramp/curation-diffs.md naming live source,
      curated asset, removed/changed material and reason; source scans
      prove the installer performs no LLM/network call and no
      target-mutating git command and Tier-1 assets carry no
      yamlgraph-only path assumptions; ramp/consumers.md has a documented
      slug-only row schema with idempotent append/update keyed on
      (target, tier, manifest hash) and rejects absolute paths and
      credential-bearing URLs.
    modules:
      - scripts
