id: CAP-03
name: Node Execution
description: >
  Create executable node functions for LLM, streaming, tool, interrupt, and
  subgraph behavior.
modules:
  - executor
  - executor_async
  - executor_base
  - node_factory/llm_nodes
  - node_factory/streaming
  - utils/llm_factory
  - utils/llm_factory_async
requirements:
  - id: REQ-YG-009
    description: Node creation and streaming
    modules:
      - node_factory/llm_nodes
      - node_factory/streaming
  - id: REQ-YG-010
    description: Synchronous LLM factory management
    modules:
      - utils/llm_factory
  - id: REQ-YG-011
    description: Asynchronous LLM factory management
    modules:
      - utils/llm_factory_async
  - id: REQ-YG-050
    description: >
      Per-node and default-level `model` override: graph YAML `model` field
      flows through `execute_prompt()` to `create_llm()`
    modules:
      - node_factory/llm_nodes
      - executor
      - executor_async
      - executor_base
  - id: REQ-YG-223
    description: >
      LLM node factory decomposed into composable phases: LLMNodeConfig frozen
      dataclass, resolve_llm_node_config() pure config resolver,
      _apply_verification(), _resolve_route(), _handle_error() — each
      independently testable, all below C901=10 (FR-223)
    modules:
      - node_factory/llm_nodes
  - id: REQ-YG-539
    description: >
      Every provider constructor in llm_providers.py bounds provider work at
      the client boundary (FR-708): an explicit finite request timeout
      (default LLM_REQUEST_TIMEOUT=30s, env-overridable, garbage values
      raise) and bounded retries (max_retries=2) via the wrapper-correct
      parameter (timeout for the ChatOpenAI/ChatAnthropic/
      ChatGoogleGenerativeAI/ChatMistralAI/Azure families, request_timeout
      for ChatLiteLLM). Caller-supplied kwargs win over the defaults.
      VERTEX_TRANSPORT=rest|grpc plumbs transport= into the google and
      vertex constructors (express and ADC branches); invalid values raise
      at the boundary. A hung provider endpoint fails within the timeout
      instead of hanging forever and accumulating transport channels
      (Fly freeze RCA 2026-07-10).
    modules:
      - utils/llm_providers
fr: legacy
