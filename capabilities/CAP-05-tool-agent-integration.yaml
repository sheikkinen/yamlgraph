id: CAP-05
name: "Tool & Agent Integration"
description: >
  Integrate shell, Python, and graph tools into graphs, enable agent loops for
  tool-calling.
modules:
  - node_factory/tool_nodes
  - tools/agent
  - tools/graph_tool
  - tools/nodes
  - tools/python_tool
  - tools/shell
requirements:
  - id: REQ-YG-017
    description: Dynamic tool node creation
    modules:
      - node_factory/tool_nodes
  - id: REQ-YG-576
    description: >
      tool_call inline dict args (FR-772): an inline YAML mapping as
      tool_call.args resolves each value via resolve_node_variables
      (FR-252 semantics — literals pass through, non-string types
      preserved, simple missing paths resolve to None); a resolved value
      still containing "{state." raises ValueError naming node and key;
      an empty inline mapping dispatches no kwargs (never whole-state);
      the string form "{state.X}" behaves exactly as before.
    modules:
      - node_factory/tool_nodes
  - id: REQ-YG-580
    description: >
      tool_call on_error (FR-778): on_error defaults to skip — the
      failure envelope {success: false, error} is byte-identical to the
      pre-FR behavior for callable exceptions and unknown tools.
      on_error: fail raises ValueError at the node naming the node, the
      tool, and the original error (exception chained) for both callable
      exceptions and unknown tools; the success-path envelope is
      unchanged. Graph load rejects tool_call on_error values outside
      skip/fail (including retry and fallback) naming the valid set.
    modules:
      - node_factory/tool_nodes
      - utils
  - id: REQ-YG-018
    description: >
      Agent-driven tool selection and execution; all-tool-calls-failed
      runs raise with a failure census before synthesis (FR-891
      fail-closed boundary)
    modules:
      - tools/agent
  - id: REQ-YG-019
    description: Shell tool integration and execution
    modules:
      - tools/shell
      - tools/nodes
  - id: REQ-YG-020
    description: Python tool integration and execution
    modules:
      - tools/python_tool
  - id: REQ-YG-422
    description: Agent node structured output via prompt schema (FR-448)
    modules:
      - tools/agent
  - id: REQ-YG-510
    description: Graph-as-tool in-process pipeline invocation (FR-658)
    modules:
      - tools/graph_tool
      - graph_loader
fr: legacy
