id: CAP-181
name: Novel Fandom Genesis Pipeline
description: >
  Premise-driven world bootstrapping via two-phase pipeline:
  Phase 1 generates prose (synopsis, roster, character cards),
  Phase 2 structures prose into typed canon YAML pages.
  FR-655.
modules:
  - examples/novel_fandom
requirements:
  - id: REQ-YG-505
    description: >
      genesis.yaml graph loads premise from file, generates synopsis,
      extracts character roster, and produces character cards via map node.
    modules:
      - examples/novel_fandom
  - id: REQ-YG-506
    description: >
      structure_world prompt converts prose (synopsis + character cards)
      into structured canon pages with typed fields, absolute years,
      and cross-references in a single LLM pass.
    modules:
      - examples/novel_fandom
  - id: REQ-YG-507
    description: >
      persist_genesis node flattens structured_world output and writes
      each entity to canon/{type}/ via existing persist_pages logic.
    modules:
      - examples/novel_fandom
  - id: REQ-YG-508
    description: >
      genesis_tools.parse_roster splits roster text (one name per line)
      into a list of character names for the map node.
    modules:
      - examples/novel_fandom
fr: FR-655
