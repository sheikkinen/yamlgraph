id: CAP-181
name: Novel Fandom Genesis Pipeline
description: >
  Premise-driven world bootstrapping via stub pipeline (FR-667):
  synopsis (LLM) → stubs (LLM) → validate → persist.
  Produces minimal entity stubs for worldgen enrichment.
  FR-655, FR-664, FR-667.
modules:
  - examples/novel_fandom
requirements:
  - id: REQ-YG-505
    description: >
      genesis.yaml graph loads premise from file, generates synopsis,
      and produces entity stubs via generate_stubs LLM node.
      Validate node checks referential integrity before persist.
    modules:
      - examples/novel_fandom
  - id: REQ-YG-506
    description: >
      generate_stubs prompt converts synopsis into structured stub
      entities with minimal fields, referential integrity constraint,
      and typed schema output.
    modules:
      - examples/novel_fandom
  - id: REQ-YG-507
    description: >
      persist_genesis node flattens structured_world output, validates
      referential integrity (FR-664), and writes each entity to
      canon/{type}/ via existing persist_pages logic.
    modules:
      - examples/novel_fandom
fr: FR-655
