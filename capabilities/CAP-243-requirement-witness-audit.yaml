name: Requirement Witness Audit
id: CAP-243
status: active
fr: FR-851
feature_request: FR-851
description: >
  LLM batch review of REQ-test-code triples answering the spine's one
  non-mechanical question: does the tagged test actually witness its
  requirement (citation vs entailment)? A deterministic constructor
  (scripts/req_audit_questions.py) emits one frozen-schema question file
  per registry requirement plus token-budgeted batches; a map-node graph
  (examples/demos/req_witness_audit/, authored via the governed route)
  grades each batch with a haiku-tier model; deterministic reconciliation
  (scripts/req_audit_report.py) verifies returned req_ids against batch
  inputs at the boundary and renders a ranked report — no, partial,
  unaudited first; yes collapsed to counts. Stage 1 verdicts are labeled
  witness plausibility (names-only payloads); Stage 2 escalation carries
  test bodies for entailment claims.
modules:
  - scripts
requirements:
  - id: REQ-YG-606
    description: >
      scripts/req_audit_questions.py deterministically emits one JSON
      question file per current registry requirement (never a hard-coded
      count) with the frozen schema — req_id, req_text, cap_id, cap_name,
      declared_modules, tests each carrying a resolution class from the
      frozen enum coverage|ast|no-link-ran|no-link-unrecorded|doc-witness,
      resolved_files, evidence_depth, and the fixed audit question — plus
      batches ordered by req_id under a chars/4 token estimator with a
      configurable maximum (default 8000) where an oversized requirement
      is isolated in its own batch untruncated; output is byte-identical
      for the same tree; stage-2 emission includes test bodies for
      flagged requirements; no LLM is invoked.
    modules:
      - scripts
  - id: REQ-YG-607
    description: >
      scripts/req_audit_report.py reconciles model verdicts against batch
      inputs at the boundary: a returned req_id outside the batch's input
      set rejects that batch result and re-queues its inputs, duplicate
      req_ids keep the first occurrence and are logged, missing req_ids
      re-queue once then surface as unaudited; no input requirement
      disappears silently (audited plus unaudited equals inputs); the
      rendered report ranks no, partial, and unaudited first with gap and
      suggestion, collapses yes to counts, and carries model/provider,
      tree SHA, batch count, reconciliation summary, and the stage
      labeling (plausibility vs entailment).
    modules:
      - scripts
