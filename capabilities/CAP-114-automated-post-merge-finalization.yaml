id: CAP-114
name: Automated Post-Merge Finalization
description: >
  Shared finalization library sourced by scripts/finalize_merge.sh (FR-258).
  The watch.sh automation that once drove it retired with the Chaplain
  runtime (FR-1012); the library and the manual finalizer stay live (CAP-38, CAP-45).
modules:
  - scripts/lib/finalize_lib.sh
  - scripts/finalize_merge.sh
  - tests/unit/test_automated_post_merge_finalization
requirements:
  - id: REQ-YG-261
    description: >
      Shared library `scripts/lib/finalize_lib.sh` provides
      `extract_fr_metadata`, `create_changelog_fragment`, `update_fr_status`,
      and `create_diary_stub` functions; `scripts/finalize_merge.sh` sources
      the library instead of inlining logic; `watch.sh` detects recently
      merged PRs via timestamp-based `gh pr list` query, creates finalization
      PRs with changelog fragment, FR status update, and diary stub, enables
      auto-merge, and skips already-finalized FRs idempotently
    modules:
      - scripts/lib/finalize_lib.sh
      - scripts/finalize_merge.sh
      - tests/unit/test_automated_post_merge_finalization
fr: FR-258
