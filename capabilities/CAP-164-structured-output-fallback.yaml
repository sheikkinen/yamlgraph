id: CAP-164
name: Structured Output JSON Fallback
fr: FR-464, FR-998, FR-1121, FR-1123, FR-1125, FR-1156, FR-1164
description: >
  When with_structured_output() fails (provider rejects response_format),
  fall back to extract_json() + model_validate(). Extends FR-456 pattern
  from agent.py to executor.py and race_node.py. FR-998 adds the provider
  policy in front of it: Anthropic models are asked with constrained decoding
  (method="json_schema") from one shared module, with exactly one typed
  forced-tool-call second attempt when the model rejects output_config.

modules:
  - yamlgraph/executor.py
  - yamlgraph/node_factory/race_node.py
  - yamlgraph/utils/structured_output.py
  - yamlgraph/utils/llm_providers.py
  - yamlgraph/utils/stop_reason.py
  - yamlgraph/tools/agent.py

requirements:
  - id: REQ-YG-464
    description: Executor falls back to JSON extraction when structured output rejected
    text: >
      executor._invoke_with_retry falls back to JSON extraction when
      with_structured_output raises response_format error.
    modules:
      - yamlgraph/executor.py
  - id: REQ-YG-465
    description: Race node falls back to JSON extraction when structured output rejected
    text: >
      race_node._invoke_candidate_async falls back to JSON extraction when
      with_structured_output raises response_format error.
    modules:
      - yamlgraph/node_factory/race_node.py
  - id: REQ-YG-664
    description: Anthropic constrained structured output with typed single fallback
    text: >
      yamlgraph/utils/structured_output.py owns the only production call to
      with_structured_output. With no explicit method it selects json_schema
      for Anthropic chat models (identified by isinstance at the provider
      boundary) and omits the method for every other provider; an explicit
      method is forwarded unchanged. The sync and native-async invocation
      helpers make exactly one function_calling second attempt, with one INFO
      line naming the model and FR-998, when the error is Anthropic's typed
      BadRequestError (HTTP 400) whose structured body says output_config is
      unsupported; every other error propagates unchanged. executor_base,
      race_node (distinct run ids per attempt) and both agent finalisation
      paths route through the policy; the agent's function_calling recovery
      tier cannot be upgraded back to json_schema.
    modules:
      - yamlgraph/utils/structured_output.py
      - yamlgraph/utils/llm_providers.py
      - yamlgraph/executor_base.py
      - yamlgraph/node_factory/race_node.py
      - yamlgraph/tools/agent.py
  - id: REQ-YG-712
    description: Unconstrainable prompt-schema subschemas (untyped or open-object) refused before Anthropic constrained decoding
    text: >
      yamlgraph/utils/schema_walk.py owns one walker that returns typed
      findings for every subschema constrained decoding cannot express —
      untyped (lacking type/anyOf/oneOf/allOf/$ref and carrying no primitive
      const or non-empty all-primitive enum, FR-1123/FR-1156) and open
      object (type object with no declared properties and carrying no
      primitive const or non-empty all-primitive enum, which the transform
      hollows to {} , FR-1125) — traversing exactly as Anthropic's strict
      transform does, and one pure static
      provider resolver (node, defaults.provider, PROVIDER, "anthropic";
      a {state.x} reference is unresolved) shared by create_llm, compile and
      lint. bind_structured_output raises UnconstrainableSchemaError before
      with_structured_output for an actual Anthropic model under effective
      json_schema; compile refuses a statically Anthropic llm/router node
      naming node, prompt, model and paths; lint emits E016 for static
      Anthropic and W028 for an unresolved provider, nothing for a known
      non-Anthropic provider. No committed prompt schema trips the walker.
    modules:
      - yamlgraph/utils/schema_walk.py
      - yamlgraph/utils/structured_output.py
      - yamlgraph/utils/llm_factory.py
      - yamlgraph/node_factory/llm_nodes.py
      - yamlgraph/linter/checks_prompts.py
  - id: REQ-YG-729
    description: Replies stopped at the output-token limit raise OutputTruncatedError at the invocation boundary
    text: >
      yamlgraph/utils/stop_reason.py owns one classifier: the first nonempty
      of response_metadata stop_reason, then finish_reason; max_tokens,
      length or MAX_TOKENS raise OutputTruncatedError carrying the stop
      reason, output and reasoning token counts (None, printed "unknown",
      when the provider does not report them) and a visible-character count
      and at most 200-character preview taken from normalize_content only.
      attempt_structured_invoke (plain path and FR-464 re-invoke),
      invoke_structured / ainvoke_structured (both attempts, bound with
      include_raw=True; raw checked before parsing_error or parsed) and
      race_node._invoke_candidate_async (plain and FR-464 re-invoke) call it
      before using the reply. Direct bind_structured_output callers keep the
      parsed-only default. Not retryable; earns no FR-998 second attempt or
      FR-464 fallback. Absent metadata is not proof of completeness (FR-1164).
    modules:
      - yamlgraph/utils/stop_reason.py
      - yamlgraph/utils/structured_output.py
      - yamlgraph/executor_base.py
      - yamlgraph/node_factory/race_node.py
