id: CAP-164
name: Structured Output JSON Fallback
fr: FR-464, FR-998
description: >
  When with_structured_output() fails (provider rejects response_format),
  fall back to extract_json() + model_validate(). Extends FR-456 pattern
  from agent.py to executor.py and race_node.py. FR-998 adds the provider
  policy in front of it: Anthropic models are asked with constrained decoding
  (method="json_schema") from one shared module, with exactly one typed
  forced-tool-call second attempt when the model rejects output_config.

modules:
  - yamlgraph/executor.py
  - yamlgraph/node_factory/race_node.py
  - yamlgraph/utils/structured_output.py
  - yamlgraph/utils/llm_providers.py
  - yamlgraph/tools/agent.py

requirements:
  - id: REQ-YG-464
    description: Executor falls back to JSON extraction when structured output rejected
    text: >
      executor._invoke_with_retry falls back to JSON extraction when
      with_structured_output raises response_format error.
    modules:
      - yamlgraph/executor.py
  - id: REQ-YG-465
    description: Race node falls back to JSON extraction when structured output rejected
    text: >
      race_node._invoke_candidate_async falls back to JSON extraction when
      with_structured_output raises response_format error.
    modules:
      - yamlgraph/node_factory/race_node.py
  - id: REQ-YG-664
    description: Anthropic constrained structured output with typed single fallback
    text: >
      yamlgraph/utils/structured_output.py owns the only production call to
      with_structured_output. With no explicit method it selects json_schema
      for Anthropic chat models (identified by isinstance at the provider
      boundary) and omits the method for every other provider; an explicit
      method is forwarded unchanged. The sync and native-async invocation
      helpers make exactly one function_calling second attempt, with one INFO
      line naming the model and FR-998, when the error is Anthropic's typed
      BadRequestError (HTTP 400) whose structured body says output_config is
      unsupported; every other error propagates unchanged. executor_base,
      race_node (distinct run ids per attempt) and both agent finalisation
      paths route through the policy; the agent's function_calling recovery
      tier cannot be upgraded back to json_schema.
    modules:
      - yamlgraph/utils/structured_output.py
      - yamlgraph/utils/llm_providers.py
      - yamlgraph/executor_base.py
      - yamlgraph/node_factory/race_node.py
      - yamlgraph/tools/agent.py
