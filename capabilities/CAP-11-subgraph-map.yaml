id: CAP-11
name: "Subgraph & Map"
description: Parallel fan-out and nested subgraph execution.
modules:
  - map_compiler
  - map_compiler.wrap_for_reducer
  - node_factory/subgraph_nodes
requirements:
  - id: REQ-YG-040
    description: Map node compilation
    modules:
      - map_compiler
  - id: REQ-YG-041
    description: Output wrapping for reduction
    modules:
      - map_compiler.wrap_for_reducer
  - id: REQ-YG-042
    description: >
      Subgraph node creation. FR-1058: `mode: direct` registers the
      compiled child graph natively (no callable adapter), so the engine
      owns its checkpoint namespace and interrupts are durable across it;
      `mode: invoke` runs the child on a derived "<parent>:<node>"
      thread and strips the parent's checkpoint coordinates
      (checkpoint_id, checkpoint_ns, checkpoint_map) and internal
      __pregel_* keys, so a child cannot resume into its parent's
      checkpoint and two parents invoking the same child do not collide.
      User `configurable` keys are forwarded; the parent config is never
      mutated.
    modules:
      - node_factory/subgraph_nodes
      - compile/subgraph_relay
      - tests/unit/test_fr1058_subgraph_config_propagation.py
  - id: REQ-YG-692
    description: >
      FR-1073 map result contract. A map compiles to a dispatch node, a
      sub-node and a join. Branch failures never enter `collect`; they
      land as typed `MapFailure` records in `failures` (default
      `<collect>_failures`), non-tolerated ones with exactly one
      `PipelineError`. The join accounts every dispatched index against
      the exact dispatch token, writes a `MapVerdict` and raises
      `MapCompletenessError` when `min_success` (strict by default) is
      unmet; same-map overlap raises `MapAccountingError`.
    modules:
      - map_compiler
      - compile/map_contract
      - models/map_results
      - tests/unit/test_fr1073_map_result_contract.py
fr: legacy, FR-797, FR-1058, FR-1073
