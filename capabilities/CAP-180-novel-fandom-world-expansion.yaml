name: Novel Fandom World Expansion
id: CAP-180
status: active
fr: FR-643v2
feature_request: FR-643v2
description: >
  World expansion pipeline for novel_fandom. Deepens thin entities via LLM,
  extracts red links (new entity mentions that lack wiki pages), creates
  skeleton pages for red links, and loops until depth budget is reached.
  Pipeline decides what to deepen (deterministic thinness filter), LLM
  generates content, gate validates references. No LLM diagnoses gaps.
modules:
  - examples
requirements:
  - id: REQ-YG-494
    description: >
      Schema additions for world expansion: Character has backstory field,
      all page models have depth field (default 0), depth roundtrips through
      dict serialization. Seed canon pages are lane:dynamic. worldgen.yaml
      graph exists and lints clean with all loop_limits specified.
    modules:
      - examples
  - id: REQ-YG-495
    description: >
      World expansion nodes: select_thin identifies thin entities by structural
      field checks sorted by thin_score, collect_red_links deduplicates new
      entities by id and filters existing pages, validate_pages gate checks
      references against merged canon, persist_pages validates against Pydantic
      models before atomic write, reload_canon reads canon dir at runtime.
    modules:
      - examples
  - id: REQ-YG-496
    description: >
      Reflexion step (FR-646): reflect LLM node reviews canon summaries after
      deepening and identifies concepts mentioned in prose but lacking pages.
      missing_entities from reflection merge into collect_red_links alongside
      new_entities from deepening. Prompt sends page summaries, not full JSON.
    modules:
      - examples
  - id: REQ-YG-497
    description: >
      Event propagation pre-pass (FR-647): anchor_events Python node runs once
      before the worldgen loop, computing per-character event context with
      spatial scoping (world/regional/local) and age arithmetic from absolute
      dates (Character.birth_year, Event.year). Premise gains calendar_note.
      Deepen prompt enriched with event timeline for characters.
    modules:
      - examples
  - id: REQ-YG-498
    description: >
      Obsidian wiki output (FR-648): render_wiki.py converts canon YAML pages
      to Obsidian-compatible markdown with YAML frontmatter and body sections.
      References rendered as [[wiki_links]], relationships as linked lists,
      prose fields as markdown sections (not frontmatter). Standalone script.
    modules:
      - examples
  - id: REQ-YG-499
    description: >
      Persist boundary normalization (FR-649): normalize_page coerces LLM-varied
      shapes to schema-expected shapes before Pydantic validation. Covers
      relationship key variants, participant dicts, consequence dicts, reference
      dicts, scalar-to-list coercion, Rule.domain default, _map_index strip.
      Pages that still fail validation are persisted with warning (not dropped).
    modules:
      - examples
  - id: REQ-YG-500
    description: >
      Canon type subfolders (FR-650): canon pages organized into subfolders by
      type field (canon/character/, canon/event/, etc.). reload_canon and
      render_wiki use rglob for recursive reading. persist_pages writes into
      type subfolders with atomic tempfile in same directory. Skeleton
      exists-check uses rglob across subfolders. ref_gate produces
      type-prefixed save_path.
    modules:
      - examples
  - id: REQ-YG-501
    description: >
      Deepen temporal fields (FR-651): deepen prompt instructs LLM to set
      birth_year and role on characters, and year/scope/affected_locations on
      events, enabling timeline queries.
    modules:
      - examples
  - id: REQ-YG-502
    description: >
      Role enum normalization (FR-652): normalize_page coerces freetext
      character role to valid enum (protagonist/antagonist/supporting/minor),
      defaulting to 'supporting'.
    modules:
      - examples
  - id: REQ-YG-503
    description: >
      Robust deepen output (FR-653): persist_pages handles flat-dict deepen
      results (no updated_page wrapper) by using the result dict itself as
      the page when it contains id and type fields.
    modules:
      - examples
  - id: REQ-YG-504
    description: >
      Seed depth-0 thin bonus (FR-654): select_thin adds +2 to thin_score
      for pages with depth 0 or missing depth, prioritizing seed pages for
      deepening before newly generated skeletons.
    modules:
      - examples
