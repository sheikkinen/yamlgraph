id: CAP-158
name: Copilot Skill Promotion
description: >
  Promote reference docs to Copilot Skills (.github/skills/) for
  on-demand loading in VS Code Copilot Chat.

modules:
  - .github/skills/author-graph/SKILL.md
  - .github/skills/author-prompt/SKILL.md
  - .github/skills/release-version/SKILL.md
  - .github/skills/chaplain-ops/SKILL.md
  - .github/skills/run-code-analysis/SKILL.md
  - .github/skills/feature-request/SKILL.md
  - .github/skills/graph-authoring/SKILL.md
  - .github/skills/graph-authoring/doctrine.md
  - .github/skills/graph-authoring/adapters/README.md
  - .github/skills/graph-authoring/adapters/graph.yaml
  - .github/skills/graph-authoring/adapters/prompts/author.yaml
  - scripts/author.sh

requirements:
  - id: REQ-YG-423
    description: >
      Seven Tier 1 skills: author-graph, author-prompt, release-version,
      chaplain-ops, run-code-analysis, feature-request (FR-446), and the
      graph-authoring end-to-end workflow skill (FR-765). Each skill is a
      self-contained SKILL.md with applyTo patterns and tool restrictions;
      graph-authoring adds a doctrine.md workflow contract (input closure,
      precedent search, artifact report, local validation, escalation,
      anti-patterns) composing author-graph/author-prompt as syntax
      references, plus an executable adapter route (FR-765 round 2):
      a thin copilot-node adapter graph and pointer prompt launched by
      the scripts/author.sh operator wrapper, verified by the
      tmp/draft-authoring-report.md artifact contract, never exit code.
    modules:
      - .github/skills/author-graph/SKILL.md
      - .github/skills/author-prompt/SKILL.md
      - .github/skills/release-version/SKILL.md
      - .github/skills/chaplain-ops/SKILL.md
      - .github/skills/run-code-analysis/SKILL.md
      - .github/skills/feature-request/SKILL.md
      - .github/skills/graph-authoring/SKILL.md
      - .github/skills/graph-authoring/doctrine.md
      - .github/skills/graph-authoring/adapters/README.md
      - .github/skills/graph-authoring/adapters/graph.yaml
      - .github/skills/graph-authoring/adapters/prompts/author.yaml
      - scripts/author.sh

fr: FR-446
