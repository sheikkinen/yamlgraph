requirements:
  - id: REQ-YG-423
    description: >
      Five Tier 1 skills: release-version, chaplain-ops,
      run-code-analysis, feature-request (FR-446), and the
      graph-authoring end-to-end workflow skill (FR-765). Each skill is a
      self-contained SKILL.md with applyTo patterns and tool restrictions;
      graph-authoring adds a doctrine.md workflow contract (input closure,
      precedent search, artifact report, local validation, escalation,
      anti-patterns) composing reference/graph-yaml.md and
      reference/prompt-yaml.md as syntax references (the author-graph /
      author-prompt intermediary skills were retired 2026-07-29; their
      unique content folded into the reference docs), plus an executable
      adapter route (FR-765 round 2):
      a thin copilot-node adapter graph and pointer prompt launched by
      the scripts/author.sh operator wrapper, verified by the
      tmp/draft-authoring-report.md artifact contract, never exit code.
      The route is mechanically enforced (FR-767) by the PreToolUse
      guard's governed_path() predicate and the check_authoring_proof.py
      commit backstop; FR-1014 makes their graphs/ arm dir-aware
      (graphs/<name>/*.yaml and graphs/<name>/prompts/*.yaml alongside
      flat graphs/*.yaml) and witnesses both predicates against one
      provenance-labelled truth table.
    modules:
      - .github/skills/release-version/SKILL.md
      - .github/skills/chaplain-ops/SKILL.md
      - .github/skills/run-code-analysis/SKILL.md
      - .github/skills/feature-request/SKILL.md
      - .github/skills/graph-authoring/SKILL.md
      - .github/skills/graph-authoring/doctrine.md
      - .github/skills/graph-authoring/adapters/README.md
      - .github/skills/graph-authoring/adapters/graph.yaml
      - .github/skills/graph-authoring/adapters/prompts/author.yaml
      - scripts/author.sh
      - .github/hooks/scripts/pre-command-guard.sh
      - scripts/check_authoring_proof.py
      - .github/hooks/tests/test_authoring_guard.py
      - tests/unit/test_fr1014_authoring_proof_dir_graphs.py

fr: FR-446
