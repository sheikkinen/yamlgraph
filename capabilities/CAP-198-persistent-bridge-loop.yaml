name: Persistent Bridge Loop
id: CAP-198
status: active
fr: FR-713
feature_request: FR-713
description: >
  One long-lived event loop thread (yamlgraph-bridge-loop) owned by the graph
  runtime bridges all sync→async node work (race, router-race, future async
  paths), replacing the per-invocation daemon-thread + asyncio.run() topology.
  Eliminates per-call thread churn and fresh-loop SDK reconnects (FR-711:
  anthropic Δp50 +0.527 s → +0.073 s locally) and makes the FR-707
  shutdown-blocker and FR-712 loop-affinity defect classes unreachable by
  construction. The verdict-first contract, CLEANUP_GRACE drain bound, and
  RuntimeError-on-budget-breach semantics are preserved unchanged.
modules:
  - yamlgraph/utils/bridge.py
  - yamlgraph/node_factory/race_node.py
  - yamlgraph/node_factory/router_race_node.py
requirements:
  - id: REQ-YG-541
    description: >
      Persistent bridge loop substrate. Exactly ONE yamlgraph-bridge-loop
      daemon thread across N sequential bridge invocations; started lazily on
      first use, never at import; os.register_at_fork resets the loop handle
      and the LLM cache (with fresh locks) so a fork after warm-up gets a
      fresh lazy loop in the child; a dead loop thread is restarted lazily
      with a WARNING. The post-verdict drain is scoped to the invocation's
      own tasks (ContextVar task bucket via loop task factory) — concurrent
      invocations never wait on or WARN about each other's tasks. On
      verdict_budget breach the bridge cancels the submitted work so the
      abandoned coroutine cannot outlive cancellation + CLEANUP_GRACE
      (FR-708 leak-lifetime bound preserved). Client construction happens on
      the caller thread, never on the shared loop (head-of-line blocking);
      per-candidate construction failures are pre-errors in race accounting,
      not node failures.
    modules:
      - yamlgraph/utils/bridge.py
      - yamlgraph/node_factory/race_node.py
      - tests/unit/test_fr713_persistent_bridge.py
