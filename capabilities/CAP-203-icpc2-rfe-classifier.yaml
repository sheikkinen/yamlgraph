name: ICPC-2 RFE Classifier Example
id: CAP-203
status: active
fr: FR-722
feature_request: FR-722
description: >
  Map/reason/reduce YAMLGraph example classifying freeform encounter
  transcripts into ICPC-2 Reason-for-Encounter codes. Cluster fan-out
  (17 chapters x components 1 and 7, max 34 items) over a catalog
  GENERATED locally from the Tier-1 ICPC-2e-v7.0 source (Judgement A1:
  the repo ships the builder with URL + sha256 pin, never the Wonca-
  copyrighted data); per-cluster LLM verdicts validate at the python
  reducer boundary; ranking is fully deterministic.
modules:
  - examples/icpc-2-rfe/nodes/build_catalog.py
  - examples/icpc-2-rfe/nodes/catalog.py
  - examples/icpc-2-rfe/nodes/reduce.py
requirements:
  - id: REQ-YG-548
    description: >
      Catalog builder + provenance (FR-722). parse_claml derives rows
      from Class elements: component from the SuperClass code suffix
      (<chapter>.<component>), cluster_id = <chapter>-C<component>;
      chapter headers and process codes (components 2-6) are excluded
      (phase-1 purge list); every row carries source_tier=1,
      source_reference=ICPC-2e-v7.0/<code>, provenance_status=verified
      assigned mechanically. verify_source refuses a zip whose sha256
      differs from the pinned digest.
    modules:
      - examples/icpc-2-rfe/nodes/build_catalog.py
  - id: REQ-YG-549
    description: >
      Catalog loader (FR-722). load_rfe_catalog groups rows into
      chapter x component clusters each carrying its code list;
      provisional rows are excluded unless include_provisional is set
      (F6 production-mode default); a missing generated catalog raises
      FileNotFoundError naming build_catalog.py (A1: usable only after
      the user-run build step).
    modules:
      - examples/icpc-2-rfe/nodes/catalog.py
  - id: REQ-YG-550
    description: >
      Reducer determinism (FR-722). Candidates validate against a
      Pydantic model at the reducer boundary (bad shape raises, names
      the candidate); evidence spans must be substrings of the raw
      transcript (F3); ranking is verdict rank then confidence then
      code (total order); multi-label via secondary; no match yields an
      explicit low_confidence result naming best partials (AC-06);
      output meta declares catalog_version and catalog_coverage.
    modules:
      - examples/icpc-2-rfe/nodes/reduce.py
  - id: REQ-YG-551
    description: >
      Process codes phase 2 (FR-724). Builder includes components 2-6
      process rubrics (chapter "-") as PROC-C<n> clusters, chapter
      headers still excluded; reducer F4 rule: a process-code match
      outranks a chapter-code match for RFE primacy (deliberate,
      witnessed - never asciibetical accident); reducer F1:
      chapter_context is derived in code as the best-ranked non-process
      candidate and attached only when the primary is a process code;
      coverage meta declares components 1-7.
    modules:
      - examples/icpc-2-rfe/nodes/build_catalog.py
      - examples/icpc-2-rfe/nodes/reduce.py
  - id: REQ-YG-554
    description: >
      Labeled crosscheck harness (FR-725). Labels live beside file-based
      fixtures in data/labeled/ and require rationale plus
      valid_for_components; evaluate_result enforces primary_any_of,
      must_include (any surfaced slot including chapter_context and
      best_partial), must_not_include (primary and secondary only) and
      tri-state low_confidence_expected; a coverage mismatch between
      label and result skips loudly by name; archives attribute by
      fixture basename only (stdin runs never attributed); agreement
      reports raw k-of-n counts with no significance computation.
    modules:
      - examples/icpc-2-rfe/nodes/crosscheck.py
  - id: REQ-YG-555
    description: >
      Process-code discipline and combined-code composition (FR-727).
      META_PROCESS_CODES {-43,-46,-48,-69} — encounter-form descriptors
      and junk drawers, pinned from a full read of all 40 rubric titles
      — demote match to partial_match at validation time (evidence
      preserved in best_partial, never primary/secondary; project
      curation lives in reduce.py, not the generated Tier-1 catalog);
      genuine process requests (-50, -62) stay primary-capable; process
      primaries gain combined_code composed mechanically from
      chapter_context (K86 + -50 = K50; chapter A when contextless);
      chapter primaries get no combined_code.
    modules:
      - examples/icpc-2-rfe/nodes/reduce.py
  - id: REQ-YG-556
    description: >
      Chapter-code inflation discipline (FR-730). Chapter cap = {Z10}
      only (empty inclusion list, pure system descriptor - A13/A23/A29
      verified genuinely stateable and stay uncapped, A13 an accepted
      named residual); same-chapter symptom-over-diagnosis mechanizes
      ICPC practical rule 3 (a component-7 match demotes to partial
      when a component-1 match exists in the same chapter, P03 demotes
      P76; no cross-chapter demotion, no demotion without a competing
      symptom); composition context eligibility is non-process,
      non-capped, non-Z-chapter with component-7 diseases preferred
      over component-1 symptoms (opposite of RFE primacy - composition
      anchors to the problem managed); genuine Z RFEs (Z05) remain
      classifiable.
    modules:
      - examples/icpc-2-rfe/nodes/reduce.py
