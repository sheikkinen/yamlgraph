id: CAP-233
name: API Discovery Schema-Extract Step
description: >
  Example-level schema-extract step for the API discovery pipeline
  (FR-790): a routed llm graph under
  examples/api-discovery/steps/schema-extract/ that turns a confirmed
  platform identification into a CapabilityReport. v1 family coverage
  is frozen to OpenAPI (deterministic tool_call on the FR-783
  parse_openapi manifest, then llm mapping into EndpointInfo entries)
  and CKAN (llm extraction of dataset count, organizations, freshness,
  and languages from the FR-788 sample_response); every other family
  returns a structured limitations entry instead of inference or
  error. All llm nodes fail loudly (on_error: fail). Exposed to the
  FR-791 orchestrator as schema_extract.tool.yaml with committed
  OpenAPI and CKAN smoke fixtures.
modules:
  - examples
fr: FR-790
requirements:
  - id: REQ-YG-594
    description: >
      The schema-extract graph compiles, routes on family with no
      agent node, calls the shared parse_openapi manifest via a
      deterministic tool_call, and pins CapabilityReport in every
      prompt's output_schema: nine required fields with EndpointInfo
      items requiring path and parameters as string arrays; invalid
      output fails Pydantic validation; the input mapping consumes
      exactly the FR-788 PlatformConfirmation fields plus the
      openapi_spec_json fixture input; committed fixtures carry the
      known /pets path with limit parameter and the CKAN
      count/organization/freshness/language signals.
    modules:
      - examples
