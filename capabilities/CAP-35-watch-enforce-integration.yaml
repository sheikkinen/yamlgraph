id: CAP-35
name: Watch→Enforce Integration
description: >
  Post-graph hook in watch.sh that detects new feature request files via
  ephemeral find + comm diff, skips rejected FRs, and spawns enforce_worktree.sh
  in the background.
modules:
  - .chaplain/watch.sh
  - scripts/enforce_worktree.sh
requirements:
  - id: REQ-YG-116
    description: >
      `watch.sh` snapshots `feature-requests/` before graph execution, diffs
      after with `comm -13` to detect new FRs, skips rejected FRs (matching
      `Status.*Rejected`), and spawns `enforce_worktree.sh` via `nohup ... &`
      with output redirected to `tmp/enforce-<slug>.log`; no state files or
      Python helpers
    modules:
      - .chaplain/watch.sh
      - scripts/enforce_worktree.sh
fr: FR-116
