id: CAP-166
name: Meta Self-Reflective Demo
description: >
  Demo graph that applies a natural-language verb to a code artifact —
  including the demo's own graph YAML. A read_file shell tool feeds a tool
  node, then an LLM node transforms the source per the verb and returns typed
  output (MetaResult). A typed, traced homage to the 2023 meta.js trick
  (node meta 'explain structure' ./meta.js), correcting its trust-by-default
  flaws: YAML prompt instead of hardcoded string, inline schema for typed
  output, shlex-escaped shell tool, output kept in state rather than piped to
  disk.
modules:
  - examples/demos/meta
requirements:
  - id: REQ-YG-467
    description: >
      Meta demo: two-node graph (load tool node + transform llm node).
      read_file shell tool (cat {file}) reads the target into state.source;
      transform llm node applies state.verb to state.source via the
      meta_transform prompt and writes typed MetaResult (summary, findings,
      suggested_code) to state.result. State declares verb and target as
      str inputs. transform requires source (no LLM call before read).
      No hardcoded model — PROVIDER/MODEL env fallthrough. Self-referential
      run (target = the graph's own YAML) is the headline. demo.sh accepts
      verb and target and runs the graph with --json. Graph lints clean.
    modules:
      - examples/demos/meta
fr: FR-464
