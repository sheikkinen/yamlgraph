id: CAP-250
name: Corpus-census synthesize tail
fr: FR-895, FR-940, FR-943
description: >
  The corpus-census pipeline ends in a human-readable brief: a bounded,
  column-allowlisted synthesis input (top-N ledger rows), a single pinned
  structured-claims LLM call, and an LLM-free citation boundary that
  validates every claim citation against the source artifact before
  rendering. Validation failure emits no brief — only a .REJECTED.md
  artifact carrying the deterministic summary head and rejection reasons.
  Missing brief inputs fail loudly before any synthesis call.
modules:
  - examples/demos/corpus_census
requirements:
  - id: REQ-YG-625
    description: >
      Census brief emission is fail-closed: claims with fabricated,
      missing, or out-of-source citations are rejected mechanically
      (LLM-free); accepted briefs carry the deterministic summary head,
      cited findings, and run provenance; synthesis input is bounded and
      restricted to the public-safe column allowlist
    modules:
      - examples/demos/corpus_census
  - id: REQ-YG-633
    description: >
      Census judgement labels are normalized at the ledger boundary by a
      deterministic LLM-free algorithm (prefix strip, separator cut,
      grammar gate, optional caller vocabulary with canonical spelling);
      non-conforming values are demoted to abstain with a frozen reason,
      never dropped; raw_judgement/repaired audit fields and the frozen
      normalization summary line record every reconciliation; the judge
      and synthesis model is caller-selectable via the model variable
      with provenance carrying the effective model
    modules:
      - examples/demos/corpus_census
  - id: REQ-YG-634
    description: >
      Attributable model-owned failures (map-error findings with usable
      _map_index, error-string judgements, envelope validation errors
      wholly rooted in model-owned fields) are contained as fail-closed
      abstained ledger rows with exact frozen cells, a bounded
      "row failed:" reason, and complete causal evidence preserved in
      raw_judgement; the internal count carries exactly four keys and
      the markdown summary uses the revised normalization line;
      structural impossibilities remain batch-fatal
    modules:
      - examples/demos/corpus_census
