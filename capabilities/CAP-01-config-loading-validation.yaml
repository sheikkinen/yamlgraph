id: CAP-01
name: "Config Loading & Validation"
description: >
  Load YAML graph configs, validate schemas, build state models, and ensure
  graph integrity through linting.
modules:
  - cli/helpers
  - cli/helpers.GraphLoadError
  - data_loader
  - data_loader.DataFileError
  - graph_loader.load_graph_config
  - linter/checks
  - linter/graph_linter
  - linter/patterns/*
  - models/graph_schema
  - utils/validators
requirements:
  - id: REQ-YG-001
    description: Load graph configurations from YAML files
    modules:
      - graph_loader.load_graph_config
      - cli/helpers
      - data_loader
  - id: REQ-YG-002
    description: Validate graph configuration schemas and structures
    modules:
      - models/graph_schema
      - utils/validators
  - id: REQ-YG-003
    description: Perform linting and pattern validation
    modules:
      - linter/graph_linter
      - linter/checks
      - linter/patterns/*
  - id: REQ-YG-004
    description: Handle errors during configuration loading
    modules:
      - cli/helpers.GraphLoadError
      - data_loader.DataFileError
  - id: REQ-YG-546
    description: >
      Passthrough node output/outputs accept literal seeds (FR-721): the
      schema is dict[str, Any] matching the runtime contract —
      resolve_template's documented first branch passes non-string values
      through unchanged, and init nodes legitimately seed state with
      list/dict/bool literals. Template strings keep validating; literal
      types round-trip through model_dump unchanged (quoting "[]" would
      silently corrupt state seeding). Mapping fields (output_mapping,
      interrupt_output_mapping) remain genuinely string-to-string.
      Surfaced by ninchat NC-370 pin alignment: 8 ValidationErrors on a
      graph running correctly in production.
    modules:
      - models/node_schema
fr: legacy
