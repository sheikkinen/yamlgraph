id: CAP-257
name: LAN Copilot Delegation
description: "Stateless per-run delegation of a Copilot CLI workload to a FR-945-recon-verified LAN Windows host over WinRM, executed inside a disposable per-run detached git worktree with a wrapper-owned process-tree deadline, returning a Pydantic-validated LanDelegationResult and copied artifacts via SMB. Reuses FR-945's Option A transport (auth=negotiate + encryption=always + banned Basic/CredSSP + pinned resolved LAN address + finite timeouts) and pypsrp>=0.9,<1.0 dependency. Passes GH_TOKEN as a WinRM param binding (never in script literal), captures stdout/stderr in memory (never raw to disk), byte-scans every candidate artifact for literal token bytes before copy, refuses recursive delegation via YAMLGRAPH_LAN_DELEGATED=1 marker. v1 is stateless: no --resume, no source upload/fetch/clone, no remote runtime installation. Wall-clock timeout is the sole preventive spend cap; reported credits are post-run diagnostics only. Human safety + spend decisions dated 2026-09-01. Consumed by future FR-949+ that adds `remote:` to the yamlgraph copilot node."
fr: FR-948
modules:
