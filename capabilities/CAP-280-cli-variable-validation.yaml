id: CAP-280
name: CLI Variable Validation
description: >
  FR-1084: `graph run` refuses `--var` and `--var-file` keys that the
  compiled graph's input schema cannot hold, before any graph invocation
  or LLM call, and a documented-invocation census pins the repository's
  own `graph run` examples against that rule.
modules:
  - yamlgraph/cli/graph_commands.py
requirements:
  - id: REQ-YG-697
    description: >
      After compile and before run configuration, `graph run` compares the
      union of `--var` and `--var-file` keys with
      `app.get_input_jsonschema()["properties"]`; any unknown key exits 1
      with one sorted diagnostic naming every unknown key and the visible
      accepted keys, in sync, async and stream modes, on stdout in human
      mode and stderr in `--json` mode. `--import-state` and graph
      `variables:` are not validated. Every documented `graph run`
      invocation is PASS or a reasoned EXCLUDED row.
    modules:
      - yamlgraph/cli/graph_commands.py
      - tests/unit/test_fr1084_reject_undeclared_cli_vars.py
      - tests/unit/test_fr1084_invocation_census.py
fr: FR-1084
