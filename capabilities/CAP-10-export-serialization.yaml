id: CAP-10
name: "Export & Serialization"
description: >
  Export results/states in JSON/Markdown, handle serialization for persistence.
modules:
  - cli/graph_commands.cmd_graph_codegen
  - cli/schema_commands
  - storage/export
  - storage/serializers
requirements:
  - id: REQ-YG-036
    description: CLI schema export and access
    modules:
      - cli/schema_commands
  - id: REQ-YG-037
    description: Graph code generation for IDE support
    modules:
      - cli/graph_commands.cmd_graph_codegen
  - id: REQ-YG-038
    description: Export and management of pipeline results/states
    modules:
      - storage/export
  - id: REQ-YG-039
    description: Serialization and deserialization utilities
    modules:
      - storage/serializers
  - id: REQ-YG-553
    description: "Authored-graph Mermaid export (FR-723). graph export --mermaid renders the authored YAML view (typed nodes, condition labels, router routes, loop limits, explicit loop-exit edges); --overlay renders an executed route.jsonl with taken edges and decision ordinals so the ordered route is reconstructible from the render; --diff compares two routes occurrence-aligned per (node, occurrence) naming the seam and Nth firing. Pure stdlib+yaml, no LLM."
    modules:
      - mermaid_export
      - cli/export_commands
fr: legacy
