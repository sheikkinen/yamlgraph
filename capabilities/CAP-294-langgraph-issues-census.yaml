id: CAP-294
name: LangGraph Issues Census
description: >
  FR-1130: gh-issues discover/versions/extract adapters snapshot a GitHub
  repository's issues and PRs once per run into a validated, atomically
  replaced cache; the LangGraph issues census graph judges every item under
  a 17-category pain taxonomy through the corpus-census judge and map memo,
  then a refusing cross-tab, citation verifier and disposition checker turn
  the ledger into solves / inherits / untouched lists.
modules:
  - examples/demos/corpus_census/adapters/gh_issues_adapters.py
  - examples/demos/corpus_census/adapters/gh_issues_report.py
  - examples/demos/langgraph_issues_census/graph.yaml
requirements:
  - id: REQ-YG-717
    description: >
      `gh_issues_discover` runs one paginated `gh api` listing with the
      frozen argv, validates every record against `IssueRecord` (extra
      fields forbidden) and the population ceiling, and replaces the
      snapshot atomically only when the whole listing validates; any bad
      record raises and leaves the prior snapshot byte-identical.
      `gh_issues_versions` returns `{ref: updated_at}` from that snapshot
      and `gh_issues_extract` reads one record from it without a
      subprocess, raising when absent. The source grammar accepts `o/r`,
      evenly spaced `o/r:n` and explicit `o/r@a,b`. `gh_issues_crosstab`
      refuses abstained, unknown, duplicate, missing, off-taxonomy or
      canary-contradicting rows before writing, and reports item counts per
      category by kind and state; `verify_citations` resolves every cited
      ref's labels against GitHub; `check_dispositions` enforces one row per
      category and the evidence rule per list. The census graph re-judges
      only memo misses and every item when rubric, labels, provider, model
      or a signature file changes.
    modules:
      - examples/demos/corpus_census/adapters/gh_issues_adapters.py
      - examples/demos/corpus_census/adapters/gh_issues_report.py
      - examples/demos/langgraph_issues_census/graph.yaml
      - tests/unit/test_fr1130_gh_issues_adapters.py
      - tests/unit/test_fr1130_gh_issues_report.py
      - tests/unit/test_fr1130_census_graph.py
fr: FR-1130
