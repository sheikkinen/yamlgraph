id: CAP-236
name: Router-Visible Tool-Call Outputs
description: >
  Opt-in parsed_key field on tool_call nodes (FR-810): when the resolved
  tool is a graph-runtime tool, the node parses the child graph's object
  output (JSON-object strings parse; dicts pass through) and exposes it
  under parsed_key as addressable state, so edge conditions route on the
  step's actual findings instead of upstream hints. The wrapper under
  state_key is preserved unchanged. Fail-closed: invalid JSON, lists,
  scalars, missing child output, failed child wrappers, and non-graph
  tool misuse are node failures governed by on_error (fail raises;
  skip returns the failure envelope and never sets parsed_key). Lint
  warns when parsed_key targets a statically known shell/python tool.
modules:
  - node_factory
  - models
  - linter
fr: FR-810
requirements:
  - id: REQ-YG-597
    description: >
      A tool_call node with parsed_key on a graph-runtime tool exposes
      the child's object output under parsed_key while returning the
      wrapper under state_key unchanged, and an edge condition routes
      on a parsed field in a compiled graph; without parsed_key the
      observable behavior is unchanged; JSON-object strings parse and
      dicts pass through while invalid JSON, lists, scalars, missing
      output, and failed child wrappers are parse failures with no
      empty-dict substitution, honored per on_error (fail raises,
      skip returns the failure envelope without parsed_key); non-graph
      tools with parsed_key fail at runtime per on_error and warn at
      lint when statically known; parse_result/result_key aliases are
      rejected by the node config schema.
    modules:
      - node_factory
      - models
      - linter
