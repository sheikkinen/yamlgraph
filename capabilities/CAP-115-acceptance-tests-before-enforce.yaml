id: CAP-115
name: Acceptance Tests Before Enforce
description: >
  Move worktree creation from the enforce phase into the plan-judge loop,
  and add a dedicated acceptance test generation step between research and
  judge. Judge evaluates the FR, the research brief, AND concrete failing
  tests — three inputs instead of two. Enforce receives a worktree with
  pre-committed RED tests and a clear contract: make these tests pass.
modules:
  - .chaplain/graphs/copilot/graph.yaml
  - .chaplain/graphs/copilot/prompts/write-acceptance-tests.yaml
  - .chaplain/graphs/copilot/prompts/judge.yaml
  - .chaplain/graphs/enforce/prompts/enforce-implement.yaml
  - .chaplain/lib/worktree.py
  - scripts/enforce_worktree.sh
requirements:
  - id: REQ-YG-262
    description: >
      create_worktree python node and write_acceptance_tests copilot node
      inserted between research and judge in .chaplain/graphs/copilot/graph.yaml;
      create_worktree tool at .chaplain/lib/worktree.py commits FR draft to
      main and creates worktree with .venv symlink; write-acceptance-tests
      prompt reads FR acceptance criteria and generates pytest tests with
      @pytest.mark.req tags; tests committed as RED in worktree; judge
      prompt includes criterion 8 for test evidence evaluation; enforce
      implement prompt references existing RED tests; enforce_worktree.sh
      accepts optional pre-existing worktree path (FR-260).
    modules:
      - .chaplain/graphs/copilot/graph.yaml
      - .chaplain/graphs/copilot/prompts/write-acceptance-tests.yaml
      - .chaplain/graphs/copilot/prompts/judge.yaml
      - .chaplain/graphs/enforce/prompts/enforce-implement.yaml
      - .chaplain/lib/worktree.py
      - scripts/enforce_worktree.sh
fr: FR-260
