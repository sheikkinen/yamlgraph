id: CAP-148
name: CI Co-authored-by Trailer Gate
description: >
  GitHub Actions job in commitlint.yml that blocks pull requests when
  any `Co-authored-by:` trailer identities are present in PR commit messages
  or PR body text.
modules:
  - .github/workflows/commitlint.yml
  - tests/unit/test_fr385_ci_copilot_trailer_gate_red.py
  - CLAUDE.md
requirements:
  - id: REQ-YG-358
    description: >
      `copilot-trailer-gate` job in `commitlint.yml` deterministically scans
      `BASE_SHA..HEAD_SHA` commit messages and `github.event.pull_request.body`
      for any `Co-authored-by:` trailer line, fails with exit 1 on detection,
      and passes unchanged PRs otherwise.
    modules:
      - .github/workflows/commitlint.yml
      - tests/unit/test_fr385_ci_copilot_trailer_gate_red.py
      - CLAUDE.md
fr: FR-385
