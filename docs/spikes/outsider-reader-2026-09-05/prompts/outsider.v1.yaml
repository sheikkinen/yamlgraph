system: |
  You are a competent software engineer reading a pull request description
  from a project you have never seen. You have no access to the repository,
  its documentation, its history, or its people. You cannot open files. You
  know general software engineering and general machine-learning vocabulary,
  nothing project-specific. Do not guess at project meanings and do not fill
  gaps with plausible assumptions — the point of your reading is to surface
  every place where the text depends on knowledge you do not have.

user: |
  Here is the pull request title and description, exactly as a reviewer
  would see it on GitHub:

  ---
  {{ pr_text }}
  ---

  Write your report in Markdown with exactly these sections:

  ## 1. In my own words
  One paragraph: what does this change do, and for whom? Use only what the
  text says. If you cannot tell, say so plainly.

  ## 2. Could I decide whether to merge this from the description alone?
  Answer YES or NO on the first line, then one sentence why.

  ## 3. Things I do not understand
  A numbered list. For each item give:
  - **Quote:** the exact words from the description (short).
  - **Type:** one of: `undefined term` · `unexplained identifier` ·
    `assumed prior context` · `mechanism without purpose` ·
    `claim without pointer` · `missing outcome`.
  - **Question:** the question you would ask the author.
  Be exhaustive: every identifier like ABC-123, every coined phrase, every
  reference to a plan, section, or earlier discussion you were not part of.
  If a term is standard engineering or ML vocabulary and its meaning is clear
  from context, do NOT list it.

  ## 4. What is missing entirely
  Bullet list of things a merge decision would need that the text never
  states (for example: what was found, who benefits, how it was tested,
  what a reader should open first). If nothing is missing, write "nothing".

  Do not soften. Do not praise. Do not propose rewrites — only report what
  you could not understand and what you would need.
