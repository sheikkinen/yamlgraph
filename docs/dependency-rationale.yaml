# Dependency Rationale Registry
#
# Every pyproject.toml dependency (core and optional) must have an entry here.
# Run: python scripts/dependency_rationale.py --strict
#
# FR-219: Dependency Rationale Audit

dependencies:
  # ─── Core Dependencies ───────────────────────────────────────────────

  langchain-anthropic:
    rationale: "Anthropic LLM provider integration (Claude models via ChatAnthropic)"
    modules: ["yamlgraph/utils/llm_factory.py"]
    added: "0.1.0"

  langchain-google-genai:
    rationale: "Google Gemini / Vertex AI provider integration"
    modules: ["yamlgraph/utils/llm_factory.py"]
    added: "0.4.64"

  langchain-mistralai:
    rationale: "Mistral AI provider integration"
    modules: ["yamlgraph/utils/llm_factory.py"]
    added: "0.1.0"

  langchain-openai:
    rationale: "OpenAI provider integration (GPT models, DeepSeek, xAI, LM Studio via compatible API)"
    modules: ["yamlgraph/utils/llm_factory.py"]
    added: "0.1.0"

  langgraph:
    rationale: "Core graph orchestration engine — StateGraph compilation, node execution, checkpointing"
    modules: ["yamlgraph/compile/graph_loader.py", "yamlgraph/executor.py", "yamlgraph/compile/edge_compiler.py"]
    added: "0.1.0"

  langgraph-checkpoint-sqlite:
    rationale: "SQLite checkpointer for graph state persistence across runs"
    modules: ["yamlgraph/storage/checkpointer_factory.py"]
    added: "0.1.0"

  pydantic:
    rationale: "Structured LLM output validation — Commandment 5 (all data through Pydantic)"
    modules: ["yamlgraph/models/", "yamlgraph/schema_loader.py"]
    added: "0.1.0"

  python-dotenv:
    rationale: "Load .env files for API keys and configuration"
    modules: ["yamlgraph/cli/__init__.py"]
    added: "0.1.0"

  pyyaml:
    rationale: "YAML parsing for graph definitions, prompt templates, and configuration"
    modules: ["yamlgraph/data_loader.py", "yamlgraph/compile/graph_loader.py"]
    added: "0.1.0"

  langsmith:
    rationale: "LangSmith observability and tracing integration (REQ-YG-047)"
    modules: ["yamlgraph/utils/tracing.py", "yamlgraph/cli/graph_commands.py"]
    added: "0.1.0"

  jinja2:
    rationale: "Advanced template engine for complex prompt templates with loops, conditionals, filters"
    modules: ["yamlgraph/utils/template.py", "yamlgraph/executor_base.py"]
    added: "0.2.0"

  # ─── Dev Dependencies ────────────────────────────────────────────────

  pytest:
    rationale: "Test runner — Commandment 7 (TDD red-green-refactor)"
    modules: ["tests/"]
    added: "0.1.0"

  pytest-asyncio:
    rationale: "Async test support for executor_async and streaming tests"
    modules: ["tests/"]
    added: "0.1.0"

  pytest-cov:
    rationale: "Coverage reporting with 70% minimum threshold"
    modules: ["pyproject.toml [tool.pytest.ini_options]"]
    added: "0.1.0"

  pytest-xdist:
    rationale: "Parallel test execution across 12 cores — FR-293 (42s → 21s)"
    modules: ["tests/"]
    added: "0.4.69"

  ruff:
    rationale: "Linter and formatter — Commandment 6 (expose every fault)"
    modules: ["pyproject.toml [tool.ruff]"]
    added: "0.1.0"

  radon:
    rationale: "Cyclomatic complexity analysis — Commandment 8 (kill entropy)"
    modules: ["scripts/"]
    added: "0.1.0"

  vulture:
    rationale: "Dead code detection — Commandment 8 (kill entropy)"
    modules: ["vulture_whitelist.py"]
    added: "0.1.0"

  bandit:
    rationale: "Security static analysis gate (medium+ severity) — FR-714 gate-truth; suppressions confessed as nosec"
    modules: ["scripts/noqa_coverage.py"]
    added: "0.5.12"

  pip-audit:
    rationale: >
      Dependency CVE scanner backing the CI `security` gate
      (`.github/workflows/security.yml`). Declared in the `dev` extra
      (FR-761) so the exact command CI runs — `pip-audit --desc
      --skip-editable --ignore-vuln CVE-2026-3219` — is reproducible
      locally with `pip install -e ".[dev]"` alone; previously it was
      installed ad hoc beside `.[dev]` in CI only, making the local
      environment unable to mechanically match the remote gate
      (`automation_inherits_doctrine`).
    modules: [".github/workflows/security.yml"]
    added: "0.5.18"

  z3-solver:
    rationale: "SMT solver for lint-time condition verification (W803-W805, FR-719) — optional verify extra, never core; hand-rolled interval analysis is the regex_fourth_exclusion trap"
    modules: ["yamlgraph/linter/patterns/conditions_smt.py"]
    added: "0.5.12"

  pre-commit:
    rationale: "Git hook framework for pre-commit and commit-msg quality gates"
    modules: [".pre-commit-config.yaml"]
    added: "0.1.0"

  import-linter:
    rationale: "Architectural boundary enforcement — three-layer import contracts (FR-218)"
    modules: [".importlinter"]
    added: "0.4.62"

  # ─── Optional: Analysis ──────────────────────────────────────────────

  jedi:
    rationale: "Python code analysis for import resolution and module introspection"
    modules: ["scripts/analysis.sh"]
    added: "0.3.0"

  # ─── Optional: Web Search ────────────────────────────────────────────

  ddgs:
    rationale: "DuckDuckGo search integration for web search tool nodes"
    modules: ["examples/shared/websearch.py", "examples/demos/fi_domain_crawl/nodes/seed_discovery.py"]
    added: "0.2.0"

  # ─── Optional: Tavily ────────────────────────────────────────────────

  tavily-python:
    rationale: "Tavily search API for domain-scoped RAG retrieval"
    modules: ["examples/demos/tavily_rag/"]
    added: "0.3.0"

  # ─── Optional: Storyboard ────────────────────────────────────────────

  replicate:
    rationale: "Replicate API for image generation in storyboard pipeline"
    modules: ["examples/storyboard/"]
    added: "0.3.0"

  # ─── Optional: Replicate (LiteLLM) ───────────────────────────────────

  langchain-litellm:
    rationale: "LiteLLM integration for Replicate-hosted models as LangChain LLM"
    modules: ["yamlgraph/utils/llm_factory.py"]
    added: "0.3.0"

  litellm:
    rationale: "FR-762 direct-import honesty: yamlgraph/utils/llm_providers.py imports litellm directly for the Replicate provider (previously only transitive via langchain-litellm)"
    modules: ["yamlgraph/utils/llm_providers.py"]
    added: "0.5.18"

  # ─── Optional: Azure AI ──────────────────────────────────────────────

  langchain-azure-ai:
    rationale: "Azure AI Foundry + Azure OpenAI unified provider integration"
    modules: ["yamlgraph/utils/llm_factory.py"]
    added: "0.4.75"

  # ─── Optional: Vertex AI ───────────────────────────────────────────────

  langchain-google-vertexai:
    rationale: "Google Vertex AI provider integration for Gemini models via Vertex API (project/location auth)"
    modules: ["yamlgraph/utils/llm_factory.py"]
    added: "0.4.73"

  # ─── Optional: Redis ─────────────────────────────────────────────────

  langgraph-checkpoint-redis:
    rationale: "Redis checkpointer for distributed graph state persistence"
    modules: ["yamlgraph/storage/checkpointer_factory.py"]
    added: "0.2.0"

  # ─── Optional: Redis Simple ──────────────────────────────────────────

  redis:
    rationale: "Direct Redis client for simple key-value session storage"
    modules: ["yamlgraph/storage/simple_redis.py"]
    added: "0.3.0"

  orjson:
    rationale: "Fast JSON serialization for Redis session data"
    modules: ["yamlgraph/storage/simple_redis.py"]
    added: "0.3.0"

  # ─── Optional: RAG ───────────────────────────────────────────────────

  lancedb:
    rationale: "Vector database for RAG embedding storage and retrieval"
    modules: ["examples/rag/"]
    added: "0.3.0"

  openai:
    rationale: "OpenAI embeddings API for RAG vector generation"
    modules: ["examples/rag/"]
    added: "0.3.0"

  pyarrow:
    rationale: "FR-762 direct-import honesty: examples/rag/index_docs.py's LanceDB-backed pipeline touches pyarrow tables directly (previously only transitive via lancedb)"
    modules: ["examples/rag/"]
    added: "0.5.18"

  # ─── Optional: Booking ───────────────────────────────────────────────

  fastapi:
    rationale: "Web framework for booking API, digest API, NPC server, telco endpoints, dungeon_master app, and openai_proxy server"
    modules: ["examples/booking/", "examples/daily_digest/", "examples/npc/", "examples/dungeon_master/", "examples/openai_proxy/"]
    added: "0.3.0"

  httpx:
    rationale: "Async HTTP client for booking and digest API calls; also the direct import in yamlgraph/contrib/a2a_client.py's A2A client transport (FR-761 direct-import ownership fix — a2a-sdk pulls httpx in transitively, but the direct import needs its own declaration under the a2a extra)"
    modules: ["examples/booking/", "examples/daily_digest/", "yamlgraph/contrib/a2a_client.py"]
    added: "0.3.0"

  uvicorn:
    rationale: "ASGI server for FastAPI applications (booking, digest, NPC, dungeon_master, openai_proxy)"
    modules: ["examples/booking/", "examples/daily_digest/", "examples/npc/", "examples/dungeon_master/api/app.py", "examples/openai_proxy/api/app.py"]
    added: "0.3.0"

  # ─── Optional: NPC ───────────────────────────────────────────────────

  python-multipart:
    rationale: "Multipart form data parsing for NPC and digest file uploads"
    modules: ["examples/npc/", "examples/daily_digest/"]
    added: "0.3.0"

  # ─── Optional: Digest ────────────────────────────────────────────────

  feedparser:
    rationale: "RSS/Atom feed parsing for daily digest content ingestion"
    modules: ["examples/daily_digest/"]
    added: "0.3.0"

  resend:
    rationale: "Email delivery service for digest distribution"
    modules: ["examples/daily_digest/"]
    added: "0.3.0"

  beautifulsoup4:
    rationale: "HTML content extraction from fetched web pages"
    modules: ["examples/daily_digest/"]
    added: "0.3.0"

  slowapi:
    rationale: "Rate limiting middleware for digest API endpoints"
    modules: ["examples/daily_digest/api/"]
    added: "0.3.0"

  # ─── Optional: FSM ───────────────────────────────────────────────────

  statemachine-engine:
    rationale: "State machine runtime for FSM-based workflow execution"
    modules: ["fsm/"]
    added: "0.4.0"

  # ─── Optional: MCP ───────────────────────────────────────────────────

  mcp:
    rationale: "Model Context Protocol server for exposing graphs as Copilot tools (CAP-19)"
    modules: ["yamlgraph/export/mcp.py"]
    added: "0.4.0"

  # ─── Optional: A2A ───────────────────────────────────────────────────

  a2a-sdk:
    rationale: "Agent-to-Agent protocol SDK for inter-agent communication (FR-208)"
    modules: ["yamlgraph/a2a/server.py"]
    added: "0.4.60"

  grpcio:
    rationale: "gRPC runtime required by a2a-sdk>=1.0 compat layer (a2a/compat/v0_3/context_builders.py imports grpc at module level); without it the a2a extras fail to import (FR-244)"
    modules: ["yamlgraph/a2a/server.py"]
    added: "0.4.68"

  starlette:
    rationale: "FR-762 direct-import honesty: yamlgraph/a2a/server.py, examples/openai_proxy/api/app.py import starlette directly for Starlette/Request/Response types (previously only transitive via a2a-sdk/fastapi)"
    modules: ["yamlgraph/a2a/server.py", "examples/openai_proxy/api/app.py"]
    added: "0.5.18"

  protobuf:
    rationale: "FR-762 direct-import honesty: yamlgraph/cli/a2a_commands.py and yamlgraph/contrib/a2a_client.py import google.protobuf directly (previously only transitive via a2a-sdk)"
    modules: ["yamlgraph/cli/a2a_commands.py", "yamlgraph/contrib/a2a_client.py"]
    added: "0.5.18"

  # ─── Optional: Telco ─────────────────────────────────────────────────

  twilio:
    rationale: "Twilio API for telephony integration (voice calls, SMS)"
    modules: ["projects/incaller/"]
    added: "0.4.0"

  elevenlabs:
    rationale: "ElevenLabs text-to-speech for voice generation in telephony"
    modules: ["projects/incaller/"]
    added: "0.4.0"

  # ─── Optional: Chatterbox TTS ────────────────────────────────────────

  chatterbox-tts:
    rationale: "Chatterbox TTS for local speech synthesis in the chatterbox demo (FR-233)"
    modules: ["examples/demos/chatterbox/"]
    added: "0.4.68"

  torch:
    rationale: "FR-762 direct-import honesty: chatterbox-tts requires torch==2.6.0 (no macOS Intel x86_64 wheel per examples/demos/chatterbox/README.md); declared directly with a platform marker instead of leaving it fully transitive"
    modules: ["examples/demos/chatterbox/"]
    added: "0.5.18"

  torchaudio:
    rationale: "FR-762 direct-import honesty: paired with torch for chatterbox-tts audio tensor I/O; same platform marker as torch"
    modules: ["examples/demos/chatterbox/"]
    added: "0.5.18"

  # ─── Optional: Dungeon Master examples ────────────────────────────────

  tiktoken:
    rationale: "FR-762 example dependency taxonomy: examples/dungeon_master/api/prompt_salience.py lazily imports tiktoken for the cl100k_base prompt-mass witness (previously undeclared anywhere)"
    modules: ["examples/dungeon_master/api/prompt_salience.py"]
    added: "0.5.18"

  unified-planning:
    rationale: "FR-762 example dependency taxonomy: examples/dungeon_master/api/plot/up_model.py uses unified_planning's PDDL-style planner for the plot causal model (previously undeclared anywhere)"
    modules: ["examples/dungeon_master/api/plot/up_model.py"]
    added: "0.5.18"
